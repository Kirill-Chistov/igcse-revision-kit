<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16283c"/></marker>
    <marker id="w" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2a5f80"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">A meander — plan view and cross-section</text>

  <!-- ===== plan view ===== -->
  <text x="20" y="50" font-size="13.5" font-weight="700" fill="#16283c">Plan view</text>
  <rect x="16" y="60" width="430" height="250" fill="#eef4e6"/>
  <path d="M16,100 C200,100 380,90 380,190 C380,290 200,280 16,280" fill="none" stroke="#bcd6e8" stroke-width="36"/>
  <!-- river cliff on outer bank -->
  <path d="M290,83 C362,78 398,118 398,190 C398,262 362,302 290,297" fill="none" stroke="#8a6f33" stroke-width="5"/>
  <!-- point bar on inner bank -->
  <path d="M320,132 C360,146 366,170 366,190 C366,210 360,234 320,248 C344,226 350,206 350,190 C350,174 344,154 320,132 Z" fill="#e8dcc0" stroke="#b8912e" stroke-width="1"/>
  <!-- thalweg -->
  <path d="M16,100 C180,98 392,80 392,190 C392,300 180,284 16,280" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 4"/>
  <line x1="120" y1="100" x2="170" y2="100" stroke="#2a5f80" stroke-width="2.2" marker-end="url(#w)"/>
  <line x1="170" y1="281" x2="120" y2="281" stroke="#2a5f80" stroke-width="2.2" marker-end="url(#w)"/>
  <!-- A-B -->
  <line x1="300" y1="190" x2="440" y2="190" stroke="#16283c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="290" y="194" font-size="13" font-weight="700" fill="#16283c" text-anchor="end">A</text>
  <text x="438" y="182" font-size="13" font-weight="700" fill="#16283c" text-anchor="end">B</text>
  <!-- labels -->
  <text x="180" y="78" font-size="12" font-weight="700" fill="#c0392b">fastest flow (thalweg) swings to the outer bank</text>
  <text x="40" y="160" font-size="12.5" font-weight="700" fill="#16283c">Inner bend: slow, shallow water</text>
  <text x="40" y="175" font-size="12.5" fill="#16283c">→ deposition → slip-off slope</text>
  <text x="40" y="190" font-size="12.5" fill="#16283c">(point bar)</text>
  <text x="40" y="222" font-size="12.5" font-weight="700" fill="#8a6f33">Outer bend: fast, deep water</text>
  <text x="40" y="237" font-size="12.5" fill="#8a6f33">→ erosion → river cliff</text>

  <!-- ===== cross-section A-B ===== -->
  <text x="480" y="50" font-size="13.5" font-weight="700" fill="#16283c">Cross-section A–B</text>
  <path d="M480,110 L560,110 C640,130 720,190 780,232 L800,232 L815,160 L820,110 L884,110 L884,300 L480,300 Z" fill="#e3d3ae"/>
  <path d="M609,140 C660,165 720,194 780,232 L800,232 L815,160 L819,140 Z" fill="#bcd6e8"/>
  <line x1="609" y1="140" x2="819" y2="140" stroke="#3d7ea6" stroke-width="1.6"/>
  <path d="M560,110 C640,130 700,166 745,201 L735,210 C690,178 625,138 560,120 Z" fill="#e8dcc0" stroke="#b8912e" stroke-width="1"/>
  <path d="M480,110 L560,110 C640,130 720,190 780,232 L800,232 L815,160 L820,110 L884,110" fill="none" stroke="#4b6b3d" stroke-width="2"/>
  <text x="484" y="100" font-size="13" font-weight="700" fill="#16283c">A  (inner bend)</text>
  <text x="884" y="100" font-size="13" font-weight="700" fill="#16283c" text-anchor="end">(outer bend)  B</text>

  <text x="494" y="160" font-size="12.5" font-weight="700" fill="#8a6f33">SLIP-OFF SLOPE</text>
  <text x="494" y="175" font-size="12" fill="#6b5424">gentle; sand and gravel</text>
  <text x="494" y="189" font-size="12" fill="#6b5424">deposited</text>
  <text x="640" y="84" font-size="12.5" font-weight="700" fill="#16283c">RIVER CLIFF — steep, undercut</text>
  <line x1="770" y1="88" x2="816" y2="130" stroke="#16283c" stroke-width="1" marker-end="url(#k)"/>
  <text x="600" y="272" font-size="12.5" font-weight="700" fill="#16283c">deepest, fastest water</text>
  <line x1="730" y1="266" x2="786" y2="236" stroke="#16283c" stroke-width="1" marker-end="url(#k)"/>
</svg>

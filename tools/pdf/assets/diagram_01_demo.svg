<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" width="820" height="210" role="img"
     aria-label="Pipeline: topic.md plus SVG assets, rendered by headless Chromium into the topic PDF">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" text-anchor="middle">
    <rect x="20" y="55" width="200" height="100" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="2"/>
    <text x="120" y="95" font-size="19" font-weight="700" fill="#0b5f54">topic.md</text>
    <text x="120" y="120" font-size="14" fill="#33475b">+ assets/*.svg</text>

    <rect x="310" y="55" width="200" height="100" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
    <text x="410" y="95" font-size="19" font-weight="700" fill="#4c3fa8">Chromium</text>
    <text x="410" y="120" font-size="14" fill="#33475b">HTML + print CSS</text>

    <rect x="600" y="55" width="200" height="100" rx="8" fill="#16283c"/>
    <text x="700" y="95" font-size="19" font-weight="700" fill="#ffffff">NN_Topic.pdf</text>
    <text x="700" y="120" font-size="14" fill="#c3d0dc">A4 booklet</text>

    <line x1="228" y1="105" x2="300" y2="105" stroke="#16283c" stroke-width="2" marker-end="url(#a)"/>
    <line x1="518" y1="105" x2="590" y2="105" stroke="#16283c" stroke-width="2" marker-end="url(#a)"/>
    <text x="410" y="185" font-size="13" fill="#6b7a88">render_booklet.py</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .blk { fill: #f1f5f9; stroke: #334155; stroke-width: 1.4; }
    .fw { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.8; }
    .t { font-size: 15px; font-weight: bold; fill: #1e293b; }
    .s { font-size: 12.5px; fill: #475569; }
    .step { font-size: 12.5px; fill: #334155; }
    .num { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .ro { font-size: 12px; fill: #0f766e; font-style: italic; }
  </style>
  <text x="120" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">START-UP ORDER</text>
  <text x="355" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">LAYERS</text>

  <!-- stack -->
  <rect class="blk" x="250" y="24" width="210" height="50" rx="4"/>
  <text class="t" x="355" y="45" text-anchor="middle">Application software</text>
  <text class="s" x="355" y="63" text-anchor="middle">e.g. word processor, web browser</text>

  <rect class="blk" x="250" y="90" width="210" height="50" rx="4"/>
  <text class="t" x="355" y="111" text-anchor="middle">Operating system</text>
  <text class="s" x="355" y="129" text-anchor="middle">kept in secondary storage</text>

  <rect class="fw" x="250" y="156" width="210" height="50" rx="4"/>
  <text class="t" x="355" y="177" text-anchor="middle">Firmware — bootloader</text>
  <text class="s" x="355" y="195" text-anchor="middle">stored in ROM</text>

  <rect class="blk" x="250" y="222" width="210" height="50" rx="4"/>
  <text class="t" x="355" y="243" text-anchor="middle">Hardware</text>
  <text class="s" x="355" y="261" text-anchor="middle">CPU, RAM, ROM, storage, I/O devices</text>

  <!-- runs on arrows -->
  <g stroke="#0f766e" stroke-width="1.5" fill="#0f766e">
    <line x1="472" y1="56" x2="472" y2="102"/><polygon points="472,108 467,99 477,99"/>
    <line x1="472" y1="122" x2="472" y2="168"/><polygon points="472,174 467,165 477,165"/>
    <line x1="472" y1="188" x2="472" y2="234"/><polygon points="472,240 467,231 477,231"/>
  </g>
  <text class="ro" x="482" y="86">runs on the OS</text>
  <text class="ro" x="482" y="152">runs on the firmware</text>
  <text class="ro" x="482" y="218">runs on the hardware</text>

  <!-- start-up steps -->
  <line x1="18" y1="170" x2="18" y2="60" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="18,52 13,62 23,62" fill="#94a3b8"/>
  <line x1="18" y1="170" x2="18" y2="126" stroke="#94a3b8" stroke-width="1.4"/>

  <circle cx="18" cy="181" r="10" fill="#0f766e"/><text class="num" x="18" y="185" text-anchor="middle">1</text>
  <text class="step" x="36" y="177">Switch on: the bootloader</text>
  <text class="step" x="36" y="193">runs on the hardware</text>
  <line x1="200" y1="181" x2="244" y2="181" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

  <circle cx="18" cy="115" r="10" fill="#0f766e"/><text class="num" x="18" y="119" text-anchor="middle">2</text>
  <text class="step" x="36" y="111">The bootloader loads the OS</text>
  <text class="step" x="36" y="127">into RAM and starts it</text>
  <line x1="200" y1="115" x2="244" y2="115" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

  <circle cx="18" cy="49" r="10" fill="#0f766e"/><text class="num" x="18" y="53" text-anchor="middle">3</text>
  <text class="step" x="36" y="45">The user runs an application;</text>
  <text class="step" x="36" y="61">it uses hardware via the OS</text>
  <line x1="200" y1="49" x2="244" y2="49" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
</svg>

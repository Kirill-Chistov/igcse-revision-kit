<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" aria-label="Quarter cross-section of the Earth showing the inner core, outer core, mantle, crust and lithosphere with their characteristics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g transform="scale(0.93)">
<defs><pattern id="es-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16283c" stroke-width="1.4" stroke-opacity="0.55"/></pattern></defs>
<path d="M30 362 L360.0 362.0 A330 330 0 0 0 30.0 32.0 Z" fill="#5b4636"/>
<path d="M30 362 L350.0 362.0 A320 320 0 0 0 30.0 42.0 Z" fill="#d98a5f"/>
<path d="M30 362 L210.0 362.0 A180 180 0 0 0 30.0 182.0 Z" fill="#f0b45a"/>
<path d="M30 362 L93.0 362.0 A63 63 0 0 0 30.0 299.0 Z" fill="#fbe7a8"/>
<path d="M338.0 362.0 L360.0 362.0 A330 330 0 0 0 30.0 32.0 L30.0 54.0 A308 308 0 0 1 338.0 362.0 Z" fill="url(#es-hatch)"/>
<path d="M338.0 362.0 A308 308 0 0 0 30.0 54.0" fill="none" stroke="#16283c" stroke-width="1.3" stroke-dasharray="5 3"/>
<path d="M93.0 362.0 A63 63 0 0 0 30.0 299.0" fill="none" stroke="#16283c" stroke-width="1"/>
<path d="M210.0 362.0 A180 180 0 0 0 30.0 182.0" fill="none" stroke="#16283c" stroke-width="1"/>
<path d="M350.0 362.0 A320 320 0 0 0 30.0 42.0" fill="none" stroke="#16283c" stroke-width="1"/>
<path d="M360.0 362.0 A330 330 0 0 0 30.0 32.0" fill="none" stroke="#16283c" stroke-width="1"/>
<line x1="30" y1="362" x2="360" y2="362" stroke="#16283c" stroke-width="1.2"/>
<line x1="30" y1="362" x2="30" y2="32" stroke="#16283c" stroke-width="1.2"/>
<g font-family="Carlito, Calibri, sans-serif" font-size="12.5" fill="#33475b" text-anchor="middle">
<line x1="360" y1="362" x2="360" y2="368" stroke="#16283c" stroke-width="1.2"/>
<line x1="210" y1="362" x2="210" y2="368" stroke="#16283c" stroke-width="1.2"/>
<line x1="93" y1="362" x2="93" y2="368" stroke="#16283c" stroke-width="1.2"/>
<line x1="30" y1="362" x2="30" y2="368" stroke="#16283c" stroke-width="1.2"/>
<text x="356" y="381">0 km</text>
<text x="210" y="381">2 900 km</text>
<text x="99" y="381">5 150 km</text>
<text x="24" y="381" text-anchor="start">centre</text>
<text x="16" y="397" font-style="italic" text-anchor="start">Depth below the surface (the centre is 6 370 km down). Crust and lithosphere not to scale.</text>
</g>
<g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
<circle cx="130.7" cy="52.0" r="2.6" fill="#16283c"/>
<polyline points="130.7,52.0 408,18 416,18" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="420" y="22" font-size="14.5" font-weight="700">CRUST</text>
<text x="420" y="39" font-size="13" fill="#33475b">Thin outer layer of solid rock.</text>
<text x="420" y="55" font-size="13" fill="#33475b">Oceanic 5–10 km thick; continental 25–70 km.</text>
<circle cx="208.4" cy="107.2" r="2.6" fill="#16283c"/>
<polyline points="208.4,107.2 408,86 416,86" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="420" y="90" font-size="14.5" font-weight="700">LITHOSPHERE</text>
<text x="420" y="107" font-size="13" fill="#33475b">The crust + the rigid top of the mantle (≈100 km).</text>
<text x="420" y="123" font-size="13" fill="#33475b">Broken into the tectonic plates.</text>
<circle cx="254.7" cy="221.6" r="2.6" fill="#16283c"/>
<polyline points="254.7,221.6 408,158 416,158" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="420" y="162" font-size="14.5" font-weight="700">MANTLE</text>
<text x="420" y="179" font-size="13" fill="#33475b">≈2 900 km thick. Hot rock (≈1 000–3 700 °C) that is</text>
<text x="420" y="195" font-size="13" fill="#33475b">mostly solid but flows very slowly; semi-molten near the top.</text>
<circle cx="150.5" cy="313.3" r="2.6" fill="#16283c"/>
<polyline points="150.5,313.3 408,236 416,236" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="420" y="240" font-size="14.5" font-weight="700">OUTER CORE</text>
<text x="420" y="257" font-size="13" fill="#33475b">Liquid iron and nickel, ≈4 500 °C.</text>
<circle cx="56.2" cy="343.6" r="2.6" fill="#16283c"/>
<polyline points="56.2,343.6 408,296 416,296" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="420" y="300" font-size="14.5" font-weight="700">INNER CORE</text>
<text x="420" y="317" font-size="13" fill="#33475b">Solid iron and nickel, ≈5 500 °C —</text>
<text x="420" y="333" font-size="13" fill="#33475b">solid because of the enormous pressure.</text>
</g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16283c"/></marker>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0f7b6c"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">Formation of a waterfall and gorge — side view</text>

  <!-- ================= panel 1 ================= -->
  <g transform="translate(10,0)">
    <text x="0" y="60" font-size="13.5" font-weight="700" fill="#16283c">1  Hard rock lies over soft rock</text>
    <!-- soft rock body -->
    <path d="M0,140 L150,140 L140,165 L143,200 L152,228 L160,236 L172,256 L208,256 L220,236 L290,236 L290,300 L0,300 Z" fill="#e3d3ae"/>
    <!-- hard rock band -->
    <rect x="0" y="100" width="150" height="40" fill="#6f6c66"/>
    <!-- water -->
    <rect x="0" y="92" width="150" height="8" fill="#7fb2d4"/>
    <path d="M150,96 C166,110 172,180 178,244" fill="none" stroke="#7fb2d4" stroke-width="9"/>
    <path d="M160,236 L172,256 L208,256 L220,236 Z" fill="#7fb2d4"/>
    <rect x="220" y="230" width="70" height="6" fill="#7fb2d4"/>
    <text x="14" y="125" font-size="12" font-weight="700" fill="#ffffff">HARD ROCK</text>
    <text x="14" y="190" font-size="12" font-weight="700" fill="#8a6f33">SOFT ROCK</text>
    <text x="196" y="170" font-size="12" fill="#16283c">soft rock eroded</text>
    <text x="196" y="184" font-size="12" fill="#16283c">faster — undercut</text>
    <line x1="194" y1="176" x2="148" y2="172" stroke="#16283c" stroke-width="1" marker-end="url(#k)"/>
    <text x="120" y="282" font-size="12" fill="#16283c">plunge pool: hydraulic action</text>
    <text x="120" y="296" font-size="12" fill="#16283c">and abrasion by swirling load</text>
  </g>

  <!-- ================= panel 2 ================= -->
  <g transform="translate(305,0)">
    <text x="0" y="60" font-size="13.5" font-weight="700" fill="#16283c">2  An overhang forms</text>
    <path d="M0,140 L150,140 L118,160 L120,205 L150,232 L158,238 L170,266 L212,266 L222,238 L290,238 L290,300 L0,300 Z" fill="#e3d3ae"/>
    <rect x="0" y="100" width="150" height="40" fill="#6f6c66"/>
    <rect x="0" y="92" width="150" height="8" fill="#7fb2d4"/>
    <path d="M150,96 C166,110 172,180 180,252" fill="none" stroke="#7fb2d4" stroke-width="9"/>
    <path d="M158,238 L170,266 L212,266 L222,238 Z" fill="#7fb2d4"/>
    <rect x="222" y="232" width="68" height="6" fill="#7fb2d4"/>
    <text x="14" y="125" font-size="12" font-weight="700" fill="#ffffff">HARD ROCK</text>
    <text x="196" y="118" font-size="12" fill="#16283c">unsupported</text>
    <text x="196" y="132" font-size="12" fill="#16283c">OVERHANG</text>
    <line x1="194" y1="128" x2="152" y2="134" stroke="#16283c" stroke-width="1" marker-end="url(#k)"/>
    <text x="120" y="290" font-size="12" fill="#16283c">plunge pool deepens</text>
  </g>

  <!-- ================= panel 3 ================= -->
  <g transform="translate(600,0)">
    <text x="0" y="60" font-size="13.5" font-weight="700" fill="#16283c">3  It collapses; the fall retreats</text>
    <path d="M0,140 L110,140 L102,165 L104,205 L112,232 L120,238 L132,266 L178,266 L190,238 L290,238 L290,300 L0,300 Z" fill="#e3d3ae"/>
    <rect x="0" y="100" width="110" height="40" fill="#6f6c66"/>
    <rect x="0" y="92" width="110" height="8" fill="#7fb2d4"/>
    <path d="M110,96 C126,110 132,180 140,252" fill="none" stroke="#7fb2d4" stroke-width="9"/>
    <path d="M120,238 L132,266 L178,266 L190,238 Z" fill="#7fb2d4"/>
    <rect x="190" y="232" width="100" height="6" fill="#7fb2d4"/>
    <!-- fallen blocks -->
    <path d="M146,262 L156,244 L172,250 L170,264 Z" fill="#6f6c66"/>
    <path d="M160,238 L176,228 L186,240 L176,248 Z" fill="#6f6c66"/>
    <!-- former position -->
    <path d="M110,100 L150,100 L150,140" fill="none" stroke="#6b7a88" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="14" y="125" font-size="12" font-weight="700" fill="#ffffff">HARD</text>
    <line x1="140" y1="80" x2="40" y2="80" stroke="#0f7b6c" stroke-width="2.6" marker-end="url(#t)"/>
    <text x="146" y="84" font-size="12" font-weight="700" fill="#0f7b6c">retreats upstream</text>
    <text x="196" y="150" font-size="12" fill="#16283c">steep-sided</text>
    <text x="196" y="164" font-size="12" fill="#16283c">GORGE left</text>
    <text x="196" y="178" font-size="12" fill="#16283c">downstream</text>
    <text x="100" y="290" font-size="12" fill="#16283c">fallen rock adds to abrasion</text>
  </g>
</svg>

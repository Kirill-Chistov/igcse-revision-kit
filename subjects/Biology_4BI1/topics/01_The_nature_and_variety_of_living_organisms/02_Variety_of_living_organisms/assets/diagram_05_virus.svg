<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" role="img" aria-label="Viruses. Drawn to the same scale, viruses are tiny dots beside a bacterium. Enlarged, a virus is only a protein coat around one type of nucleic acid, DNA or RNA; it has no cell membrane, cytoplasm or organelles. Viruses have different shapes, for example the rod-shaped tobacco mosaic virus." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vg5-p   { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #c0392b; }
    .vg5-lb  { font-size: 12.5px; font-weight: 700; }
    .vg5-ls  { font-size: 12.5px; fill: #33475b; }
    .vg5-no  { font-size: 12.5px; font-weight: 700; fill: #c0392b; }
    .vg5-ldr { fill: none; stroke: #8fa3b8; stroke-width: 1.2; }
  </style>

  <!-- ============ size ============ -->
  <text class="vg5-p" x="6" y="16">SIZE</text>
  <rect x="10" y="40" width="180" height="92" rx="46" fill="#f7f4fc" stroke="#6d3fa8" stroke-width="3"/>
  <text class="vg5-ls" x="100" y="91" text-anchor="middle">bacterium</text>
  <g fill="#c0392b">
    <circle cx="204" cy="56" r="2.2"/><circle cx="212" cy="74" r="2.2"/><circle cx="200" cy="96" r="2.2"/>
    <circle cx="216" cy="112" r="2.2"/><circle cx="206" cy="128" r="2.2"/>
  </g>
  <path class="vg5-ldr" d="M214,150 L208,132"/>
  <text class="vg5-lb" x="10" y="168">viruses (same scale):</text>
  <text class="vg5-ls" x="10" y="184">much smaller than bacteria</text>

  <line x1="250" y1="30" x2="250" y2="208" stroke="#dfe5ea" stroke-width="1.5"/>

  <!-- ============ structure ============ -->
  <text class="vg5-p" x="264" y="16">ENLARGED — NO CELL STRUCTURE</text>
  <polygon points="330,44 380,70 380,126 330,152 280,126 280,70" fill="#fdeded" stroke="#c0392b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M312,82 C340,74 352,96 330,102 C306,108 318,128 346,122" fill="none" stroke="#16283c" stroke-width="2.4" stroke-linecap="round"/>
  <path class="vg5-ldr" d="M420,58 L372,70"/>
  <text class="vg5-lb" x="424" y="56">protein coat</text>
  <path class="vg5-ldr" d="M420,106 L346,106"/>
  <text class="vg5-lb" x="424" y="104">nucleic acid</text>
  <text class="vg5-ls" x="424" y="119">DNA or RNA</text>
  <text class="vg5-ls" x="424" y="134">(one type only)</text>
  <text class="vg5-no" x="264" y="184">no cell membrane, cytoplasm or organelles</text>
  <text class="vg5-ls" x="264" y="200">— not a cell, so not a living organism</text>

  <line x1="572" y1="30" x2="572" y2="208" stroke="#dfe5ea" stroke-width="1.5"/>

  <!-- ============ shapes vary ============ -->
  <text class="vg5-p" x="586" y="16">SHAPES VARY</text>
  <rect x="592" y="58" width="150" height="30" rx="4" fill="#fdeded" stroke="#c0392b" stroke-width="2"/>
  <g stroke="#c0392b" stroke-width="1.4">
    <line x1="602" y1="58" x2="602" y2="88"/><line x1="614" y1="58" x2="614" y2="88"/><line x1="626" y1="58" x2="626" y2="88"/>
    <line x1="638" y1="58" x2="638" y2="88"/><line x1="650" y1="58" x2="650" y2="88"/><line x1="662" y1="58" x2="662" y2="88"/>
    <line x1="674" y1="58" x2="674" y2="88"/><line x1="686" y1="58" x2="686" y2="88"/><line x1="698" y1="58" x2="698" y2="88"/>
    <line x1="710" y1="58" x2="710" y2="88"/><line x1="722" y1="58" x2="722" y2="88"/><line x1="734" y1="58" x2="734" y2="88"/>
  </g>
  <line x1="592" y1="73" x2="742" y2="73" stroke="#16283c" stroke-width="2.4"/>
  <text class="vg5-lb" x="586" y="114">tobacco mosaic virus</text>
  <text class="vg5-ls" x="586" y="129">rod: protein coat around RNA</text>
</svg>

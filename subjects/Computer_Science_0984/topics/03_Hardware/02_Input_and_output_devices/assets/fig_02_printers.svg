<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 326" width="784" height="326" role="img" aria-label="How inkjet, laser and 3D printers produce output, step by step." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .pr-h { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .pr-hs { font-size: 12px; fill: #ffffff; }
    .pr-t { font-size: 11.5px; }
    .pr-n { font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs><marker id="pr-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker></defs>
  <rect x="6" y="6" width="78" height="98" rx="7" fill="#2f6f9f"/><text class="pr-h" x="45" y="52.0" text-anchor="middle">Inkjet</text><text class="pr-hs" x="45" y="68.0" text-anchor="middle">printer</text><rect x="92" y="6" width="126" height="98" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="104" cy="18" r="8" fill="#2f6f9f"/><text class="pr-n" x="104" y="21.5" text-anchor="middle">1</text><text class="pr-t" x="155.0" y="57.5" text-anchor="middle">Data sent to the</text><text class="pr-t" x="155.0" y="71.0" text-anchor="middle">printer and held</text><text class="pr-t" x="155.0" y="84.5" text-anchor="middle">in its buffer</text><line x1="219" y1="55.0" x2="231" y2="55.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="232" y="6" width="126" height="98" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="244" cy="18" r="8" fill="#2f6f9f"/><text class="pr-n" x="244" y="21.5" text-anchor="middle">2</text><text class="pr-t" x="295.0" y="64.25" text-anchor="middle">A sheet of paper</text><text class="pr-t" x="295.0" y="77.75" text-anchor="middle">is fed in</text><line x1="359" y1="55.0" x2="371" y2="55.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="372" y="6" width="126" height="98" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="384" cy="18" r="8" fill="#2f6f9f"/><text class="pr-n" x="384" y="21.5" text-anchor="middle">3</text><text class="pr-t" x="435.0" y="44.0" text-anchor="middle">Print head moves across</text><text class="pr-t" x="435.0" y="57.5" text-anchor="middle">the page, firing tiny ink</text><text class="pr-t" x="435.0" y="71.0" text-anchor="middle">droplets through nozzles</text><text class="pr-t" x="435.0" y="84.5" text-anchor="middle">(heater bubble or</text><text class="pr-t" x="435.0" y="98.0" text-anchor="middle">piezoelectric crystal)</text><line x1="499" y1="55.0" x2="511" y2="55.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="512" y="6" width="126" height="98" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="524" cy="18" r="8" fill="#2f6f9f"/><text class="pr-n" x="524" y="21.5" text-anchor="middle">4</text><text class="pr-t" x="575.0" y="50.75" text-anchor="middle">Paper moves up a</text><text class="pr-t" x="575.0" y="64.25" text-anchor="middle">little; the next line</text><text class="pr-t" x="575.0" y="77.75" text-anchor="middle">is printed, until the</text><text class="pr-t" x="575.0" y="91.25" text-anchor="middle">page is complete</text><rect x="6" y="114" width="78" height="98" rx="7" fill="#4c3fa8"/><text class="pr-h" x="45" y="160.0" text-anchor="middle">Laser</text><text class="pr-hs" x="45" y="176.0" text-anchor="middle">printer</text><rect x="92" y="114" width="126" height="98" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.2"/><circle cx="104" cy="126" r="8" fill="#4c3fa8"/><text class="pr-n" x="104" y="129.5" text-anchor="middle">1</text><text class="pr-t" x="155.0" y="172.25" text-anchor="middle">Drum is given an</text><text class="pr-t" x="155.0" y="185.75" text-anchor="middle">electric charge</text><line x1="219" y1="163.0" x2="231" y2="163.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="232" y="114" width="126" height="98" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.2"/><circle cx="244" cy="126" r="8" fill="#4c3fa8"/><text class="pr-n" x="244" y="129.5" text-anchor="middle">2</text><text class="pr-t" x="295.0" y="152.0" text-anchor="middle">Laser beam scans the</text><text class="pr-t" x="295.0" y="165.5" text-anchor="middle">rotating drum, removing</text><text class="pr-t" x="295.0" y="179.0" text-anchor="middle">charge to leave an</text><text class="pr-t" x="295.0" y="192.5" text-anchor="middle">electrostatic image</text><text class="pr-t" x="295.0" y="206.0" text-anchor="middle">of the page</text><line x1="359" y1="163.0" x2="371" y2="163.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="372" y="114" width="126" height="98" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.2"/><circle cx="384" cy="126" r="8" fill="#4c3fa8"/><text class="pr-n" x="384" y="129.5" text-anchor="middle">3</text><text class="pr-t" x="435.0" y="165.5" text-anchor="middle">Charged toner (powder</text><text class="pr-t" x="435.0" y="179.0" text-anchor="middle">ink) sticks only to</text><text class="pr-t" x="435.0" y="192.5" text-anchor="middle">the image on the drum</text><line x1="499" y1="163.0" x2="511" y2="163.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="512" y="114" width="126" height="98" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.2"/><circle cx="524" cy="126" r="8" fill="#4c3fa8"/><text class="pr-n" x="524" y="129.5" text-anchor="middle">4</text><text class="pr-t" x="575.0" y="158.75" text-anchor="middle">Oppositely charged</text><text class="pr-t" x="575.0" y="172.25" text-anchor="middle">paper rolls over the</text><text class="pr-t" x="575.0" y="185.75" text-anchor="middle">drum and picks up</text><text class="pr-t" x="575.0" y="199.25" text-anchor="middle">the toner</text><line x1="639" y1="163.0" x2="651" y2="163.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="652" y="114" width="126" height="98" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.2"/><circle cx="664" cy="126" r="8" fill="#4c3fa8"/><text class="pr-n" x="664" y="129.5" text-anchor="middle">5</text><text class="pr-t" x="715.0" y="158.75" text-anchor="middle">Fuser (heated rollers)</text><text class="pr-t" x="715.0" y="172.25" text-anchor="middle">melts the toner onto</text><text class="pr-t" x="715.0" y="185.75" text-anchor="middle">the paper; the drum</text><text class="pr-t" x="715.0" y="199.25" text-anchor="middle">is discharged</text><rect x="6" y="222" width="78" height="98" rx="7" fill="#0f7b6c"/><text class="pr-h" x="45" y="268.0" text-anchor="middle">3D</text><text class="pr-hs" x="45" y="284.0" text-anchor="middle">printer</text><rect x="92" y="222" width="126" height="98" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.2"/><circle cx="104" cy="234" r="8" fill="#0f7b6c"/><text class="pr-n" x="104" y="237.5" text-anchor="middle">1</text><text class="pr-t" x="155.0" y="273.5" text-anchor="middle">A digital 3D design</text><text class="pr-t" x="155.0" y="287.0" text-anchor="middle">(CAD file) of the</text><text class="pr-t" x="155.0" y="300.5" text-anchor="middle">object is used</text><line x1="219" y1="271.0" x2="231" y2="271.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="232" y="222" width="126" height="98" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.2"/><circle cx="244" cy="234" r="8" fill="#0f7b6c"/><text class="pr-n" x="244" y="237.5" text-anchor="middle">2</text><text class="pr-t" x="295.0" y="273.5" text-anchor="middle">Software slices the</text><text class="pr-t" x="295.0" y="287.0" text-anchor="middle">design into very thin</text><text class="pr-t" x="295.0" y="300.5" text-anchor="middle">layers</text><line x1="359" y1="271.0" x2="371" y2="271.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="372" y="222" width="126" height="98" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.2"/><circle cx="384" cy="234" r="8" fill="#0f7b6c"/><text class="pr-n" x="384" y="237.5" text-anchor="middle">3</text><text class="pr-t" x="435.0" y="260.0" text-anchor="middle">Nozzle / print head</text><text class="pr-t" x="435.0" y="273.5" text-anchor="middle">lays down material</text><text class="pr-t" x="435.0" y="287.0" text-anchor="middle">(e.g. melted plastic,</text><text class="pr-t" x="435.0" y="300.5" text-anchor="middle">powdered resin or metal)</text><text class="pr-t" x="435.0" y="314.0" text-anchor="middle">one layer at a time</text><line x1="499" y1="271.0" x2="511" y2="271.0" stroke="#16283c" stroke-width="1.8" marker-end="url(#pr-ar)"/><rect x="512" y="222" width="126" height="98" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.2"/><circle cx="524" cy="234" r="8" fill="#0f7b6c"/><text class="pr-n" x="524" y="237.5" text-anchor="middle">4</text><text class="pr-t" x="575.0" y="266.75" text-anchor="middle">Each layer hardens</text><text class="pr-t" x="575.0" y="280.25" text-anchor="middle">and bonds to the one</text><text class="pr-t" x="575.0" y="293.75" text-anchor="middle">below; the solid object</text><text class="pr-t" x="575.0" y="307.25" text-anchor="middle">builds up layer by layer</text>
</svg>

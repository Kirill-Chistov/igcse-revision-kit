<text x="502.0" y="178.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="400"><tspan font-weight="700">2</tspan>  Δ<tspan font-style="italic">T</tspan> = highest temperature − start temperature</text>
<text x="502.0" y="204.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="400"><tspan font-weight="700">3</tspan>  <tspan font-style="italic">c</tspan> = <tspan font-style="italic">E</tspan> ÷ (<tspan font-style="italic">m</tspan> × Δ<tspan font-style="italic">T</tspan>)</text>
</g>

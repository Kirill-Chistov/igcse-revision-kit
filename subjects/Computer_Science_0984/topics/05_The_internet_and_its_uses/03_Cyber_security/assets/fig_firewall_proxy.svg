<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Firewall between a computer or network and the internet, checking traffic both ways; proxy server between the user's computer and a web server, forwarding requests" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="afs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .firewa-box{fill:#f1f5f9;stroke:#334155;stroke-width:1.4}
    .firewa-sec{fill:#ccfbf1;stroke:#0f766e;stroke-width:1.8}
    .firewa-t{font-size:14px;font-weight:700;fill:#1e293b;text-anchor:middle}
    .firewa-s{font-size:12px;fill:#475569;text-anchor:middle}
    .firewa-row{font-size:14px;font-weight:700;fill:#1e293b}
    .firewa-li{font-size:12.5px;fill:#134e4a}
    .firewa-x{font-size:12px;fill:#b91c1c}
  </style>

  <text class="firewa-row" x="10" y="18">(a) Firewall</text>
  <rect class="firewa-box" x="10" y="32" width="170" height="54" rx="5"/>
  <text class="firewa-t" x="95" y="55">User's computer</text>
  <text class="firewa-s" x="95" y="73">or internal network</text>
  <rect class="firewa-sec" x="245" y="32" width="160" height="54" rx="5"/>
  <text class="firewa-t" x="325" y="55">Firewall</text>
  <text class="firewa-s" x="325" y="73">hardware or software</text>
  <rect class="firewa-box" x="470" y="32" width="170" height="54" rx="22"/>
  <text class="firewa-t" x="555" y="64">Internet</text>
  <line x1="184" y1="59" x2="241" y2="59" stroke="#334155" stroke-width="1.8" marker-start="url(#afs)" marker-end="url(#af)"/>
  <line x1="409" y1="59" x2="466" y2="59" stroke="#334155" stroke-width="1.8" marker-start="url(#afs)" marker-end="url(#af)"/>
  <text class="firewa-li" x="245" y="106">• checks all incoming and outgoing traffic against set rules</text>
  <text class="firewa-li" x="245" y="123">• blocks traffic that fails, e.g. from a blocked IP address</text>
  <text class="firewa-li" x="245" y="140">• warns the user and logs the traffic</text>

  <line x1="0" y1="158" x2="650" y2="158" stroke="#cbd5e1" stroke-width="1"/>

  <text class="firewa-row" x="10" y="182">(b) Proxy server</text>
  <rect class="firewa-box" x="10" y="196" width="170" height="54" rx="5"/>
  <text class="firewa-t" x="95" y="219">User's computer</text>
  <text class="firewa-s" x="95" y="237">sends a request</text>
  <rect class="firewa-sec" x="245" y="196" width="160" height="54" rx="5"/>
  <text class="firewa-t" x="325" y="219">Proxy server</text>
  <text class="firewa-s" x="325" y="237">intermediary</text>
  <rect class="firewa-box" x="470" y="196" width="170" height="54" rx="5"/>
  <text class="firewa-t" x="555" y="219">Web server</text>
  <text class="firewa-s" x="555" y="237">sees only the proxy</text>
  <line x1="184" y1="215" x2="241" y2="215" stroke="#334155" stroke-width="1.8" marker-end="url(#af)"/>
  <line x1="241" y1="233" x2="184" y2="233" stroke="#334155" stroke-width="1.8" marker-end="url(#af)"/>
  <line x1="409" y1="215" x2="466" y2="215" stroke="#334155" stroke-width="1.8" marker-end="url(#af)"/>
  <line x1="466" y1="233" x2="409" y2="233" stroke="#334155" stroke-width="1.8" marker-end="url(#af)"/>
  <text class="firewa-li" x="245" y="270">• forwards valid requests; blocks invalid ones or banned websites</text>
  <text class="firewa-li" x="245" y="287">• hides the user's IP address; attacks hit the proxy, not the web server</text>
</svg>

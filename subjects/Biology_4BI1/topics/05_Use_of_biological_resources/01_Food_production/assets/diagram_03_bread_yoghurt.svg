<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" role="img" aria-label="Bread: mix flour, water, sugar and yeast; leave warm so yeast respires anaerobically making ethanol and carbon dioxide; carbon dioxide bubbles make the dough rise; baking kills the yeast and evaporates the ethanol. Yoghurt: heat milk to kill bacteria; cool to 40 to 45 degrees and add Lactobacillus; bacteria ferment lactose to lactic acid; pH falls so milk proteins clot and the yoghurt thickens and tastes sour." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .by-t { font-size: 13px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.06em; }
    .by-o { font-size: 12px; fill: #33475b; font-style: italic; }
    .by-h { font-size: 12.5px; font-weight: 700; }
    .by-s { font-size: 12px; fill: #33475b; }
  </style>
  <defs><marker id="by-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker></defs>
  <text class="by-t" x="4" y="46">BREAD</text>
  <text class="by-o" x="4" y="64">yeast</text>
  <text class="by-o" x="4" y="78">(a fungus)</text>
  <rect x="96" y="8" width="148" height="94" rx="7" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6"/>
  <text class="by-h" x="170.0" y="44" text-anchor="middle">Mix</text>
  <text class="by-s" x="170.0" y="60" text-anchor="middle">flour, water, sugar</text>
  <text class="by-s" x="170.0" y="76" text-anchor="middle">and yeast; knead</text>
  <line x1="246" y1="55.0" x2="261" y2="55.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#by-ar)"/>
  <rect x="264" y="8" width="148" height="94" rx="7" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6"/>
  <text class="by-h" x="338.0" y="36" text-anchor="middle">Leave somewhere warm</text>
  <text class="by-s" x="338.0" y="53" text-anchor="middle">anaerobic respiration:</text>
  <text class="by-s" x="338.0" y="68" text-anchor="middle">glucose → ethanol</text>
  <text class="by-s" x="338.0" y="83" text-anchor="middle">+ carbon dioxide</text>
  <line x1="414" y1="55.0" x2="429" y2="55.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#by-ar)"/>
  <rect x="432" y="8" width="148" height="94" rx="7" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6"/>
  <text class="by-h" x="506.0" y="44" text-anchor="middle">Dough rises</text>
  <text class="by-s" x="506.0" y="60" text-anchor="middle"><tspan style="font-weight:700;fill:#16283c">CO₂</tspan> bubbles are</text>
  <text class="by-s" x="506.0" y="76" text-anchor="middle">trapped in the dough</text>
  <line x1="582" y1="55.0" x2="597" y2="55.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#by-ar)"/>
  <rect x="600" y="8" width="148" height="94" rx="7" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6"/>
  <text class="by-h" x="674.0" y="36" text-anchor="middle">Bake</text>
  <text class="by-s" x="674.0" y="53" text-anchor="middle">yeast killed;</text>
  <text class="by-s" x="674.0" y="68" text-anchor="middle">ethanol evaporates;</text>
  <text class="by-s" x="674.0" y="83" text-anchor="middle">bread sets</text>
  <text class="by-t" x="4" y="150">YOGHURT</text>
  <text class="by-o" x="4" y="168">Lactobacillus</text>
  <text class="by-o" x="4" y="182">(a bacterium)</text>
  <rect x="96" y="112" width="148" height="94" rx="7" fill="#eef4fb" stroke="#6b9fd4" stroke-width="1.6"/>
  <text class="by-h" x="170.0" y="148" text-anchor="middle">Heat milk</text>
  <text class="by-s" x="170.0" y="164" text-anchor="middle">(pasteurise): kills</text>
  <text class="by-s" x="170.0" y="180" text-anchor="middle">unwanted bacteria</text>
  <line x1="246" y1="159.0" x2="261" y2="159.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#by-ar)"/>
  <rect x="264" y="112" width="148" height="94" rx="7" fill="#eef4fb" stroke="#6b9fd4" stroke-width="1.6"/>
  <text class="by-h" x="338.0" y="148" text-anchor="middle">Cool to 40–45 °C</text>
  <text class="by-s" x="338.0" y="164" text-anchor="middle">add Lactobacillus;</text>
  <text class="by-s" x="338.0" y="180" text-anchor="middle">keep warm (incubate)</text>
  <line x1="414" y1="159.0" x2="429" y2="159.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#by-ar)"/>
  <rect x="432" y="112" width="148" height="94" rx="7" fill="#eef4fb" stroke="#6b9fd4" stroke-width="1.6"/>
  <text class="by-h" x="506.0" y="148" text-anchor="middle">Fermentation</text>
  <text class="by-s" x="506.0" y="164" text-anchor="middle">anaerobic respiration:</text>
  <text class="by-s" x="506.0" y="180" text-anchor="middle">lactose → <tspan style="font-weight:700;fill:#16283c">lactic acid</tspan></text>
  <line x1="582" y1="159.0" x2="597" y2="159.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#by-ar)"/>
  <rect x="600" y="112" width="148" height="94" rx="7" fill="#eef4fb" stroke="#6b9fd4" stroke-width="1.6"/>
  <text class="by-h" x="674.0" y="140" text-anchor="middle">pH falls</text>
  <text class="by-s" x="674.0" y="157" text-anchor="middle">milk proteins clot:</text>
  <text class="by-s" x="674.0" y="172" text-anchor="middle">thick and sour; harmful</text>
  <text class="by-s" x="674.0" y="187" text-anchor="middle">microbes cannot grow</text>
</svg>

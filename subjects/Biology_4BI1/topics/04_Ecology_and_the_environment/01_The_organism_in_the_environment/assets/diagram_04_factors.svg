<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" height="206" role="img" aria-label="Abiotic factors (light, temperature, water, oxygen and carbon dioxide, mineral ions and soil pH) and biotic factors (food supply, predation, competition, disease) both act on a population. They change the birth rate and death rate, so change population size, and decide where organisms can survive and reproduce, so set their distribution.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .fa-t { font-size: 13px; font-weight: 700; }
    .fa-b { font-size: 12px; font-weight: 700; }
    .fa-s { font-size: 11px; fill: #33475b; }
    .fa-c { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .fa-w { font-size: 11px; fill: #ffffff; }
  </style>
  <defs><marker id="fa-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a6"/></marker></defs>
  <text class="fa-t" x="6" y="16" style="fill:#2f6f9f">ABIOTIC — non-living factors</text>
  <text class="fa-t" x="754" y="16" text-anchor="end" style="fill:#b8433a">BIOTIC — living factors</text>
  <rect x="6" y="26" width="268" height="32" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/>
  <text class="fa-b" x="15" y="39">Light</text><text class="fa-s" x="15" y="52">plants need it for photosynthesis</text>
  <path d="M274,42.0 L318,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="6" y="62" width="268" height="32" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/>
  <text class="fa-b" x="15" y="75">Temperature</text><text class="fa-s" x="15" y="88">affects enzyme activity, so growth and reproduction</text>
  <path d="M274,78.0 L318,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="6" y="98" width="268" height="32" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/>
  <text class="fa-b" x="15" y="111">Water</text><text class="fa-s" x="15" y="124">needed by all organisms; plants wilt without it</text>
  <path d="M274,114.0 L318,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="6" y="134" width="268" height="32" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/>
  <text class="fa-b" x="15" y="147">Oxygen and carbon dioxide</text><text class="fa-s" x="15" y="160">for respiration; CO₂ for photosynthesis</text>
  <path d="M274,150.0 L318,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="6" y="170" width="268" height="32" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/>
  <text class="fa-b" x="15" y="183">Mineral ions and soil pH</text><text class="fa-s" x="15" y="196">affect plant growth</text>
  <path d="M274,186.0 L318,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="486" y="44.0" width="268" height="32" rx="6" fill="#fbecea" stroke="#b8433a" stroke-width="1.2"/>
  <text class="fa-b" x="495" y="57.0">Food supply</text><text class="fa-s" x="495" y="70.0">more food → more survive and reproduce</text>
  <path d="M486,60.0 L444,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="486" y="80.0" width="268" height="32" rx="6" fill="#fbecea" stroke="#b8433a" stroke-width="1.2"/>
  <text class="fa-b" x="495" y="93.0">Predation</text><text class="fa-s" x="495" y="106.0">more predators → more prey eaten</text>
  <path d="M486,96.0 L444,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="486" y="116.0" width="268" height="32" rx="6" fill="#fbecea" stroke="#b8433a" stroke-width="1.2"/>
  <text class="fa-b" x="495" y="129.0">Competition</text><text class="fa-s" x="495" y="142.0">for food, water, light, space, mates</text>
  <path d="M486,132.0 L444,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="486" y="152.0" width="268" height="32" rx="6" fill="#fbecea" stroke="#b8433a" stroke-width="1.2"/>
  <text class="fa-b" x="495" y="165.0">Disease</text><text class="fa-s" x="495" y="178.0">pathogens increase the death rate</text>
  <path d="M486,168.0 L444,114.0" stroke="#8a97a6" stroke-width="1.3" fill="none" marker-end="url(#fa-ar)"/>
  <rect x="322" y="52.0" width="120" height="124" rx="10" fill="#0f7b6c"/>
  <text class="fa-c" x="382" y="72.0" text-anchor="middle">POPULATION SIZE</text>
  <text class="fa-w" x="382" y="88.0" text-anchor="middle">set by birth rate</text>
  <text class="fa-w" x="382" y="101.0" text-anchor="middle">and death rate</text>
  <line x1="338" y1="114.0" x2="426" y2="114.0" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  <text class="fa-c" x="382" y="134.0" text-anchor="middle">DISTRIBUTION</text>
  <text class="fa-w" x="382" y="150.0" text-anchor="middle">only where it can</text>
  <text class="fa-w" x="382" y="163.0" text-anchor="middle">survive and breed</text>
</svg>

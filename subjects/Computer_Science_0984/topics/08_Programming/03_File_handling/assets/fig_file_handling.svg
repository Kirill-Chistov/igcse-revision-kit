<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Data is written from a program to a file on storage and read back" font-family="Carlito, Calibri, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker></defs>
<rect x="20" y="30" width="210" height="120" rx="6" fill="#f3f5f7" stroke="#16283c" stroke-width="1.4"/>
<text x="125.0" y="56.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="bold" style="white-space:pre">Program running</text>
<text x="125.0" y="78.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" style="white-space:pre">variables and arrays in RAM</text>
<text x="125.0" y="112.0" font-size="12.5" fill="#b91c1c" text-anchor="middle" font-weight="bold" style="white-space:pre">Data is lost when the</text>
<text x="125.0" y="128.0" font-size="12.5" fill="#b91c1c" text-anchor="middle" font-weight="bold" style="white-space:pre">program closes or power is off</text>
<path d="M410 30 L590 30 L620 60 L620 150 L410 150 Z" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.6"/>
<path d="M590 30 L590 60 L620 60" fill="none" stroke="#0f766e" stroke-width="1.4"/>
<text x="515.0" y="56.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="bold" style="white-space:pre">File on storage</text>
<text x="515.0" y="78.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">e.g. "Scores.txt"</text>
<text x="515.0" y="112.0" font-size="12.5" fill="#0f766e" text-anchor="middle" font-weight="bold" style="white-space:pre">Data is kept permanently</text>
<text x="515.0" y="128.0" font-size="12.5" fill="#0f766e" text-anchor="middle" font-weight="bold" style="white-space:pre">after the program closes</text>
<path d="M236 70 L402 70" fill="none" stroke="#16283c" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="319.0" y="62.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">WRITEFILE</text>
<path d="M402 112 L236 112" fill="none" stroke="#16283c" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="319.0" y="130.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">READFILE</text>
</svg>

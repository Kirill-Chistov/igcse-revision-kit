<circle cx="537" cy="112.0" r="8" fill="#16283c" stroke="#16283c" stroke-width="1"/>
<text x="537" y="116.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="white">2</text>
<text x="552" y="101.6" font-size="11.5" fill="#16283c">The earth wire has a low</text>
<text x="552" y="116.0" font-size="11.5" fill="#16283c">resistance: a large current</text>
<text x="552" y="130.4" font-size="11.5" fill="#16283c">flows through it to earth.</text>
<line x1="617.0" y1="141" x2="617.0" y2="151" stroke="#16283c" stroke-width="1.8" marker-end="url(#e2f1-16283c)"/>
<rect x="522" y="152" width="190" height="42" rx="6" fill="#eef2f5" stroke="#16283c" stroke-width="1.5"/>
<circle cx="537" cy="173.0" r="8" fill="#16283c" stroke="#16283c" stroke-width="1"/>
<text x="537" y="177.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="white">3</text>
<text x="552" y="169.8" font-size="11.5" fill="#16283c">The large current melts the</text>
<text x="552" y="184.2" font-size="11.5" fill="#16283c">fuse (or trips the breaker).</text>
<line x1="617.0" y1="195" x2="617.0" y2="205" stroke="#16283c" stroke-width="1.8" marker-end="url(#e2f1-16283c)"/>
<rect x="522" y="206" width="190" height="42" rx="6" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="1.5"/>
<circle cx="537" cy="227.0" r="8" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1"/>
<text x="537" y="231.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="white">4</text>
<text x="552" y="223.8" font-size="11.5" fill="#16283c">The live wire is cut off: the</text>
<text x="552" y="238.2" font-size="11.5" fill="#16283c">case is safe to touch.</text>
<text x="10" y="268" font-size="11.5" font-style="italic" fill="#33475b">No earth wire? The case stays at 230 V, and anyone who touches it becomes the path to earth: an electric shock.</text>

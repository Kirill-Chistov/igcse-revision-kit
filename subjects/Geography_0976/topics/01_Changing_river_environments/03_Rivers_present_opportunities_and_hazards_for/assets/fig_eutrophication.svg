<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16283c"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">Eutrophication — how nutrient pollution kills a river</text>
  <g font-size="12" fill="#33475b">
    <g transform="translate(6,44)">
      <rect width="134" height="110" rx="5" fill="#e7f3ef" stroke="#cfe4dd"/>
      <text x="10" y="22" font-size="12.5" font-weight="700" fill="#0b5f54">1 NUTRIENTS IN</text>
      <text x="10" y="44">fertiliser run-off and</text><text x="10" y="60">sewage add nitrates</text><text x="10" y="76">and phosphates</text>
    </g>
    <g transform="translate(157,44)">
      <rect width="134" height="110" rx="5" fill="#e7f3ef" stroke="#cfe4dd"/>
      <text x="10" y="22" font-size="12.5" font-weight="700" fill="#0b5f54">2 ALGAL BLOOM</text>
      <text x="10" y="44">algae grow rapidly</text><text x="10" y="60">and cover the</text><text x="10" y="76">water surface</text>
    </g>
    <g transform="translate(308,44)">
      <rect width="134" height="110" rx="5" fill="#e7f3ef" stroke="#cfe4dd"/>
      <text x="10" y="22" font-size="12.5" font-weight="700" fill="#0b5f54">3 LIGHT BLOCKED</text>
      <text x="10" y="44">plants below cannot</text><text x="10" y="60">photosynthesise</text><text x="10" y="76">and die</text>
    </g>
    <g transform="translate(459,44)">
      <rect width="134" height="110" rx="5" fill="#fdf6e5" stroke="#f1dfb0"/>
      <text x="10" y="22" font-size="12.5" font-weight="700" fill="#8a6412">4 DECOMPOSITION</text>
      <text x="10" y="44">bacteria break down</text><text x="10" y="60">dead plants and</text><text x="10" y="76">algae, using oxygen</text>
    </g>
    <g transform="translate(610,44)">
      <rect width="134" height="110" rx="5" fill="#fdf6e5" stroke="#f1dfb0"/>
      <text x="10" y="22" font-size="12.5" font-weight="700" fill="#8a6412">5 OXYGEN FALLS</text>
      <text x="10" y="44">dissolved oxygen</text><text x="10" y="60">in the water drops</text><text x="10" y="76">sharply</text>
    </g>
    <g transform="translate(761,44)">
      <rect width="134" height="110" rx="5" fill="#fdeded" stroke="#f3c9c4"/>
      <text x="10" y="22" font-size="12.5" font-weight="700" fill="#c0392b">6 FISH DIE</text>
      <text x="10" y="44">fish and other</text><text x="10" y="60">animals suffocate;</text><text x="10" y="76">biodiversity falls</text>
    </g>
  </g>
  <g stroke="#16283c" stroke-width="2" marker-end="url(#k)">
    <line x1="141" y1="99" x2="154" y2="99"/><line x1="292" y1="99" x2="305" y2="99"/><line x1="443" y1="99" x2="456" y2="99"/>
    <line x1="594" y1="99" x2="607" y2="99"/><line x1="745" y1="99" x2="758" y2="99"/>
  </g>
</svg>

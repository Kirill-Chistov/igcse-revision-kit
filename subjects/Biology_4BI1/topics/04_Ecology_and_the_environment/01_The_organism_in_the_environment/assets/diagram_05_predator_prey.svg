<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" role="img" aria-label="Predator and prey populations over time. Both rise and fall in cycles; the predator peaks come shortly after the prey peaks and the predator population is smaller. 1: prey increase, so predators have more food and increase. 2: more predators eat more prey, so prey decrease. 3: predators now have less food, so they decrease. 4: with fewer predators, prey increase again.">

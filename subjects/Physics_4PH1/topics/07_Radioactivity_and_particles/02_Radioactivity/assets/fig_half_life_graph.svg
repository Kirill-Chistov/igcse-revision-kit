<text x="595" y="59.5" font-size="12" fill="#33475b" xml:space="preserve">1. Pick any activity</text>
<text x="595" y="75.0" font-size="12" fill="#33475b" xml:space="preserve">    on the curve.</text>
<text x="595" y="90.5" font-size="12" fill="#33475b" xml:space="preserve">2. Find where it</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="White blood cells and the immune response. A phagocyte ingests a pathogen and digests it. A lymphocyte releases antibodies whose shape is specific to the antigens on the pathogen; they bind to it. Graph: after a vaccine a small, slow antibody response occurs and memory cells are made; on later infection antibodies are produced sooner, faster and in greater quantity.">

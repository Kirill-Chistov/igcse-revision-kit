<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-label="1: a restriction enzyme cuts both DNA strands at a specific base sequence, GAATTC, with a staggered cut that leaves sticky ends. 2: the same enzyme cuts the plasmid open, leaving complementary sticky ends that pair with the ends of the human gene. 3: DNA ligase joins the gene into the plasmid, making a recombinant plasmid." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .cj-t { font-size: 12px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .cj-b { font-size: 15px; font-weight: 700; font-family: "DejaVu Sans Mono", Consolas, monospace; }
    .cj-s { font-size: 12px; fill: #33475b; }
    .cj-l { font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="cj-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
  </defs>
  <!-- Panel 1 -->
  <text class="cj-t" x="6" y="16">1  RESTRICTION ENZYME CUTS</text>
  <rect x="56" y="48" width="110" height="58" rx="4" fill="#fbe9b8"/>
  <g class="cj-b" text-anchor="middle">
    <text x="30" y="70">A</text><text x="48" y="70">T</text><text x="66" y="70">G</text><text x="84" y="70">A</text><text x="102" y="70">A</text><text x="120" y="70">T</text><text x="138" y="70">T</text><text x="156" y="70">C</text><text x="174" y="70">C</text><text x="192" y="70">G</text>
    <text x="30" y="98">T</text><text x="48" y="98">A</text><text x="66" y="98">C</text><text x="84" y="98">T</text><text x="102" y="98">T</text><text x="120" y="98">A</text><text x="138" y="98">A</text><text x="156" y="98">G</text><text x="174" y="98">G</text><text x="192" y="98">C</text>
  </g>
  <path d="M75,48 L75,82 L147,82 L147,108" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <text class="cj-s" x="8" y="136">cuts both strands at a</text>
  <text class="cj-l" x="8" y="151">specific base sequence</text>
  <text class="cj-s" x="8" y="166">(here GAATTC, shaded)</text>
  <text class="cj-s" x="8" y="190">the staggered cut leaves</text>
  <text class="cj-l" x="8" y="205">sticky ends: short</text>
  <text class="cj-l" x="8" y="220">unpaired single strands</text>
  <line x1="236" y1="6" x2="236" y2="230" stroke="#dfe5ea" stroke-width="1.4"/>
  <!-- Panel 2 -->
  <text class="cj-t" x="250" y="16">2  SAME ENZYME CUTS PLASMID</text>
  <g stroke="#c0392b" stroke-width="3.2"><line x1="354" y1="46" x2="396" y2="46"/><line x1="358" y1="53" x2="392" y2="53"/></g>
  <text class="cj-l" x="404" y="46" style="fill:#c0392b">human gene</text>
  <text class="cj-s" x="404" y="60">with sticky ends</text>
  <line x1="375" y1="60" x2="375" y2="88" stroke="#33475b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#cj-ar)"/>
  <g transform="translate(0 -12)"><path d="M392.8,111.1 A52,52 0 1 1 357.2,111.1" fill="none" stroke="#33475b" stroke-width="3.2"/>
  <path d="M388.6,118.9 A44,44 0 1 1 361.4,118.9" fill="none" stroke="#33475b" stroke-width="3.2"/>
  <text class="cj-l" x="375" y="164" text-anchor="middle">plasmid</text></g>
  <text class="cj-s" x="373" y="218" text-anchor="middle">plasmid and gene have matching</text>
  <text class="cj-s" x="373" y="232" text-anchor="middle">sticky ends, which pair up</text>
  <line x1="496" y1="6" x2="496" y2="230" stroke="#dfe5ea" stroke-width="1.4"/>
  <!-- Panel 3 -->
  <text class="cj-t" x="510" y="16">3  DNA LIGASE JOINS</text>
  <circle cx="626" cy="146" r="52" fill="none" stroke="#33475b" stroke-width="3.2"/>
  <circle cx="626" cy="146" r="44" fill="none" stroke="#33475b" stroke-width="3.2"/>
  <path d="M608.2,97.1 A52,52 0 0 1 643.8,97.1" fill="none" stroke="#c0392b" stroke-width="3.6"/>
  <path d="M611,104.7 A44,44 0 0 1 641,104.7" fill="none" stroke="#c0392b" stroke-width="3.6"/>
  <circle cx="608.5" cy="100" r="4.5" fill="#0f7b6c"/>
  <circle cx="643.5" cy="100" r="4.5" fill="#0f7b6c"/>
  <line x1="648" y1="96" x2="680" y2="64" stroke="#6b7a88" stroke-width="1"/>
  <text class="cj-l" x="668" y="44" style="fill:#0b5f54">ligase seals</text>
  <text class="cj-l" x="668" y="58" style="fill:#0b5f54">both joins</text>
  <text class="cj-l" x="626" y="144" text-anchor="middle">recombinant</text>
  <text class="cj-l" x="626" y="160" text-anchor="middle">plasmid</text>
  <text class="cj-s" x="626" y="218" text-anchor="middle">DNA from two different organisms</text>
  <text class="cj-s" x="626" y="232" text-anchor="middle">= recombinant DNA</text>
</svg>

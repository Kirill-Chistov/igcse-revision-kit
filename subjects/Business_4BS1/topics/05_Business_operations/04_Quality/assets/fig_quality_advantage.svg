<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 208" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
  </defs>
  <!-- start -->
  <rect x="6" y="46" width="130" height="64" rx="7" fill="#16283c"/>
  <text x="71" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">High quality</text>
  <text x="71" y="92" text-anchor="middle" font-size="12.5" fill="#dfe5ea">goods or services</text>
  <!-- branches -->
  <path d="M140,68 L160,68 L160,24 L180,24" fill="none" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="140" y1="78" x2="180" y2="78" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M140,88 L160,88 L160,132 L180,132" fill="none" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <g font-size="12.5" fill="#0b5f54">
    <rect x="186" y="4" width="330" height="40" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="198" y="20"><tspan font-weight="700">Good reputation and brand image</tspan></text>
    <text x="198" y="37">→ customer loyalty, repeat purchases, recommendations</text>
    <rect x="186" y="58" width="330" height="40" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="198" y="74"><tspan font-weight="700">Customers will pay more</tspan></text>
    <text x="198" y="91">→ premium price, higher profit margin</text>
    <rect x="186" y="112" width="330" height="40" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="198" y="128"><tspan font-weight="700">Fewer faults, returns and complaints</tspan></text>
    <text x="198" y="145">→ lower costs → lower prices or higher profit</text>
  </g>
  <!-- merge -->
  <path d="M520,24 L540,24 L540,78" fill="none" stroke="#33475b" stroke-width="1.6"/>
  <line x1="520" y1="78" x2="566" y2="78" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M520,132 L540,132 L540,78" fill="none" stroke="#33475b" stroke-width="1.6"/>
  <rect x="572" y="41" width="142" height="74" rx="7" fill="#1e8449"/>
  <text x="643" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Competitive</text>
  <text x="643" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">advantage</text>
  <text x="643" y="105" text-anchor="middle" font-size="12" fill="#eaf7ef">over rivals</text>
  <!-- poor quality -->
  <rect x="6" y="166" width="708" height="38" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.5"/>
  <text x="360" y="190" text-anchor="middle" font-size="13.5" fill="#c0392b"><tspan font-weight="700">Poor quality</tspan> → returns, refunds, product recalls, complaints, bad reviews → lost sales and a damaged reputation</text>
</svg>

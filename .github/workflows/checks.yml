name: checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Repository checks (consistency, privacy, licences)
        run: python3 tools/check_repo.py
      - name: Generated indexes are up to date
        run: |
          pip install --quiet pypdf
          python3 tools/build_index.py --check
      - name: Tracker smoke test
        run: python3 tools/tracker/serve.py --check

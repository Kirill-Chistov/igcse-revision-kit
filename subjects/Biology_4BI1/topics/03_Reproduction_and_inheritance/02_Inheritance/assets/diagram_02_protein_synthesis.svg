<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-label="Transcription in the nucleus: the DNA of a gene unzips and a complementary mRNA strand is built on one DNA strand, with uracil pairing with adenine. The mRNA leaves the nucleus and attaches to a ribosome. Translation: tRNA molecules with anticodons complementary to each mRNA codon bring specific amino acids, which are joined into a chain.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" width="800" height="262" role="img"
     aria-label="Distribution channels: producer to retailer to consumer; producer to e-tailer to consumer; producer's own website direct to consumer">
  <defs>
    <marker id="dc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <!-- producer and consumer -->
    <rect x="8" y="96" width="130" height="70" rx="8" fill="#16283c"/>
    <text x="73" y="128" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Producer</text>
    <text x="73" y="148" font-size="12.5" fill="#c3d0dc" text-anchor="middle">makes the product</text>

    <rect x="662" y="96" width="130" height="70" rx="8" fill="#16283c"/>
    <text x="727" y="128" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Consumer</text>
    <text x="727" y="148" font-size="12.5" fill="#c3d0dc" text-anchor="middle">final user</text>

    <!-- routes -->
    <path d="M140,112 C180,70 200,48 256,44" fill="none" stroke="#16283c" stroke-width="2" marker-end="url(#dc-arr)"/>
    <line x1="140" y1="131" x2="256" y2="131" stroke="#16283c" stroke-width="2" marker-end="url(#dc-arr)"/>
    <path d="M140,150 C180,192 200,214 256,218" fill="none" stroke="#16283c" stroke-width="2" marker-end="url(#dc-arr)"/>

    <rect x="262" y="12" width="200" height="64" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
    <text x="362" y="40" font-size="16" font-weight="700" fill="#0b5f54" text-anchor="middle">Retailer</text>
    <text x="362" y="60" font-size="12.5" text-anchor="middle">physical shop</text>

    <rect x="262" y="99" width="200" height="64" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.8"/>
    <text x="362" y="127" font-size="16" font-weight="700" fill="#4c3fa8" text-anchor="middle">E-tailer</text>
    <text x="362" y="147" font-size="12.5" text-anchor="middle">online store or marketplace</text>

    <rect x="262" y="186" width="200" height="64" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.8"/>
    <text x="362" y="214" font-size="16" font-weight="700" fill="#4c3fa8" text-anchor="middle">Producer's own website</text>
    <text x="362" y="234" font-size="12.5" text-anchor="middle">sells direct, no intermediary</text>

    <path d="M464,44 C560,48 600,70 656,112" fill="none" stroke="#16283c" stroke-width="2" marker-end="url(#dc-arr)"/>
    <line x1="464" y1="131" x2="656" y2="131" stroke="#16283c" stroke-width="2" marker-end="url(#dc-arr)"/>
    <path d="M464,218 C560,214 600,192 656,150" fill="none" stroke="#16283c" stroke-width="2" marker-end="url(#dc-arr)"/>

    <g font-size="12.5" fill="#33475b">
      <text x="500" y="34">customer visits the shop</text>
      <text x="480" y="123">ordered online, delivered</text>
      <text x="500" y="244">ordered online, delivered</text>
    </g>

    <!-- e-commerce bracket -->
    <path d="M252,99 L246,99 L246,250 L252,250" fill="none" stroke="#4c3fa8" stroke-width="1.6"/>
    <text x="236" y="176" font-size="13" font-weight="700" fill="#4c3fa8" text-anchor="middle" transform="rotate(-90 236 176)">e-commerce</text>
  </g>
</svg>

<text x="396.0" y="161.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="400">heater</text>
<line x1="146.0" y1="226.0" x2="124.0" y2="226.0" stroke="#6b7a88" stroke-width="1" stroke-linecap="round"/>
<text x="120.0" y="222.0" font-size="13" fill="#33475b" text-anchor="end" font-weight="400">insulation</text>
<text x="120.0" y="237.0" font-size="13" fill="#33475b" text-anchor="end" font-weight="400">(cuts energy loss)</text>
<text x="260.0" y="256.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="700">metal block, mass <tspan font-style="italic">m</tspan></text>
<rect x="488.0" y="128.0" width="316.0" height="96.0" rx="5" fill="#e7f3ef" stroke="#cfe4dd" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <!-- ===== Panel 1: fusion ===== -->
  <text x="185" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">1 · Fusion: small nuclei join</text>
  <!-- H-2 -->
  <g stroke="#16283c" stroke-width="1">
    <circle cx="36" cy="100" r="9" fill="#c0392b"/><circle cx="52" cy="100" r="9" fill="#9aa5ae"/>
    <circle cx="36" cy="160" r="9" fill="#c0392b"/><circle cx="52" cy="160" r="9" fill="#9aa5ae"/><circle cx="44" cy="174" r="9" fill="#9aa5ae"/>
  </g>
  <text x="44" y="82" font-size="11.5" fill="#33475b" text-anchor="middle">hydrogen-2</text>
  <text x="44" y="200" font-size="11.5" fill="#33475b" text-anchor="middle">hydrogen-3</text>
  <line x1="72" y1="104" x2="120" y2="126" stroke="#16283c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="72" y1="160" x2="120" y2="140" stroke="#16283c" stroke-width="2" marker-end="url(#a)"/>
  <!-- He-4 -->
  <g stroke="#16283c" stroke-width="1">
    <circle cx="160" cy="124" r="9" fill="#c0392b"/><circle cx="176" cy="124" r="9" fill="#9aa5ae"/>
    <circle cx="160" cy="140" r="9" fill="#9aa5ae"/><circle cx="176" cy="140" r="9" fill="#c0392b"/>
  </g>
    <text x="168" y="170" font-size="11.5" font-weight="700" fill="#16283c" text-anchor="middle">helium-4</text>
  <text x="168" y="184" font-size="11" fill="#33475b" text-anchor="middle">(larger nucleus)</text>
  <circle cx="236" cy="104" r="9" fill="#9aa5ae" stroke="#16283c"/>
  <line x1="190" y1="120" x2="224" y2="108" stroke="#16283c" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="250" y="100" font-size="11.5" fill="#33475b">neutron</text>
  <path d="M196,146 l10,-6 l4,10 l10,-6 l4,10 l10,-6" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#r)"/>
  <text x="248" y="150" font-size="12" font-weight="700" fill="#c0392b">energy</text>
  <rect x="24" y="210" width="330" height="32" rx="5" fill="#eef2f5" stroke="#9fb3c3"/>
  <text x="189" y="231" font-size="12.5" font-weight="700" fill="#16283c" text-anchor="middle">mass of products &lt; mass of the nuclei that fused</text>

  <!-- ===== Panel 2: why high T and P ===== -->
  <line x1="372" y1="10" x2="372" y2="245" stroke="#d5dde3" stroke-width="1.5"/>
  <text x="548" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">2 · Why fusion needs high T and P</text>
  <!-- low temperature -->
  <text x="390" y="52" font-size="12.5" font-weight="700" fill="#16283c">Low temperature: slow nuclei</text>
  <circle cx="478" cy="88" r="11" fill="#c0392b" stroke="#16283c"/><text x="478" y="92" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <circle cx="542" cy="88" r="11" fill="#c0392b" stroke="#16283c"/><text x="542" y="92" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <line x1="464" y1="88" x2="414" y2="88" stroke="#16283c" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="556" y1="88" x2="606" y2="88" stroke="#16283c" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="510" y="115" font-size="11" fill="#c0392b" text-anchor="middle">pushed apart</text>
  <text x="620" y="84" font-size="11.5" fill="#33475b">repel before</text>
  <text x="620" y="98" font-size="11.5" fill="#33475b">they touch</text>
  <!-- high temperature -->
  <text x="390" y="140" font-size="12.5" font-weight="700" fill="#16283c">Very high temperature: very fast nuclei</text>
  <line x1="400" y1="176" x2="480" y2="176" stroke="#16283c" stroke-width="2.4" marker-end="url(#a)"/>
  <line x1="600" y1="176" x2="520" y2="176" stroke="#16283c" stroke-width="2.4" marker-end="url(#a)"/>
  <circle cx="489" cy="176" r="11" fill="#c0392b" stroke="#16283c"/><text x="489" y="180" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <circle cx="511" cy="176" r="11" fill="#c0392b" stroke="#16283c"/><text x="511" y="180" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <text x="620" y="172" font-size="11.5" fill="#33475b">overcome the</text>
  <text x="620" y="186" font-size="11.5" fill="#33475b">repulsion → fuse</text>
  <text x="390" y="220" font-size="12" fill="#33475b">High pressure (density) packs nuclei close together,</text>
  <text x="390" y="236" font-size="12" fill="#33475b">so these fast collisions happen often enough.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 176" width="680" height="176" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Structure of a packet: header, payload, trailer">
  <text x="340" y="18" text-anchor="middle" font-size="13" fill="#0f766e" letter-spacing="1">ONE PACKET</text>

  <!-- the three parts -->
  <rect x="20" y="30" width="330" height="44" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <rect x="350" y="30" width="200" height="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="550" y="30" width="110" height="44" fill="#e2e8f0" stroke="#0f766e" stroke-width="2"/>
  <text x="185" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#134e4a">Packet header</text>
  <text x="450" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#134e4a">Payload</text>
  <text x="605" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#134e4a">Trailer</text>

  <!-- header contents -->
  <rect x="20" y="86" width="106" height="52" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <rect x="132" y="86" width="106" height="52" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <rect x="244" y="86" width="106" height="52" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="73" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">destination</text>
  <text x="73" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">address</text>
  <text x="185" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">packet</text>
  <text x="185" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">number</text>
  <text x="297" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">originator’s</text>
  <text x="297" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">address</text>
  <text x="73" y="156" text-anchor="middle" font-size="11.5" fill="#475569">where it is going</text>
  <text x="185" y="156" text-anchor="middle" font-size="11.5" fill="#475569">its place in the order</text>
  <text x="297" y="156" text-anchor="middle" font-size="11.5" fill="#475569">who sent it</text>

  <!-- payload + trailer notes -->
  <text x="450" y="104" text-anchor="middle" font-size="12.5" fill="#334155">the actual data being sent:</text>
  <text x="450" y="121" text-anchor="middle" font-size="12.5" fill="#334155">one piece of the file</text>
  <text x="605" y="104" text-anchor="middle" font-size="12.5" fill="#334155">marks the end</text>
  <text x="605" y="121" text-anchor="middle" font-size="12.5" fill="#334155">of the packet;</text>
  <text x="605" y="138" text-anchor="middle" font-size="12.5" fill="#334155">error-check data</text>
</svg>

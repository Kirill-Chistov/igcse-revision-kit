<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="Levels of organisation from smallest to largest: organelle (mitochondrion or chloroplast), cell (muscle cell or palisade cell), tissue (muscle tissue or palisade tissue), organ (stomach or leaf), organ system (digestive system or shoot system).">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .lo-h  { font-size: 14px; font-weight: 700; fill: #0b5f54; }
    .lo-e  { font-size: 12px; fill: #33475b; }
    .lo-ar { fill: none; stroke: #0f7b6c; stroke-width: 2.4; }
    .lo-ah { fill: #0f7b6c; }
    .lo-sm { font-size: 11.5px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
  </style>
  <text class="lo-sm" x="6" y="14">SMALLEST</text>
  <text class="lo-sm" x="754" y="14" text-anchor="end">LARGEST</text>

  <!-- 1 organelle: mitochondrion -->
  <g transform="translate(76,70)">
    <ellipse cx="0" cy="0" rx="46" ry="24" fill="#fbe9d0" stroke="#b86e12" stroke-width="2"/>
    <path d="M-36,0 C-30,-16 -24,16 -18,0 C-12,-16 -6,16 0,0 C6,-16 12,16 18,0 C24,-16 30,16 36,0" fill="none" stroke="#b86e12" stroke-width="1.8"/>
  </g>
  <!-- 2 cell -->
  <g transform="translate(228,70)">
    <rect x="-44" y="-30" width="88" height="60" rx="14" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#cfe4dd" stroke="#0b5f54" stroke-width="1.6"/>
    <ellipse cx="-26" cy="-12" rx="7" ry="4" fill="#fbe9d0" stroke="#b86e12" stroke-width="1"/>
    <ellipse cx="26" cy="14" rx="7" ry="4" fill="#fbe9d0" stroke="#b86e12" stroke-width="1"/>
  </g>
  <!-- 3 tissue -->
  <g transform="translate(380,70)" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6">
    <rect x="-48" y="-33" width="32" height="22" rx="5"/><rect x="-16" y="-33" width="32" height="22" rx="5"/><rect x="16" y="-33" width="32" height="22" rx="5"/>
    <rect x="-48" y="-11" width="32" height="22" rx="5"/><rect x="-16" y="-11" width="32" height="22" rx="5"/><rect x="16" y="-11" width="32" height="22" rx="5"/>
    <rect x="-48" y="11" width="32" height="22" rx="5"/><rect x="-16" y="11" width="32" height="22" rx="5"/><rect x="16" y="11" width="32" height="22" rx="5"/>
    <g fill="#cfe4dd" stroke="#0b5f54" stroke-width="1">
      <circle cx="-32" cy="-22" r="4"/><circle cx="0" cy="-22" r="4"/><circle cx="32" cy="-22" r="4"/>
      <circle cx="-32" cy="0" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="32" cy="0" r="4"/>
      <circle cx="-32" cy="22" r="4"/><circle cx="0" cy="22" r="4"/><circle cx="32" cy="22" r="4"/>
    </g>
  </g>
  <!-- 4 organ: stomach -->
  <g transform="translate(532,70)">
    <path d="M-14,-38 L-10,-22 C-34,-18 -40,10 -22,26 C-4,42 34,36 42,14 C48,-2 40,-14 30,-12 C20,-10 18,2 8,4 C0,6 -2,-10 2,-22 L6,-38 Z" fill="#f6dada" stroke="#a93226" stroke-width="2"/>
  </g>
  <!-- 5 system: simplified digestive system -->
  <g transform="translate(684,70)" fill="none" stroke-width="2">
    <path d="M-6,-40 L-6,-24" stroke="#a93226"/>
    <path d="M-10,-24 C-30,-20 -30,-2 -14,2 C0,6 16,0 18,-10 C20,-20 8,-24 -2,-24 Z" fill="#f6dada" stroke="#a93226"/>
    <path d="M18,-8 C34,-6 36,6 22,8 C4,10 -20,8 -24,16 C-28,24 -6,26 8,24 C22,22 30,28 20,34 C10,40 -14,38 -18,32" stroke="#a93226"/>
    <path d="M-30,6 C-40,20 -38,40 -18,40 C0,40 24,42 34,30 C42,20 42,4 34,-4" stroke="#b86e12" stroke-width="3"/>
  </g>

  <!-- arrows -->
  <g>
    <path class="lo-ar" d="M128,70 L170,70"/><path class="lo-ah" d="M178,70 l-10,-6 v12 z"/>
    <path class="lo-ar" d="M280,70 L322,70"/><path class="lo-ah" d="M330,70 l-10,-6 v12 z"/>
    <path class="lo-ar" d="M434,70 L474,70"/><path class="lo-ah" d="M482,70 l-10,-6 v12 z"/>
    <path class="lo-ar" d="M584,70 L626,70"/><path class="lo-ah" d="M634,70 l-10,-6 v12 z"/>
  </g>

  <!-- labels -->
  <g text-anchor="middle">
    <text class="lo-h" x="76" y="132">Organelle</text>
    <text class="lo-e" x="76" y="152">mitochondrion,</text>
    <text class="lo-e" x="76" y="167">nucleus</text>
    <text class="lo-e" x="76" y="186">(plant: chloroplast)</text>

    <text class="lo-h" x="228" y="132">Cell</text>
    <text class="lo-e" x="228" y="152">muscle cell</text>
    <text class="lo-e" x="228" y="186">(plant: palisade cell)</text>

    <text class="lo-h" x="380" y="132">Tissue</text>
    <text class="lo-e" x="380" y="152">muscle tissue</text>
    <text class="lo-e" x="380" y="186">(plant: palisade tissue)</text>

    <text class="lo-h" x="532" y="132">Organ</text>
    <text class="lo-e" x="532" y="152">stomach</text>
    <text class="lo-e" x="532" y="186">(plant: leaf)</text>

    <text class="lo-h" x="684" y="132">Organ system</text>
    <text class="lo-e" x="684" y="152">digestive system</text>
    <text class="lo-e" x="684" y="186">(plant: shoot system)</text>
  </g>
</svg>

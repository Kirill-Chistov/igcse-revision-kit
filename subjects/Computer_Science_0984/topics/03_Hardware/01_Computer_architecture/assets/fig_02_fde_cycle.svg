<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 379" width="775" height="379" role="img" aria-label="Fetch–decode–execute cycle in eight numbered steps. Fetch: PC address copied to MAR; address sent on address bus with a read signal on the control bus; instruction sent on the data bus to the MDR; copied to the CIR; PC incremented. Decode: the CU decodes the instruction in the CIR. Execute: the CU sends control signals; the ALU carries out arithmetic and logic operations with results in the ACC. The cycle then repeats." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .fd-t { font-size: 13px; }
    .fd-n { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .fd-g { font-size: 12px; font-weight: 700; }
    .fd-p { font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: 1px; }
    .fd-l { font-size: 11.5px; font-style: italic; fill: #33475b; }
  </style>
  <defs><marker id="fd-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker></defs>
  <rect x="10" y="10" width="60" height="210" rx="6" fill="#2f6f9f"/><text class="fd-p" x="40" y="115.0" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 40 115.0)">FETCH</text><rect x="10" y="235" width="60" height="38" rx="6" fill="#0f7b6c"/><text class="fd-p" x="40" y="258.0" text-anchor="middle" style="font-size:11px;letter-spacing:0.5px">DECODE</text><rect x="10" y="288" width="60" height="81" rx="6" fill="#4c3fa8"/><text class="fd-p" x="40" y="328.5" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 40 328.5)">EXECUTE</text>
  <rect x="80" y="10" width="640" height="38" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="100" cy="29.0" r="11" fill="#2f6f9f"/><text class="fd-n" x="100" y="33.5" text-anchor="middle">1</text><text class="fd-t" x="120" y="33.5">The address of the next instruction, held in the PC, is copied to the MAR.</text><text class="fd-g" x="712" y="33.5" text-anchor="end" style="fill:#2f6f9f">PC → MAR</text><rect x="80" y="53" width="640" height="38" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="100" cy="72.0" r="11" fill="#2f6f9f"/><text class="fd-n" x="100" y="76.5" text-anchor="middle">2</text><text class="fd-t" x="120" y="68">The address is sent to RAM on the address bus; the CU sends</text><text class="fd-t" x="120" y="83">a read signal on the control bus.</text><text class="fd-g" x="712" y="76.5" text-anchor="end" style="fill:#2f6f9f">address bus, control bus</text><rect x="80" y="96" width="640" height="38" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="100" cy="115.0" r="11" fill="#2f6f9f"/><text class="fd-n" x="100" y="119.5" text-anchor="middle">3</text><text class="fd-t" x="120" y="119.5">The instruction stored at that address is sent on the data bus to the MDR.</text><text class="fd-g" x="712" y="119.5" text-anchor="end" style="fill:#2f6f9f">RAM → data bus → MDR</text><rect x="80" y="139" width="640" height="38" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="100" cy="158.0" r="11" fill="#2f6f9f"/><text class="fd-n" x="100" y="162.5" text-anchor="middle">4</text><text class="fd-t" x="120" y="162.5">The instruction is copied from the MDR to the CIR.</text><text class="fd-g" x="712" y="162.5" text-anchor="end" style="fill:#2f6f9f">MDR → CIR</text><rect x="80" y="182" width="640" height="38" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.2"/><circle cx="100" cy="201.0" r="11" fill="#2f6f9f"/><text class="fd-n" x="100" y="205.5" text-anchor="middle">5</text><text class="fd-t" x="120" y="205.5">The PC is incremented by 1, so it now holds the address of the next instruction.</text><text class="fd-g" x="712" y="205.5" text-anchor="end" style="fill:#2f6f9f">PC + 1</text><rect x="80" y="235" width="640" height="38" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.2"/><circle cx="100" cy="254.0" r="11" fill="#0f7b6c"/><text class="fd-n" x="100" y="258.5" text-anchor="middle">6</text><text class="fd-t" x="120" y="250">The CU decodes the instruction in the CIR: it works out which operation</text><text class="fd-t" x="120" y="265">to carry out and what data is needed.</text><text class="fd-g" x="712" y="258.5" text-anchor="end" style="fill:#0f7b6c">CU</text><rect x="80" y="288" width="640" height="38" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.2"/><circle cx="100" cy="307.0" r="11" fill="#4c3fa8"/><text class="fd-n" x="100" y="311.5" text-anchor="middle">7</text><text class="fd-t" x="120" y="303">The CU sends control signals on the control bus to the components that</text><text class="fd-t" x="120" y="318">carry out the instruction; any data needed is fetched via the MAR and MDR.</text><text class="fd-g" x="712" y="311.5" text-anchor="end" style="fill:#4c3fa8">CU, control bus</text><rect x="80" y="331" width="640" height="38" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.2"/><circle cx="100" cy="350.0" r="11" fill="#4c3fa8"/><text class="fd-n" x="100" y="354.5" text-anchor="middle">8</text><text class="fd-t" x="120" y="354.5">Arithmetic and logic operations are done by the ALU; results are held in the ACC.</text><text class="fd-g" x="712" y="354.5" text-anchor="end" style="fill:#4c3fa8">ALU → ACC</text>
  <path d="M720,350 L748,350 L748,29 L724,29" fill="none" stroke="#16283c" stroke-width="2" marker-end="url(#fd-ar)"/><text class="fd-l" x="760" y="189.5" text-anchor="middle" transform="rotate(90 760 189.5)">repeat for the next instruction</text>
</svg>

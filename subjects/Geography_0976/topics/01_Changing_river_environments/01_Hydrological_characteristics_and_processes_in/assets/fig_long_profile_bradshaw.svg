<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16283c"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">The long profile and the Bradshaw model</text>
  <g font-size="13" fill="#33475b">
    <text x="16" y="62" font-weight="700" fill="#16283c">Long profile</text>
    <text x="16" y="79">the gradient of a river</text>
    <text x="16" y="95">from source to mouth:</text>
    <text x="16" y="111">steep near the source,</text>
    <text x="16" y="127">gentle near the mouth —</text>
    <text x="16" y="143">a smooth concave curve</text>
  </g>
  <path d="M270,52 C360,140 520,182 880,192 L880,208 L270,208 Z" fill="#efe6d2"/>
  <path d="M270,52 C360,140 520,182 880,192" fill="none" stroke="#2a5f80" stroke-width="4"/>
  <line x1="270" y1="194" x2="880" y2="194" stroke="#3d7ea6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="690" y="206" font-size="12" fill="#3d7ea6">sea level (base level)</text>
  <line x1="270" y1="40" x2="270" y2="208" stroke="#6b7a88" stroke-width="1.2"/>
  <text x="258" y="130" font-size="12" fill="#6b7a88" transform="rotate(-90 258 130)" text-anchor="middle">height</text>
  <line x1="470" y1="40" x2="470" y2="208" stroke="#6b7a88" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="680" y1="40" x2="680" y2="208" stroke="#6b7a88" stroke-width="1" stroke-dasharray="4 4"/>
  <g font-size="13" font-weight="700" fill="#16283c" text-anchor="middle">
    <text x="370" y="48">Upper course</text><text x="575" y="48">Middle course</text><text x="780" y="48">Lower course</text>
  </g>
  <text x="262" y="58" font-size="12.5" font-weight="700" fill="#2a5f80" text-anchor="end">Source</text>
  <text x="846" y="182" font-size="12.5" font-weight="700" fill="#2a5f80">Mouth</text>
  <line x1="16" y1="224" x2="884" y2="224" stroke="#dfe5ea" stroke-width="1.5"/>
  <text x="16" y="248" font-size="13" font-weight="700" fill="#16283c">Bradshaw model</text>
  <text x="16" y="264" font-size="12.5" fill="#33475b">how channel characteristics change downstream</text>
  <line x1="300" y1="258" x2="850" y2="258" stroke="#16283c" stroke-width="2" marker-end="url(#k)"/>
  <text x="300" y="250" font-size="12.5" font-weight="700" fill="#16283c">UPSTREAM</text>
  <text x="858" y="250" font-size="12.5" font-weight="700" fill="#16283c" text-anchor="end">DOWNSTREAM</text>
  <path d="M270,284.5 L880,275 L880,297 L270,287.5 Z" fill="#0f7b6c"/>
  <text x="16" y="291" font-size="13.5" fill="#16283c">Discharge</text><text x="205" y="291" font-size="12" font-weight="700" fill="#0f7b6c">increases</text>
  <path d="M270,312.5 L880,303 L880,325 L270,315.5 Z" fill="#0f7b6c"/>
  <text x="16" y="319" font-size="13.5" fill="#16283c">Occupied channel width</text><text x="205" y="319" font-size="12" font-weight="700" fill="#0f7b6c">increases</text>
  <path d="M270,340.5 L880,331 L880,353 L270,343.5 Z" fill="#0f7b6c"/>
  <text x="16" y="347" font-size="13.5" fill="#16283c">Channel depth</text><text x="205" y="347" font-size="12" font-weight="700" fill="#0f7b6c">increases</text>
  <path d="M270,368.5 L880,359 L880,381 L270,371.5 Z" fill="#0f7b6c"/>
  <text x="16" y="375" font-size="13.5" fill="#16283c">Average velocity</text><text x="205" y="375" font-size="12" font-weight="700" fill="#0f7b6c">increases</text>
  <path d="M270,396.5 L880,387 L880,409 L270,399.5 Z" fill="#0f7b6c"/>
  <text x="16" y="403" font-size="13.5" fill="#16283c">Load quantity</text><text x="205" y="403" font-size="12" font-weight="700" fill="#0f7b6c">increases</text>
  <path d="M270,423 L880,432.5 L880,435.5 L270,445 Z" fill="#b8912e"/>
  <text x="16" y="439" font-size="13.5" fill="#16283c">Load particle size</text><text x="205" y="439" font-size="12" font-weight="700" fill="#8a6f33">decreases</text>
  <path d="M270,451 L880,460.5 L880,463.5 L270,473 Z" fill="#b8912e"/>
  <text x="16" y="467" font-size="13.5" fill="#16283c">Channel bed roughness</text><text x="205" y="467" font-size="12" font-weight="700" fill="#8a6f33">decreases</text>
  <path d="M270,479 L880,488.5 L880,491.5 L270,501 Z" fill="#b8912e"/>
  <text x="16" y="495" font-size="13.5" fill="#16283c">Slope angle (gradient)</text><text x="205" y="495" font-size="12" font-weight="700" fill="#8a6f33">decreases</text>
</svg>

  <text class="gd-g" x="610.0" y="146.0" text-anchor="middle">t</text>
  <text class="gd-g" x="644.0" y="146.0" text-anchor="middle">t</text>
  <text class="gd-g" x="576.0" y="180.0" text-anchor="middle">T</text>
  <text class="gd-g" x="576.0" y="214.0" text-anchor="middle">t</text>
  <text class="gd-g" x="610.0" y="180.0" text-anchor="middle">Tt</text>
  <text class="gd-g" x="644.0" y="180.0" text-anchor="middle">Tt</text>
  <text class="gd-g" x="610.0" y="214.0" text-anchor="middle">tt</text>
  <text class="gd-g" x="644.0" y="214.0" text-anchor="middle">tt</text>

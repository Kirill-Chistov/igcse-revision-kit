<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" role="img" aria-label="Micropropagation: choose a parent plant with the desired characteristics; cut small explants from its shoot tips and sterilise them; place them in vitro on sterile agar containing nutrients and plant hormones; the cells divide by mitosis to form many plantlets with shoots and roots, which can be divided again; transfer the plantlets to compost to grow into identical plants." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .mp-h { font-size: 12.5px; font-weight: 700; }
    .mp-s { font-size: 11.8px; fill: #33475b; }
    .mp-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .mp-r { font-size: 11.5px; font-weight: 700; fill: #0b5f54; font-style: italic; }
  </style>
  <defs>
    <marker id="mp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <marker id="mp-ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker>
  </defs>
  <!-- 1 parent plant -->
  <path d="M58,100 L96,100 L92,120 L62,120 Z" fill="#c98a5a" stroke="#8a5a3a" stroke-width="1.2"/>
  <path d="M77,100 L77,30" stroke="#2e7d4f" stroke-width="2.4"/>
  <g fill="#5fae6e" stroke="#2e7d4f" stroke-width="0.8">
    <ellipse cx="66" cy="80" rx="11" ry="5" transform="rotate(-25 66 80)"/><ellipse cx="88" cy="70" rx="11" ry="5" transform="rotate(25 88 70)"/>
    <ellipse cx="67" cy="54" rx="10" ry="4.5" transform="rotate(-25 67 54)"/><ellipse cx="87" cy="46" rx="10" ry="4.5" transform="rotate(25 87 46)"/>
  </g>
  <circle cx="77" cy="26" r="6" fill="#d96aa0" stroke="#a63d72" stroke-width="1"/>
  <circle cx="87" cy="44" r="7" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="130" y1="72" x2="160" y2="72" stroke="#33475b" stroke-width="2" marker-end="url(#mp-ar)"/>
  <!-- 2 explants -->
  <g fill="#8cc79a" stroke="#2e7d4f" stroke-width="1">
    <rect x="198" y="58" width="12" height="9" rx="2"/><rect x="220" y="66" width="12" height="9" rx="2"/><rect x="242" y="56" width="12" height="9" rx="2"/><rect x="208" y="82" width="12" height="9" rx="2"/><rect x="232" y="86" width="12" height="9" rx="2"/>
  </g>
  <path d="M196,30 L250,40 L252,46 L198,36 Z" fill="#dfe5ea" stroke="#33475b" stroke-width="1.2"/>
  <line x1="252" y1="43" x2="272" y2="46" stroke="#33475b" stroke-width="3"/>
  <line x1="282" y1="72" x2="312" y2="72" stroke="#33475b" stroke-width="2" marker-end="url(#mp-ar)"/>
  <!-- 3 in vitro on agar -->
  <path d="M340,34 L340,110 Q340,116 346,116 L404,116 Q410,116 410,110 L410,34" fill="#ffffff" stroke="#33475b" stroke-width="1.8"/>
  <rect x="336" y="28" width="78" height="8" rx="2" fill="#8fa3b8" stroke="#33475b" stroke-width="1"/>
  <path d="M342,88 L408,88 L408,110 Q408,114 404,114 L346,114 Q342,114 342,110 Z" fill="#f3e3a8"/>
  <g fill="#8cc79a" stroke="#2e7d4f" stroke-width="1"><rect x="356" y="80" width="11" height="8" rx="2"/><rect x="384" y="80" width="11" height="8" rx="2"/></g>
  <text class="mp-s" x="375" y="106" text-anchor="middle" style="font-size:10.5px">agar</text>
  <line x1="434" y1="72" x2="464" y2="72" stroke="#33475b" stroke-width="2" marker-end="url(#mp-ar)"/>
  <!-- 4 plantlets -->
  <path d="M492,34 L492,110 Q492,116 498,116 L556,116 Q562,116 562,110 L562,34" fill="#ffffff" stroke="#33475b" stroke-width="1.8"/>
  <rect x="488" y="28" width="78" height="8" rx="2" fill="#8fa3b8" stroke="#33475b" stroke-width="1"/>
  <path d="M494,88 L560,88 L560,110 Q560,114 556,114 L498,114 Q494,114 494,110 Z" fill="#f3e3a8"/>
  <g stroke="#2e7d4f" stroke-width="1.6" fill="none">
    <path d="M504,88 L504,62"/><path d="M516,88 L516,56"/><path d="M528,88 L528,64"/><path d="M540,88 L540,58"/><path d="M551,88 L551,66"/>
  </g>
  <g stroke="#b08a3a" stroke-width="1.1" fill="none">
    <path d="M504,88 L501,100 M504,88 L507,99"/><path d="M516,88 L513,101 M516,88 L519,100"/><path d="M528,88 L525,99 M528,88 L531,101"/><path d="M540,88 L537,100 M540,88 L543,99"/><path d="M551,88 L548,99 M551,88 L554,100"/>
  </g>
  <g fill="#5fae6e" stroke="#2e7d4f" stroke-width="0.6">
    <ellipse cx="500" cy="64" rx="5" ry="2.5" transform="rotate(-30 500 64)"/><ellipse cx="520" cy="58" rx="5" ry="2.5" transform="rotate(30 520 58)"/><ellipse cx="524" cy="66" rx="5" ry="2.5" transform="rotate(-30 524 66)"/><ellipse cx="544" cy="60" rx="5" ry="2.5" transform="rotate(30 544 60)"/><ellipse cx="547" cy="68" rx="5" ry="2.5" transform="rotate(-30 547 68)"/>
  </g>
  <path d="M527,24 Q527,6 450,6 Q375,6 375,24" fill="none" stroke="#0f7b6c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#mp-ag)"/>
  <text class="mp-r" x="451" y="20" text-anchor="middle">divide again</text>
  <line x1="586" y1="72" x2="616" y2="72" stroke="#33475b" stroke-width="2" marker-end="url(#mp-ar)"/>
  <!-- 5 identical plants in compost -->
  <g>
    <path d="M630,96 L656,96 L653,116 L633,116 Z" fill="#c98a5a" stroke="#8a5a3a" stroke-width="1"/>
    <path d="M668,96 L694,96 L691,116 L671,116 Z" fill="#c98a5a" stroke="#8a5a3a" stroke-width="1"/>
    <path d="M706,96 L732,96 L729,116 L709,116 Z" fill="#c98a5a" stroke="#8a5a3a" stroke-width="1"/>
    <g stroke="#2e7d4f" stroke-width="2"><path d="M643,96 L643,54"/><path d="M681,96 L681,54"/><path d="M719,96 L719,54"/></g>
    <g fill="#5fae6e" stroke="#2e7d4f" stroke-width="0.7">
      <ellipse cx="636" cy="80" rx="8" ry="3.8" transform="rotate(-25 636 80)"/><ellipse cx="650" cy="70" rx="8" ry="3.8" transform="rotate(25 650 70)"/>
      <ellipse cx="674" cy="80" rx="8" ry="3.8" transform="rotate(-25 674 80)"/><ellipse cx="688" cy="70" rx="8" ry="3.8" transform="rotate(25 688 70)"/>
      <ellipse cx="712" cy="80" rx="8" ry="3.8" transform="rotate(-25 712 80)"/><ellipse cx="726" cy="70" rx="8" ry="3.8" transform="rotate(25 726 70)"/>
    </g>
    <g fill="#d96aa0" stroke="#a63d72" stroke-width="0.8"><circle cx="643" cy="51" r="5"/><circle cx="681" cy="51" r="5"/><circle cx="719" cy="51" r="5"/></g>
  </g>
  <!-- captions -->
  <g>
    <circle cx="14" cy="144" r="9" fill="#0f7b6c"/><text class="mp-n" x="14" y="148" text-anchor="middle">1</text>
    <text class="mp-h" x="27" y="148">Parent plant</text>
    <text class="mp-s" x="10" y="166">with the desired</text>
    <text class="mp-s" x="10" y="180">characteristics</text>
    <circle cx="178" cy="144" r="9" fill="#0f7b6c"/><text class="mp-n" x="178" y="148" text-anchor="middle">2</text>
    <text class="mp-h" x="191" y="148">Explants</text>
    <text class="mp-s" x="170" y="166">small pieces cut from</text>
    <text class="mp-s" x="170" y="180">shoot tips; sterilised</text>
    <text class="mp-s" x="170" y="194">(aseptic technique)</text>
    <circle cx="330" cy="144" r="9" fill="#0f7b6c"/><text class="mp-n" x="330" y="148" text-anchor="middle">3</text>
    <text class="mp-h" x="343" y="148">In vitro</text>
    <text class="mp-s" x="322" y="166">on sterile agar with</text>
    <text class="mp-s" x="322" y="180">nutrients and plant</text>
    <text class="mp-s" x="322" y="194">hormones</text>
    <circle cx="482" cy="144" r="9" fill="#0f7b6c"/><text class="mp-n" x="482" y="148" text-anchor="middle">4</text>
    <text class="mp-h" x="495" y="148">Plantlets</text>
    <text class="mp-s" x="474" y="166">cells divide by mitosis;</text>
    <text class="mp-s" x="474" y="180">shoots and roots</text>
    <text class="mp-s" x="474" y="194">develop</text>
    <circle cx="630" cy="144" r="9" fill="#0f7b6c"/><text class="mp-n" x="630" y="148" text-anchor="middle">5</text>
    <text class="mp-h" x="643" y="148">Into compost</text>
    <text class="mp-s" x="622" y="166">grown on in a</text>
    <text class="mp-s" x="622" y="180">greenhouse: many</text>
    <text class="mp-s" x="622" y="194">identical plants</text>
  </g>
</svg>

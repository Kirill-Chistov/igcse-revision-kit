<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 258" width="680" height="258" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Asymmetric encryption with a public key and a private key">
<defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="asg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker></defs>
<rect x="10" y="10" width="190" height="210" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="480" y="10" width="190" height="210" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">Tom (sender)</text>
<text x="575" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">Jane (receiver)</text>
<text x="575" y="56" text-anchor="middle" font-size="12" fill="#1e293b">generates a matching</text>
<text x="575" y="71" text-anchor="middle" font-size="12" fill="#1e293b">pair of keys:</text>
<g stroke="#15803d" stroke-width="2.4" fill="none"><circle cx="500" cy="92" r="6"/><line x1="506" y1="92" x2="526" y2="92"/><line x1="520" y1="92" x2="520" y2="98"/><line x1="525" y1="92" x2="525" y2="98"/></g>
<text x="536" y="96" font-size="12.5" font-weight="700" fill="#15803d">public key</text>
<g stroke="#b91c1c" stroke-width="2.4" fill="none"><circle cx="500" cy="116" r="6"/><line x1="506" y1="116" x2="526" y2="116"/><line x1="520" y1="116" x2="520" y2="122"/><line x1="525" y1="116" x2="525" y2="122"/></g>
<text x="536" y="120" font-size="12.5" font-weight="700" fill="#b91c1c">private key</text>
<text x="536" y="135" font-size="11" fill="#7f1d1d">kept secret, never sent</text>
<line x1="478" y1="92" x2="204" y2="92" stroke="#15803d" stroke-width="2.2" marker-end="url(#asg)"/>
<text x="340" y="84" text-anchor="middle" font-size="12.5" fill="#14532d"><tspan font-weight="700">1</tspan>  Jane sends her public key to Tom</text>
<g stroke="#15803d" stroke-width="2.4" fill="none"><circle cx="92" cy="96" r="6"/><line x1="98" y1="96" x2="118" y2="96"/><line x1="112" y1="96" x2="112" y2="102"/><line x1="117" y1="96" x2="117" y2="102"/></g>
<text x="105" y="62" text-anchor="middle" font-size="12" fill="#1e293b">receives:</text><text x="105" y="122" text-anchor="middle" font-size="11" fill="#475569">Jane’s public key</text>
<text x="105" y="168" text-anchor="middle" font-size="12.5" fill="#1e293b"><tspan font-weight="700">2</tspan>  encrypts the</text>
<text x="105" y="184" text-anchor="middle" font-size="12.5" fill="#1e293b">document with</text>
<text x="105" y="200" text-anchor="middle" font-size="12.5" fill="#1e293b">Jane’s public key</text>
<line x1="202" y1="184" x2="476" y2="184" stroke="#0f766e" stroke-width="2.2" marker-end="url(#as)"/>
<text x="340" y="176" text-anchor="middle" font-size="12.5" fill="#134e4a"><tspan font-weight="700">3</tspan>  ciphertext is sent</text>
<text x="575" y="168" text-anchor="middle" font-size="12.5" fill="#1e293b"><tspan font-weight="700">4</tspan>  decrypts it with</text>
<text x="575" y="184" text-anchor="middle" font-size="12.5" fill="#1e293b">her own private key</text>
<text x="340" y="244" text-anchor="middle" font-size="12.5" fill="#134e4a">Data encrypted with the public key can only be decrypted with the matching private key.</text>
</svg>

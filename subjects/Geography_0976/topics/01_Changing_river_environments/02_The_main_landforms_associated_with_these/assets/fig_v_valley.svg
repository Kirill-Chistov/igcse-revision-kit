<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0f7b6c"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#8a6f33"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">V-shaped valley and interlocking spurs — upper course</text>

  <!-- ===== left: cross-section ===== -->
  <text x="20" y="50" font-size="13.5" font-weight="700" fill="#16283c">Cross-section of a V-shaped valley</text>
  <path d="M20,70 L185,250 L225,250 L400,70 L400,300 L20,300 Z" fill="#e3d3ae"/>
  <path d="M20,70 L185,250 L225,250 L400,70" fill="none" stroke="#4b6b3d" stroke-width="2.4"/>
  <path d="M187,248 Q205,262 223,248 Z" fill="#3d7ea6"/>
  <!-- slope arrows -->
  <line x1="80" y1="120" x2="136" y2="182" stroke="#8a6f33" stroke-width="2.6" marker-end="url(#r)"/>
  <line x1="330" y1="127" x2="274" y2="188" stroke="#8a6f33" stroke-width="2.6" marker-end="url(#r)"/>
  <text x="210" y="84" font-size="12.5" font-weight="700" fill="#8a6f33" text-anchor="middle">weathering loosens the valley sides;</text>
  <text x="210" y="99" font-size="12.5" font-weight="700" fill="#8a6f33" text-anchor="middle">mass movement carries material</text>
  <text x="210" y="114" font-size="12.5" font-weight="700" fill="#8a6f33" text-anchor="middle">down into the river, which removes it</text>
  <!-- vertical erosion -->
  <line x1="205" y1="262" x2="205" y2="292" stroke="#0f7b6c" stroke-width="3" marker-end="url(#t)"/>
  <text x="222" y="274" font-size="12.5" font-weight="700" fill="#0f7b6c">vertical erosion deepens the channel</text>
  <text x="222" y="289" font-size="12" fill="#0f7b6c">(hydraulic action, abrasion)</text>
  <text x="120" y="244" font-size="12" fill="#16283c" text-anchor="end">steep sides</text>
  <text x="252" y="236" font-size="12" fill="#16283c">river fills the</text>
  <text x="252" y="249" font-size="12" fill="#16283c">narrow floor</text>

  <!-- ===== right: plan view ===== -->
  <text x="470" y="50" font-size="13.5" font-weight="700" fill="#16283c">Plan view — interlocking spurs</text>
  <rect x="470" y="62" width="420" height="232" fill="#eef4e6"/>
  <g fill="#d6c49a">
    <rect x="470" y="62" width="420" height="48"/>
    <rect x="470" y="246" width="420" height="48"/>
    <path d="M480,110 C495,160 525,190 540,190 C555,190 585,160 600,110 Z"/>
    <path d="M660,110 C675,160 705,190 720,190 C735,190 765,160 780,110 Z"/>
    <path d="M570,246 C585,196 615,152 630,152 C645,152 675,196 690,246 Z"/>
    <path d="M750,246 C765,196 795,152 810,152 C825,152 855,196 870,246 Z"/>
  </g>
  <path d="M470,190 C500,212 520,214 540,212 C580,210 600,128 630,128 C660,128 690,212 720,212 C750,212 780,128 810,128 C840,128 860,170 890,190"
        fill="none" stroke="#3d7ea6" stroke-width="5" stroke-linecap="round"/>
  <text x="540" y="88" font-size="12" font-weight="700" fill="#6b5424" text-anchor="middle">SPUR</text>
  <text x="630" y="272" font-size="12" font-weight="700" fill="#6b5424" text-anchor="middle">SPUR</text>
  <text x="720" y="88" font-size="12" font-weight="700" fill="#6b5424" text-anchor="middle">SPUR</text>
  <text x="810" y="272" font-size="12" font-weight="700" fill="#6b5424" text-anchor="middle">SPUR</text>
  <text x="478" y="236" font-size="12" fill="#2a5f80" font-weight="700">river</text>
</svg>

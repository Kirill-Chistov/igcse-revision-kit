<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="Cloning Dolly: a diploid nucleus is taken from a body cell of sheep A (white face); the nucleus is removed from an egg cell of sheep B (black face); the diploid nucleus is inserted into the enucleated egg and an electric shock makes them fuse and start dividing; the cell divides by mitosis into an embryo, which is implanted into the uterus of a surrogate mother, sheep C; the lamb Dolly is genetically identical to sheep A." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>

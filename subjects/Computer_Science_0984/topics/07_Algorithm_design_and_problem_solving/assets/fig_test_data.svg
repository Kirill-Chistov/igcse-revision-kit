<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 196" width="820" height="196" role="img"
     aria-label="Test data for a whole-number mark from 0 to 100: normal, extreme, boundary and abnormal values on a number line" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Carlito, Calibri, sans-serif" font-size="16" fill="#16283c" text-anchor="middle">
    <!-- accepted band -->
    <rect x="250" y="62" width="320" height="28" fill="#eaf7ef" stroke="#1e8449" stroke-width="1.5"/>
    <text x="410" y="81" font-size="15" fill="#1e8449" font-weight="700">accepted: 0 to 100</text>
    <text x="130" y="81" font-size="15" fill="#c0392b" font-weight="700">rejected</text>
    <text x="690" y="81" font-size="15" fill="#c0392b" font-weight="700">rejected</text>
    <!-- number line -->
    <line x1="30" y1="104" x2="790" y2="104" stroke="#16283c" stroke-width="2"/>
    <g stroke="#16283c" stroke-width="2">
      <line x1="90" y1="97" x2="90" y2="111"/>
      <line x1="220" y1="97" x2="220" y2="111"/>
      <line x1="250" y1="97" x2="250" y2="111"/>
      <line x1="440" y1="97" x2="440" y2="111"/>
      <line x1="570" y1="97" x2="570" y2="111"/>
      <line x1="600" y1="97" x2="600" y2="111"/>
      <line x1="730" y1="97" x2="730" y2="111"/>
    </g>
    <!-- values -->
    <g font-weight="700" font-size="17">
      <text x="90" y="52" fill="#c0392b">−20</text>
      <text x="218" y="52" fill="#c0392b">−1</text>
      <text x="252" y="52" fill="#1e8449">0</text>
      <text x="440" y="52" fill="#1e8449">57</text>
      <text x="568" y="52" fill="#1e8449">100</text>
      <text x="606" y="52" fill="#c0392b">101</text>
      <text x="730" y="52" fill="#c0392b">150</text>
    </g>
    <!-- type labels -->
    <text x="90" y="132">abnormal</text>
    <text x="250" y="132">extreme</text>
    <text x="440" y="132">normal</text>
    <text x="570" y="132">extreme</text>
    <text x="730" y="132">abnormal</text>
    <!-- boundary brackets -->
    <g stroke="#4c3fa8" stroke-width="2" fill="none">
      <path d="M212 144 V152 H258 V144"/>
      <path d="M562 144 V152 H608 V144"/>
    </g>
    <g fill="#4c3fa8" font-weight="700">
      <text x="235" y="172">boundary</text>
      <text x="585" y="172">boundary</text>
    </g>
    <text x="235" y="190" font-size="14" fill="#6b7a88">−1 rejected, 0 accepted</text>
    <text x="585" y="190" font-size="14" fill="#6b7a88">100 accepted, 101 rejected</text>
    <!-- non-numeric abnormal -->
    <rect x="30" y="150" width="120" height="30" rx="4" fill="#fdeded" stroke="#c0392b" stroke-width="1.5"/>
    <text x="90" y="171" font-size="15">"ten": abnormal</text>
  </g>
</svg>

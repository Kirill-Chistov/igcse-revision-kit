<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-label="Virtual memory. When RAM is full, pages of data not currently needed are moved out of RAM into a virtual memory area on the HDD or SSD. When one of those pages is needed it is moved back into RAM." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vm-h { font-size: 14px; font-weight: 700; }
    .vm-p { font-size: 11.5px; }
    .vm-s { font-size: 11.5px; fill: #33475b; }
    .vm-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs><marker id="vm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker></defs>

  <rect x="8" y="10" width="220" height="176" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="vm-h" x="118" y="31" text-anchor="middle" style="fill:#0b5f54">RAM — full</text>
  <g>
    <rect x="24" y="42" width="188" height="28" rx="4" fill="#ffffff" stroke="#0f7b6c"/><text class="vm-p" x="118" y="60" text-anchor="middle">page — program B (in use)</text>
    <rect x="24" y="76" width="188" height="28" rx="4" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4"/><text class="vm-p" x="118" y="94" text-anchor="middle">page — program A (not needed now)</text>
    <rect x="24" y="110" width="188" height="28" rx="4" fill="#ffffff" stroke="#0f7b6c"/><text class="vm-p" x="118" y="128" text-anchor="middle">page — program C (in use)</text>
    <rect x="24" y="144" width="188" height="28" rx="4" fill="#ffffff" stroke="#0f7b6c"/><text class="vm-p" x="118" y="162" text-anchor="middle">page — program B (in use)</text>
  </g>

  <rect x="532" y="10" width="220" height="176" rx="8" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.6"/>
  <text class="vm-h" x="642" y="31" text-anchor="middle" style="fill:#2f6f9f">HDD / SSD</text>
  <rect x="546" y="40" width="192" height="134" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-dasharray="5 3"/>
  <text class="vm-s" x="642" y="58" text-anchor="middle">virtual memory area</text>
  <rect x="560" y="68" width="164" height="28" rx="4" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.4"/><text class="vm-p" x="642" y="86" text-anchor="middle">page — program A</text>
  <rect x="560" y="110" width="164" height="28" rx="4" fill="#eaf2f9" stroke="#2f6f9f"/><text class="vm-p" x="642" y="128" text-anchor="middle">page — program D</text>

  <line x1="232" y1="90" x2="554" y2="82" stroke="#16283c" stroke-width="2" marker-end="url(#vm-ar)"/>
  <circle cx="258" cy="66" r="9" fill="#b7791f"/><text class="vm-n" x="258" y="70" text-anchor="middle">1</text>
  <text class="vm-p" x="273" y="63">A page not currently needed is moved out of RAM</text>
  <text class="vm-s" x="273" y="77">— this frees space in RAM</text>
  <line x1="556" y1="124" x2="232" y2="124" stroke="#16283c" stroke-width="2" marker-end="url(#vm-ar)"/>
  <circle cx="258" cy="148" r="9" fill="#2f6f9f"/><text class="vm-n" x="258" y="152" text-anchor="middle">2</text>
  <text class="vm-p" x="273" y="145">When a page in virtual memory is needed, it is</text>
  <text class="vm-p" x="273" y="159">moved back into RAM (another page moves out)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="w" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16283c"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">Formation of an oxbow lake — plan view</text>

  <g font-size="12.5" fill="#16283c">
  <!-- 1 -->
  <g transform="translate(10,20)">
    <rect x="0" y="36" width="210" height="180" fill="#eef4e6"/>
    <path d="M0,190 C40,190 60,180 70,150 C80,110 40,70 90,60 C140,50 150,110 150,150 C150,180 180,190 210,190" fill="none" stroke="#7fb2d4" stroke-width="13"/>
    <line x1="44" y1="140" x2="62" y2="140" stroke="#c0392b" stroke-width="2.6" marker-end="url(#r)"/>
    <line x1="176" y1="140" x2="158" y2="140" stroke="#c0392b" stroke-width="2.6" marker-end="url(#r)"/>
    <text x="108" y="140" font-size="11.5" fill="#6b7a88" text-anchor="middle">neck</text>
    <text x="0" y="238" font-weight="700">1  Erosion on the outer</text>
    <text x="0" y="253" font-weight="700">bends narrows the neck</text>
  </g>
  <!-- 2 -->
  <g transform="translate(232,20)">
    <rect x="0" y="36" width="210" height="180" fill="#eef4e6"/>
    <path d="M0,195 C40,195 88,185 93,160 C98,130 40,70 103,60 C168,50 113,130 118,160 C123,185 172,195 210,195" fill="none" stroke="#7fb2d4" stroke-width="13"/>
    <line x1="72" y1="162" x2="84" y2="162" stroke="#c0392b" stroke-width="2.6" marker-end="url(#r)"/>
    <line x1="140" y1="162" x2="128" y2="162" stroke="#c0392b" stroke-width="2.6" marker-end="url(#r)"/>
    <text x="0" y="238" font-weight="700">2  The neck becomes</text>
    <text x="0" y="253" font-weight="700">very narrow</text>
  </g>
  <!-- 3 -->
  <g transform="translate(454,20)">
    <rect x="0" y="36" width="210" height="180" fill="#eef4e6"/>
    <path d="M0,195 C40,195 88,185 93,160 C98,130 40,70 103,60 C168,50 113,130 118,160 C123,185 172,195 210,195" fill="none" stroke="#bcd6e8" stroke-width="13"/>
    <path d="M0,195 C50,195 80,182 106,180 C132,182 162,195 210,195" fill="none" stroke="#7fb2d4" stroke-width="15"/>
    <line x1="70" y1="208" x2="140" y2="208" stroke="#16283c" stroke-width="2.2" marker-end="url(#w)"/>
    <text x="0" y="238" font-weight="700">3  In a flood the river cuts</text>
    <text x="0" y="253" font-weight="700">through the neck</text>
  </g>
  <!-- 4 -->
  <g transform="translate(676,20)">
    <rect x="0" y="36" width="214" height="180" fill="#eef4e6"/>
    <path d="M91,170 C98,130 40,70 103,60 C168,50 113,130 120,170" fill="none" stroke="#7fb2d4" stroke-width="13"/>
    <path d="M0,200 C60,198 150,198 214,200" fill="none" stroke="#7fb2d4" stroke-width="13"/>
    <ellipse cx="91" cy="182" rx="9" ry="7" fill="#e8dcc0" stroke="#b8912e"/>
    <ellipse cx="120" cy="182" rx="9" ry="7" fill="#e8dcc0" stroke="#b8912e"/>
    <text x="106" y="112" font-size="12" font-weight="700" fill="#2a5f80" text-anchor="middle">OXBOW</text>
    <text x="106" y="126" font-size="12" font-weight="700" fill="#2a5f80" text-anchor="middle">LAKE</text>
    <text x="150" y="176" font-size="11" fill="#8a6f33">deposition</text>
    <text x="0" y="238" font-weight="700">4  Deposition seals the ends;</text>
    <text x="0" y="253" font-weight="700">an oxbow lake is left</text>
  </g>
  </g>
</svg>

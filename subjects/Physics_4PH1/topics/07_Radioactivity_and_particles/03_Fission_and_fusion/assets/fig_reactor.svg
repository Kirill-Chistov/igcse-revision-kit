<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="conc" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c3cad0"/><circle cx="2" cy="2" r="1" fill="#9aa5ae"/><circle cx="6" cy="6" r="0.8" fill="#9aa5ae"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker>
  </defs>
  <!-- shielding -->
  <rect x="16" y="34" width="360" height="256" fill="url(#conc)" stroke="#16283c" stroke-width="2"/>
  <!-- steel vessel with moderator -->
  <rect x="56" y="70" width="280" height="184" fill="#d6e8f5" stroke="#16283c" stroke-width="3"/>
  <!-- fuel rods -->
  <g fill="#e8a33d" stroke="#16283c" stroke-width="1.4">
    <rect x="86" y="92" width="16" height="140"/>
    <rect x="152" y="92" width="16" height="140"/>
    <rect x="218" y="92" width="16" height="140"/>
    <rect x="284" y="92" width="16" height="140"/>
  </g>
  <!-- control rods (partly inserted) -->
  <g fill="#34414d" stroke="#16283c" stroke-width="1.2">
    <rect x="122" y="14" width="12" height="150"/>
    <rect x="188" y="14" width="12" height="150"/>
    <rect x="254" y="14" width="12" height="150"/>
  </g>
  <line x1="128" y1="8" x2="260" y2="8" stroke="#16283c" stroke-width="2"/>
  <line x1="194" y1="8" x2="194" y2="14" stroke="#16283c" stroke-width="2"/>
  <line x1="128" y1="8" x2="128" y2="14" stroke="#16283c" stroke-width="2"/>
  <line x1="260" y1="8" x2="260" y2="14" stroke="#16283c" stroke-width="2"/>
  <!-- labels -->
  <line x1="266" y1="40" x2="410" y2="40" stroke="#16283c" stroke-width="1.2"/>
  <text x="414" y="36" font-size="13" font-weight="700" fill="#16283c">Control rods (e.g. boron)</text>
  <text x="414" y="52" font-size="12" fill="#33475b">absorb neutrons. Lower them → fewer fissions;</text>
  <text x="414" y="67" font-size="12" fill="#33475b">raise them → more. Fully in → reaction stops.</text>
  <line x1="300" y1="110" x2="410" y2="110" stroke="#16283c" stroke-width="1.2"/>
  <text x="414" y="106" font-size="13" font-weight="700" fill="#b5651d">Fuel rods (uranium-235)</text>
  <text x="414" y="122" font-size="12" fill="#33475b">where fission happens</text>
  <line x1="318" y1="200" x2="410" y2="170" stroke="#16283c" stroke-width="1.2"/>
  <text x="414" y="166" font-size="13" font-weight="700" fill="#1f6fb2">Moderator (graphite or water)</text>
  <text x="414" y="182" font-size="12" fill="#33475b">slows the fast neutrons from fission so they</text>
  <text x="414" y="197" font-size="12" fill="#33475b">can be absorbed by U-235 and cause more fission</text>
  <line x1="360" y1="262" x2="410" y2="240" stroke="#16283c" stroke-width="1.2"/>
  <text x="414" y="236" font-size="13" font-weight="700" fill="#16283c">Shielding (thick concrete)</text>
  <text x="414" y="252" font-size="12" fill="#33475b">absorbs the neutrons and gamma radiation</text>
  <text x="414" y="267" font-size="12" fill="#33475b">escaping from the core, protecting people</text>
  <text x="414" y="282" font-size="12" fill="#33475b">and the environment</text>
</svg>

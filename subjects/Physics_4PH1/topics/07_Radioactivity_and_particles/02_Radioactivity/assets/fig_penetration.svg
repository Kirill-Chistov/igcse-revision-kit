<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5651d"/></marker>
  </defs>

  <!-- ===== Panel 1: what stops each radiation ===== -->
  <text x="180" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">1 · What stops each radiation</text>
  <rect x="14" y="52" width="40" height="150" rx="4" fill="#eef2f5" stroke="#16283c" stroke-width="2"/>
  <text x="34" y="222" font-size="12" font-weight="700" fill="#16283c" text-anchor="middle">source</text>
  <!-- paper -->
  <rect x="118" y="48" width="4" height="160" fill="#f4e7c5" stroke="#16283c" stroke-width="1"/>
  <!-- aluminium -->
  <rect x="198" y="48" width="12" height="160" fill="#cfd8de" stroke="#16283c" stroke-width="1.2"/>
  <!-- lead -->
  <rect x="274" y="48" width="30" height="160" fill="#7d8a95" stroke="#16283c" stroke-width="1.2"/>
  <!-- alpha -->
  <text x="62" y="76" font-size="15" font-weight="700" fill="#c0392b">α</text>
  <line x1="76" y1="82" x2="115" y2="82" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
  <!-- beta -->
  <text x="62" y="126" font-size="15" font-weight="700" fill="#1f6fb2">β</text>
  <line x1="76" y1="132" x2="195" y2="132" stroke="#1f6fb2" stroke-width="3" marker-end="url(#ahb)"/>
  <!-- gamma -->
  <text x="62" y="176" font-size="15" font-weight="700" fill="#b5651d">γ</text>
  <line x1="76" y1="182" x2="272" y2="182" stroke="#b5651d" stroke-width="3"/>
  <line x1="306" y1="182" x2="350" y2="182" stroke="#b5651d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aho)"/>
  <text x="330" y="170" font-size="11" fill="#b5651d" text-anchor="middle">weaker</text>
  <text x="120" y="228" font-size="12" font-weight="700" fill="#16283c" text-anchor="middle">paper</text>
  <text x="120" y="242" font-size="11" fill="#33475b" text-anchor="middle">(or a few cm of air)</text>
  <text x="204" y="228" font-size="12" font-weight="700" fill="#16283c" text-anchor="middle">aluminium</text>
  <text x="204" y="242" font-size="11" fill="#33475b" text-anchor="middle">a few mm</text>
  <text x="289" y="228" font-size="12" font-weight="700" fill="#16283c" text-anchor="middle">lead</text>
  <text x="289" y="242" font-size="11" fill="#33475b" text-anchor="middle">several cm</text>

  <!-- ===== Panel 2: the practical ===== -->
  <line x1="366" y1="10" x2="366" y2="250" stroke="#d5dde3" stroke-width="1.5"/>
  <text x="545" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">2 · Practical set-up (7.6)</text>
  <!-- source holder -->
  <rect x="384" y="100" width="46" height="36" rx="3" fill="#eef2f5" stroke="#16283c" stroke-width="2"/>
  <text x="407" y="123" font-size="11.5" font-weight="700" fill="#16283c" text-anchor="middle">source</text>
  <!-- absorber -->
  <rect x="478" y="78" width="8" height="80" fill="#cfd8de" stroke="#16283c" stroke-width="1.2"/>
  <text x="482" y="70" font-size="12" font-weight="700" fill="#16283c" text-anchor="middle">absorber</text>
  <!-- GM tube -->
  <rect x="530" y="106" width="88" height="24" rx="4" fill="#ffffff" stroke="#16283c" stroke-width="2"/>
  <rect x="526" y="104" width="6" height="28" fill="#16283c"/>
  <text x="574" y="122" font-size="11.5" font-weight="700" fill="#16283c" text-anchor="middle">GM tube</text>
  <line x1="618" y1="118" x2="640" y2="118" stroke="#16283c" stroke-width="2"/>
  <!-- counter -->
  <rect x="640" y="98" width="68" height="40" rx="4" fill="#eef2f5" stroke="#16283c" stroke-width="2"/>
  <rect x="648" y="106" width="52" height="16" fill="#16283c"/>
  <text x="674" y="119" font-size="11.5" font-weight="700" fill="#7ee08a" text-anchor="middle">0482</text>
  <text x="674" y="152" font-size="12" font-weight="700" fill="#16283c" text-anchor="middle">counter</text>
  <!-- fixed distance -->
  <line x1="430" y1="176" x2="526" y2="176" stroke="#16283c" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="526" y1="176" x2="430" y2="176" stroke="#16283c" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="478" y="194" font-size="11.5" fill="#33475b" text-anchor="middle">fixed distance</text>
  <text x="384" y="220" font-size="12" fill="#33475b">Measure background first. Add paper, then</text>
  <text x="384" y="236" font-size="12" fill="#33475b">aluminium, then lead; record the count rate each time.</text>
</svg>

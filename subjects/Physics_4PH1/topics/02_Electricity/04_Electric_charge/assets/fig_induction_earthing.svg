<text x="178" y="202" font-size="11" text-anchor="middle" fill="#33475b">The balloon repels electrons in the wall away from its surface;</text>
<text x="178" y="216" font-size="11" text-anchor="middle" fill="#33475b">the nearby surface is left positive, so the balloon is attracted.</text>

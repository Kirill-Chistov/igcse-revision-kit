<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 242" width="800" height="242" role="img" aria-label="Timeline of responses to a tectonic hazard: primary responses in the first hours to weeks, secondary responses over months to years" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="rt-k" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker></defs>
<g font-family="Carlito, Calibri, sans-serif">
<line x1="100" y1="40" x2="785" y2="40" stroke="#16283c" stroke-width="3" marker-end="url(#rt-k)"/>
<rect x="10" y="22" width="84" height="36" rx="6" fill="#c0392b"/><text x="52" y="45" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">EVENT</text>
<line x1="110" y1="34" x2="110" y2="46" stroke="#16283c" stroke-width="2"/><text x="110" y="24" font-size="12.5" fill="#33475b" text-anchor="middle">hours</text>
<line x1="230" y1="34" x2="230" y2="46" stroke="#16283c" stroke-width="2"/><text x="230" y="24" font-size="12.5" fill="#33475b" text-anchor="middle">days</text>
<line x1="360" y1="34" x2="360" y2="46" stroke="#16283c" stroke-width="2"/><text x="360" y="24" font-size="12.5" fill="#33475b" text-anchor="middle">weeks</text>
<line x1="520" y1="34" x2="520" y2="46" stroke="#16283c" stroke-width="2"/><text x="520" y="24" font-size="12.5" fill="#33475b" text-anchor="middle">months</text>
<line x1="680" y1="34" x2="680" y2="46" stroke="#16283c" stroke-width="2"/><text x="680" y="24" font-size="12.5" fill="#33475b" text-anchor="middle">years</text>
<rect x="100" y="60" width="300" height="130" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.4"/>
<text x="112" y="81" font-size="14.5" font-weight="700" fill="#c0392b">PRIMARY RESPONSES</text>
<text x="112" y="97" font-size="12.3" fill="#6b7a88">immediate: save lives, meet basic needs</text>
<text x="112" y="118" font-size="13" fill="#16283c">• search and rescue; treat the injured</text>
<text x="112" y="135" font-size="13" fill="#16283c">• emergency shelter, food and clean water</text>
<text x="112" y="152" font-size="13" fill="#16283c">• evacuate people still at risk</text>
<text x="112" y="169" font-size="13" fill="#16283c">• clear roads, reopen ports and airports for aid</text>
<rect x="412" y="60" width="378" height="130" rx="7" fill="#e7f3ef" stroke="#0b5f54" stroke-width="1.4"/>
<text x="424" y="81" font-size="14.5" font-weight="700" fill="#0b5f54">SECONDARY RESPONSES</text>
<text x="424" y="97" font-size="12.3" fill="#6b7a88">long-term: recover and reduce future risk</text>
<text x="424" y="118" font-size="13" fill="#16283c">• rebuild homes, schools and roads to higher standards</text>
<text x="424" y="135" font-size="13" fill="#16283c">• restore power, water, sewage and health care</text>
<text x="424" y="152" font-size="13" fill="#16283c">• restart the economy: jobs, loans, trade</text>
<text x="424" y="169" font-size="13" fill="#16283c">• new building codes, hazard maps, monitoring, education</text>
<text x="10" y="214" font-size="13" font-weight="700" fill="#16283c">Who responds:</text>
<text x="100" y="214" font-size="13" fill="#33475b">local people and emergency services → national government and army →</text>
<text x="100" y="231" font-size="13" fill="#33475b">charities / NGOs (e.g. Red Cross) → other countries (aid money, troops, equipment)</text>
</g></svg>
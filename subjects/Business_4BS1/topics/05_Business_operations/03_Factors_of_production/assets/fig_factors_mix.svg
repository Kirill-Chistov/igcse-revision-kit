<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 218" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
    <marker id="big" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/>
    </marker>
    <linearGradient id="mix" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fdf6e5"/>
      <stop offset="1" stop-color="#0f7b6c"/>
    </linearGradient>
  </defs>

  <!-- top: combining the factors -->
  <g font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">
    <rect x="20" y="4" width="140" height="26" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/>
    <text x="90" y="22">Land</text>
    <rect x="20" y="36" width="140" height="26" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/>
    <text x="90" y="54">Labour</text>
    <rect x="20" y="68" width="140" height="26" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/>
    <text x="90" y="86">Capital</text>
  </g>
  <line x1="164" y1="17" x2="244" y2="40" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="164" y1="49" x2="244" y2="49" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="164" y1="81" x2="244" y2="58" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="250" y="21" width="210" height="56" rx="7" fill="#16283c"/>
  <text x="355" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Enterprise</text>
  <text x="355" y="64" text-anchor="middle" font-size="12.5" fill="#dfe5ea">combines them and takes the risk</text>
  <line x1="464" y1="49" x2="524" y2="49" stroke="#33475b" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="530" y="27" width="176" height="44" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text x="618" y="54" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b5f54">Goods and services</text>

  <line x1="10" y1="106" x2="710" y2="106" stroke="#dfe5ea" stroke-width="1.2"/>

  <!-- bottom: the labour–capital scale -->
  <text x="360" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b5f54">Over time: new technology + rising wages → capital replaces labour</text>
  <line x1="190" y1="141" x2="530" y2="141" stroke="#0f7b6c" stroke-width="5" marker-end="url(#big)"/>
  <text x="40" y="162" font-size="13.5" font-weight="700" fill="#a5720c">LABOUR-INTENSIVE</text>
  <text x="680" y="162" text-anchor="end" font-size="13.5" font-weight="700" fill="#0b5f54">CAPITAL-INTENSIVE</text>
  <rect x="40" y="168" width="640" height="18" rx="4" fill="url(#mix)" stroke="#33475b" stroke-width="1.2"/>
  <g stroke="#33475b" stroke-width="1.4">
    <line x1="85" y1="186" x2="85" y2="194"/><line x1="195" y1="186" x2="195" y2="194"/><line x1="350" y1="186" x2="350" y2="194"/><line x1="520" y1="186" x2="520" y2="194"/><line x1="632" y1="186" x2="632" y2="194"/>
  </g>
  <g font-size="12.5" fill="#16283c" text-anchor="middle">
    <text x="85" y="210">hairdressing</text>
    <text x="195" y="210">restaurants</text>
    <text x="350" y="210">clothing workshop</text>
    <text x="520" y="210">car assembly</text>
    <text x="632" y="210">oil refining</text>
  </g>
</svg>

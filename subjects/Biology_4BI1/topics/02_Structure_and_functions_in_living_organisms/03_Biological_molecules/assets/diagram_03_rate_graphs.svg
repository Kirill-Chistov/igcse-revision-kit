<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" role="img" aria-label="Graph of rate of enzyme activity against temperature: rate rises to an optimum near 40 degrees C, then falls steeply to zero as the enzyme is denatured. Graph of rate against pH: each enzyme has its own optimum pH, for example about pH 7 for amylase and about pH 2 for a protease in the stomach; rate falls on either side.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .rg-ax { stroke: #16283c; stroke-width: 1.6; fill: none; }
    .rg-c  { stroke: #0f7b6c; stroke-width: 3; fill: none; }
    .rg-d  { stroke: #4c3fa8; stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
    .rg-l  { font-size: 12.5px; font-weight: 700; }
    .rg-s  { font-size: 12px; fill: #33475b; }
    .rg-t  { font-size: 11px; fill: #6b7a88; }
    .rg-r  { font-size: 12px; fill: #c0392b; font-weight: 700; }
    .rg-g  { stroke: #8fa3b8; stroke-width: 1.1; stroke-dasharray: 3 3; fill: none; }
  </style>
  <!-- temperature -->
  <path class="rg-ax" d="M60,30 L60,170 L340,170"/>
  <text class="rg-l" x="50" y="105.0" transform="rotate(-90 50 105.0)" text-anchor="middle">rate of reaction</text>
  <text class="rg-l" x="200.0" y="204" text-anchor="middle">temperature / °C</text>
  <text class="rg-t" x="60" y="185" text-anchor="middle">0</text><text class="rg-t" x="100" y="185" text-anchor="middle">10</text><text class="rg-t" x="140" y="185" text-anchor="middle">20</text><text class="rg-t" x="180" y="185" text-anchor="middle">30</text><text class="rg-t" x="220" y="185" text-anchor="middle">40</text><text class="rg-t" x="260" y="185" text-anchor="middle">50</text><text class="rg-t" x="300" y="185" text-anchor="middle">60</text><text class="rg-t" x="340" y="185" text-anchor="middle">70</text>
  <path class="rg-c" d="M60.0,159.6 L64.0,159.5 L68.0,159.2 L72.0,158.7 L76.0,158.1 L80.0,157.3 L84.0,156.4 L88.0,155.4 L92.0,154.3 L96.0,153.0 L100.0,151.7 L104.0,150.2 L108.0,148.6 L112.0,146.9 L116.0,145.1 L120.0,143.1 L124.0,141.1 L128.0,139.0 L132.0,136.7 L136.0,134.4 L140.0,132.0 L144.0,129.4 L148.0,126.8 L152.0,124.1 L156.0,121.2 L160.0,118.3 L164.0,115.3 L168.0,112.2 L172.0,109.0 L176.0,105.7 L180.0,102.3 L184.0,98.8 L188.0,95.2 L192.0,91.6 L196.0,87.8 L200.0,84.0 L204.0,80.0 L208.0,76.0 L212.0,71.9 L216.0,67.7 L220.0,63.4 L224.0,64.4 L228.0,66.6 L232.0,69.5 L236.0,73.0 L240.0,77.1 L244.0,81.8 L248.0,86.9 L252.0,92.5 L256.0,98.6 L260.0,105.0 L264.0,111.9 L268.0,119.1 L272.0,126.7 L276.0,134.7 L280.0,143.0 L284.0,151.7 L288.0,160.7 L292.0,170.0 L296.0,170.0 L300.0,170.0"/>
  <path class="rg-g" d="M220,63.400000000000006 L220,170"/>
  <text class="rg-s" x="220" y="55.400000000000006" text-anchor="middle">optimum</text>
  <text class="rg-s" x="72" y="62">more collisions</text>
  <text class="rg-s" x="72" y="76">as temperature rises</text>
  <text class="rg-r" x="264" y="89.4">denatured</text>


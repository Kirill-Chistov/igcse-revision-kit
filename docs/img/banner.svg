<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="IGCSE Revision Kit: an AI tutor for your exact specification, in any AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#ece7da"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3b3523" flood-opacity="0.12"/>
    </filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="-20" r="190" fill="#2e8b57" opacity="0.07"/>
  <circle cx="60" cy="380" r="150" fill="#d08c14" opacity="0.08"/>

  <!-- left: title -->
  <g class="t">
    <text x="72" y="92" font-size="20" font-weight="600" letter-spacing="3" fill="#2e8b57">IGCSE · GCSE · ANY AI</text>
    <text x="70" y="160" font-size="60" font-weight="800" fill="#1f1d17">IGCSE Revision Kit</text>
    <text x="72" y="210" font-size="25" fill="#4a463b">An AI tutor that knows your exact specification,</text>
    <text x="72" y="244" font-size="25" fill="#4a463b">your exam dates — and every session you've had.</text>

    <g font-size="17" font-weight="600">
      <rect x="72" y="278" width="138" height="38" rx="19" fill="#1f1d17"/>
      <text x="141" y="303" text-anchor="middle" fill="#f7f5ef">/setup</text>
      <rect x="222" y="278" width="138" height="38" rx="19" fill="#fff" stroke="#d6cfbd"/>
      <text x="291" y="303" text-anchor="middle" fill="#1f1d17">/revise</text>
      <rect x="372" y="278" width="138" height="38" rx="19" fill="#fff" stroke="#d6cfbd"/>
      <text x="441" y="303" text-anchor="middle" fill="#1f1d17">/test</text>
      <rect x="522" y="278" width="138" height="38" rx="19" fill="#fff" stroke="#d6cfbd"/>
      <text x="591" y="303" text-anchor="middle" fill="#1f1d17">/progress</text>
    </g>
  </g>

  <!-- right: tracker card -->
  <g class="t" filter="url(#sh)">
    <rect x="770" y="58" width="370" height="244" rx="18" fill="#ffffff"/>
  </g>
  <g class="t">
    <text x="798" y="98" font-size="19" font-weight="700" fill="#1f1d17">Revision tracker</text>
    <text x="1112" y="98" font-size="14" text-anchor="end" fill="#8a8473">this week</text>

    <text x="798" y="138" font-size="15" font-weight="600" fill="#1f1d17">Biology</text>
    <text x="1112" y="138" font-size="13" text-anchor="end" fill="#8a8473">4BI1</text>
    <rect x="798" y="148" width="314" height="10" rx="5" fill="#e3ded1"/>
    <rect x="798" y="148" width="150" height="10" rx="5" fill="#2e8b57"/>
    <rect x="944" y="148" width="54" height="10" fill="#d08c14"/>
    <rect x="998" y="148" width="22" height="10" fill="#c2412d"/>

    <text x="798" y="196" font-size="15" font-weight="600" fill="#1f1d17">Physics</text>
    <text x="1112" y="196" font-size="13" text-anchor="end" fill="#8a8473">4PH1</text>
    <rect x="798" y="206" width="314" height="10" rx="5" fill="#e3ded1"/>
    <rect x="798" y="206" width="190" height="10" rx="5" fill="#2e8b57"/>
    <rect x="984" y="206" width="40" height="10" fill="#d08c14"/>
    <rect x="1024" y="206" width="14" height="10" fill="#c2412d"/>

    <text x="798" y="254" font-size="15" font-weight="600" fill="#1f1d17">Geography</text>
    <text x="1112" y="254" font-size="13" text-anchor="end" fill="#8a8473">0976</text>
    <rect x="798" y="264" width="314" height="10" rx="5" fill="#e3ded1"/>
    <rect x="798" y="264" width="110" height="10" rx="5" fill="#2e8b57"/>
    <rect x="904" y="264" width="48" height="10" fill="#d08c14"/>
    <rect x="952" y="264" width="30" height="10" fill="#c2412d"/>
  </g>
  <g class="t" font-size="14" fill="#4a463b">
    <circle cx="790" cy="331" r="6" fill="#2e8b57"/><text x="802" y="336">Feel good</text>
    <circle cx="904" cy="331" r="6" fill="#d08c14"/><text x="916" y="336">Need revision</text>
    <circle cx="1036" cy="331" r="6" fill="#c2412d"/><text x="1048" y="336">Don't know</text>
  </g>
</svg>

  <text class="gd-g" x="280" y="70" text-anchor="middle">Tt</text><text class="gd-v" x="330" y="70" text-anchor="middle">×</text><text class="gd-g" x="380" y="70" text-anchor="middle">Tt</text>
  <circle cx="264" cy="100" r="12" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.5"/><text class="gd-g" x="264" y="105" text-anchor="middle">T</text>
  <circle cx="296" cy="100" r="12" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.5"/><text class="gd-g" x="296" y="105" text-anchor="middle">t</text>

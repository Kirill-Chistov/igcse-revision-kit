<line x1="315.0" y1="216.5" x2="315.0" y2="205.5" stroke="#16283c" stroke-width="1.5"/>
<line x1="315.0" y1="235.5" x2="315.0" y2="246.5" stroke="#16283c" stroke-width="1.5"/>
<text x="195.0" y="231.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="225.0" y="231.2" font-size="15" text-anchor="middle" font-weight="bold" fill="#16283c">C</text>
<text x="255.0" y="231.2" font-size="15" text-anchor="middle" font-weight="bold" fill="#16283c">C</text>
<text x="285.0" y="231.2" font-size="15" text-anchor="middle" font-weight="bold" fill="#16283c">C</text>
<text x="315.0" y="231.2" font-size="15" text-anchor="middle" font-weight="bold" fill="#16283c">C</text>
<text x="345.0" y="231.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="225.0" y="201.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="225.0" y="261.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="255.0" y="201.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="255.0" y="261.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="285.0" y="201.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="285.0" y="261.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="315.0" y="201.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="315.0" y="261.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#33475b">H</text>
<text x="400.0" y="222.0" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">every atom and every covalent bond drawn;</text>
<text x="400.0" y="240.0" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">each line is one shared pair of electrons</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 118" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="6.0" y="8.0" width="158.0" height="100.0" rx="6" fill="#f3f5f7" stroke="#9aa7b3" stroke-width="1.3" />
<text x="16.0" y="30.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="700">Collision</text>
<text x="16.0" y="50.0" font-size="12" fill="#33475b" text-anchor="start">momentum must fall</text>
<text x="16.0" y="66.0" font-size="12" fill="#33475b" text-anchor="start">from mv to 0: the</text>
<text x="16.0" y="82.0" font-size="12" fill="#33475b" text-anchor="start">change is fixed</text>
<line x1="166.0" y1="58.0" x2="176.0" y2="58.0" stroke="#16283c" stroke-width="2" stroke-linecap="butt"/>
<polygon points="184.0,58.0 176.0,63.0 176.0,53.0" fill="#16283c" stroke="#16283c" stroke-width="1" stroke-linejoin="round" />
<rect x="186.0" y="8.0" width="158.0" height="100.0" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3" />
<text x="196.0" y="30.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="700">Safety feature</text>
<text x="196.0" y="50.0" font-size="12" fill="#33475b" text-anchor="start">crumples, stretches or</text>
<text x="196.0" y="66.0" font-size="12" fill="#33475b" text-anchor="start">squashes, so the change</text>
<text x="196.0" y="82.0" font-size="12" fill="#33475b" text-anchor="start">takes a longer time</text>
<line x1="346.0" y1="58.0" x2="356.0" y2="58.0" stroke="#16283c" stroke-width="2" stroke-linecap="butt"/>
<polygon points="364.0,58.0 356.0,63.0 356.0,53.0" fill="#16283c" stroke="#16283c" stroke-width="1" stroke-linejoin="round" />
<rect x="366.0" y="8.0" width="158.0" height="100.0" rx="6" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.3" />
<text x="376.0" y="30.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="700">Smaller rate of change</text>
<text x="376.0" y="50.0" font-size="12" fill="#33475b" text-anchor="start">of momentum:</text>
<text x="376.0" y="66.0" font-size="12" fill="#33475b" text-anchor="start">F = (mv − mu) ÷ t</text>
<text x="376.0" y="82.0" font-size="12" fill="#33475b" text-anchor="start">with a bigger t</text>
<line x1="526.0" y1="58.0" x2="536.0" y2="58.0" stroke="#16283c" stroke-width="2" stroke-linecap="butt"/>
<polygon points="544.0,58.0 536.0,63.0 536.0,53.0" fill="#16283c" stroke="#16283c" stroke-width="1" stroke-linejoin="round" />
<rect x="546.0" y="8.0" width="158.0" height="100.0" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3" />
<text x="556.0" y="30.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="700">Smaller force</text>
<text x="556.0" y="50.0" font-size="12" fill="#33475b" text-anchor="start">on the person, so</text>
<text x="556.0" y="66.0" font-size="12" fill="#33475b" text-anchor="start">fewer and less serious</text>
<text x="556.0" y="82.0" font-size="12" fill="#33475b" text-anchor="start">injuries</text>
</svg>

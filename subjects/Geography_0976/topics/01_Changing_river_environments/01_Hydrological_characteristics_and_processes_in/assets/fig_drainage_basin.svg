<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16283c"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">A drainage basin — plan view</text>

  <!-- sea -->
  <path d="M690,430 L900,430 L900,240 C850,270 800,300 770,322 C730,352 705,390 690,430 Z" fill="#dbeaf3"/>
  <text x="820" y="400" font-size="14" font-weight="700" fill="#3d7ea6">SEA</text>

  <!-- basin area and watershed -->
  <path d="M760,328 C700,392 560,396 450,372 C330,346 185,332 112,262 C60,212 72,120 152,84 C262,40 420,50 522,70 C632,92 722,122 762,182 C792,232 792,296 760,328 Z"
        fill="#eef4e6" stroke="#8a6f33" stroke-width="2.4" stroke-dasharray="9 5"/>

  <!-- rivers -->
  <g fill="none" stroke="#3d7ea6" stroke-linecap="round">
    <path d="M300,78 C310,122 300,162 330,200" stroke-width="2.4"/>
    <path d="M560,88 C540,142 512,202 480,250" stroke-width="2.4"/>
    <path d="M420,356 C470,330 520,300 550,280" stroke-width="2.4"/>
    <path d="M662,118 C648,182 644,250 620,300" stroke-width="2.2"/>
    <path d="M170,122 C230,170 262,190 330,200 C400,210 430,240 480,250 C540,262 560,300 620,300 C680,300 702,326 760,330" stroke-width="4.6"/>
  </g>
  <circle cx="170" cy="122" r="5" fill="#2a5f80"/>
  <circle cx="330" cy="200" r="5.5" fill="#16283c"/>
  <circle cx="480" cy="250" r="5.5" fill="#16283c"/>

  <!-- labels -->
  <g font-size="13" fill="#16283c">
    <text x="30" y="60" font-weight="700">Source</text>
    <text x="30" y="75">where the river begins</text>
    <line x1="92" y1="80" x2="162" y2="116" stroke="#16283c" stroke-width="1.2" marker-end="url(#k)"/>

    <text x="590" y="42" font-weight="700" fill="#8a6f33">Watershed</text>
    <text x="590" y="57" fill="#8a6f33">boundary of the basin, along the high ground</text>
    <line x1="630" y1="62" x2="640" y2="92" stroke="#8a6f33" stroke-width="1.2" marker-end="url(#k)"/>

    <text x="352" y="118" font-weight="700" fill="#2a5f80">Tributary</text>
    <text x="352" y="133" fill="#2a5f80">a smaller river that</text>
    <text x="352" y="148" fill="#2a5f80">joins the main river</text>
    <line x1="350" y1="122" x2="312" y2="130" stroke="#2a5f80" stroke-width="1.2" marker-end="url(#k)"/>

    <text x="190" y="232" font-weight="700">Confluence</text>
    <text x="190" y="247">where two rivers meet</text>
    <line x1="265" y1="226" x2="322" y2="205" stroke="#16283c" stroke-width="1.2" marker-end="url(#k)"/>
    <line x1="265" y1="232" x2="470" y2="252" stroke="#16283c" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#k)"/>

    <text x="560" y="355" font-weight="700" fill="#2a5f80">Main channel</text>
    <line x1="600" y1="342" x2="610" y2="306" stroke="#2a5f80" stroke-width="1.2" marker-end="url(#k)"/>

    <text x="784" y="300" font-weight="700">Mouth</text>
    <text x="784" y="315">where the river</text>
    <text x="784" y="330">enters the sea</text>
    <line x1="782" y1="318" x2="768" y2="327" stroke="#16283c" stroke-width="1.2" marker-end="url(#k)"/>
  </g>

  <text x="236" y="286" font-size="13.5" font-weight="700" fill="#4b6b3d">DRAINAGE BASIN</text>
  <text x="236" y="302" font-size="13" fill="#4b6b3d">the area of land drained by a</text>
  <text x="236" y="317" font-size="13" fill="#4b6b3d">river and its tributaries</text>
</svg>

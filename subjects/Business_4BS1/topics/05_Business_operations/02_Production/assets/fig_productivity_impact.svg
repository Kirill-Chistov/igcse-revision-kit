<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 164" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
  </defs>
  <!-- start -->
  <rect x="6" y="30" width="160" height="56" rx="7" fill="#16283c"/>
  <text x="86" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Productivity rises</text>
  <text x="86" y="73" text-anchor="middle" font-size="12.5" fill="#dfe5ea">more output per worker</text>
  <line x1="170" y1="58" x2="212" y2="58" stroke="#33475b" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- unit cost -->
  <rect x="218" y="30" width="160" height="56" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text x="298" y="54" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b5f54">Labour cost</text>
  <text x="298" y="73" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b5f54">per unit falls</text>
  <!-- branches -->
  <path d="M382,48 L420,48 L420,25 L446,25" fill="none" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M382,68 L420,68 L420,91 L446,91" fill="none" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="452" y="4" width="262" height="42" rx="7" fill="#eaf7ef" stroke="#1e8449" stroke-width="1.5"/>
  <text x="583" y="21" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e8449">Cut prices</text>
  <text x="583" y="38" text-anchor="middle" font-size="12.5" fill="#1e8449">→ more competitive, higher sales</text>
  <text x="583" y="62" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6b7a88">or</text>
  <rect x="452" y="70" width="262" height="42" rx="7" fill="#eaf7ef" stroke="#1e8449" stroke-width="1.5"/>
  <text x="583" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e8449">Keep prices</text>
  <text x="583" y="104" text-anchor="middle" font-size="12.5" fill="#1e8449">→ higher profit margin per unit</text>
  <!-- downside -->
  <path d="M86,90 L86,140 L212,140" fill="none" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="218" y="122" width="496" height="36" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.5"/>
  <text x="466" y="145" text-anchor="middle" font-size="13" fill="#c0392b"><tspan font-weight="700">Fewer workers needed</tspan> for the same output → possible redundancies, lower morale</text>
</svg>

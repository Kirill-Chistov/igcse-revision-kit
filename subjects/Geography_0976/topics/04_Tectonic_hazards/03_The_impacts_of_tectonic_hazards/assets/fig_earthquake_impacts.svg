<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" width="800" height="346" role="img" aria-label="Flow diagram from an earthquake to its primary impacts and then its secondary impacts, each tagged social, economic or environmental" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ei-k" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker></defs>
<g font-family="Carlito, Calibri, sans-serif">
<text x="80" y="22" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">HAZARD</text>
<text x="300" y="22" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">PRIMARY IMPACTS</text>
<text x="300" y="38" font-size="12" fill="#6b7a88" text-anchor="middle">caused directly by the shaking</text>
<text x="628" y="22" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">SECONDARY IMPACTS</text>
<text x="628" y="38" font-size="12" fill="#6b7a88" text-anchor="middle">result from the primary impacts, often later</text>
<rect x="10" y="130" width="140" height="70" rx="6" fill="#16283c" stroke="#16283c" stroke-width="1.2"/>
<text x="80.0" y="154.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="400">EARTHQUAKE</text>
<text x="80.0" y="170.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="400">ground shakes</text>
<text x="80.0" y="186.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="400">and cracks</text>
<rect x="190" y="60" width="220" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="395" cy="88.0" r="10.5" fill="#d99a17"/><text x="395" y="92.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Ec</text>
<text x="202" y="85.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Buildings, bridges and</text>
<text x="202" y="101.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">roads collapse</text>
<rect x="190" y="137" width="220" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="395" cy="165.0" r="10.5" fill="#0f7b6c"/><text x="395" y="169.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">S</text>
<text x="202" y="162.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">People killed, injured</text>
<text x="202" y="178.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">or trapped</text>
<rect x="190" y="214" width="220" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="395" cy="242.0" r="10.5" fill="#d99a17"/><text x="395" y="246.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Ec</text>
<text x="202" y="239.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Gas, power, water and</text>
<text x="202" y="255.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">sewage pipes broken</text>
<rect x="456" y="50" width="344" height="38" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="785" cy="69.0" r="10.5" fill="#1e8449"/><text x="785" y="73.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">En</text>
<text x="468" y="66.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Fires from broken gas pipes</text>
<text x="468" y="82.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">and power lines</text>
<rect x="456" y="94" width="344" height="38" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="785" cy="113.0" r="10.5" fill="#0f7b6c"/><text x="785" y="117.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">S</text>
<text x="468" y="110.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Disease from dirty water</text>
<text x="468" y="126.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">and crowded shelters</text>
<rect x="456" y="138" width="344" height="38" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="785" cy="157.0" r="10.5" fill="#0f7b6c"/><text x="785" y="161.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">S</text>
<text x="468" y="154.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Homelessness: people live in</text>
<text x="468" y="170.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">temporary shelters</text>
<rect x="456" y="182" width="344" height="38" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="785" cy="201.0" r="10.5" fill="#0f7b6c"/><text x="785" y="205.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">S</text>
<text x="468" y="198.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Aid delayed by blocked</text>
<text x="468" y="214.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">roads and damaged ports</text>
<rect x="456" y="226" width="344" height="38" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="785" cy="245.0" r="10.5" fill="#1e8449"/><text x="785" y="249.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">En</text>
<text x="468" y="242.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Landslides; tsunami if the</text>
<text x="468" y="258.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">seabed is moved</text>
<rect x="456" y="270" width="344" height="38" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<circle cx="785" cy="289.0" r="10.5" fill="#d99a17"/><text x="785" y="293.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Ec</text>
<text x="468" y="286.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">Jobs and income lost;</text>
<text x="468" y="302.0" font-size="13" text-anchor="start" fill="#16283c" font-weight="400">high cost of rebuilding</text>
<g stroke="#16283c" stroke-width="2.4" fill="none">
<path d="M150 165 L170 165 L170 88 L184 88" marker-end="url(#ei-k)"/>
<path d="M150 165 L170 165 L170 165 L184 165" marker-end="url(#ei-k)"/>
<path d="M150 165 L170 165 L170 242 L184 242" marker-end="url(#ei-k)"/>
<path d="M410 165 L448 165" marker-end="url(#ei-k)"/>
<path d="M410 88 L430 88 L430 165" /><path d="M410 242 L430 242 L430 165"/>
</g>
<text x="10" y="336" font-size="12.5" fill="#33475b">Impact type:</text>
<circle cx="100" cy="332" r="10" fill="#0f7b6c"/><text x="100" y="336.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S</text>
<text x="116" y="336" font-size="12.5" fill="#33475b">social (people)</text>
<circle cx="241.0" cy="332" r="10" fill="#d99a17"/><text x="241.0" y="336.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Ec</text>
<text x="257.0" y="336" font-size="12.5" fill="#33475b">economic (money, jobs, property)</text>
<circle cx="487.4" cy="332" r="10" fill="#1e8449"/><text x="487.4" y="336.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">En</text>
<text x="503.4" y="336" font-size="12.5" fill="#33475b">environmental (land, water, air)</text>
</g></svg>
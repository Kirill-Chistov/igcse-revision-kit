<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" role="img" aria-label="How the Human Development Index is built from three dimensions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="hdi8-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif">
    <text x="125" y="16" font-size="13" font-weight="700" fill="#6b7a88" text-anchor="middle" letter-spacing="1">DIMENSION</text>
    <text x="440" y="16" font-size="13" font-weight="700" fill="#6b7a88" text-anchor="middle" letter-spacing="1">INDICATOR USED</text>

    <!-- dimensions -->
    <rect x="20" y="26" width="210" height="48" rx="7" fill="#0b5f54"/>
    <text x="125" y="56" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">A long and healthy life</text>
    <rect x="20" y="84" width="210" height="58" rx="7" fill="#0b5f54"/>
    <text x="125" y="119" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Knowledge (education)</text>
    <rect x="20" y="152" width="210" height="52" rx="7" fill="#0b5f54"/>
    <text x="125" y="184" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">A decent standard of living</text>

    <!-- indicators -->
    <rect x="270" y="26" width="340" height="48" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="440" y="56" font-size="15" fill="#16283c" text-anchor="middle">Life expectancy at birth</text>
    <rect x="270" y="84" width="340" height="58" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="440" y="107" font-size="15" fill="#16283c" text-anchor="middle">Mean years of schooling (adults aged 25+)</text>
    <text x="440" y="129" font-size="15" fill="#16283c" text-anchor="middle">Expected years of schooling (children)</text>
    <rect x="270" y="152" width="340" height="52" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="440" y="174" font-size="15" fill="#16283c" text-anchor="middle">GNI per capita (PPP $)</text>
    <text x="440" y="194" font-size="13" font-style="italic" fill="#33475b" text-anchor="middle">income adjusted for the local cost of living</text>

    <g stroke="#16283c" stroke-width="2" fill="none">
      <line x1="232" y1="50" x2="266" y2="50" marker-end="url(#hdi8-a)"/>
      <line x1="232" y1="113" x2="266" y2="113" marker-end="url(#hdi8-a)"/>
      <line x1="232" y1="178" x2="266" y2="178" marker-end="url(#hdi8-a)"/>
      <path d="M612 50 C650 50 650 94 686 100" marker-end="url(#hdi8-a)"/>
      <line x1="612" y1="113" x2="686" y2="113" marker-end="url(#hdi8-a)"/>
      <path d="M612 178 C650 178 650 132 686 126" marker-end="url(#hdi8-a)"/>
    </g>

    <!-- HDI -->
    <rect x="690" y="62" width="190" height="102" rx="9" fill="#16283c"/>
    <text x="785" y="99" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">HDI</text>
    <text x="785" y="124" font-size="14" fill="#c3d0dc" text-anchor="middle">one score from 0 to 1</text>
    <text x="785" y="146" font-size="14" fill="#c3d0dc" text-anchor="middle">closer to 1 = more developed</text>

    <!-- scale: 0.30 to 1.00 mapped to x 60..860 -->
    <rect x="60" y="216" width="286" height="42" fill="#cfe4dd"/>
    <rect x="346" y="216" width="171" height="42" fill="#8cc2b3"/>
    <rect x="517" y="216" width="114" height="42" fill="#3f9583"/>
    <rect x="631" y="216" width="229" height="42" fill="#0b5f54"/>
    <g font-size="14" text-anchor="middle">
      <text x="203" y="233" font-weight="700" fill="#16283c">Low</text><text x="203" y="251" fill="#16283c">below 0.550</text>
      <text x="431" y="233" font-weight="700" fill="#16283c">Medium</text><text x="431" y="251" fill="#16283c">0.550–0.699</text>
      <text x="574" y="233" font-weight="700" fill="#fff">High</text><text x="574" y="251" fill="#fff">0.700–0.799</text>
      <text x="745" y="233" font-weight="700" fill="#fff">Very high</text><text x="745" y="251" fill="#fff">0.800 and above</text>
    </g>
    <text x="52" y="242" font-size="12" fill="#33475b" text-anchor="end">0.3</text>
    <text x="868" y="242" font-size="12" fill="#33475b">1.0</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 345" width="820" height="345" role="img"
     aria-label="Energy transfer chains for generating electricity from wind, water, geothermal, solar heating, fossil fuels, nuclear power and solar cells">
  <defs>
    <marker id="p4gc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/>
    </marker>
    <marker id="p4gc-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <g font-size="13" font-weight="700" fill="#6b7a88">
      <text x="12" y="20">Resource</text>
      <text x="241" y="20" text-anchor="middle">Energy starts in</text>
      <text x="463" y="20" text-anchor="middle">How the turbine is turned</text>
      <text x="758" y="20" text-anchor="middle">Output</text>
    </g>
    <!-- common turbine + generator block (all rows except solar cells) -->
    <rect x="590" y="37" width="92" height="262" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.8"/>
    <text x="636" y="154.0" font-size="14" font-weight="700" fill="#4c3fa8" text-anchor="middle">turbine</text>
    <text x="636" y="172.0" font-size="12.5" text-anchor="middle">turns a</text>
    <text x="636" y="190.0" font-size="14" font-weight="700" fill="#4c3fa8" text-anchor="middle">generator</text>
    <line x1="682" y1="168.0" x2="704" y2="168.0" stroke="#0f7b6c" stroke-width="2.5" marker-end="url(#p4gc-teal)"/>
    <rect x="708" y="37" width="100" height="302" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
    <text x="758" y="184.0" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">electrically</text>
    <text x="758" y="202.0" font-size="12.5" text-anchor="middle">to the grid</text>
    <text x="12" y="59" font-size="13.5" font-weight="700" fill="#16283c">Wind</text>
    <rect x="146" y="39" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="58.5" font-size="12.5" text-anchor="middle">kinetic store of moving air</text>
    <text x="463" y="51" font-size="12.5" text-anchor="middle">moving air turns the blades</text>
    <line x1="340" y1="61" x2="586" y2="61" stroke="#4c3fa8" stroke-width="1.8" marker-end="url(#p4gc-arr)"/>
    <text x="12" y="90" font-size="13.5" font-weight="700" fill="#16283c">Water</text>
    <text x="12" y="105" font-size="12">hydroelectric</text>
    <rect x="146" y="77" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="96.5" font-size="12.5" text-anchor="middle">gravitational store of water</text>
    <text x="463" y="89" font-size="12.5" text-anchor="middle">water falls through the turbines</text>
    <line x1="340" y1="99" x2="586" y2="99" stroke="#4c3fa8" stroke-width="1.8" marker-end="url(#p4gc-arr)"/>
    <text x="12" y="128" font-size="13.5" font-weight="700" fill="#16283c">Water</text>
    <text x="12" y="143" font-size="12">tides and waves</text>
    <rect x="146" y="115" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="134.5" font-size="12.5" text-anchor="middle">kinetic store of moving sea water</text>
    <text x="463" y="127" font-size="12.5" text-anchor="middle">moving water turns the turbines</text>
    <line x1="340" y1="137" x2="586" y2="137" stroke="#4c3fa8" stroke-width="1.8" marker-end="url(#p4gc-arr)"/>
    <text x="12" y="173" font-size="13.5" font-weight="700" fill="#16283c">Geothermal</text>
    <rect x="146" y="153" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="172.5" font-size="12.5" text-anchor="middle">thermal store of hot rocks</text>
    <text x="463" y="165" font-size="12.5" text-anchor="middle">heats water → steam</text>
    <line x1="340" y1="175" x2="586" y2="175" stroke="#4c3fa8" stroke-width="1.8" marker-end="url(#p4gc-arr)"/>
    <text x="12" y="211" font-size="13.5" font-weight="700" fill="#16283c">Solar heating</text>
    <rect x="146" y="191" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="210.5" font-size="12.5" text-anchor="middle">light (radiation) from the Sun</text>
    <text x="463" y="203" font-size="12.5" text-anchor="middle">mirrors focus it: heats water → steam</text>
    <line x1="340" y1="213" x2="586" y2="213" stroke="#4c3fa8" stroke-width="1.8" marker-end="url(#p4gc-arr)"/>
    <text x="12" y="249" font-size="13.5" font-weight="700" fill="#16283c">Fossil fuels</text>
    <rect x="146" y="229" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="248.5" font-size="12.5" text-anchor="middle">chemical store of the fuel</text>
    <text x="463" y="241" font-size="12.5" text-anchor="middle">burned: heats water → steam</text>
    <line x1="340" y1="251" x2="586" y2="251" stroke="#4c3fa8" stroke-width="1.8" marker-end="url(#p4gc-arr)"/>
    <text x="12" y="287" font-size="13.5" font-weight="700" fill="#16283c">Nuclear</text>
    <rect x="146" y="267" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="286.5" font-size="12.5" text-anchor="middle">nuclear store of uranium</text>
    <text x="463" y="279" font-size="12.5" text-anchor="middle">fission: heats water → steam</text>
    <line x1="340" y1="289" x2="586" y2="289" stroke="#4c3fa8" stroke-width="1.8" marker-end="url(#p4gc-arr)"/>
    <text x="12" y="325" font-size="13.5" font-weight="700" fill="#16283c">Solar cells</text>
    <rect x="146" y="305" width="190" height="30" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="241" y="324.5" font-size="12.5" text-anchor="middle">light (radiation) from the Sun</text>
    <text x="521" y="317" font-size="12.5" font-weight="700" fill="#0f7b6c" text-anchor="middle">solar cell: transferred electrically, directly — no turbine</text>
    <line x1="340" y1="327" x2="704" y2="327" stroke="#0f7b6c" stroke-width="1.8" marker-end="url(#p4gc-teal)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Mitosis: a diploid cell with two pairs of chromosomes divides once to give two diploid cells with identical sets of chromosomes. Meiosis: the same cell divides twice to give four haploid cells, each with one chromosome from each pair; which one of each pair a gamete receives varies, so gametes are genetically different.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .mm-t { font-size: 12px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .mm-l { font-size: 12px; font-weight: 700; }
    .mm-s { font-size: 11px; fill: #33475b; }
  </style>
  <defs><marker id="mm-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7a88"/></marker></defs>
  <text class="mm-t" x="6" y="16">MITOSIS</text>
  <circle cx="90" cy="74" r="36" fill="#f4f7f9" stroke="#33475b" stroke-width="1.5"/><path d="M68.9,56.0 L68.9,92.0" stroke="#3d78c2" stroke-width="4.5" stroke-linecap="round"/><path d="M83.0,56.0 L83.0,92.0" stroke="#c0392b" stroke-width="4.5" stroke-linecap="round"/><path d="M97.0,64.1 L97.0,83.9" stroke="#3d78c2" stroke-width="4.5" stroke-linecap="round"/><path d="M111.1,64.1 L111.1,83.9" stroke="#c0392b" stroke-width="4.5" stroke-linecap="round"/>
  <text class="mm-s" x="90" y="126" text-anchor="middle">diploid parent cell</text>
  <path d="M134,74 L210,54" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <path d="M134,74 L210,98" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <text class="mm-s" x="172" y="44" text-anchor="middle">copy, divide once</text>
  <circle cx="246" cy="46" r="28" fill="#f4f7f9" stroke="#33475b" stroke-width="1.5"/><path d="M229.6,32.0 L229.6,60.0" stroke="#3d78c2" stroke-width="3.5" stroke-linecap="round"/><path d="M240.5,32.0 L240.5,60.0" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/><path d="M251.5,38.3 L251.5,53.7" stroke="#3d78c2" stroke-width="3.5" stroke-linecap="round"/><path d="M262.4,38.3 L262.4,53.7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="246" cy="106" r="28" fill="#f4f7f9" stroke="#33475b" stroke-width="1.5"/><path d="M229.6,92.0 L229.6,120.0" stroke="#3d78c2" stroke-width="3.5" stroke-linecap="round"/><path d="M240.5,92.0 L240.5,120.0" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/><path d="M251.5,98.3 L251.5,113.7" stroke="#3d78c2" stroke-width="3.5" stroke-linecap="round"/><path d="M262.4,98.3 L262.4,113.7" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <text class="mm-l" x="296" y="66">2 cells: diploid,</text><text class="mm-l" x="296" y="81">genetically identical</text>
  <text class="mm-s" x="296" y="98">humans: 46 → 46</text>
  <text class="mm-s" x="470" y="66">Used for growth, repair, cloning</text><text class="mm-s" x="470" y="80">and asexual reproduction.</text>
  <line x1="6" y1="146" x2="754" y2="146" stroke="#dfe5ea" stroke-width="1.4"/>
  <text class="mm-t" x="6" y="168">MEIOSIS</text>
  <circle cx="90" cy="236" r="36" fill="#f4f7f9" stroke="#33475b" stroke-width="1.5"/><path d="M68.9,218.0 L68.9,254.0" stroke="#3d78c2" stroke-width="4.5" stroke-linecap="round"/><path d="M83.0,218.0 L83.0,254.0" stroke="#c0392b" stroke-width="4.5" stroke-linecap="round"/><path d="M97.0,226.1 L97.0,245.9" stroke="#3d78c2" stroke-width="4.5" stroke-linecap="round"/><path d="M111.1,226.1 L111.1,245.9" stroke="#c0392b" stroke-width="4.5" stroke-linecap="round"/>
  <text class="mm-s" x="90" y="288" text-anchor="middle">diploid parent cell</text><text class="mm-s" x="90" y="301" text-anchor="middle">(testis or ovary)</text>
  <path d="M134,236 L204,204" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <path d="M134,236 L204,270" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <text class="mm-s" x="132" y="170">1st division:</text><text class="mm-s" x="132" y="183">pairs separated</text>
  <circle cx="236" cy="196" r="26" fill="#f4f7f9" stroke="#33475b" stroke-width="1.5"/><path d="M230.9,183.0 L230.9,209.0" stroke="#3d78c2" stroke-width="3.2" stroke-linecap="round"/><path d="M241.1,188.8 L241.1,203.2" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="236" cy="278" r="26" fill="#f4f7f9" stroke="#33475b" stroke-width="1.5"/><path d="M230.9,265.0 L230.9,291.0" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round"/><path d="M241.1,270.9 L241.1,285.1" stroke="#3d78c2" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M264,196 L316,178" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <path d="M264,196 L316,214" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <circle cx="338" cy="176" r="18" fill="#fff7e0" stroke="#33475b" stroke-width="1.5"/><path d="M334.5,167.0 L334.5,185.0" stroke="#3d78c2" stroke-width="3.0" stroke-linecap="round"/><path d="M341.5,171.1 L341.5,180.9" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round"/>
  <circle cx="338" cy="216" r="18" fill="#fff7e0" stroke="#33475b" stroke-width="1.5"/><path d="M334.5,207.0 L334.5,225.0" stroke="#3d78c2" stroke-width="3.0" stroke-linecap="round"/><path d="M341.5,211.1 L341.5,220.9" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M264,278 L316,260" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <path d="M264,278 L316,296" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#mm-ar)"/>
  <circle cx="338" cy="258" r="18" fill="#fff7e0" stroke="#33475b" stroke-width="1.5"/><path d="M334.5,249.0 L334.5,267.0" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round"/><path d="M341.5,253.1 L341.5,262.9" stroke="#3d78c2" stroke-width="3.0" stroke-linecap="round"/>
  <circle cx="338" cy="298" r="18" fill="#fff7e0" stroke="#33475b" stroke-width="1.5"/><path d="M334.5,289.0 L334.5,307.0" stroke="#c0392b" stroke-width="3.0" stroke-linecap="round"/><path d="M341.5,293.1 L341.5,302.9" stroke="#3d78c2" stroke-width="3.0" stroke-linecap="round"/>
  <text class="mm-s" x="258" y="162">2nd division</text>
  <text class="mm-l" x="376" y="228">4 cells: haploid gametes,</text><text class="mm-l" x="376" y="243">genetically different</text>
  <text class="mm-s" x="376" y="260">humans: 46 → 23</text>
  <text class="mm-s" x="560" y="220">Each gamete gets one chromosome</text><text class="mm-s" x="560" y="234">of each pair; which one varies, so</text><text class="mm-s" x="560" y="248">gametes carry different combinations.</text>
  <text class="mm-s" x="560" y="272"><tspan style="fill:#3d78c2" font-weight="700">blue</tspan> = from mother, <tspan style="fill:#c0392b" font-weight="700">red</tspan> = from father</text>
  </svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16283c"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
  </defs>
  <!-- zones -->
  <rect x="91" y="24" width="289" height="225" fill="#e7f3ef"/>
  <rect x="380" y="24" width="290" height="225" fill="#fdeded"/>
  <text x="235" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#0b5f54">ECONOMIES OF SCALE</text>
  <text x="235" y="62" text-anchor="middle" font-size="13.5" fill="#0b5f54">ATC falls as output rises</text>
  <text x="525" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">DISECONOMIES OF SCALE</text>
  <text x="525" y="62" text-anchor="middle" font-size="13.5" fill="#c0392b">ATC rises as output rises</text>
  <!-- axes -->
  <line x1="90" y1="250" x2="90" y2="20" stroke="#16283c" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="90" y1="250" x2="680" y2="250" stroke="#16283c" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="40" y="137" text-anchor="middle" font-size="13.5" fill="#16283c" transform="rotate(-90 40 137)">Average total cost per unit</text>
  <text x="680" y="272" text-anchor="end" font-size="13.5" fill="#16283c">Output (scale of production)</text>
  <!-- guides at the minimum -->
  <line x1="380" y1="200" x2="380" y2="250" stroke="#6b7a88" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="90" y1="200" x2="380" y2="200" stroke="#6b7a88" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="84" y="204" text-anchor="end" font-size="12.5" fill="#33475b">lowest</text>
  <text x="380" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16283c">Optimum output</text>
  <text x="380" y="285" text-anchor="middle" font-size="12.5" fill="#33475b">(lowest ATC)</text>
  <!-- ATC curve -->
  <path d="M112,78 C 200,188 290,200 380,200 C 470,200 565,186 655,86" fill="none" stroke="#16283c" stroke-width="3.2"/>
  <text x="662" y="84" font-size="15" font-weight="700" fill="#16283c">ATC</text>
  <circle cx="380" cy="200" r="5" fill="#16283c"/>
  <!-- limit of growth label -->
  <text x="380" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#16283c">Limit of growth</text>
  <text x="380" y="135" text-anchor="middle" font-size="12.5" fill="#33475b">growing further raises ATC</text>
  <line x1="380" y1="142" x2="380" y2="190" stroke="#33475b" stroke-width="1.3" marker-end="url(#am)"/>
  <!-- causes -->
  <text x="235" y="224" text-anchor="middle" font-size="12.5" fill="#0b5f54" font-style="italic">e.g. bulk buying, specialist</text>
  <text x="235" y="239" text-anchor="middle" font-size="12.5" fill="#0b5f54" font-style="italic">machinery and managers</text>
  <text x="525" y="224" text-anchor="middle" font-size="12.5" fill="#c0392b" font-style="italic">e.g. poor communication,</text>
  <text x="525" y="239" text-anchor="middle" font-size="12.5" fill="#c0392b" font-style="italic">coordination, low motivation</text>
</svg>

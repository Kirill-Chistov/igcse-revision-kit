<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-label="Recombinant plasmid carrying the human insulin gene is taken up by a bacterium; the bacteria are grown in a fermenter where they multiply rapidly and make human insulin; the insulin is extracted and purified." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .in-h { font-size: 12.5px; font-weight: 700; }
    .in-s { font-size: 12px; fill: #33475b; }
    .in-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="in-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
  </defs>
  <!-- 1 recombinant plasmid -->
  <circle cx="95" cy="62" r="34" fill="none" stroke="#33475b" stroke-width="3"/>
  <circle cx="95" cy="62" r="28" fill="none" stroke="#33475b" stroke-width="3"/>
  <path d="M83.4,30.1 A34,34 0 0 1 106.6,30.1" fill="none" stroke="#c0392b" stroke-width="3.4"/>
  <path d="M85.4,35.7 A28,28 0 0 1 104.6,35.7" fill="none" stroke="#c0392b" stroke-width="3.4"/>
  <text class="in-s" x="95" y="60" text-anchor="middle" style="fill:#c0392b;font-weight:700">insulin</text>
  <text class="in-s" x="95" y="74" text-anchor="middle" style="fill:#c0392b;font-weight:700">gene</text>
  <line x1="150" y1="62" x2="186" y2="62" stroke="#33475b" stroke-width="2" marker-end="url(#in-ar)"/>
  <!-- 2 bacterium -->
  <rect x="225" y="34" width="120" height="58" rx="29" fill="#eef4fb" stroke="#33475b" stroke-width="2"/>
  <path d="M248,70 C258,50 268,78 280,58 C290,42 300,74 312,56" fill="none" stroke="#6b7a88" stroke-width="2"/>
  <circle cx="318" cy="72" r="8" fill="none" stroke="#33475b" stroke-width="2"/>
  <path d="M312,67 A8,8 0 0 1 324,67" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <text class="in-s" x="262" y="108">chromosome</text>
  <line x1="352" y1="62" x2="382" y2="62" stroke="#33475b" stroke-width="2" marker-end="url(#in-ar)"/>
  <!-- 3 fermenter -->
  <path d="M430,22 L430,90 Q430,104 444,104 L506,104 Q520,104 520,90 L520,22" fill="#f6ecc8" stroke="#33475b" stroke-width="2"/>
  <rect x="424" y="16" width="102" height="8" rx="2" fill="#8fa3b8" stroke="#33475b" stroke-width="1.2"/>
  <g fill="#6b9fd4"><rect x="440" y="36" width="10" height="5" rx="2.5"/><rect x="462" y="44" width="10" height="5" rx="2.5"/><rect x="486" y="34" width="10" height="5" rx="2.5"/><rect x="500" y="52" width="10" height="5" rx="2.5"/><rect x="446" y="58" width="10" height="5" rx="2.5"/><rect x="472" y="66" width="10" height="5" rx="2.5"/><rect x="494" y="76" width="10" height="5" rx="2.5"/><rect x="442" y="82" width="10" height="5" rx="2.5"/><rect x="466" y="90" width="10" height="5" rx="2.5"/><rect x="488" y="92" width="10" height="5" rx="2.5"/><rect x="458" y="28" width="10" height="5" rx="2.5"/><rect x="480" y="54" width="10" height="5" rx="2.5"/></g>
  <line x1="530" y1="62" x2="566" y2="62" stroke="#33475b" stroke-width="2" marker-end="url(#in-ar)"/>
  <!-- 4 insulin vial -->
  <rect x="650" y="20" width="30" height="12" rx="2" fill="#6b7a88"/>
  <path d="M644,32 L686,32 L686,98 Q686,104 680,104 L650,104 Q644,104 644,98 Z" fill="#ffffff" stroke="#33475b" stroke-width="2"/>
  <rect x="646" y="56" width="38" height="46" fill="#e7f3ef"/>
  <text class="in-s" x="665" y="84" text-anchor="middle" style="font-weight:700;fill:#0b5f54">insulin</text>
  <!-- captions -->
  <g>
    <circle cx="20" cy="132" r="9" fill="#0f7b6c"/><text class="in-n" x="20" y="136" text-anchor="middle">1</text>
    <text class="in-h" x="34" y="136">Recombinant plasmid</text>
    <text class="in-s" x="34" y="152">human insulin gene</text>
    <text class="in-s" x="34" y="167">joined into plasmid</text>
    <text class="in-s" x="34" y="182">(Fig. 1)</text>
    <circle cx="214" cy="132" r="9" fill="#0f7b6c"/><text class="in-n" x="214" y="136" text-anchor="middle">2</text>
    <text class="in-h" x="228" y="136">Into a bacterium</text>
    <text class="in-s" x="228" y="152">the plasmid (vector)</text>
    <text class="in-s" x="228" y="167">is taken up by a</text>
    <text class="in-s" x="228" y="182">bacterial cell</text>
    <circle cx="404" cy="132" r="9" fill="#0f7b6c"/><text class="in-n" x="404" y="136" text-anchor="middle">3</text>
    <text class="in-h" x="418" y="136">Fermenter</text>
    <text class="in-s" x="418" y="152">bacteria multiply rapidly;</text>
    <text class="in-s" x="418" y="167">every cell has the gene</text>
    <text class="in-s" x="418" y="182">and makes human insulin</text>
    <circle cx="594" cy="132" r="9" fill="#0f7b6c"/><text class="in-n" x="594" y="136" text-anchor="middle">4</text>
    <text class="in-h" x="608" y="136">Extract and purify</text>
    <text class="in-s" x="608" y="152">insulin separated</text>
    <text class="in-s" x="608" y="167">from the bacteria</text>
    <text class="in-s" x="608" y="182">and the liquid</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 172" width="680" height="172" role="img" aria-label="Units of data storage from bit to exbibyte" font-family="Carlito, Calibri, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker></defs>
<rect x="10" y="30" width="64" height="44" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" />
<text x="42.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >bit</text>
<text x="42.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" ></text>
<text x="42.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >0 or 1</text>
<line x1="75" y1="52" x2="83" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="84" y="30" width="64" height="44" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" />
<text x="116.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >nibble</text>
<text x="116.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" ></text>
<text x="116.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 4 bits</text>
<line x1="149" y1="52" x2="157" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="158" y="30" width="64" height="44" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" />
<text x="190.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >byte</text>
<text x="190.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" ></text>
<text x="190.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 8 bits</text>
<line x1="223" y1="52" x2="231" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="232" y="30" width="64" height="44" rx="5" fill="#e7f3ef" stroke="#0f766e" stroke-width="1.8" />
<text x="264.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >KiB</text>
<text x="264.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" >kibibyte</text>
<text x="264.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 1024 bytes</text>
<line x1="297" y1="52" x2="305" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="306" y="30" width="64" height="44" rx="5" fill="#e7f3ef" stroke="#0f766e" stroke-width="1.8" />
<text x="338.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >MiB</text>
<text x="338.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" >mebibyte</text>
<text x="338.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 1024 KiB</text>
<line x1="371" y1="52" x2="379" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="380" y="30" width="64" height="44" rx="5" fill="#e7f3ef" stroke="#0f766e" stroke-width="1.8" />
<text x="412.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >GiB</text>
<text x="412.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" >gibibyte</text>
<text x="412.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 1024 MiB</text>
<line x1="445" y1="52" x2="453" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="454" y="30" width="64" height="44" rx="5" fill="#e7f3ef" stroke="#0f766e" stroke-width="1.8" />
<text x="486.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >TiB</text>
<text x="486.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" >tebibyte</text>
<text x="486.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 1024 GiB</text>
<line x1="519" y1="52" x2="527" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="528" y="30" width="64" height="44" rx="5" fill="#e7f3ef" stroke="#0f766e" stroke-width="1.8" />
<text x="560.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >PiB</text>
<text x="560.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" >pebibyte</text>
<text x="560.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 1024 TiB</text>
<line x1="593" y1="52" x2="601" y2="52" stroke="#0f766e" stroke-width="1.5" />
<rect x="602" y="30" width="64" height="44" rx="5" fill="#e7f3ef" stroke="#0f766e" stroke-width="1.8" />
<text x="634.0" y="58" font-size="17" fill="#16283c" text-anchor="middle" font-weight="bold" >EiB</text>
<text x="634.0" y="20" font-size="11" fill="#6b7a88" text-anchor="middle" font-weight="normal" >exbibyte</text>
<text x="634.0" y="94" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" >= 1024 PiB</text>
<line x1="30" y1="124" x2="646" y2="124" stroke="#16283c" stroke-width="1.6" marker-end="url(#ar)" />
<text x="338.0" y="117" font-size="12" fill="#16283c" text-anchor="middle" font-weight="normal" >to a larger unit: ÷ 8 (bits → bytes), then ÷ 1024 at each step</text>
<line x1="646" y1="146" x2="30" y2="146" stroke="#16283c" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="338.0" y="164" font-size="12" fill="#16283c" text-anchor="middle" font-weight="normal" >to a smaller unit: × 1024 at each step, then × 8 (bytes → bits)</text>
</svg>

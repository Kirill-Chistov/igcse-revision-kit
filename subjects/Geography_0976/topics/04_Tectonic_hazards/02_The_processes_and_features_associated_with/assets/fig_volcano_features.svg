<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Cross-section of a strato-volcano labelled with crater, main vent, secondary cone, magma, magma chamber, layers of ash and lava, lava flow and ash cloud" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

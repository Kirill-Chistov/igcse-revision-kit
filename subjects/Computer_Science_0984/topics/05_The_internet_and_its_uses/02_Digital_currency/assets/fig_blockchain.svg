<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="A valid blockchain of four blocks, and the same chain with block 2 altered so its hash no longer matches block 3's previous hash" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .blockc-blk{fill:#f8fafc;stroke:#334155;stroke-width:1.4}
    .blockc-hd{fill:#334155}
    .blockc-ht{font-size:13px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .blockc-f{font-size:12px;fill:#334155}
    .blockc-k{font-size:12px;fill:#0f766e;font-weight:700}
    .blockc-bad{font-size:12px;fill:#b91c1c;font-weight:700}
    .blockc-row{font-size:14px;font-weight:700;fill:#1e293b}
    .blockc-dim{opacity:0.45}
  </style>

  <text class="blockc-row" x="10" y="18">(a) Valid chain</text>
  <!-- row a blocks at x 10,175,340,505 ; y 28 -->
  <g>
    <rect class="blockc-blk" x="10" y="28" width="135" height="100" rx="4"/><rect class="blockc-hd" x="10" y="28" width="135" height="20" rx="4"/>
    <text class="blockc-ht" x="77" y="43">Block 1 (first block)</text>
    <text class="blockc-f" x="18" y="66">data: Ana → Ben 5</text>
    <text class="blockc-f" x="18" y="83">time: 09:14</text>
    <text class="blockc-k" x="18" y="100">hash: 7A3F</text>
    <text class="blockc-f" x="18" y="117">previous hash: 0000</text>

    <rect class="blockc-blk" x="175" y="28" width="135" height="100" rx="4"/><rect class="blockc-hd" x="175" y="28" width="135" height="20" rx="4"/>
    <text class="blockc-ht" x="242" y="43">Block 2</text>
    <text class="blockc-f" x="183" y="66">data: Ben → Cal 2</text>
    <text class="blockc-f" x="183" y="83">time: 09:21</text>
    <text class="blockc-f" x="183" y="100">hash: E5B2</text>
    <text class="blockc-k" x="183" y="117">previous hash: 7A3F</text>

    <rect class="blockc-blk" x="340" y="28" width="135" height="100" rx="4"/><rect class="blockc-hd" x="340" y="28" width="135" height="20" rx="4"/>
    <text class="blockc-ht" x="407" y="43">Block 3</text>
    <text class="blockc-f" x="348" y="66">data: Cal → Dee 1</text>
    <text class="blockc-f" x="348" y="83">time: 09:30</text>
    <text class="blockc-f" x="348" y="100">hash: 41D0</text>
    <text class="blockc-f" x="348" y="117">previous hash: E5B2</text>

    <rect class="blockc-blk" x="505" y="28" width="135" height="100" rx="4"/><rect class="blockc-hd" x="505" y="28" width="135" height="20" rx="4"/>
    <text class="blockc-ht" x="572" y="43">Block 4</text>
    <text class="blockc-f" x="513" y="66">data: Dee → Ana 3</text>
    <text class="blockc-f" x="513" y="83">time: 09:42</text>
    <text class="blockc-f" x="513" y="100">hash: 9C77</text>
    <text class="blockc-f" x="513" y="117">previous hash: 41D0</text>

    <line x1="147" y1="78" x2="173" y2="78" stroke="#334155" stroke-width="1.8" marker-end="url(#ab)"/>
    <line x1="312" y1="78" x2="338" y2="78" stroke="#334155" stroke-width="1.8" marker-end="url(#ab)"/>
    <line x1="477" y1="78" x2="503" y2="78" stroke="#334155" stroke-width="1.8" marker-end="url(#ab)"/>
  </g>

  <text class="blockc-row" x="10" y="160">(b) Block 2 is changed</text>
  <g>
    <rect class="blockc-blk" x="10" y="170" width="135" height="100" rx="4"/><rect class="blockc-hd" x="10" y="170" width="135" height="20" rx="4"/>
    <text class="blockc-ht" x="77" y="185">Block 1</text>
    <text class="blockc-f" x="18" y="208">data: Ana → Ben 5</text>
    <text class="blockc-f" x="18" y="225">time: 09:14</text>
    <text class="blockc-f" x="18" y="242">hash: 7A3F</text>
    <text class="blockc-f" x="18" y="259">previous hash: 0000</text>

    <rect x="175" y="170" width="135" height="100" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/><rect x="175" y="170" width="135" height="20" rx="4" fill="#b91c1c"/>
    <text class="blockc-ht" x="242" y="185">Block 2 (altered)</text>
    <text class="blockc-bad" x="183" y="208">data: Ben → Cal 20</text>
    <text class="blockc-f" x="183" y="225">time: 09:21</text>
    <text class="blockc-bad" x="183" y="242">hash: C91E (new)</text>
    <text class="blockc-f" x="183" y="259">previous hash: 7A3F</text>

    <rect class="blockc-blk" x="340" y="170" width="135" height="100" rx="4"/><rect class="blockc-hd" x="340" y="170" width="135" height="20" rx="4"/>
    <text class="blockc-ht" x="407" y="185">Block 3</text>
    <text class="blockc-f" x="348" y="208">data: Cal → Dee 1</text>
    <text class="blockc-f" x="348" y="225">time: 09:30</text>
    <text class="blockc-f" x="348" y="242">hash: 41D0</text>
    <text class="blockc-bad" x="348" y="259">previous hash: E5B2 ✗</text>

    <g class="blockc-dim">
      <rect class="blockc-blk" x="505" y="170" width="135" height="100" rx="4"/><rect class="blockc-hd" x="505" y="170" width="135" height="20" rx="4"/>
      <text class="blockc-ht" x="572" y="185">Block 4</text>
      <text class="blockc-f" x="513" y="208">data: Dee → Ana 3</text>
      <text class="blockc-f" x="513" y="225">time: 09:42</text>
      <text class="blockc-f" x="513" y="242">hash: 9C77</text>
      <text class="blockc-f" x="513" y="259">previous hash: 41D0</text>
    </g>

    <line x1="147" y1="220" x2="173" y2="220" stroke="#334155" stroke-width="1.8" marker-end="url(#ab)"/>
    <line x1="312" y1="220" x2="338" y2="220" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M318 212 l14 16 M332 212 l-14 16" stroke="#b91c1c" stroke-width="2.4"/>
    <line x1="477" y1="220" x2="503" y2="220" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ab)"/>
    <text class="blockc-bad" x="325" y="292" text-anchor="middle">link broken → change detected; blocks 3 and 4 are no longer valid</text>
  </g>
</svg>

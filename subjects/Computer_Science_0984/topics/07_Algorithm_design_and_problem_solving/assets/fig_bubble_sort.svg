    <rect x="60" y="180" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="80" y="203" text-anchor="middle">4</text>
    <rect x="104" y="180" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="124" y="203" text-anchor="middle">2</text>
    <rect x="148" y="180" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="168" y="203" text-anchor="middle" font-weight="700">5</text>
    <rect x="192" y="180" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="212" y="203" text-anchor="middle" font-weight="700">8</text>
    <text x="250" y="203" font-size="16">5 &lt; 8 → no swap</text>
    <rect x="16" y="228" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="36" y="251" text-anchor="middle">1</text>

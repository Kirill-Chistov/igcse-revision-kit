<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" role="img" aria-label="Timeline of the universe from the Big Bang: expansion and cooling, atoms form and the CMB is released, stars and galaxies form, the universe is still expanding today" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/></marker>
</defs>
<defs><linearGradient id="bb" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#fff3c4"/><stop offset="0.15" stop-color="#ffc46b"/>
<stop offset="0.45" stop-color="#c77d9e"/><stop offset="1" stop-color="#1f2d5c"/></linearGradient></defs>
<g font-family="Carlito, Calibri, sans-serif">
<path d="M30 92 L790 22 L790 162 Z" fill="url(#bb)" stroke="#16283c" stroke-width="1.2"/>
<circle cx="30" cy="92" r="6" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<line x1="30" y1="172" x2="30" y2="186" stroke="#16283c" stroke-width="1.6"/>
<text x="24.0" y="206.0" font-size="14" fill="#16283c" text-anchor="start" font-weight="700">Big Bang</text>
<text x="24.0" y="224.0" font-size="12" fill="#33475b" text-anchor="start" font-weight="400">≈ 13.8 billion years ago:</text>
<text x="24.0" y="239.0" font-size="12" fill="#33475b" text-anchor="start" font-weight="400">all matter and energy in</text>
<text x="24.0" y="254.0" font-size="12" fill="#33475b" text-anchor="start" font-weight="400">one tiny, very hot,</text>
<text x="24.0" y="269.0" font-size="12" fill="#33475b" text-anchor="start" font-weight="400">very dense point</text>
<line x1="215" y1="172" x2="215" y2="186" stroke="#16283c" stroke-width="1.6"/>
<text x="215.0" y="206.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700">Expands and cools</text>
<text x="215.0" y="224.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">space itself stretches;</text>
<text x="215.0" y="239.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">temperature falls</text>
<line x1="395" y1="172" x2="395" y2="186" stroke="#16283c" stroke-width="1.6"/>
<text x="395.0" y="206.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700">Atoms form</text>
<text x="395.0" y="224.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">hydrogen and helium;</text>
<text x="395.0" y="239.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">radiation now travels</text>
<text x="395.0" y="254.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">freely → today’s CMB</text>
<line x1="585" y1="172" x2="585" y2="186" stroke="#16283c" stroke-width="1.6"/>
<text x="585.0" y="206.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700">Stars and galaxies</text>
<text x="585.0" y="224.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">gravity pulls the gas</text>
<text x="585.0" y="239.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">into clumps</text>
<line x1="760" y1="172" x2="760" y2="186" stroke="#16283c" stroke-width="1.6"/>
<text x="780.0" y="206.0" font-size="14" fill="#16283c" text-anchor="end" font-weight="700">Today</text>
<text x="780.0" y="224.0" font-size="12" fill="#33475b" text-anchor="end" font-weight="400">still expanding;</text>
<text x="780.0" y="239.0" font-size="12" fill="#33475b" text-anchor="end" font-weight="400">galaxies moving apart</text>
<line x1="30.0" y1="179.0" x2="800.0" y2="179.0" stroke="#16283c" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="795.0" y="25.0" font-size="1" fill="#33475b" text-anchor="middle" font-weight="400"></text>
<text x="410.0" y="100.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">universe gets bigger and cooler →</text>
<ellipse cx="560" cy="80" rx="7" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-20 560 80)"/>
<ellipse cx="640" cy="118" rx="7" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-20 640 118)"/>
<ellipse cx="700" cy="60" rx="7" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-20 700 60)"/>
<ellipse cx="735" cy="132" rx="7" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-20 735 132)"/>
<ellipse cx="610" cy="50" rx="7" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-20 610 50)"/>
<ellipse cx="760" cy="95" rx="7" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-20 760 95)"/>
<ellipse cx="672" cy="97" rx="7" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-20 672 97)"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 296" width="820" height="296" role="img"
     aria-label="Practical set-ups: rods of different materials with wax and drawing pins; a crystal in a heated beaker of water; a Leslie cube with an infrared detector">
  <defs>
    <marker id="p4tp-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8e44ad"/>
    </marker>
    <marker id="p4tp-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#33475b"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <line x1="272" y1="10" x2="272" y2="290" stroke="#dfe5ea" stroke-width="1.5"/>
    <line x1="545" y1="10" x2="545" y2="290" stroke="#dfe5ea" stroke-width="1.5"/>

    <!-- ===== (a) Conduction ===== -->
    <text x="137" y="22" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">(a) Conduction</text>
    <rect x="28" y="56" width="24" height="146" fill="#9aa7b3" stroke="#33475b" stroke-width="1.5"/>
    <!-- rods -->
    <rect x="52" y="70" width="184" height="12" fill="#d08b5b" stroke="#33475b" stroke-width="1"/>
    <rect x="52" y="106" width="184" height="12" fill="#c9ced3" stroke="#33475b" stroke-width="1"/>
    <rect x="52" y="142" width="184" height="12" fill="#8f98a1" stroke="#33475b" stroke-width="1"/>
    <rect x="52" y="178" width="184" height="12" fill="#e3f1f4" stroke="#33475b" stroke-width="1"/>
    <g font-size="12.5" text-anchor="middle">
      <text x="130" y="66">copper</text>
      <text x="130" y="102">aluminium</text>
      <text x="130" y="138">steel</text>
      <text x="130" y="174">glass</text>
    </g>
    <!-- wax and drawing pins -->
    <g stroke="#33475b" stroke-width="1.2">
      <ellipse cx="228" cy="85" rx="6" ry="4" fill="#f3e3a0" stroke="#b59f3b"/>
      <line x1="228" y1="88" x2="228" y2="97"/><rect x="222" y="97" width="12" height="3" fill="#33475b"/>
      <ellipse cx="228" cy="121" rx="6" ry="4" fill="#f3e3a0" stroke="#b59f3b"/>
      <line x1="228" y1="124" x2="228" y2="133"/><rect x="222" y="133" width="12" height="3" fill="#33475b"/>
      <ellipse cx="228" cy="157" rx="6" ry="4" fill="#f3e3a0" stroke="#b59f3b"/>
      <line x1="228" y1="160" x2="228" y2="169"/><rect x="222" y="169" width="12" height="3" fill="#33475b"/>
      <ellipse cx="228" cy="193" rx="6" ry="4" fill="#f3e3a0" stroke="#b59f3b"/>
      <line x1="228" y1="196" x2="228" y2="205"/><rect x="222" y="205" width="12" height="3" fill="#33475b"/>
    </g>
    <text x="222" y="226" font-size="12" text-anchor="end">wax + drawing pin</text>
    <path d="M40,250 C23,240 27,222 40,208 C42,222 57,230 40,250 Z" fill="#e67e22"/>
    <path d="M40,248 C32,242 34,232 40,224 C42,234 48,239 40,248 Z" fill="#f7c948"/>
    <text x="137" y="270" font-size="12.5" text-anchor="middle">same size rods, heated equally;</text>
    <text x="137" y="286" font-size="12.5" text-anchor="middle">time for each pin to fall</text>

    <!-- ===== (b) Convection ===== -->
    <text x="410" y="22" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">(b) Convection</text>
    <rect x="341" y="62" width="138" height="152" fill="#e3eef7"/>
    <path d="M340,44 L340,206 Q340,215 349,215 L471,215 Q480,215 480,206 L480,44" stroke="#33475b" stroke-width="2" fill="none"/>
    <path d="M357,202 C354,160 355,112 362,94 C372,74 440,72 455,92 C466,110 466,160 462,196" stroke="#8e44ad" stroke-width="3" stroke-opacity="0.8" fill="none" marker-end="url(#p4tp-purple)"/>
    <polygon points="351,213 363,213 360,205 353,206" fill="#5b2172"/>
    <text x="369" y="210" font-size="12" font-weight="700" fill="#5b2172">crystal</text>
    <path d="M357,256 C340,246 344,230 357,218 C359,230 374,238 357,256 Z" fill="#e67e22"/>
    <path d="M357,254 C349,248 351,238 357,231 C359,240 365,245 357,254 Z" fill="#f7c948"/>
    <text x="410" y="270" font-size="12.5" text-anchor="middle">purple colour shows the</text>
    <text x="410" y="286" font-size="12.5" text-anchor="middle">convection current</text>

    <!-- ===== (c) Radiation ===== -->
    <text x="680" y="22" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">(c) Radiation</text>
    <text x="635" y="68" font-size="12" text-anchor="middle">filled with hot water</text>
    <polygon points="575,110 605,82 695,82 665,110" fill="#9aa7b3" stroke="#33475b" stroke-width="1.2"/>
    <polygon points="665,110 695,82 695,172 665,200" fill="#e6eaee" stroke="#33475b" stroke-width="1.2"/>
    <line x1="671" y1="160" x2="689" y2="110" stroke="#ffffff" stroke-width="3"/>
    <rect x="575" y="110" width="90" height="90" fill="#2b2b2b" stroke="#33475b" stroke-width="1.2"/>
    <text x="620" y="151" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">matt</text>
    <text x="620" y="167" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">black</text>
    <!-- detector -->
    <rect x="728" y="130" width="20" height="16" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.5"/>
    <rect x="748" y="116" width="52" height="44" rx="4" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.5"/>
    <rect x="756" y="124" width="36" height="14" fill="#ffffff" stroke="#4c3fa8" stroke-width="1"/>
    <text x="774" y="96" font-size="12.5" font-weight="700" fill="#4c3fa8" text-anchor="middle">infrared</text>
    <text x="774" y="110" font-size="12.5" font-weight="700" fill="#4c3fa8" text-anchor="middle">detector</text>
    <line x1="698" y1="138" x2="726" y2="138" stroke="#33475b" stroke-width="1.2" marker-start="url(#p4tp-dim)" marker-end="url(#p4tp-dim)"/>
    <text x="701" y="157" font-size="12">fixed</text>
    <text x="701" y="171" font-size="12">distance</text>
    <text x="680" y="270" font-size="12.5" text-anchor="middle">Leslie cube: each face a different</text>
    <text x="680" y="286" font-size="12.5" text-anchor="middle">surface (matt black, shiny silver…)</text>
  </g>
</svg>

  <rect x="627.0" y="124" width="34" height="34" fill="#efe9fa" stroke="#6b7a88" stroke-width="1.2"/>
  <rect x="559.0" y="158" width="34" height="34" fill="#e6f3ec" stroke="#6b7a88" stroke-width="1.2"/>

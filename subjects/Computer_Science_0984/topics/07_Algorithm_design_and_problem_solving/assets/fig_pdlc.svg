<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 206" width="820" height="206" role="img"
     aria-label="Program development life cycle: analysis, design, coding, testing, with the tasks done at each stage" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="pdlc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" font-size="15" fill="#33475b">
    <!-- stage headers -->
    <g font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
      <rect x="8" y="8" width="180" height="38" rx="6" fill="#0f7b6c"/>
      <text x="98" y="33">1 Analysis</text>
      <rect x="219" y="8" width="180" height="38" rx="6" fill="#0f7b6c"/>
      <text x="309" y="33">2 Design</text>
      <rect x="430" y="8" width="180" height="38" rx="6" fill="#0f7b6c"/>
      <text x="520" y="33">3 Coding</text>
      <rect x="641" y="8" width="171" height="38" rx="6" fill="#0f7b6c"/>
      <text x="726" y="33">4 Testing</text>
    </g>
    <line x1="190" y1="27" x2="215" y2="27" stroke="#16283c" stroke-width="2" marker-end="url(#pdlc-arr)"/>
    <line x1="401" y1="27" x2="426" y2="27" stroke="#16283c" stroke-width="2" marker-end="url(#pdlc-arr)"/>
    <line x1="612" y1="27" x2="637" y2="27" stroke="#16283c" stroke-width="2" marker-end="url(#pdlc-arr)"/>

    <!-- task panels -->
    <g fill="#e7f3ef" stroke="#cfe4dd" stroke-width="1.5">
      <rect x="8" y="52" width="180" height="146" rx="5"/>
      <rect x="219" y="52" width="180" height="146" rx="5"/>
      <rect x="430" y="52" width="180" height="146" rx="5"/>
      <rect x="641" y="52" width="171" height="146" rx="5"/>
    </g>

    <text x="18" y="78">• identify the problem</text>
    <text x="18" y="102">• identify the requirements</text>
    <text x="18" y="126">• <tspan font-weight="700" fill="#16283c">abstraction</tspan></text>
    <text x="18" y="150">• <tspan font-weight="700" fill="#16283c">decomposition</tspan> of</text>
    <text x="30" y="170">the problem</text>

    <text x="229" y="78">• <tspan font-weight="700" fill="#16283c">decomposition</tspan> into</text>
    <text x="241" y="98">sub-systems</text>
    <text x="229" y="122">• structure diagrams</text>
    <text x="229" y="146">• flowcharts</text>
    <text x="229" y="170">• pseudocode</text>

    <text x="440" y="78">• write the program code</text>
    <text x="440" y="102">• <tspan font-weight="700" fill="#16283c">iterative testing</tspan>:</text>
    <text x="452" y="122">test each part as it is</text>
    <text x="452" y="142">written, amend it and</text>
    <text x="452" y="162">re-test until it works</text>

    <text x="651" y="78">• run the completed</text>
    <text x="663" y="98">program with</text>
    <text x="663" y="118"><tspan font-weight="700" fill="#16283c">test data</tspan></text>
    <text x="651" y="142">• check that it all works</text>
    <text x="663" y="162">together as required</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="Structure of a MAC address such as 00-1A-2B-3C-4D-5E: 48 bits written as 12 hexadecimal digits in six pairs. The first three pairs are the manufacturer code; the last three pairs are the serial code of the device." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .mc-x { font-size: 24px; font-weight: 700; font-family: "DejaVu Sans Mono", Consolas, monospace; }
    .mc-d { font-size: 24px; fill: #8a97a6; font-family: "DejaVu Sans Mono", Consolas, monospace; }
    .mc-h { font-size: 13.5px; font-weight: 700; }
    .mc-s { font-size: 11.5px; fill: #33475b; }
  </style>
  <g>
    <rect x="130" y="40" width="66" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/><text class="mc-x" x="163" y="70" text-anchor="middle">00</text>
    <text class="mc-d" x="210" y="70" text-anchor="middle">-</text>
    <rect x="224" y="40" width="66" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/><text class="mc-x" x="257" y="70" text-anchor="middle">1A</text>
    <text class="mc-d" x="304" y="70" text-anchor="middle">-</text>
    <rect x="318" y="40" width="66" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/><text class="mc-x" x="351" y="70" text-anchor="middle">2B</text>
    <text class="mc-d" x="398" y="70" text-anchor="middle">-</text>
    <rect x="412" y="40" width="66" height="44" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/><text class="mc-x" x="445" y="70" text-anchor="middle">3C</text>
    <text class="mc-d" x="492" y="70" text-anchor="middle">-</text>
    <rect x="506" y="40" width="66" height="44" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/><text class="mc-x" x="539" y="70" text-anchor="middle">4D</text>
    <text class="mc-d" x="586" y="70" text-anchor="middle">-</text>
    <rect x="600" y="40" width="66" height="44" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/><text class="mc-x" x="633" y="70" text-anchor="middle">5E</text>
  </g>
  <!-- byte label -->
  <text class="mc-s" x="163" y="30" text-anchor="middle">1 pair = 2 hex digits = 8 bits</text>
  <!-- braces -->
  <path d="M132,94 L132,102 L382,102 L382,94" fill="none" stroke="#2f6f9f" stroke-width="1.6"/>
  <text class="mc-h" x="257" y="120" text-anchor="middle" style="fill:#2f6f9f">manufacturer code</text>
  <text class="mc-s" x="257" y="136" text-anchor="middle">identifies the maker of the NIC</text>
  <path d="M414,94 L414,102 L664,102 L664,94" fill="none" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="mc-h" x="539" y="120" text-anchor="middle" style="fill:#0b5f54">serial code</text>
  <text class="mc-s" x="539" y="136" text-anchor="middle">unique to this device, set by the maker</text>
  <text class="mc-h" x="705" y="58" text-anchor="middle">48 bits</text>
  <text class="mc-s" x="705" y="74" text-anchor="middle">12 hex digits</text>
</svg>

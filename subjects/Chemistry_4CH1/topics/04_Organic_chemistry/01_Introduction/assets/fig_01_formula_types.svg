<line x1="294.5" y1="226.0" x2="305.5" y2="226.0" stroke="#16283c" stroke-width="1.5"/>
<line x1="285.0" y1="216.5" x2="285.0" y2="205.5" stroke="#16283c" stroke-width="1.5"/>
<line x1="285.0" y1="235.5" x2="285.0" y2="246.5" stroke="#16283c" stroke-width="1.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" width="760" height="176" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="176" fill="#fff"/>
<rect x="6" y="64" width="132" height="48" fill="#f7fafb" stroke="#16283c" stroke-width="1.3" rx="5"/>
<text x="72.0" y="85.5" font-size="10.5" font-weight="700" fill="#16283c" text-anchor="middle">International</text>
<text x="72.0" y="98.5" font-size="10.5" font-weight="700" fill="#33475b" text-anchor="middle">migrant</text>
<text x="72" y="126" font-size="9" fill="#6b7a88" text-anchor="middle">moves to live in</text><text x="72" y="137" font-size="9" fill="#6b7a88" text-anchor="middle">another country</text>
<line x1="138" y1="78" x2="172.6" y2="39.9" stroke="#16283c" stroke-width="1.6"/>
<polygon points="178,34 175.9,42.9 169.3,36.9" fill="#16283c"/>
<line x1="138" y1="98" x2="172.3" y2="132.3" stroke="#16283c" stroke-width="1.6"/>
<polygon points="178,138 169.2,135.5 175.5,129.2" fill="#16283c"/>
<text x="150" y="46" font-size="9" fill="#0b5f54" font-style="italic" text-anchor="end">chooses</text>
<text x="150" y="134" font-size="9" fill="#8f2b20" font-style="italic" text-anchor="end">forced</text>
<rect x="180" y="8" width="566" height="52" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3" rx="5"/>
<text x="190" y="31.5" font-size="10.5" font-weight="700" fill="#0b5f54" text-anchor="start">Economic migrant — moves voluntarily to find work or higher wages</text>
<text x="190" y="44.5" font-size="9.5" font-weight="400" fill="#33475b" text-anchor="start">Moves by choice; can usually return home safely. Needs a visa or work permit to live in most countries.</text>
<rect x="180" y="112" width="196" height="58" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.3" rx="5"/>
<text x="278.0" y="132.0" font-size="10.5" font-weight="700" fill="#9a6b0a" text-anchor="middle">Asylum seeker</text>
<text x="278.0" y="145.0" font-size="9.5" font-weight="400" fill="#33475b" text-anchor="middle">has fled and applied for</text>
<text x="278.0" y="158.0" font-size="9.5" font-weight="400" fill="#33475b" text-anchor="middle">protection; waiting for a decision</text>
<line x1="376" y1="128" x2="412.8" y2="109.6" stroke="#1e8449" stroke-width="1.6"/>
<polygon points="420,106 414.9,113.6 410.8,105.6" fill="#1e8449"/>
<line x1="376" y1="154" x2="412.1" y2="158.9" stroke="#c0392b" stroke-width="1.6"/>
<polygon points="420,160 411.5,163.4 412.7,154.5" fill="#c0392b"/>
<text x="392" y="108" font-size="9" fill="#1e8449" font-style="italic" text-anchor="middle">granted</text>
<text x="398" y="172" font-size="9" fill="#8f2b20" font-style="italic" text-anchor="middle">refused</text>
<rect x="422" y="74" width="324" height="52" fill="#eaf7ef" stroke="#1e8449" stroke-width="1.3" rx="5"/>
<text x="432" y="97.5" font-size="10.5" font-weight="700" fill="#1e6b3a" text-anchor="start">Refugee — has fled persecution, war or violence</text>
<text x="432" y="110.5" font-size="9.5" font-weight="400" fill="#33475b" text-anchor="start">and is legally protected: cannot be sent back to danger</text>
<rect x="422" y="134" width="324" height="36" fill="#fdeded" stroke="#c0392b" stroke-width="1.3" rx="5"/>
<text x="432" y="156.0" font-size="9.5" font-weight="400" fill="#33475b" text-anchor="start">May appeal, or be returned to the country of origin</text>
</svg>
  <text class="im-t" x="6" y="14">PHAGOCYTE</text><text class="im-t" x="262" y="14">LYMPHOCYTE</text><text class="im-t" x="512" y="14">VACCINATION — PAPER 2 ONLY</text>
  <line x1="250" y1="6" x2="250" y2="230" stroke="#dfe5ea" stroke-width="1.4"/><line x1="500" y1="6" x2="500" y2="230" stroke="#dfe5ea" stroke-width="1.4"/>

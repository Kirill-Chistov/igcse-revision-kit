<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The cycle of poverty and why the development gap widens" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="pov8-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" font-size="14" fill="#16283c" text-anchor="middle">
    <text x="290" y="160" font-size="17" font-weight="700" fill="#c0392b">CYCLE OF</text>
    <text x="290" y="180" font-size="17" font-weight="700" fill="#c0392b">POVERTY</text>

    <!-- nodes -->
    <g fill="#fdeded" stroke="#c0392b" stroke-width="1.5">
      <rect x="195" y="8" width="190" height="52" rx="8"/>
      <rect x="390" y="90" width="195" height="62" rx="8"/>
      <rect x="320" y="212" width="205" height="68" rx="8"/>
      <rect x="55" y="212" width="205" height="68" rx="8"/>
      <rect x="5" y="90" width="185" height="62" rx="8"/>
    </g>
    <text x="290" y="31" font-weight="700">Low incomes</text>
    <text x="290" y="50">many in subsistence farming</text>
    <text x="487" y="115" font-weight="700">Little saved; low taxes</text>
    <text x="487" y="136">for the government</text>
    <text x="422" y="236" font-weight="700">Little investment</text>
    <text x="422" y="255">in schools, health care,</text>
    <text x="422" y="273">roads and power</text>
    <text x="157" y="236" font-weight="700">Weak workforce</text>
    <text x="157" y="255">unhealthy, poorly educated;</text>
    <text x="157" y="273">poor infrastructure</text>
    <text x="97" y="115" font-weight="700">Low productivity</text>
    <text x="97" y="136">few investors</text>

    <!-- arrows (clockwise) -->
    <g stroke="#c0392b" stroke-width="2.2" fill="none">
      <path d="M385 40 C440 45 470 62 480 86" marker-end="url(#pov8-a)"/>
      <path d="M480 154 C475 180 460 195 445 208" marker-end="url(#pov8-a)"/>
      <path d="M318 246 C300 246 280 246 264 246" marker-end="url(#pov8-a)"/>
      <path d="M120 210 C105 190 98 172 97 156" marker-end="url(#pov8-a)"/>
      <path d="M100 88 C110 60 150 42 191 36" marker-end="url(#pov8-a)"/>
    </g>
  </g>

  <!-- side notes -->
  <g font-family="Carlito, Calibri, sans-serif" font-size="14" fill="#16283c">
    <rect x="608" y="8" width="286" height="126" rx="8" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.3"/>
    <text x="622" y="32" font-size="15" font-weight="700" fill="#9a6a08">Money drained out of the cycle</text>
    <text x="622" y="56">• debt repayments and interest</text>
    <text x="622" y="77">• low, unstable export prices</text>
    <text x="622" y="98">• rebuilding after hazards and conflict</text>
    <text x="622" y="119">• corruption</text>

    <rect x="608" y="146" width="286" height="134" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
    <text x="622" y="170" font-size="15" font-weight="700" fill="#0b5f54">HICs: the cycle runs the other way</text>
    <text x="622" y="193">high incomes → high savings and taxes</text>
    <text x="622" y="213">→ investment in education, research,</text>
    <text x="622" y="233">infrastructure → high productivity →</text>
    <text x="622" y="253">higher incomes. Growing from a larger</text>
    <text x="622" y="273">base, HICs pull further ahead.</text>
  </g>
</svg>

<text x="302.9" y="172.6" font-size="12" fill="#4c3fa8" text-anchor="middle" font-weight="700">run = 0.40</text>
<text x="415.4" y="102.2" font-size="12" fill="#4c3fa8" text-anchor="start" font-weight="700">rise = 0.60</text>
<text x="530.0" y="70.0" font-size="14" fill="#16283c" text-anchor="start" font-weight="700">Straight line through the origin:</text>
<text x="530.0" y="90.0" font-size="14" fill="#16283c" text-anchor="start" font-weight="400">sin i is proportional to sin r</text>
<text x="530.0" y="130.0" font-size="14" fill="#4c3fa8" text-anchor="start" font-weight="700">gradient = rise ÷ run</text>
<text x="530.0" y="150.0" font-size="14" fill="#4c3fa8" text-anchor="start" font-weight="700">= 0.60 ÷ 0.40 = 1.5</text>
<text x="530.0" y="190.0" font-size="16" fill="#0f7b6c" text-anchor="start" font-weight="700">gradient = n</text>
<text x="530.0" y="210.0" font-size="13" fill="#0f7b6c" text-anchor="start" font-weight="400">(refractive index of the glass)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="An animal cell with cell membrane, cytoplasm, nucleus, mitochondria and ribosomes, beside a plant cell with the same structures plus a cellulose cell wall, chloroplasts and a large permanent vacuole containing cell sap.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .cs-t  { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #0b5f54; }
    .cs-l  { font-size: 12.5px; font-weight: 700; }
    .cs-p  { font-size: 12.5px; font-weight: 700; fill: #1e8449; }
    .cs-s  { font-size: 11.5px; fill: #33475b; }
    .cs-ld { fill: none; stroke: #8fa3b8; stroke-width: 1.1; }
    .cs-mi { fill: #fbe9d0; stroke: #b86e12; stroke-width: 1.3; }
    .cs-ch { fill: #8cc466; stroke: #3d7a1c; stroke-width: 1.2; }
    .cs-rb { fill: #4c3fa8; }
  </style>

  <text class="cs-t" x="80" y="20">ANIMAL CELL</text>
  <text class="cs-t" x="410" y="20">PLANT CELL</text>

  <!-- ANIMAL -->
  <ellipse cx="185" cy="160" rx="105" ry="85" fill="#fdf1f0" stroke="#a93226" stroke-width="1.8"/>
  <circle cx="200" cy="150" r="26" fill="#eadcf5" stroke="#6d3fa8" stroke-width="1.6"/>
  <g class="cs-mi">
    <ellipse cx="130" cy="200" rx="15" ry="7"/><ellipse cx="248" cy="112" rx="15" ry="7" transform="rotate(-25 248 112)"/><ellipse cx="120" cy="130" rx="14" ry="7" transform="rotate(30 120 130)"/>
  </g>
  <g fill="none" stroke="#b86e12" stroke-width="0.9">
    <path d="M119,200 q3,-5 6,0 t6,0 t6,0 t6,0"/>
  </g>
  <g class="cs-rb">
    <circle cx="228" cy="190" r="2"/><circle cx="236" cy="182" r="2"/><circle cx="222" cy="200" r="2"/>
    <circle cx="160" cy="112" r="2"/><circle cx="168" cy="104" r="2"/><circle cx="150" cy="226" r="2"/>
    <circle cx="170" cy="215" r="2"/><circle cx="100" cy="165" r="2"/><circle cx="260" cy="160" r="2"/>
  </g>
  <path class="cs-ld" d="M90,100 L113,101"/>
  <text class="cs-l" x="6" y="104">cell membrane</text>
  <path class="cs-ld" d="M64,160 L118,166"/>
  <text class="cs-l" x="6" y="164">cytoplasm</text>
  <path class="cs-ld" d="M88,212 L116,203"/>
  <text class="cs-l" x="6" y="216">mitochondrion</text>
  <path class="cs-ld" d="M296,124 L224,142"/>
  <text class="cs-l" x="300" y="128">nucleus</text>
  <path class="cs-ld" d="M296,216 L231,192"/>
  <text class="cs-l" x="300" y="220">ribosomes</text>

  <!-- PLANT -->
  <rect x="410" y="60" width="190" height="190" rx="8" fill="#e3f1d6" stroke="#4a7a1f" stroke-width="7"/>
  <rect x="418" y="68" width="174" height="174" rx="5" fill="#f7fbf2" stroke="#2f5d12" stroke-width="1.4"/>
  <rect x="445" y="95" width="110" height="110" rx="28" fill="#dcecf7" stroke="#5b8db8" stroke-width="1.5"/>
  <circle cx="574" cy="185" r="13" fill="#eadcf5" stroke="#6d3fa8" stroke-width="1.6"/>
  <g class="cs-ch">
    <ellipse cx="578" cy="100" rx="9" ry="5" transform="rotate(90 578 100)"/>
    <ellipse cx="578" cy="130" rx="9" ry="5" transform="rotate(90 578 130)"/>
    <ellipse cx="431" cy="95" rx="9" ry="5" transform="rotate(90 431 95)"/>
    <ellipse cx="431" cy="150" rx="9" ry="5" transform="rotate(90 431 150)"/>
    <ellipse cx="431" cy="205" rx="9" ry="5" transform="rotate(90 431 205)"/>
    <ellipse cx="480" cy="81" rx="9" ry="5"/><ellipse cx="530" cy="81" rx="9" ry="5"/>
    <ellipse cx="470" cy="228" rx="9" ry="5"/><ellipse cx="530" cy="228" rx="9" ry="5"/>
  </g>
  <ellipse class="cs-mi" cx="500" cy="228" rx="10" ry="5"/>
  <g class="cs-rb"><circle cx="555" cy="222" r="2"/><circle cx="505" cy="84" r="2"/><circle cx="433" cy="178" r="2"/></g>

  <path class="cs-ld" d="M610,70 L604,76"/>
  <text class="cs-p" x="614" y="74">cell wall (cellulose)</text>
  <path class="cs-ld" d="M610,98 L593,89"/>
  <text class="cs-l" x="614" y="102">cell membrane</text>
  <path class="cs-ld" d="M610,128 L587,130"/>
  <text class="cs-p" x="614" y="132">chloroplast</text>
  <path class="cs-ld" d="M610,160 L556,160"/>
  <text class="cs-p" x="614" y="160">large permanent vacuole</text>
  <text class="cs-s" x="614" y="174">containing cell sap</text>
  <path class="cs-ld" d="M610,200 L586,190"/>
  <text class="cs-l" x="614" y="204">nucleus</text>
  <path class="cs-ld" d="M610,232 L586,214"/>
  <text class="cs-l" x="614" y="236">cytoplasm</text>

  <text class="cs-s" x="410" y="274">also mitochondria and ribosomes, as in the animal cell</text>
  <rect x="80" y="263" width="12" height="12" rx="2" fill="#1e8449"/>
  <text class="cs-s" x="98" y="274">green label = plant cells only</text>
</svg>

<path d="M506 214 l-8 16 M506 214 l8 16 M506 214 l0 16" stroke="#16283c" stroke-width="1.4"/><circle cx="506" cy="210" r="5" fill="#ffffff" stroke="#16283c" stroke-width="1.4"/>
<g transform="translate(600 34)"><rect x="-10" y="-8" width="20" height="16" fill="#b9c4cd" stroke="#16283c"/><rect x="-38" y="-5" width="24" height="10" fill="#4c6a8a" stroke="#16283c"/><rect x="14" y="-5" width="24" height="10" fill="#4c6a8a" stroke="#16283c"/></g>
<path d="M596 44 L512 202 M592 44 L420 114" stroke="#4c3fa8" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="10" y="150" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">SEISMOMETERS</text>
<text x="10" y="166" font-size="12.5" fill="#33475b" text-anchor="start">record swarms of small</text>
<text x="10" y="181" font-size="12.5" fill="#33475b" text-anchor="start">earthquakes as magma</text>
<text x="10" y="196" font-size="12.5" fill="#33475b" text-anchor="start">forces its way up</text>
<polyline points="160,146 240,146 284,200" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="262" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">MAGMA RISING</text>
<text x="10" y="278" font-size="12.5" fill="#33475b" text-anchor="start">magma chamber fills</text>
<text x="10" y="293" font-size="12.5" fill="#33475b" text-anchor="start">and pressure builds</text>
<polyline points="150,258 260,258 318,328" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="40" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">GAS SENSORS</text>
<text x="10" y="56" font-size="12.5" fill="#33475b" text-anchor="start">more sulphur dioxide (SO₂)</text>
<text x="10" y="71" font-size="12.5" fill="#33475b" text-anchor="start">escaping from the crater</text>
<polyline points="164,36 340,36 402,86" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="600" y="200" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">TILTMETERS AND GPS</text>
<text x="600" y="216" font-size="12.5" fill="#33475b" text-anchor="start">measure the ground</text>
<text x="600" y="231" font-size="12.5" fill="#33475b" text-anchor="start">swelling (bulging) as</text>
<text x="600" y="246" font-size="12.5" fill="#33475b" text-anchor="start">magma pushes up</text>
<polyline points="594,196 520,214" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="648" y="24" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">SATELLITES</text>
<text x="648" y="40" font-size="12.5" fill="#33475b" text-anchor="start">thermal images: heat;</text>
<text x="648" y="55" font-size="12.5" fill="#33475b" text-anchor="start">radar: swelling</text>
<text x="580" y="292" font-size="12.5" font-style="italic" fill="#c0392b" text-anchor="end">bulge</text>
</g></svg>
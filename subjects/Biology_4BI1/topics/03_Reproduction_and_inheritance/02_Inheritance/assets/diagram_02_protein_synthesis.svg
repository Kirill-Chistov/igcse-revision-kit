    .ps-b { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .ps-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .ld { stroke: #8fa3b8; stroke-width: 1; fill: none; }
  </style>

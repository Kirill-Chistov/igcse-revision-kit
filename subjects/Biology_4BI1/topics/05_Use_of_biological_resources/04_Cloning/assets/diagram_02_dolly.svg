    .dl-h { font-size: 12.5px; font-weight: 700; }
    .dl-s { font-size: 11.8px; fill: #33475b; }
    .dl-t { font-size: 11.5px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
  </style>
  <defs><marker id="dl-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker></defs>

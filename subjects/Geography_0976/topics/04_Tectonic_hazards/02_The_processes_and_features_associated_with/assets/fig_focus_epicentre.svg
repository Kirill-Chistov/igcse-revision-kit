<g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
<text x="580" y="28" font-size="14.5" font-weight="700" fill="#16283c">EPICENTRE</text>
<text x="580" y="45" font-size="13" fill="#33475b">the point on the surface</text>
<text x="580" y="60" font-size="13" fill="#33475b">directly above the focus</text>
<polyline points="574,40 380,40 308,66" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="580" y="106" font-size="14.5" font-weight="700" fill="#c0392b">SEISMIC WAVES</text>
<text x="580" y="123" font-size="13" fill="#33475b">waves of energy that spread</text>
<text x="580" y="138" font-size="13" fill="#33475b">out from the focus; shaking</text>
<text x="580" y="153" font-size="13" fill="#33475b">is strongest at the epicentre</text>
<text x="580" y="168" font-size="13" fill="#33475b">and weakens with distance</text>
<polyline points="574,118 540,118 500,150" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="580" y="212" font-size="14.5" font-weight="700" fill="#16283c">FOCUS</text>
<text x="580" y="229" font-size="13" fill="#33475b">the point underground where</text>
<text x="580" y="244" font-size="13" fill="#33475b">the rock breaks and the</text>
<text x="580" y="259" font-size="13" fill="#33475b">energy is released</text>
<polyline points="574,224 520,224 316,235" fill="none" stroke="#16283c" stroke-width="1"/>

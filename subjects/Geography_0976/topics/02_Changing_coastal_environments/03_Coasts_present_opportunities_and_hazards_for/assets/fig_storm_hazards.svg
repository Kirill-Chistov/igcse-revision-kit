<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 222" width="820" height="222" role="img" aria-label="The three hazards of a tropical storm and the damage each causes">
  <defs>
    <marker id="sh-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
    <g>
      <rect x="0" y="4" width="244" height="62" rx="6" fill="#fbe3d0" stroke="#c96a1e" stroke-width="1.5"/>
      <text x="14" y="30" font-size="17" font-weight="700">Strong winds</text>
      <text x="14" y="50" font-size="13.5">at least 119 km/h</text>
      <line x1="250" y1="35" x2="296" y2="35" stroke="#16283c" stroke-width="2" marker-end="url(#sh-arr)"/>
      <text x="306" y="30" font-size="14.5">Buildings, power lines, trees and crops destroyed;</text>
      <text x="306" y="49" font-size="14.5">flying debris injures and kills people.</text>
    </g>
    <g>
      <rect x="0" y="80" width="244" height="62" rx="6" fill="#fbe3d0" stroke="#c96a1e" stroke-width="1.5"/>
      <text x="14" y="106" font-size="17" font-weight="700">Heavy rainfall</text>
      <text x="14" y="126" font-size="13.5">often over 100 mm in a day</text>
      <line x1="250" y1="111" x2="296" y2="111" stroke="#16283c" stroke-width="2" marker-end="url(#sh-arr)"/>
      <text x="306" y="106" font-size="14.5">River flooding; landslides on steep, saturated slopes.</text>
    </g>
    <g>
      <rect x="0" y="156" width="244" height="62" rx="6" fill="#fbe3d0" stroke="#c96a1e" stroke-width="1.5"/>
      <text x="14" y="182" font-size="17" font-weight="700">Storm surge</text>
      <text x="14" y="202" font-size="13.5">sea level raised by up to several metres</text>
      <line x1="250" y1="187" x2="296" y2="187" stroke="#16283c" stroke-width="2" marker-end="url(#sh-arr)"/>
      <text x="306" y="178" font-size="14.5">Very low pressure lets the sea surface rise, and strong onshore</text>
      <text x="306" y="196" font-size="14.5">winds pile water against the coast → coastal flooding and erosion;</text>
      <text x="306" y="214" font-size="14.5">salt water ruins farmland and contaminates drinking water.</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Carlito, Calibri, Lato, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="c1a2-arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a88"/></marker><marker id="c1a2-arr1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="c1a2-arr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker><marker id="c1a2-arr3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="170.0" y="22.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >A  Diluting a coloured solution</text><path d="M30,60 L30,170 Q30,178 38,178 L82,178 Q90,178 90,170 L90,60" stroke="#33475b" stroke-width="1.6" fill="none" /><rect x="31.5" y="95.0" width="57.0" height="81.0" rx="0" fill="#5b1a6e" /><text x="60.0" y="198.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >1 crystal of</text><text x="60.0" y="212.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >KMnO₄ in 10 cm³</text><line x1="92.0" y1="80.0" x2="113.0" y2="80.0" stroke="#6b7a88" stroke-width="1.4" marker-end="url(#c1a2-arr0)"/><path d="M115,60 L115,170 Q115,178 123,178 L167,178 Q175,178 175,170 L175,60" stroke="#33475b" stroke-width="1.6" fill="none" /><rect x="116.5" y="95.0" width="57.0" height="81.0" rx="0" fill="#8a4a9c" /><text x="145.0" y="198.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >10 cm³ + 90 cm³</text><text x="145.0" y="212.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >water</text><line x1="177.0" y1="80.0" x2="198.0" y2="80.0" stroke="#6b7a88" stroke-width="1.4" marker-end="url(#c1a2-arr0)"/><path d="M200,60 L200,170 Q200,178 208,178 L252,178 Q260,178 260,170 L260,60" stroke="#33475b" stroke-width="1.6" fill="none" /><rect x="201.5" y="95.0" width="57.0" height="81.0" rx="0" fill="#b88ac4" /><text x="230.0" y="198.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >10 cm³ + 90 cm³</text><text x="230.0" y="212.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >water</text><line x1="262.0" y1="80.0" x2="283.0" y2="80.0" stroke="#6b7a88" stroke-width="1.4" marker-end="url(#c1a2-arr0)"/><path d="M285,60 L285,170 Q285,178 293,178 L337,178 Q345,178 345,170 L345,60" stroke="#33475b" stroke-width="1.6" fill="none" /><rect x="286.5" y="95.0" width="57.0" height="81.0" rx="0" fill="#dcc4e3" /><text x="315.0" y="198.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >10 cm³ + 90 cm³</text><text x="315.0" y="212.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >water</text><text x="170.0" y="240.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" font-style="normal" >Colour fades but is still seen after many dilutions:</text><text x="170.0" y="256.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" font-style="normal" >one crystal contains a huge number of very small</text><text x="170.0" y="272.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" font-style="normal" >particles, which spread out through all the water.</text><line x1="362.0" y1="15.0" x2="362.0" y2="280.0" stroke="#dfe5ea" stroke-width="1.2"/><text x="545.0" y="22.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >B  Diffusion of two gases</text><rect x="385.0" y="94.0" width="320.0" height="32.0" rx="4" fill="#fbfdfe" stroke="#33475b" stroke-width="1.6" /><rect x="387.0" y="96.0" width="26.0" height="28.0" rx="0" fill="#cfe4f5" /><rect x="677.0" y="96.0" width="26.0" height="28.0" rx="0" fill="#f7d9d4" /><text x="387.0" y="86.0" font-size="12" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal" >cotton wool + conc. ammonia</text><text x="703.0" y="86.0" font-size="12" fill="#16283c" text-anchor="end" font-weight="bold" font-style="normal" >cotton wool + conc. HCl</text><rect x="577.4" y="96.0" width="12.0" height="28.0" rx="0" fill="#ffffff" stroke="#9aa6b1" stroke-width="1" /><line x1="583.4" y1="162.0" x2="583.4" y2="130.0" stroke="#16283c" stroke-width="1.2" marker-end="url(#c1a2-arr1)"/><text x="583.4" y="178.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >white ring of ammonium chloride</text><line x1="420.0" y1="55.0" x2="573.4" y2="55.0" stroke="#0f7b6c" stroke-width="1.8" marker-end="url(#c1a2-arr2)"/><text x="501.7" y="48.0" font-size="12" fill="#0f7b6c" text-anchor="middle" font-weight="bold" font-style="normal" >NH₃ travels further</text><line x1="670.0" y1="55.0" x2="593.4" y2="55.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#c1a2-arr3)"/><text x="630.7" y="48.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" font-style="normal" >HCl</text><text x="545.0" y="222.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" font-style="normal" >NH₃ (Mr 17) is lighter than HCl (Mr 36.5), so its</text><text x="545.0" y="238.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" font-style="normal" >particles move faster and diffuse further in the</text><text x="545.0" y="254.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="normal" font-style="normal" >same time: the ring forms nearer the HCl end.</text></svg>

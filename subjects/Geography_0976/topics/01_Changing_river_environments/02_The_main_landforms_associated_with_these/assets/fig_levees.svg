<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16283c"/></marker>
    <marker id="k2" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 z" fill="#16283c"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">Floodplain and levées — cross-section of the lower course</text>

  <!-- flood water extent -->
  <path d="M42,125 L858,125 L842,172 L570,172 L505,152 L495,166 L483,190 L417,190 L405,166 L395,152 L330,172 L58,172 Z" fill="#dbeaf3" opacity="0.8"/>
  <line x1="42" y1="125" x2="858" y2="125" stroke="#3d7ea6" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="70" y="118" font-size="12" font-weight="700" fill="#2a5f80">flood level — water spills over the banks and spreads across the floodplain</text>

  <!-- bedrock -->
  <path d="M16,60 L58,172 L842,172 L884,60 L884,310 L16,310 Z" fill="#dcd8d0"/>
  <!-- alluvium -->
  <path d="M58,172 L330,172 L395,152 L405,166 L430,214 L470,214 L495,166 L505,152 L570,172 L842,172 L830,204 L70,204 Z" fill="#e3d3ae"/>
  <g stroke="#b8a37a" stroke-width="1" fill="none" stroke-dasharray="3 5">
    <path d="M66,186 L834,186"/><path d="M68,196 L832,196"/>
  </g>
  <!-- coarse sediment in levées -->
  <g fill="#a38a57">
    <circle cx="372" cy="164" r="3.4"/><circle cx="384" cy="160" r="3.6"/><circle cx="362" cy="168" r="3"/><circle cx="392" cy="166" r="3.2"/><circle cx="378" cy="170" r="3"/>
    <circle cx="512" cy="160" r="3.6"/><circle cx="524" cy="164" r="3.4"/><circle cx="536" cy="168" r="3"/><circle cx="516" cy="170" r="3"/><circle cx="530" cy="174" r="2.8"/>
  </g>
  <!-- channel water (normal level) -->
  <path d="M417,190 L430,214 L470,214 L483,190 Z" fill="#7fb2d4"/>
  <path d="M16,60 L58,172 L330,172 L395,152 L405,166 L430,214 L470,214 L495,166 L505,152 L570,172 L842,172 L884,60" fill="none" stroke="#4b6b3d" stroke-width="2.2"/>

  <!-- labels -->
  <text x="40" y="92" font-size="12" fill="#16283c">valley side</text>
  <text x="860" y="92" font-size="12" fill="#16283c" text-anchor="end">valley side</text>

  <text x="200" y="232" font-size="12.5" font-weight="700" fill="#8a6f33">LEVÉE</text>
  <text x="200" y="247" font-size="12" fill="#16283c">coarse, heavy sediment dropped first,</text>
  <text x="200" y="261" font-size="12" fill="#16283c">right beside the channel, as flood water</text>
  <text x="200" y="275" font-size="12" fill="#16283c">leaves it and slows (friction)</text>
  <line x1="300" y1="228" x2="378" y2="164" stroke="#16283c" stroke-width="1" marker-end="url(#k)"/>

  <text x="560" y="232" font-size="12.5" font-weight="700" fill="#8a6f33">FLOODPLAIN</text>
  <text x="560" y="247" font-size="12" fill="#16283c">wide and flat; finer silt (alluvium) carried</text>
  <text x="560" y="261" font-size="12" fill="#16283c">further and laid down in layers flood after flood</text>
  <line x1="640" y1="228" x2="700" y2="190" stroke="#16283c" stroke-width="1" marker-end="url(#k)"/>

  <text x="450" y="236" font-size="12" fill="#2a5f80" text-anchor="middle">normal</text>
  <text x="450" y="249" font-size="12" fill="#2a5f80" text-anchor="middle">level</text>

  <line x1="64" y1="296" x2="836" y2="296" stroke="#16283c" stroke-width="1.4" marker-end="url(#k)" marker-start="url(#k2)"/>
  <text x="450" y="292" font-size="12" fill="#16283c" text-anchor="middle" paint-order="stroke" stroke="#dcd8d0" stroke-width="5">floodplain widened by meanders eroding laterally across the valley floor</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Machine learning cycle for a spam filter: training data, find patterns, predict on new data, feedback, program adapts itself and the cycle repeats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ml-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <style>
    .ml-t{font-size:15px;font-weight:700;fill:#1e293b;text-anchor:middle}
    .ml-s{font-size:13px;fill:#334155;text-anchor:middle}
    .ml-e{font-size:12.5px;fill:#0f5f55;text-anchor:middle;font-style:italic}
    .ml-n{font-size:13px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .ml-line{stroke:#1e293b;stroke-width:2;fill:none}
  </style>

  <!-- 1 training data -->
  <rect x="15" y="20" width="220" height="95" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="37" cy="42" r="12" fill="#475569"/><text class="ml-n" x="37" y="47">1</text>
  <text class="ml-t" x="130" y="47">Training data</text>
  <text class="ml-s" x="125" y="70">large amount of example data</text>
  <text class="ml-e" x="125" y="95">emails labelled spam / not spam</text>

  <!-- 2 find patterns -->
  <rect x="300" y="20" width="220" height="95" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
  <circle cx="322" cy="42" r="12" fill="#4c3fa8"/><text class="ml-n" x="322" y="47">2</text>
  <text class="ml-t" x="415" y="47">Finds patterns</text>
  <text class="ml-s" x="410" y="70">builds its own rules / model</text>
  <text class="ml-e" x="410" y="95">words and senders common in spam</text>

  <!-- 3 predict -->
  <rect x="585" y="20" width="220" height="95" rx="8" fill="#e8f0fb" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="607" cy="42" r="12" fill="#1d4ed8"/><text class="ml-n" x="607" y="47">3</text>
  <text class="ml-t" x="700" y="47">Decides on new data</text>
  <text class="ml-s" x="695" y="70">makes a prediction</text>
  <text class="ml-e" x="695" y="95">new email moved to spam folder</text>

  <!-- 4 feedback -->
  <rect x="585" y="160" width="220" height="95" rx="8" fill="#fdf3e1" stroke="#b45309" stroke-width="2"/>
  <circle cx="607" cy="182" r="12" fill="#b45309"/><text class="ml-n" x="607" y="187">4</text>
  <text class="ml-t" x="700" y="187">Feedback</text>
  <text class="ml-s" x="695" y="210">was the decision right?</text>
  <text class="ml-e" x="695" y="235">user marks a missed email as spam</text>

  <!-- 5 adapts -->
  <rect x="300" y="160" width="220" height="95" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="322" cy="182" r="12" fill="#0f766e"/><text class="ml-n" x="322" y="187">5</text>
  <text class="ml-t" x="415" y="187">Adapts itself</text>
  <text class="ml-s" x="410" y="210">changes its own processes/data</text>
  <text class="ml-e" x="410" y="235">updates the spam patterns</text>

  <!-- note -->
  <text class="ml-s" x="125" y="195" font-weight="700">No person rewrites</text>
  <text class="ml-s" x="125" y="213" font-weight="700">the program: it gets</text>
  <text class="ml-s" x="125" y="231" font-weight="700">better every cycle</text>

  <!-- arrows -->
  <line class="ml-line" x1="235" y1="67" x2="297" y2="67" marker-end="url(#ml-a)"/>
  <line class="ml-line" x1="520" y1="67" x2="582" y2="67" marker-end="url(#ml-a)"/>
  <line class="ml-line" x1="695" y1="115" x2="695" y2="157" marker-end="url(#ml-a)"/>
  <line class="ml-line" x1="585" y1="207" x2="523" y2="207" marker-end="url(#ml-a)"/>
  <line class="ml-line" x1="410" y1="160" x2="410" y2="118" marker-end="url(#ml-a)"/>
</svg>

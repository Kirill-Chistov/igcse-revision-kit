<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="es-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="es-art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker><marker id="es-arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker><marker id="es-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="960" height="170" fill="#ffffff"/>
<rect x="8" y="45" width="170" height="80" rx="8" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6" />
<text x="93" y="78" font-size="15" font-weight="700" fill="#33475b" text-anchor="middle">Energy deficit</text>
<text x="93" y="100" font-size="15" font-weight="400" fill="#33475b" text-anchor="middle">uses more than it makes</text>
<line x1="180" y1="85" x2="214" y2="85" stroke="#16283c" stroke-width="2.2" marker-end="url(#es-ar)"/>
<rect x="216" y="45" width="170" height="80" rx="8" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6" />
<text x="301" y="78" font-size="15" font-weight="700" fill="#33475b" text-anchor="middle">Relies on imports</text>
<text x="301" y="100" font-size="15" font-weight="400" fill="#33475b" text-anchor="middle">from other countries</text>
<line x1="388" y1="85" x2="422" y2="85" stroke="#16283c" stroke-width="2.2" marker-end="url(#es-ar)"/>
<rect x="424" y="10" width="236" height="150" rx="8" fill="#fdeded" stroke="#c0392b" stroke-width="1.6" />
<text x="542" y="36" font-size="16" font-weight="700" fill="#c0392b" text-anchor="middle">Exposed to…</text>
<text x="438" y="64" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• supplier cuts or stops supply</text>
<text x="438" y="85" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• war, piracy or a disaster</text>
<text x="447.3" y="106" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">blocks pipelines and routes</text>
<text x="438" y="127" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• global price spikes</text>
<text x="438" y="148" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• reserves running out</text>
<line x1="662" y1="85" x2="696" y2="85" stroke="#16283c" stroke-width="2.2" marker-end="url(#es-ar)"/>
<rect x="698" y="10" width="254" height="150" rx="8" fill="#ffffff" stroke="#16283c" stroke-width="1.8" />
<text x="825" y="36" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">Impacts</text>
<text x="712" y="64" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• industry cuts output → jobs lost</text>
<text x="712" y="85" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• higher bills → fuel poverty,</text>
<text x="721.3" y="106" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">rising prices (inflation)</text>
<text x="712" y="127" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• blackouts, fuel shortages</text>
<text x="712" y="148" font-size="15" font-weight="400" fill="#33475b" text-anchor="start">• political tension</text>
</svg>

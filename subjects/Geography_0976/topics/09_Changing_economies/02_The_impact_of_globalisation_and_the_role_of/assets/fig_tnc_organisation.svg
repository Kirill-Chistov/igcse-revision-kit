<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="920" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/></marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b42318"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7a88"/></marker>
  </defs>
  <rect x="20" y="20" width="240" height="262" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
  <text x="140" y="44" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">HOME COUNTRY</text>
  <text x="140" y="62" font-size="12" font-weight="400" fill="#6b7a88" text-anchor="middle">usually an HIC</text>
  <rect x="340" y="20" width="240" height="262" rx="6" fill="#eef2f5" stroke="#6b7a88" stroke-width="1.5"/>
  <text x="460" y="44" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">MICs</text>
  <rect x="660" y="20" width="240" height="262" rx="6" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
  <text x="780" y="44" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">LICs AND MICs</text>
  <rect x="34" y="74" width="212" height="96" rx="5" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
  <text x="46" y="96" font-size="15" font-weight="700" fill="#16283c" text-anchor="start">Headquarters</text>
  <text x="46" y="117" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">strategy, finance, marketing</text>
  <text x="46" y="135" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">most senior, best-paid jobs</text>
  <text x="46" y="153" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">profits are counted here</text>
  <rect x="34" y="180" width="212" height="90" rx="5" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
  <text x="46" y="202" font-size="15" font-weight="700" fill="#16283c" text-anchor="start">Research and development</text>
  <text x="46" y="223" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">designs new products</text>
  <text x="46" y="241" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">highly skilled scientists</text>
  <text x="46" y="259" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">and engineers</text>
  <rect x="354" y="74" width="212" height="80" rx="5" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
  <text x="366" y="96" font-size="15" font-weight="700" fill="#16283c" text-anchor="start">Regional headquarters</text>
  <text x="366" y="117" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">runs one world region</text>
  <text x="366" y="135" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">e.g. Asia or Latin America</text>
  <rect x="354" y="164" width="212" height="106" rx="5" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
  <text x="366" y="186" font-size="15" font-weight="700" fill="#16283c" text-anchor="start">Factories and assembly</text>
  <text x="366" y="207" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">semi-skilled workers</text>
  <text x="366" y="225" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">cheap land and labour</text>
  <text x="366" y="243" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">tax incentives, SEZs</text>
  <text x="366" y="261" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">near container ports</text>
  <rect x="674" y="74" width="212" height="96" rx="5" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
  <text x="686" y="96" font-size="15" font-weight="700" fill="#16283c" text-anchor="start">Subcontracted suppliers</text>
  <text x="686" y="117" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">make parts under contract</text>
  <text x="686" y="135" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">(outsourcing)</text>
  <text x="686" y="153" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">lowest wages, least security</text>
  <rect x="674" y="180" width="212" height="90" rx="5" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
  <text x="686" y="202" font-size="15" font-weight="700" fill="#16283c" text-anchor="start">Raw materials</text>
  <text x="686" y="223" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">mines, plantations,</text>
  <text x="686" y="241" font-size="13.5" font-weight="400" fill="#16283c" text-anchor="start">oil and gas fields</text>
  <path d="M262 120 H336" stroke="#0f7b6c" stroke-width="2.4" fill="none" marker-end="url(#arT)"/>
  <text x="299" y="96" font-size="11.5" font-weight="700" fill="#0f7b6c" text-anchor="middle">investment</text>
  <text x="299" y="109" font-size="11.5" font-weight="700" fill="#0f7b6c" text-anchor="middle">decisions</text>
  <text x="299" y="140" font-size="11.5" font-weight="700" fill="#0f7b6c" text-anchor="middle">technology</text>
  <path d="M658 222 H584" stroke="#b45309" stroke-width="2.4" fill="none" marker-end="url(#arO)"/>
  <text x="621" y="198" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">parts and</text>
  <text x="621" y="244" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">materials</text>
  <rect x="20" y="338" width="880" height="64" rx="6" fill="#16283c" stroke="#16283c" stroke-width="1.5"/>
  <text x="460" y="364" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">MARKETS WORLDWIDE</text>
  <text x="460" y="386" font-size="13" font-weight="400" fill="#dbe4ec" text-anchor="middle">products sold in HICs and to the growing middle classes of MICs</text>
  <path d="M460 284 V334" stroke="#16283c" stroke-width="2.6" fill="none" marker-end="url(#ar)"/>
  <text x="470" y="316" font-size="12.5" font-weight="700" fill="#16283c" text-anchor="start">finished products</text>
  <path d="M140 336 V286" stroke="#0f7b6c" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arT)"/>
  <text x="150" y="316" font-size="12.5" font-weight="700" fill="#0f7b6c" text-anchor="start">profits return to HQ</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Absorption lines in the spectra of a laboratory source, a nearby galaxy and a distant galaxy, shifted further towards red for the distant galaxy; graph of recession speed proportional to distance" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/></marker>
</defs>
<defs><linearGradient id="spec" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#6a3fbf"/><stop offset="0.18" stop-color="#2f5fd6"/>
<stop offset="0.36" stop-color="#2fb0c9"/><stop offset="0.5" stop-color="#3bb34a"/>
<stop offset="0.66" stop-color="#f2d33a"/><stop offset="0.82" stop-color="#f28c28"/>
<stop offset="1" stop-color="#d62f2f"/></linearGradient></defs>
<g font-family="Carlito, Calibri, sans-serif">
<text x="370.0" y="22.0" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">(a) Absorption lines in the spectrum</text>
<rect x="170" y="48" width="400" height="30" fill="url(#spec)" stroke="#16283c" stroke-width="1"/>
<rect x="228.0" y="48" width="4" height="30" fill="#111"/>
<rect x="318.0" y="48" width="4" height="30" fill="#111"/>
<rect x="373.0" y="48" width="4" height="30" fill="#111"/>
<rect x="468.0" y="48" width="4" height="30" fill="#111"/>
<text x="160.0" y="62.0" font-size="14" fill="#16283c" text-anchor="end" font-weight="700">Laboratory</text>
<text x="160.0" y="77.0" font-size="12" fill="#33475b" text-anchor="end" font-weight="400">(reference λ₀)</text>
<rect x="170" y="118" width="400" height="30" fill="url(#spec)" stroke="#16283c" stroke-width="1"/>
<rect x="248.0" y="118" width="4" height="30" fill="#111"/>
<rect x="338.0" y="118" width="4" height="30" fill="#111"/>
<rect x="393.0" y="118" width="4" height="30" fill="#111"/>
<rect x="488.0" y="118" width="4" height="30" fill="#111"/>
<text x="160.0" y="138.0" font-size="14" fill="#16283c" text-anchor="end" font-weight="700">Nearby galaxy</text>
<rect x="170" y="188" width="400" height="30" fill="url(#spec)" stroke="#16283c" stroke-width="1"/>
<rect x="276.0" y="188" width="4" height="30" fill="#111"/>
<rect x="366.0" y="188" width="4" height="30" fill="#111"/>
<rect x="421.0" y="188" width="4" height="30" fill="#111"/>
<rect x="516.0" y="188" width="4" height="30" fill="#111"/>
<text x="160.0" y="208.0" font-size="14" fill="#16283c" text-anchor="end" font-weight="700">Distant galaxy</text>
<line x1="230" y1="78" x2="230" y2="222" stroke="#6b7a88" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="320" y1="78" x2="320" y2="222" stroke="#6b7a88" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="375" y1="78" x2="375" y2="222" stroke="#6b7a88" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="470" y1="78" x2="470" y2="222" stroke="#6b7a88" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="470.0" y1="158.0" x2="490.0" y2="158.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/>
<line x1="470.0" y1="228.0" x2="518.0" y2="228.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/>
<text x="500.0" y="236.0" font-size="1" fill="#33475b" text-anchor="middle" font-weight="400"></text>
<text x="170.0" y="244.0" font-size="12" fill="#33475b" text-anchor="start" font-weight="400">short λ (blue end)</text>
<text x="570.0" y="244.0" font-size="12" fill="#33475b" text-anchor="end" font-weight="400">long λ (red end)</text>
<text x="370.0" y="270.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">same pattern of lines, shifted to longer wavelength:</text>
<text x="370.0" y="286.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">further galaxy → bigger red-shift</text>
<text x="710.0" y="22.0" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">(b) Speed against distance</text>
<line x1="640.0" y1="210.0" x2="640.0" y2="42.0" stroke="#16283c" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="640.0" y1="210.0" x2="808.0" y2="210.0" stroke="#16283c" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="640.0" y1="210.0" x2="794.0" y2="62.0" stroke="#0f7b6c" stroke-width="2.6"/>
<circle cx="663.1" cy="183.0" r="3.5" fill="#16283c"/>
<circle cx="686.2" cy="158.5" r="3.5" fill="#16283c"/>
<circle cx="709.3" cy="141.5" r="3.5" fill="#16283c"/>
<circle cx="732.4" cy="115.0" r="3.5" fill="#16283c"/>
<circle cx="755.5" cy="91.2" r="3.5" fill="#16283c"/>
<circle cx="778.6" cy="75.0" r="3.5" fill="#16283c"/>
<text x="628.0" y="130.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="700" transform="rotate(-90 628 130.0)">speed moving away</text>
<text x="720.0" y="230.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="700">distance from Earth</text>
<text x="720.0" y="254.0" font-size="12" fill="#0f7b6c" text-anchor="middle" font-weight="700">straight line through origin:</text>
<text x="720.0" y="269.0" font-size="12" fill="#0f7b6c" text-anchor="middle" font-weight="700">twice as far → twice as fast</text>
</g>
</svg>

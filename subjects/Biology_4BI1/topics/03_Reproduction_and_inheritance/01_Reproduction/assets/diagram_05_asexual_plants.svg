  <path d="M72,168 C110,140 160,152 200,169 C240,148 290,154 330,166" fill="none" stroke="#4f8a3c" stroke-width="2.4"/>
  <path d="M200,170 L173.7,150.8" stroke="#4f8a3c" stroke-width="1.6"/><ellipse cx="173.7" cy="144.4" rx="11.200000000000001" ry="6.4" transform="rotate(-60 173.7 144.4)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/><path d="M200,170 L200.0,135.6" stroke="#4f8a3c" stroke-width="1.6"/><ellipse cx="200.0" cy="129.2" rx="11.200000000000001" ry="6.4" transform="rotate(0 200.0 129.2)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/><path d="M200,170 L226.3,150.8" stroke="#4f8a3c" stroke-width="1.6"/><ellipse cx="226.3" cy="144.4" rx="11.200000000000001" ry="6.4" transform="rotate(60 226.3 144.4)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/><path d="M200,170 q-4.0,8.8 -8.0,17.6" stroke="#b08a5a" stroke-width="1.3" fill="none"/><path d="M200,170 q0.0,11.2 0.0,22.4" stroke="#b08a5a" stroke-width="1.3" fill="none"/><path d="M200,170 q4.0,8.0 8.0,16.0" stroke="#b08a5a" stroke-width="1.3" fill="none"/><path d="M200,170 q-1.6,6.4 -3.2,12.8" stroke="#b08a5a" stroke-width="1.3" fill="none"/>
  <ellipse cx="334" cy="158" rx="8" ry="4" transform="rotate(-30 334 158)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/>
  <text class="ap-l" x="22" y="236">parent plant</text><path class="ld" d="M60,226 L68,184"/>
  <text class="ap-l" x="96" y="64">runner</text><text class="ap-s" x="96" y="77">side stem grows along</text><text class="ap-s" x="96" y="90">the soil surface</text><path class="ld" d="M130,94 L140,150"/>
  <text class="ap-l" x="236" y="64">new plant</text><text class="ap-s" x="236" y="77">roots and shoots grow</text><text class="ap-s" x="236" y="90">where the runner</text><text class="ap-s" x="236" y="103">touches the soil</text><path class="ld" d="M250,106 L214,140"/>
  <text class="ap-s" x="160" y="230">runner withers → separate plant:</text><text class="ap-s" x="160" y="243">a clone of the parent</text>
  <path d="M460,200 L460,90" stroke="#4f8a3c" stroke-width="2.6"/><ellipse cx="446" cy="90" rx="13" ry="6.5" transform="rotate(30 446 90)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/>
    <ellipse cx="474" cy="112" rx="13" ry="6.5" transform="rotate(-30 474 112)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/><ellipse cx="446" cy="134" rx="13" ry="6.5" transform="rotate(30 446 134)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/><ellipse cx="474" cy="156" rx="13" ry="6.5" transform="rotate(-30 474 156)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/>
  <path d="M442,196 L478,188" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="ap-s" x="482" y="196">cut</text>
  <path d="M580,170 L580,60" stroke="#4f8a3c" stroke-width="2.6"/><ellipse cx="566" cy="60" rx="13" ry="6.5" transform="rotate(30 566 60)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/><ellipse cx="594" cy="82" rx="13" ry="6.5" transform="rotate(-30 594 82)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/><ellipse cx="566" cy="104" rx="13" ry="6.5" transform="rotate(30 566 104)" fill="#8cc06c" stroke="#4f8a3c" stroke-width="1.1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Carlito, Calibri, Lato, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="c2d2-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="c2d2-arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="c2d2-arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c3fa8"/></marker></defs><text x="20.0" y="28.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Oxygen transfer</text><text x="120.0" y="100.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">Mg</text><text x="170.0" y="100.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="225.0" y="100.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">CuO</text><text x="290.0" y="100.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">→</text><text x="355.0" y="100.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">MgO</text><text x="410.0" y="100.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="455.0" y="100.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">Cu</text><path d="M120,78 C120,48 355,48 355,76" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#c2d2-arrR)"/><text x="237.5" y="50.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" font-style="normal">Mg gains oxygen: oxidised</text><path d="M225,108 C225,138 455,138 455,110" stroke="#4c3fa8" stroke-width="1.5" fill="none" marker-end="url(#c2d2-arrP)"/><text x="340.0" y="148.0" font-size="12" fill="#4c3fa8" text-anchor="middle" font-weight="bold" font-style="normal">CuO loses oxygen: reduced</text><text x="650.0" y="80.0" font-size="12" fill="#c0392b" text-anchor="end" font-weight="normal" font-style="normal"></text><text x="650.0" y="102.0" font-size="12" fill="#4c3fa8" text-anchor="end" font-weight="normal" font-style="normal"></text><text x="20.0" y="183.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Electron transfer (ionic equation for Zn + CuSO₄)</text><text x="120.0" y="255.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">Zn</text><text x="170.0" y="255.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="225.0" y="255.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">Cu²⁺</text><text x="290.0" y="255.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">→</text><text x="355.0" y="255.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">Zn²⁺</text><text x="410.0" y="255.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">+</text><text x="455.0" y="255.0" font-size="19" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">Cu</text><path d="M120,233 C120,203 355,203 355,231" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#c2d2-arrR)"/><text x="237.5" y="205.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" font-style="normal">Zn loses 2e⁻: oxidised</text><path d="M225,263 C225,293 455,293 455,265" stroke="#4c3fa8" stroke-width="1.5" fill="none" marker-end="url(#c2d2-arrP)"/><text x="340.0" y="303.0" font-size="12" fill="#4c3fa8" text-anchor="middle" font-weight="bold" font-style="normal">Cu²⁺ gains 2e⁻: reduced</text><text x="650.0" y="235.0" font-size="12" fill="#c0392b" text-anchor="end" font-weight="normal" font-style="normal"></text><text x="650.0" y="257.0" font-size="12" fill="#4c3fa8" text-anchor="end" font-weight="normal" font-style="normal"></text><text x="530.0" y="92.0" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal">Mg = reducing agent</text><text x="530.0" y="112.0" font-size="12.5" fill="#4c3fa8" text-anchor="start" font-weight="bold" font-style="normal">CuO = oxidising agent</text><text x="530.0" y="247.0" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal">Zn = reducing agent</text><text x="530.0" y="267.0" font-size="12.5" fill="#4c3fa8" text-anchor="start" font-weight="bold" font-style="normal">Cu²⁺ = oxidising agent</text><line x1="10.0" y1="168.0" x2="710.0" y2="168.0" stroke="#dfe5ea" stroke-width="1.2"/></svg>
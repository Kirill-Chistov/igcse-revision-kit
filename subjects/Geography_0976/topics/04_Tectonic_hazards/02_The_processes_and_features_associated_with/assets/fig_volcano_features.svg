<path d="M347 336 L349 92 L361 92 L363 336 Z" fill="#c0392b"/>
<path d="M360 250 Q432 222 478 148 L484 150 Q436 236 361 262 Z" fill="#c0392b"/>
<path d="M334 92 Q300 150 262 190 Q240 214 214 250 Q205 262 200 276 L210 278 Q220 262 232 248 Q262 214 280 190 Q312 150 342 96 Z" fill="#e0632f" stroke="#a3321c" stroke-width="0.8"/>
<g fill="#9aa4ad" stroke="#6b7a88" stroke-width="0.8"><circle cx="340" cy="52" r="20"/><circle cx="366" cy="42" r="24"/><circle cx="394" cy="50" r="18"/><circle cx="350" cy="26" r="18"/><circle cx="382" cy="20" r="16"/></g>
<g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
<text x="10" y="24" font-size="14" font-weight="700" text-anchor="start">ASH CLOUD</text>
<text x="10" y="40" font-size="12.5" fill="#33475b" text-anchor="start">fine ash and gas blasted</text>
<text x="10" y="55" font-size="12.5" fill="#33475b" text-anchor="start">out during an eruption</text>
<polyline points="150,20 320,40" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="92" font-size="14" font-weight="700" text-anchor="start">CRATER</text>
<text x="10" y="108" font-size="12.5" fill="#33475b" text-anchor="start">bowl-shaped hollow at the</text>
<text x="10" y="123" font-size="12.5" fill="#33475b" text-anchor="start">top of the vent</text>
<polyline points="118,88 340,90" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="160" font-size="14" font-weight="700" text-anchor="start">LAVA FLOW</text>
<text x="10" y="176" font-size="12.5" fill="#33475b" text-anchor="start">magma that has reached</text>
<text x="10" y="191" font-size="12.5" fill="#33475b" text-anchor="start">the surface</text>
<polyline points="120,156 250,200" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="232" font-size="14" font-weight="700" text-anchor="start">LAYERS OF ASH AND LAVA</text>
<text x="10" y="248" font-size="12.5" fill="#33475b" text-anchor="start">build up a strato-volcano</text>
<polyline points="190,244 250,262" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="332" font-size="14" font-weight="700" text-anchor="start">CRUST</text>
<text x="600" y="62" font-size="14" font-weight="700" text-anchor="start">MAIN VENT</text>
<text x="600" y="78" font-size="12.5" fill="#33475b" text-anchor="start">the channel through which</text>
<text x="600" y="93" font-size="12.5" fill="#33475b" text-anchor="start">magma rises to the surface</text>
<polyline points="594,58 420,58 362,130" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="600" y="140" font-size="14" font-weight="700" text-anchor="start">SECONDARY CONE</text>
<text x="600" y="156" font-size="12.5" fill="#33475b" text-anchor="start">smaller cone on the side of</text>
<text x="600" y="171" font-size="12.5" fill="#33475b" text-anchor="start">the volcano, built around a</text>
<text x="600" y="186" font-size="12.5" fill="#33475b" text-anchor="start">side (secondary) vent</text>
<polyline points="594,136 540,136 512,180" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="600" y="236" font-size="14" font-weight="700" text-anchor="start">MAGMA</text>
<text x="600" y="252" font-size="12.5" fill="#33475b" text-anchor="start">molten rock below the surface</text>
<polyline points="594,232 430,232 400,240" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="600" y="330" font-size="14" font-weight="700" text-anchor="start">MAGMA CHAMBER</text>
<text x="600" y="346" font-size="12.5" fill="#33475b" text-anchor="start">store of magma under</text>
<text x="600" y="361" font-size="12.5" fill="#33475b" text-anchor="start">the volcano</text>
<polyline points="594,326 520,326 470,352" fill="none" stroke="#16283c" stroke-width="1"/>
</g></svg>
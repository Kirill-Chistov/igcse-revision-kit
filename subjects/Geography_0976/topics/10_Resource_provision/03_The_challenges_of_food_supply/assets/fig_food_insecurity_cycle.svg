<text x="640" y="208" font-size="19" font-weight="700" fill="#16283c" text-anchor="middle">Low productivity</text>
<text x="640" y="231" font-size="15" font-weight="400" fill="#33475b" text-anchor="middle">less able to work, farm or learn</text>

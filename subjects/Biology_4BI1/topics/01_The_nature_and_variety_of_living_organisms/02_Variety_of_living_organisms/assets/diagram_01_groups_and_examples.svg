<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="Living organisms divide into eukaryotic organisms, whose cells have a nucleus (plants, animals, fungi, protoctists), and prokaryotic organisms with no nucleus (bacteria). Viruses are not living organisms. Each group lists the examples named in the specification." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vg1-h   { font-weight: 700; font-size: 15px; text-anchor: middle; }
    .vg1-hs  { font-size: 12px; text-anchor: middle; fill: #33475b; }
    .vg1-g   { font-weight: 700; font-size: 14.5px; text-anchor: middle; fill: #ffffff; }
    .vg1-e   { font-size: 12px; text-anchor: middle; fill: #16283c; }
    .vg1-ei  { font-size: 12px; text-anchor: middle; font-style: italic; fill: #16283c; }
    .vg1-en  { font-size: 11px; text-anchor: middle; fill: #6b7a88; }
    .vg1-ln  { stroke: #8fa3b8; stroke-width: 1.6; fill: none; }
  </style>

  <!-- root -->
  <rect x="190" y="4" width="240" height="34" rx="9" fill="#16283c"/>
  <text class="vg1-h" x="310" y="26" style="fill:#ffffff">LIVING ORGANISMS</text>

  <!-- level 2 -->
  <path class="vg1-ln" d="M310,38 V50 M190,50 H576 M190,50 V62 M576,50 V62"/>
  <rect x="4" y="62" width="498" height="40" rx="9" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="vg1-h" x="253" y="80" style="fill:#0b5f58">EUKARYOTIC</text>
  <text class="vg1-hs" x="253" y="96">cells contain a nucleus</text>
  <rect x="516" y="62" width="120" height="40" rx="9" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.6"/>
  <text class="vg1-h" x="576" y="80" style="fill:#4c3fa8">PROKARYOTIC</text>
  <text class="vg1-hs" x="576" y="96">no nucleus</text>

  <!-- viruses: outside living organisms -->
  <rect x="648" y="4" width="108" height="98" rx="9" fill="#fdeded" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="vg1-h" x="702" y="30" style="fill:#c0392b">NOT LIVING</text>
  <text class="vg1-hs" x="702" y="50">no cells;</text>
  <text class="vg1-hs" x="702" y="65">reproduce only</text>
  <text class="vg1-hs" x="702" y="80">inside living</text>
  <text class="vg1-hs" x="702" y="95">cells</text>

  <!-- level 3 connectors -->
  <path class="vg1-ln" d="M253,102 V112 M64,112 H442 M64,112 V124 M190,112 V124 M316,112 V124 M442,112 V124 M576,102 V124 M702,102 V124"/>

  <!-- group boxes: header strip + body -->
  <g stroke-width="1.6">
    <rect x="4"   y="124" width="120" height="164" rx="9" fill="#eaf7ef" stroke="#1e8449"/>
    <rect x="130" y="124" width="120" height="164" rx="9" fill="#eeedfb" stroke="#4c3fa8"/>
    <rect x="256" y="124" width="120" height="164" rx="9" fill="#fbf1e4" stroke="#a0621c"/>
    <rect x="382" y="124" width="120" height="164" rx="9" fill="#e7f3ef" stroke="#0f7b6c"/>
    <rect x="516" y="124" width="120" height="164" rx="9" fill="#f3effb" stroke="#6d3fa8"/>
    <rect x="642" y="124" width="114" height="164" rx="9" fill="#fdeded" stroke="#c0392b" stroke-dasharray="5 4"/>
  </g>
  <g>
    <rect x="4"   y="124" width="120" height="30" rx="9" fill="#1e8449"/>
    <rect x="130" y="124" width="120" height="30" rx="9" fill="#4c3fa8"/>
    <rect x="256" y="124" width="120" height="30" rx="9" fill="#a0621c"/>
    <rect x="382" y="124" width="120" height="30" rx="9" fill="#0f7b6c"/>
    <rect x="516" y="124" width="120" height="30" rx="9" fill="#6d3fa8"/>
    <rect x="642" y="124" width="114" height="30" rx="9" fill="#c0392b"/>
  </g>
  <text class="vg1-g" x="64"  y="144">PLANTS</text>
  <text class="vg1-g" x="190" y="144">ANIMALS</text>
  <text class="vg1-g" x="316" y="144">FUNGI</text>
  <text class="vg1-g" x="442" y="144">PROTOCTISTS</text>
  <text class="vg1-g" x="576" y="144">BACTERIA</text>
  <text class="vg1-g" x="699" y="144">VIRUSES</text>

  <!-- examples -->
  <text class="vg1-e"  x="64" y="176">maize</text>
  <text class="vg1-en" x="64" y="191">a cereal</text>
  <text class="vg1-e"  x="64" y="216">peas, beans</text>
  <text class="vg1-en" x="64" y="231">herbaceous legumes</text>

  <text class="vg1-e"  x="190" y="176">humans</text>
  <text class="vg1-en" x="190" y="191">mammal</text>
  <text class="vg1-e"  x="190" y="216">housefly, mosquito</text>
  <text class="vg1-en" x="190" y="231">insects</text>

  <text class="vg1-ei" x="316" y="176">Mucor</text>
  <text class="vg1-en" x="316" y="191">hyphae / mycelium</text>
  <text class="vg1-e"  x="316" y="216">yeast</text>
  <text class="vg1-en" x="316" y="231">single-celled</text>

  <text class="vg1-ei" x="442" y="176">Amoeba</text>
  <text class="vg1-en" x="442" y="191">animal-like</text>
  <text class="vg1-ei" x="442" y="216">Chlorella</text>
  <text class="vg1-en" x="442" y="231">plant-like</text>
  <text class="vg1-ei" x="442" y="256">Plasmodium</text>
  <text class="vg1-en" x="442" y="271">causes malaria</text>

  <text class="vg1-ei" x="576" y="176">Lactobacillus</text>
  <text class="vg1-ei" x="576" y="191">bulgaricus</text>
  <text class="vg1-en" x="576" y="206">rod; makes yoghurt</text>
  <text class="vg1-ei" x="576" y="236">Pneumococcus</text>
  <text class="vg1-en" x="576" y="251">spherical; causes</text>
  <text class="vg1-en" x="576" y="265">pneumonia</text>

  <text class="vg1-e"  x="699" y="176">tobacco mosaic</text>
  <text class="vg1-e"  x="699" y="191">virus</text>
  <text class="vg1-e"  x="699" y="221">influenza virus</text>
  <text class="vg1-e"  x="699" y="251">HIV</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 292" width="820" height="292" role="img" aria-label="Life cycle of stars: nebula, protostar, main-sequence star; Sun-like stars become red giants then white dwarfs; much more massive stars become red supergiants, supernovae, then neutron stars or black holes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/></marker>
</defs>

<g font-family="Carlito, Calibri, sans-serif">
<rect x="20" y="10" width="200" height="62" rx="8" fill="#eef4f8" stroke="#16283c" stroke-width="1.6"/>
<text x="120.0" y="30.0" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">Nebula</text>
<text x="120.0" y="47.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">cloud of dust and gas</text>
<text x="120.0" y="62.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">(mainly hydrogen)</text>
<rect x="20" y="104" width="200" height="62" rx="8" fill="#eef4f8" stroke="#16283c" stroke-width="1.6"/>
<text x="120.0" y="124.0" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">Protostar</text>
<text x="120.0" y="141.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">gravity pulls the cloud</text>
<text x="120.0" y="156.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">together; it heats up</text>
<rect x="20" y="198" width="200" height="78" rx="8" fill="#fff6d6" stroke="#b7791f" stroke-width="1.6"/>
<text x="120.0" y="218.5" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">Main-sequence star</text>
<text x="120.0" y="235.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">hydrogen nuclei fuse into</text>
<text x="120.0" y="250.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">helium; stable for billions</text>
<text x="120.0" y="265.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">of years</text>
<line x1="120.0" y1="74.0" x2="120.0" y2="101.0" stroke="#16283c" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="120.0" y1="168.0" x2="120.0" y2="195.0" stroke="#16283c" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="130.0" y="90.0" font-size="12" fill="#6b7a88" text-anchor="start" font-weight="400" font-style="italic">gravity</text>
<text x="130.0" y="184.0" font-size="12" fill="#6b7a88" text-anchor="start" font-weight="400" font-style="italic">fusion starts</text>
<text x="280.0" y="30.0" font-size="15" fill="#0f7b6c" text-anchor="start" font-weight="700">Stars of similar mass to the Sun</text>
<rect x="280" y="44" width="210" height="78" rx="8" fill="#fde3dc" stroke="#c0392b" stroke-width="1.6"/>
<text x="385.0" y="64.5" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Red giant</text>
<text x="385.0" y="81.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">hydrogen in the core runs out;</text>
<text x="385.0" y="96.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">star swells and its surface</text>
<text x="385.0" y="111.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">cools (looks red)</text>
<rect x="560" y="44" width="240" height="78" rx="8" fill="#f1f3f6" stroke="#6b7a88" stroke-width="1.6"/>
<text x="680.0" y="64.5" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">White dwarf</text>
<text x="680.0" y="81.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">outer layers drift away; the core</text>
<text x="680.0" y="96.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">is left: small, hot, very dense;</text>
<text x="680.0" y="111.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">it slowly cools and fades</text>
<line x1="492.0" y1="83.0" x2="557.0" y2="83.0" stroke="#16283c" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="280.0" y="170.0" font-size="15" fill="#4c3fa8" text-anchor="start" font-weight="700">Stars with a much larger mass than the Sun</text>
<rect x="280" y="184" width="150" height="78" rx="8" fill="#fde3dc" stroke="#c0392b" stroke-width="1.6"/>
<text x="355.0" y="204.5" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Red supergiant</text>
<text x="355.0" y="221.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">swells to an</text>
<text x="355.0" y="236.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">even larger</text>
<text x="355.0" y="251.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">size</text>
<rect x="460" y="184" width="150" height="78" rx="8" fill="#efeaff" stroke="#4c3fa8" stroke-width="1.6"/>
<text x="535.0" y="204.5" font-size="15" fill="#4c3fa8" text-anchor="middle" font-weight="700">Supernova</text>
<text x="535.0" y="221.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">core collapses;</text>
<text x="535.0" y="236.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">huge explosion</text>
<text x="535.0" y="251.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">throws out layers</text>
<rect x="645" y="172" width="155" height="50" rx="8" fill="#f1f3f6" stroke="#6b7a88" stroke-width="1.6"/>
<text x="722.5" y="193.5" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">Neutron star</text>
<text x="722.5" y="210.5" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400">extremely dense core</text>
<rect x="645" y="234" width="155" height="50" rx="8" fill="#16283c" stroke="#16283c" stroke-width="1.6"/>
<text x="722.5" y="255.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Black hole</text>
<text x="722.5" y="272.5" font-size="12" fill="#dfe6ee" text-anchor="middle" font-weight="400">not even light escapes</text>
<line x1="432.0" y1="223.0" x2="457.0" y2="223.0" stroke="#16283c" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="612.0" y1="215.0" x2="642.0" y2="199.0" stroke="#16283c" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="612.0" y1="231.0" x2="642.0" y2="256.0" stroke="#16283c" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M222 222 C 250 222, 250 83, 277 83" fill="none" stroke="#0f7b6c" stroke-width="2.2" marker-end="url(#aht)"/>
<path d="M222 250 C 250 250, 250 223, 277 223" fill="none" stroke="#4c3fa8" stroke-width="2.2" marker-end="url(#ahp)"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker></defs>
<rect x="10" y="10" width="330" height="54" rx="6" fill="#c0392b"/>
<text x="175.0" y="34" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">RURAL AREA — push factors</text>
<text x="175.0" y="54" font-size="14" fill="#ffffff" text-anchor="middle">reasons to leave</text>
<rect x="560" y="10" width="330" height="54" rx="6" fill="#0f7b6c"/>
<text x="725.0" y="34" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">CITY — pull factors</text>
<text x="725.0" y="54" font-size="14" fill="#ffffff" text-anchor="middle">reasons to move there</text>
<path d="M354,22 L520,22 L520,10 L546,37 L520,64 L520,52 L354,52 z" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.5"/>
<text x="438.0" y="34" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">rural-to-urban</text>
<text x="438.0" y="50" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">migration</text>
<rect x="10" y="78" width="330" height="62" rx="5" fill="#fdeded" stroke="#e6b0aa" stroke-width="1"/>
<rect x="560" y="78" width="330" height="62" rx="5" fill="#e7f3ef" stroke="#cfe4dd" stroke-width="1"/>
<text x="24" y="104" font-size="15" fill="#16283c">few schools or clinics</text>
<text x="24" y="124" font-size="15" fill="#16283c">no piped water or electricity</text>
<text x="574" y="104" font-size="15" fill="#16283c">better schools and hospitals</text>
<text x="574" y="124" font-size="15" fill="#16283c">water, electricity; family already there</text>
<rect x="378" y="95" width="144" height="28" rx="14" fill="#ffffff" stroke="#6b7a88" stroke-width="1.2"/>
<text x="450.0" y="114" font-size="14.5" font-weight="700" fill="#33475b" text-anchor="middle">Social</text>
<line x1="342" y1="109" x2="376" y2="109" stroke="#c3d0dc" stroke-width="1.2"/>
<line x1="524" y1="109" x2="558" y2="109" stroke="#c3d0dc" stroke-width="1.2"/>
<rect x="10" y="148" width="330" height="62" rx="5" fill="#fdeded" stroke="#e6b0aa" stroke-width="1"/>
<rect x="560" y="148" width="330" height="62" rx="5" fill="#e7f3ef" stroke="#cfe4dd" stroke-width="1"/>
<text x="24" y="174" font-size="15" fill="#16283c">low farm incomes; land shortage</text>
<text x="24" y="194" font-size="15" fill="#16283c">mechanisation cuts farm jobs</text>
<text x="574" y="174" font-size="15" fill="#16283c">more jobs, formal and informal</text>
<text x="574" y="194" font-size="15" fill="#16283c">higher wages; money to send home</text>
<rect x="378" y="165" width="144" height="28" rx="14" fill="#ffffff" stroke="#6b7a88" stroke-width="1.2"/>
<text x="450.0" y="184" font-size="14.5" font-weight="700" fill="#33475b" text-anchor="middle">Economic</text>
<line x1="342" y1="179" x2="376" y2="179" stroke="#c3d0dc" stroke-width="1.2"/>
<line x1="524" y1="179" x2="558" y2="179" stroke="#c3d0dc" stroke-width="1.2"/>
<rect x="10" y="218" width="330" height="62" rx="5" fill="#fdeded" stroke="#e6b0aa" stroke-width="1"/>
<rect x="560" y="218" width="330" height="62" rx="5" fill="#e7f3ef" stroke="#cfe4dd" stroke-width="1"/>
<text x="24" y="244" font-size="15" fill="#16283c">drought, desertification, soil</text>
<text x="24" y="264" font-size="15" fill="#16283c">erosion, floods — crops fail</text>
<text x="574" y="244" font-size="15" fill="#16283c">food and water more reliable</text>
<text x="574" y="264" font-size="15" fill="#16283c">less exposed to harvest failure</text>
<rect x="378" y="235" width="144" height="28" rx="14" fill="#ffffff" stroke="#6b7a88" stroke-width="1.2"/>
<text x="450.0" y="254" font-size="14.5" font-weight="700" fill="#33475b" text-anchor="middle">Environmental</text>
<line x1="342" y1="249" x2="376" y2="249" stroke="#c3d0dc" stroke-width="1.2"/>
<line x1="524" y1="249" x2="558" y2="249" stroke="#c3d0dc" stroke-width="1.2"/>
<rect x="10" y="288" width="330" height="62" rx="5" fill="#fdeded" stroke="#e6b0aa" stroke-width="1"/>
<rect x="560" y="288" width="330" height="62" rx="5" fill="#e7f3ef" stroke="#cfe4dd" stroke-width="1"/>
<text x="24" y="314" font-size="15" fill="#16283c">conflict and persecution; little</text>
<text x="24" y="334" font-size="15" fill="#16283c">government spending in rural areas</text>
<text x="574" y="314" font-size="15" fill="#16283c">safety; government services and</text>
<text x="574" y="334" font-size="15" fill="#16283c">investment concentrated in the city</text>
<rect x="378" y="305" width="144" height="28" rx="14" fill="#ffffff" stroke="#6b7a88" stroke-width="1.2"/>
<text x="450.0" y="324" font-size="14.5" font-weight="700" fill="#33475b" text-anchor="middle">Political</text>
<line x1="342" y1="319" x2="376" y2="319" stroke="#c3d0dc" stroke-width="1.2"/>
<line x1="524" y1="319" x2="558" y2="319" stroke="#c3d0dc" stroke-width="1.2"/>
<rect x="560" y="372" width="330" height="92" rx="6" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.6"/>
<text x="574" y="396" font-size="16" font-weight="700" fill="#0b5f54">+ Natural increase in the city</text>
<text x="574" y="418" font-size="15" fill="#16283c">migrants are mostly young adults → many births</text>
<text x="574" y="438" font-size="15" fill="#16283c">clean water, vaccination, health care</text>
<text x="574" y="456" font-size="15" fill="#16283c">→ death rate falls faster than birth rate</text>
<rect x="10" y="372" width="330" height="92" rx="6" fill="#f4f7f9" stroke="#dfe5ea" stroke-width="1"/>
<text x="24" y="396" font-size="15" font-weight="700" fill="#16283c">The pull is often only perceived</text>
<text x="24" y="418" font-size="15" fill="#33475b">Migrants expect jobs and homes, but</text>
<text x="24" y="438" font-size="15" fill="#33475b">many find no formal job and no</text>
<text x="24" y="456" font-size="15" fill="#33475b">formal housing (→ 7.2).</text>
<rect x="230" y="482" width="440" height="40" rx="6" fill="#16283c"/>
<text x="450.0" y="508" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">= RAPID URBAN GROWTH in LIC cities</text>
<line x1="725.0" y1="466" x2="665.0" y2="480" stroke="#0f7b6c" stroke-width="2" marker-end="url(#ar)"/>
<line x1="450.0" y1="368" x2="450.0" y2="480" stroke="#d99a17" stroke-width="2" marker-end="url(#ar2)"/>
<text x="458.0" y="418" font-size="14" fill="#33475b">migration</text>
</svg>
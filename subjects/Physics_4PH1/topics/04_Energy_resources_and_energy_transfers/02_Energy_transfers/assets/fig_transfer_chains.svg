<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312" role="img"
     aria-label="Energy transfer chains: falling ball, catapult, battery torch and a person climbing stairs">
  <defs>
    <marker id="p4tc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <!-- column headings -->
    <g font-size="13" font-weight="700" fill="#6b7a88" text-anchor="middle">
      <text x="220" y="24">Energy starts in</text>
      <text x="365" y="24">Transferred</text>
      <text x="510" y="24">Useful output</text>
      <text x="713" y="24">Wasted output</text>
    </g>

    <!-- row template: start box 140-300, arrow 304-426, useful box 430-590, wasted box 615-812 -->
    <!-- Row 1: ball falling (centre y 65) -->
    <text x="10" y="61" font-size="14" font-weight="700" fill="#16283c">Ball falling</text>
    <rect x="140" y="40" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="220" y="61" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Gravitational store</text>
    <text x="220" y="79" font-size="13" text-anchor="middle">of the ball</text>
    <line x1="304" y1="65" x2="424" y2="65" stroke="#4c3fa8" stroke-width="2" marker-end="url(#p4tc-arr)"/>
    <text x="365" y="58" font-size="13" font-weight="700" fill="#4c3fa8" text-anchor="middle">mechanically</text>
    <text x="365" y="82" font-size="12" fill="#6b7a88" text-anchor="middle">(weight does work)</text>
    <rect x="430" y="40" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="510" y="61" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Kinetic store</text>
    <text x="510" y="79" font-size="13" text-anchor="middle">of the ball</text>
    <text x="603" y="71" font-size="18" font-weight="700" fill="#6b7a88" text-anchor="middle">+</text>
    <rect x="615" y="40" width="197" height="50" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="713" y="61" font-size="12.5" text-anchor="middle">by heating (air resistance)</text>
    <text x="713" y="79" font-size="12.5" text-anchor="middle">→ thermal store of air and ball</text>

    <!-- Row 2: catapult (centre y 133) -->
    <text x="10" y="129" font-size="14" font-weight="700" fill="#16283c">Catapult</text>
    <text x="10" y="147" font-size="13">firing a stone</text>
    <rect x="140" y="108" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="220" y="129" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Elastic store</text>
    <text x="220" y="147" font-size="13" text-anchor="middle">of the stretched band</text>
    <line x1="304" y1="133" x2="424" y2="133" stroke="#4c3fa8" stroke-width="2" marker-end="url(#p4tc-arr)"/>
    <text x="365" y="126" font-size="13" font-weight="700" fill="#4c3fa8" text-anchor="middle">mechanically</text>
    <rect x="430" y="108" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="510" y="129" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Kinetic store</text>
    <text x="510" y="147" font-size="13" text-anchor="middle">of the stone</text>
    <text x="603" y="139" font-size="18" font-weight="700" fill="#6b7a88" text-anchor="middle">+</text>
    <rect x="615" y="108" width="197" height="50" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="713" y="129" font-size="12.5" text-anchor="middle">sound and heating</text>
    <text x="713" y="147" font-size="12.5" text-anchor="middle">→ thermal store of surroundings</text>

    <!-- Row 3: battery torch (centre y 201) -->
    <text x="10" y="205" font-size="14" font-weight="700" fill="#16283c">Battery torch</text>
    <rect x="140" y="176" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="220" y="197" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Chemical store</text>
    <text x="220" y="215" font-size="13" text-anchor="middle">of the battery</text>
    <line x1="304" y1="201" x2="424" y2="201" stroke="#4c3fa8" stroke-width="2" marker-end="url(#p4tc-arr)"/>
    <text x="365" y="194" font-size="13" font-weight="700" fill="#4c3fa8" text-anchor="middle">electrically</text>
    <text x="365" y="218" font-size="12" fill="#6b7a88" text-anchor="middle">(current in the lamp)</text>
    <rect x="430" y="176" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="510" y="197" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Light</text>
    <text x="510" y="215" font-size="13" text-anchor="middle">(by radiation)</text>
    <text x="603" y="207" font-size="18" font-weight="700" fill="#6b7a88" text-anchor="middle">+</text>
    <rect x="615" y="176" width="197" height="50" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="713" y="197" font-size="12.5" text-anchor="middle">by heating</text>
    <text x="713" y="215" font-size="12.5" text-anchor="middle">→ thermal store of lamp and air</text>

    <!-- Row 4: climbing stairs (centre y 269) -->
    <text x="10" y="265" font-size="14" font-weight="700" fill="#16283c">Climbing stairs</text>
    <rect x="140" y="244" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="220" y="265" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Chemical store</text>
    <text x="220" y="283" font-size="13" text-anchor="middle">of the person (food)</text>
    <line x1="304" y1="269" x2="424" y2="269" stroke="#4c3fa8" stroke-width="2" marker-end="url(#p4tc-arr)"/>
    <text x="365" y="262" font-size="13" font-weight="700" fill="#4c3fa8" text-anchor="middle">mechanically</text>
    <text x="365" y="286" font-size="12" fill="#6b7a88" text-anchor="middle">(muscles do work)</text>
    <rect x="430" y="244" width="160" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="510" y="265" font-size="14" font-weight="700" fill="#0b5f54" text-anchor="middle">Gravitational store</text>
    <text x="510" y="283" font-size="13" text-anchor="middle">of the person</text>
    <text x="603" y="275" font-size="18" font-weight="700" fill="#6b7a88" text-anchor="middle">+</text>
    <rect x="615" y="244" width="197" height="50" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="713" y="265" font-size="12.5" text-anchor="middle">by heating</text>
    <text x="713" y="283" font-size="12.5" text-anchor="middle">→ thermal store of body and air</text>
  </g>
</svg>

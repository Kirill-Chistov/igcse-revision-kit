<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" width="760" height="192" role="img" aria-label="A bacterial cell: cell wall, cell membrane, cytoplasm, a circular chromosome of DNA lying free in the cytoplasm, and small rings of DNA called plasmids; there is no nucleus. Lactobacillus bulgaricus is rod-shaped; Pneumococcus is spherical." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vg4-p   { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #6d3fa8; }
    .vg4-lb  { font-size: 12.5px; font-weight: 700; }
    .vg4-ls  { font-size: 12.5px; fill: #33475b; }
    .vg4-no  { font-size: 12.5px; font-weight: 700; fill: #c0392b; }
    .vg4-it  { font-size: 12.5px; font-style: italic; font-weight: 700; }
    .vg4-ldr { fill: none; stroke: #8fa3b8; stroke-width: 1.2; }
  </style>

  <text class="vg4-p" x="6" y="16">A BACTERIAL CELL</text>
  <!-- wall and membrane -->
  <rect x="150" y="40" width="330" height="140" rx="70" fill="#e5dcf5" stroke="#6d3fa8" stroke-width="6"/>
  <rect x="160" y="50" width="310" height="120" rx="60" fill="#f7f4fc" stroke="#4c3fa8" stroke-width="1.6"/>
  <!-- circular chromosome: one long closed loop -->
  <path d="M250,110 C240,80 290,72 300,92 C308,70 350,70 352,96 C372,78 408,92 392,114 C414,128 392,150 370,138 C364,160 322,158 318,138 C300,156 262,150 270,128 C244,134 232,118 250,110 Z"
        fill="none" stroke="#16283c" stroke-width="2"/>
  <!-- plasmids -->
  <g fill="none" stroke="#c0392b" stroke-width="2">
    <circle cx="210" cy="92" r="9"/>
    <circle cx="428" cy="134" r="9"/>
    <circle cx="436" cy="84" r="7"/>
  </g>

  <!-- labels left -->
  <path class="vg4-ldr" d="M64,48 L158,58"/>
  <text class="vg4-lb" x="6" y="50">cell wall</text>
  <path class="vg4-ldr" d="M98,92 L162,98"/>
  <text class="vg4-lb" x="6" y="94">cell membrane</text>
  <path class="vg4-ldr" d="M70,142 L200,138"/>
  <text class="vg4-lb" x="6" y="144">cytoplasm</text>
  <text class="vg4-no" x="6" y="172">no nucleus</text>
  <text class="vg4-ls" x="6" y="186">DNA free in the cytoplasm</text>

  <!-- labels right -->
  <path class="vg4-ldr" d="M392,32 L338,78"/>
  <text class="vg4-lb" x="396" y="24">circular chromosome</text>
  <text class="vg4-ls" x="396" y="38">one loop of DNA</text>
  <path class="vg4-ldr" d="M488,160 L437,138"/>
  <text class="vg4-lb" x="492" y="160">plasmids</text>
  <text class="vg4-ls" x="492" y="174">small extra</text>
  <text class="vg4-ls" x="492" y="188">rings of DNA</text>

  <line x1="574" y1="30" x2="574" y2="188" stroke="#dfe5ea" stroke-width="1.5"/>

  <!-- shapes -->
  <text class="vg4-p" x="588" y="16">TWO SHAPES</text>
  <g fill="#e5dcf5" stroke="#6d3fa8" stroke-width="2">
    <rect x="592" y="30" width="56" height="18" rx="9"/>
    <rect x="658" y="38" width="56" height="18" rx="9" transform="rotate(-18 686 47)"/>
    <rect x="612" y="56" width="56" height="18" rx="9" transform="rotate(10 640 65)"/>
  </g>
  <text class="vg4-it" x="588" y="98">Lactobacillus bulgaricus</text>
  <text class="vg4-ls" x="588" y="112">rod-shaped; makes yoghurt</text>
  <g fill="#e5dcf5" stroke="#6d3fa8" stroke-width="2">
    <circle cx="604" cy="134" r="10"/><circle cx="624" cy="134" r="10"/>
    <circle cx="662" cy="138" r="10"/><circle cx="680" cy="146" r="10"/>
    <circle cx="716" cy="132" r="10"/><circle cx="736" cy="134" r="10"/>
  </g>
  <text class="vg4-it" x="588" y="172">Pneumococcus</text>
  <text class="vg4-ls" x="588" y="186">spherical; causes pneumonia</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Automatic repeat query with acknowledgements and timeout">
<defs><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="aqg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="aqr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="130" y="4" width="120" height="30" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="190.0" y="23.9" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">Sender</text>
<rect x="440" y="4" width="120" height="30" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="500.0" y="23.9" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">Receiver</text>
<line x1="190" y1="34" x2="190" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="500" y1="34" x2="500" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="192" y1="64" x2="498" y2="64" stroke="#0f766e" stroke-width="2.2" marker-end="url(#aq)"/>
<text x="345.0" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1e293b">data block 1</text>
<text x="510" y="68" font-size="12" fill="#475569">checked: no error</text>
<line x1="498" y1="94" x2="192" y2="94" stroke="#15803d" stroke-width="2.2" marker-end="url(#aqg)"/>
<text x="345.0" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">positive acknowledgement (ACK)</text>
<line x1="192" y1="136" x2="498" y2="136" stroke="#0f766e" stroke-width="2.2" marker-end="url(#aq)"/>
<text x="345.0" y="130" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1e293b">data block 2</text>
<text x="510" y="140" font-size="12" fill="#b91c1c">checked: error detected</text>
<line x1="498" y1="166" x2="192" y2="166" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#aqr)"/>
<text x="345.0" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">negative acknowledgement (NAK)</text>
<line x1="192" y1="196" x2="498" y2="196" stroke="#0f766e" stroke-width="2.2" marker-end="url(#aq)"/>
<text x="345.0" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1e293b">data block 2 re-sent</text>
<line x1="192" y1="240" x2="382" y2="240" stroke="#0f766e" stroke-width="2.2"/>
<text x="300" y="234" text-anchor="middle" font-size="12.5" fill="#1e293b">data block 3</text>
<path d="M378 232 L394 248 M394 232 L378 248" stroke="#b91c1c" stroke-width="3"/>
<text x="402" y="245" font-size="12" fill="#b91c1c">lost</text>
<rect x="178" y="240" width="10" height="52" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="170" y="256" text-anchor="end" font-size="12" font-weight="700" fill="#92400e">timeout:</text>
<text x="170" y="272" text-anchor="end" font-size="12" fill="#92400e">no acknowledgement</text>
<text x="170" y="288" text-anchor="end" font-size="12" fill="#92400e">within the set time</text>
<line x1="192" y1="302" x2="498" y2="302" stroke="#0f766e" stroke-width="2.2" marker-end="url(#aq)"/>
<text x="345.0" y="296" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1e293b">data block 3 re-sent automatically</text>
</svg>

<text x="640.0" y="187.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">greater pressure</text>
<text x="612.0" y="252.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="700">pressure difference, surface to B:  p = h × ρ × g</text>

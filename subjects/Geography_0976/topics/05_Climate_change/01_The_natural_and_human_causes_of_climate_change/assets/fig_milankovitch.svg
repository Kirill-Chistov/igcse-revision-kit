<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 352" width="820" height="352" role="img" aria-label="Milankovitch cycles: eccentricity, axial tilt and precession">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker></defs>
<g font-family="Carlito, Calibri, sans-serif">
<rect x="10" y="8" width="254" height="286" rx="8" fill="#ffffff" stroke="#dfe5ea" stroke-width="1.4"/>
<rect x="283" y="8" width="254" height="286" rx="8" fill="#ffffff" stroke="#dfe5ea" stroke-width="1.4"/>
<rect x="556" y="8" width="254" height="286" rx="8" fill="#ffffff" stroke="#dfe5ea" stroke-width="1.4"/>
<ellipse cx="137" cy="92" rx="66" ry="64" fill="none" stroke="#6b7a88" stroke-width="1.6" stroke-dasharray="5 4"/>
<ellipse cx="137" cy="92" rx="100" ry="48" fill="none" stroke="#16283c" stroke-width="2"/>
<circle cx="84.4" cy="92" r="15" fill="#f4c542" stroke="#d99a17" stroke-width="2"/>
<text x="84.4" y="96" font-size="11" font-weight="700" fill="#16283c" text-anchor="middle">Sun</text>
<circle cx="237" cy="92" r="9" fill="#dbe8f5" stroke="#2e6da4" stroke-width="1.8"/>
<text x="137" y="176" font-size="11.5" fill="#6b7a88" text-anchor="middle" xml:space="preserve">- - nearly circular      <tspan fill="#16283c">━ more elliptical</tspan></text>
<text x="137" y="194" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Eccentricity</text>
<text x="137" y="214" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">shape of the orbit</text>
<text x="137" y="231.5" font-size="13" font-weight="700" fill="#0b5f54" text-anchor="middle">cycle ≈ 100 000 years</text>
<text x="137" y="249.5" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">More elliptical → bigger difference</text>
<text x="137" y="267.0" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">in the Sun’s energy reaching Earth</text>
<text x="137" y="284.5" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">during the year</text>
<line x1="310" y1="92" x2="510" y2="92" stroke="#6b7a88" stroke-width="1.2"/>
<text x="510" y="108" font-size="10.5" fill="#6b7a88" text-anchor="end">orbit plane</text>
<line x1="410" y1="14" x2="410" y2="170" stroke="#6b7a88" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="410" cy="92" r="34" fill="#dbe8f5" stroke="#2e6da4" stroke-width="1.8"/>
<line x1="391.6" y1="165.7" x2="428.4" y2="18.3" stroke="#2e6da4" stroke-width="2.4"/>
<line x1="369.7" y1="156.5" x2="450.3" y2="27.5" stroke="#c0392b" stroke-width="2.4"/>
<text x="454" y="34" font-size="12.5" font-weight="700" fill="#c0392b">more tilt 24.5°</text>
<text x="402" y="32" font-size="12.5" font-weight="700" fill="#2e6da4" text-anchor="end">less tilt 22.1°</text>
<text x="510" y="170" font-size="10.5" fill="#6b7a88" text-anchor="end">(angles exaggerated)</text>
<text x="410" y="194" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Axial tilt (obliquity)</text>
<text x="410" y="214" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">tilt varies 22.1°–24.5° (now ≈ 23.4°)</text>
<text x="410" y="231.5" font-size="13" font-weight="700" fill="#0b5f54" text-anchor="middle">cycle ≈ 41 000 years</text>
<text x="410" y="249.5" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">More tilt → hotter summers</text>
<text x="410" y="267.0" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">and colder winters</text>
<circle cx="683" cy="102" r="34" fill="#dbe8f5" stroke="#2e6da4" stroke-width="1.8"/>
<line x1="653.6" y1="169.9" x2="712.4" y2="34.1" stroke="#16283c" stroke-width="2.4"/>
<line x1="683" y1="20" x2="683" y2="162" stroke="#6b7a88" stroke-width="1.2" stroke-dasharray="4 3"/>
<ellipse cx="683" cy="34.1" rx="29.4" ry="9" fill="none" stroke="#4c3fa8" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M 657.6 40.1 q 6 5 16 7" fill="none" stroke="#4c3fa8" stroke-width="2" marker-end="url(#m)"/>
<text x="720.4" y="30.1" font-size="11.5" fill="#4c3fa8">axis traces</text>
<text x="720.4" y="44.1" font-size="11.5" fill="#4c3fa8">a circle</text>
<text x="683" y="194" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Precession</text>
<text x="683" y="214" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">wobble of the axis, like a spinning top</text>
<text x="683" y="231.5" font-size="13" font-weight="700" fill="#0b5f54" text-anchor="middle">cycle ≈ 26 000 years</text>
<text x="683" y="249.5" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">Changes which hemisphere has</text>
<text x="683" y="267.0" font-size="12.5" font-weight="400" fill="#33475b" text-anchor="middle">summer when Earth is closest to the Sun</text>
<rect x="10" y="302" width="800" height="44" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
<text x="410" y="320" font-size="13" fill="#16283c" text-anchor="middle"><tspan font-weight="700">Together</tspan> they change how much sunlight reaches Earth, and where and when → <tspan font-weight="700">glacial and interglacial periods</tspan>.</text>
<text x="410" y="338" font-size="12.5" fill="#0b5f54" text-anchor="middle">They act over tens of thousands of years, so they cannot explain the rapid warming since 1850.</text>
</g></svg>
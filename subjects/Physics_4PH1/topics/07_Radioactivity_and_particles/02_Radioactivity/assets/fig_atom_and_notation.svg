<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ===== Panel 1: the atom ===== -->
  <text x="170" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">1 · A carbon-14 atom (not to scale)</text>
  <circle cx="150" cy="148" r="58" fill="none" stroke="#9fb3c3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="150" cy="148" r="102" fill="none" stroke="#9fb3c3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- nucleus: 6 protons (red) + 8 neutrons (grey) -->
  <g stroke="#16283c" stroke-width="1">
    <circle cx="141" cy="139" r="7" fill="#c0392b"/>
    <circle cx="155" cy="137" r="7" fill="#9aa5ae"/>
    <circle cx="165" cy="146" r="7" fill="#c0392b"/>
    <circle cx="136" cy="152" r="7" fill="#9aa5ae"/>
    <circle cx="149" cy="150" r="7" fill="#c0392b"/>
    <circle cx="162" cy="159" r="7" fill="#9aa5ae"/>
    <circle cx="146" cy="163" r="7" fill="#9aa5ae"/>
    <circle cx="133" cy="165" r="7" fill="#c0392b"/>
    <circle cx="148" cy="126" r="7" fill="#9aa5ae"/>
    <circle cx="134" cy="128" r="7" fill="#c0392b"/>
    <circle cx="160" cy="125" r="7" fill="#9aa5ae"/>
    <circle cx="170" cy="134" r="7" fill="#9aa5ae"/>
    <circle cx="125" cy="143" r="7" fill="#9aa5ae"/>
    <circle cx="158" cy="170" r="7" fill="#c0392b"/>
  </g>
  <!-- electrons: 2 inner, 4 outer -->
  <g fill="#1f6fb2" stroke="#16283c" stroke-width="1">
    <circle cx="92" cy="148" r="5"/>
    <circle cx="208" cy="148" r="5"/>
    <circle cx="150" cy="46" r="5"/>
    <circle cx="150" cy="250" r="5"/>
    <circle cx="48" cy="148" r="5"/>
    <circle cx="252" cy="148" r="5"/>
  </g>
  <!-- labels -->
  <line x1="172" y1="160" x2="270" y2="206" stroke="#16283c" stroke-width="1.2"/>
  <text x="272" y="206" font-size="12.5" font-weight="700" fill="#16283c">nucleus</text>
  <text x="272" y="221" font-size="11.5" fill="#33475b">tiny; almost all</text>
  <text x="272" y="235" font-size="11.5" fill="#33475b">the mass</text>
  <line x1="208" y1="143" x2="262" y2="84" stroke="#16283c" stroke-width="1.2"/>
  <text x="264" y="80" font-size="12.5" font-weight="700" fill="#1f6fb2">electron (−)</text>
  <text x="264" y="95" font-size="11.5" fill="#33475b">orbits the nucleus</text>
  <circle cx="20" cy="266" r="6" fill="#c0392b" stroke="#16283c"/>
  <text x="30" y="270" font-size="12" fill="#16283c">proton (+)</text>
  <circle cx="110" cy="266" r="6" fill="#9aa5ae" stroke="#16283c"/>
  <text x="120" y="270" font-size="12" fill="#16283c">neutron (0)</text>
  <circle cx="205" cy="266" r="5" fill="#1f6fb2" stroke="#16283c"/>
  <text x="215" y="270" font-size="12" fill="#16283c">electron (−)</text>

  <!-- ===== Panel 2: notation ===== -->
  <line x1="372" y1="10" x2="372" y2="270" stroke="#d5dde3" stroke-width="1.5"/>
  <text x="545" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">2 · Nuclide notation</text>
  <text x="455" y="104" font-size="26" font-weight="700" fill="#b5651d" text-anchor="end">14</text>
  <text x="455" y="150" font-size="26" font-weight="700" fill="#1f6fb2" text-anchor="end">6</text>
  <text x="460" y="138" font-size="52" font-weight="700" fill="#16283c">C</text>
  <line x1="422" y1="96" x2="398" y2="70" stroke="#b5651d" stroke-width="1.4"/>
  <text x="386" y="50" font-size="12.5" font-weight="700" fill="#b5651d">mass (nucleon) number A</text>
  <text x="386" y="64" font-size="11.5" fill="#33475b">= protons + neutrons</text>
  <line x1="430" y1="154" x2="408" y2="190" stroke="#1f6fb2" stroke-width="1.4"/>
  <text x="386" y="206" font-size="12.5" font-weight="700" fill="#1f6fb2">atomic (proton) number Z</text>
  <text x="386" y="220" font-size="11.5" fill="#33475b">= protons</text>
  <line x1="505" y1="120" x2="540" y2="120" stroke="#16283c" stroke-width="1.2"/>
  <text x="546" y="116" font-size="12.5" font-weight="700" fill="#16283c">chemical symbol</text>
  <text x="546" y="131" font-size="11.5" fill="#33475b">(fixed by Z)</text>
  <rect x="546" y="160" width="164" height="68" rx="5" fill="#eef2f5" stroke="#9fb3c3"/>
  <text x="628" y="180" font-size="12" font-weight="700" fill="#16283c" text-anchor="middle">carbon-14</text>
  <text x="628" y="197" font-size="11.5" fill="#33475b" text-anchor="middle">6 protons, 6 electrons</text>
  <text x="628" y="213" font-size="11.5" fill="#33475b" text-anchor="middle">14 − 6 = 8 neutrons</text>
  <text x="545" y="256" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">neutrons = A − Z</text>
</svg>

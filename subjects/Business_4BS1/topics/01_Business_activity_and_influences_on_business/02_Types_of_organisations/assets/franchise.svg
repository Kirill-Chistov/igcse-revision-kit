<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="fr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-size="12.5" fill="#33475b" text-anchor="middle">
    <rect x="10" y="30" width="220" height="130" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
    <text x="120" y="62" font-size="16" font-weight="700" fill="#16283c">Franchisor</text>
    <text x="120" y="86">owns the brand and the</text>
    <text x="120" y="102">way the business is run</text>

    <rect x="490" y="30" width="220" height="130" rx="8" fill="#ffffff" stroke="#16283c" stroke-width="1.5"/>
    <text x="600" y="62" font-size="16" font-weight="700" fill="#16283c">Franchisee</text>
    <text x="600" y="86">buys the right to trade</text>
    <text x="600" y="102">under the brand; invests</text>
    <text x="600" y="118">its own money, runs the</text>
    <text x="600" y="134">outlet, keeps the profit left</text>

    <text x="360" y="44">brand name, logo, products</text>
    <text x="360" y="60">training, support, advertising</text>
    <line x1="234" y1="72" x2="486" y2="72" stroke="#16283c" stroke-width="1.8" marker-end="url(#fr-arr)"/>

    <line x1="486" y1="118" x2="234" y2="118" stroke="#16283c" stroke-width="1.8" marker-end="url(#fr-arr)"/>
    <text x="360" y="138">initial fee</text>
    <text x="360" y="154">+ royalties (a % of sales)</text>
  </g>
</svg>

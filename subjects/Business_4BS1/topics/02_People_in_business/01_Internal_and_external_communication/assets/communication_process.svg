<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Carlito, Calibri, sans-serif">
<defs>
<marker id="cp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker>
<marker id="cp-arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker>
</defs>
<style>
.cp-box{fill:#e7f3ef;stroke:#0f7b6c;stroke-width:2}
.cp-bt{font-size:17px;font-weight:700;fill:#16283c;text-anchor:middle}
.cp-bs{font-size:12px;fill:#33475b;text-anchor:middle}
.cp-bar{fill:#fdeded;stroke:#c0392b;stroke-width:1.4}
.cp-bh{font-size:12.5px;font-weight:700;fill:#c0392b}
.cp-bl{font-size:12px;fill:#16283c}
</style>
<!-- feedback loop -->
<path d="M600,62 V30 H120 V58" fill="none" stroke="#0f7b6c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#cp-arr-t)"/>
<rect x="228" y="20" width="264" height="20" fill="#ffffff"/>
<text x="360" y="35" font-size="13" font-weight="700" fill="#0f7b6c" text-anchor="middle">Feedback: receiver confirms or replies</text>
<!-- stages -->
<rect class="cp-box" x="20" y="62" width="200" height="48" rx="6"/>
<text class="cp-bt" x="120" y="84">Sender</text>
<text class="cp-bs" x="120" y="101">creates the message</text>
<rect class="cp-box" x="260" y="62" width="200" height="48" rx="6"/>
<text class="cp-bt" x="360" y="84">Medium</text>
<text class="cp-bs" x="360" y="101">the method used to send it</text>
<rect class="cp-box" x="500" y="62" width="200" height="48" rx="6"/>
<text class="cp-bt" x="600" y="84">Receiver</text>
<text class="cp-bs" x="600" y="101">gets and interprets it</text>
<line x1="222" y1="86" x2="256" y2="86" stroke="#16283c" stroke-width="2" marker-end="url(#cp-arr)"/>
<line x1="462" y1="86" x2="496" y2="86" stroke="#16283c" stroke-width="2" marker-end="url(#cp-arr)"/>
<!-- barriers -->
<rect class="cp-bar" x="20" y="128" width="200" height="104" rx="5"/>
<text class="cp-bh" x="30" y="147">Barriers at the sender</text>
<text class="cp-bl" x="30" y="167">• jargon or technical language</text>
<text class="cp-bl" x="30" y="185">• message unclear, too long</text>
<text class="cp-bl" x="40" y="200">or incomplete</text>
<text class="cp-bl" x="30" y="218">• poor communication skills</text>
<rect class="cp-bar" x="260" y="128" width="200" height="104" rx="5"/>
<text class="cp-bh" x="270" y="147">Barriers in the medium</text>
<text class="cp-bl" x="270" y="167">• wrong method for the message</text>
<text class="cp-bl" x="270" y="185">• technical failure (e.g. no internet)</text>
<text class="cp-bl" x="270" y="203">• long chain of command: message</text>
<text class="cp-bl" x="280" y="218">distorted as it is passed on</text>
<rect class="cp-bar" x="500" y="128" width="200" height="104" rx="5"/>
<text class="cp-bh" x="510" y="147">Barriers at the receiver</text>
<text class="cp-bl" x="510" y="167">• not listening or distracted</text>
<text class="cp-bl" x="510" y="185">• information overload</text>
<text class="cp-bl" x="510" y="203">• language or cultural differences</text>
<text class="cp-bl" x="510" y="221">• distance, time zones, distrust</text>
<!-- no feedback -->
<rect class="cp-bar" x="20" y="248" width="680" height="34" rx="5"/>
<text class="cp-bl" x="360" y="270" text-anchor="middle"><tspan class="cp-bh">No feedback</tspan> (one-way communication): the sender never finds out that the message was misunderstood.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="Total internal reflection: an optical fibre with a ray zig-zagging along it; a 45 degree prism turning light through 90 degrees; a 45 degree prism turning light through 180 degrees">

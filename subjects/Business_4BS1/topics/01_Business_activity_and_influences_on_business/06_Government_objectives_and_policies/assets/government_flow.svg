  <g stroke="#16283c" stroke-width="1.7" fill="none">
    <line x1="202" y1="56" x2="287" y2="104" marker-end="url(#gf-arr)"/>
    <line x1="202" y1="184" x2="287" y2="136" marker-end="url(#gf-arr)"/>
    <line x1="365" y1="36" x2="365" y2="89" marker-end="url(#gf-arr)"/>
    <line x1="442" y1="120" x2="511" y2="120" marker-end="url(#gf-arr)"/>
  </g>
  <g font-size="12" fill="#16283c">
    <text x="214" y="40">income tax,</text>
    <text x="214" y="54">sales tax</text>
    <text x="214" y="208">tax on profits</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" role="img" aria-label="Why Vietnam is now a middle-income country" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="vn8-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" font-size="14" fill="#16283c">
    <!-- before -->
    <rect x="6" y="81" width="140" height="120" rx="8" fill="#eef2f5" stroke="#6b7a88" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="76" y="107" font-size="15" font-weight="700">Before 1986</text>
      <text x="76" y="131">one of the world's</text>
      <text x="76" y="150">poorest countries;</text>
      <text x="76" y="169">closed to global</text>
      <text x="76" y="188">trade</text>
    </g>

    <!-- Doi Moi -->
    <rect x="176" y="71" width="166" height="140" rx="8" fill="#0b5f54"/>
    <g text-anchor="middle" fill="#fff">
      <text x="259" y="97" font-size="15" font-weight="700">1 · Đổi Mới</text>
      <text x="259" y="116" font-size="15" font-weight="700">reforms, 1986</text>
      <text x="259" y="141">private business,</text>
      <text x="259" y="160">trade and foreign</text>
      <text x="259" y="179">investment allowed;</text>
      <text x="259" y="198">market-based farming</text>
    </g>

    <!-- three effects -->
    <g fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5">
      <rect x="372" y="6" width="330" height="78" rx="8"/>
      <rect x="372" y="102" width="330" height="78" rx="8"/>
      <rect x="372" y="198" width="330" height="78" rx="8"/>
    </g>
    <text x="386" y="28" font-size="15" font-weight="700" fill="#0b5f54">2 · Export manufacturing</text>
    <text x="386" y="50">factories (clothing, electronics, footwear) →</text>
    <text x="386" y="69">wage jobs, export income, taxes for services</text>
    <text x="386" y="124" font-size="15" font-weight="700" fill="#0b5f54">3 · More productive farming</text>
    <text x="386" y="146">better rice-farming methods → higher incomes</text>
    <text x="386" y="165">in rural areas, where many poorer people live</text>
    <text x="386" y="220" font-size="15" font-weight="700" fill="#0b5f54">4 · Better health, education, infrastructure</text>
    <text x="386" y="242">healthier, better-educated workers; electricity</text>
    <text x="386" y="261">for homes, schools, hospitals and factories</text>

    <!-- result -->
    <rect x="732" y="71" width="162" height="140" rx="8" fill="#16283c"/>
    <g text-anchor="middle" fill="#fff">
      <text x="813" y="99" font-size="16" font-weight="700">Vietnam today:</text>
      <text x="813" y="121" font-size="16" font-weight="700">an MIC</text>
      <text x="813" y="149" fill="#c3d0dc">extreme poverty</text>
      <text x="813" y="171" font-size="16" font-weight="700">14% → under 4%</text>
    </g>

    <!-- arrows -->
    <g stroke="#16283c" stroke-width="2" fill="none">
      <line x1="148" y1="141" x2="172" y2="141" marker-end="url(#vn8-a)"/>
      <path d="M344 115 C356 95 356 52 368 46" marker-end="url(#vn8-a)"/>
      <line x1="344" y1="141" x2="368" y2="141" marker-end="url(#vn8-a)"/>
      <path d="M344 167 C356 187 356 230 368 237" marker-end="url(#vn8-a)"/>
      <path d="M704 46 C716 52 716 95 728 113" marker-end="url(#vn8-a)"/>
      <line x1="704" y1="141" x2="728" y2="141" marker-end="url(#vn8-a)"/>
      <path d="M704 237 C716 230 716 187 728 169" marker-end="url(#vn8-a)"/>
    </g>

    <!-- not yet HIC -->
    <rect x="6" y="286" width="888" height="34" rx="7" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.3"/>
    <text x="20" y="308"><tspan font-weight="700" fill="#9a6a08">Why not yet an HIC:</tspan> needs higher productivity, better technology and more skilled workers; faces climate risk. Goal: HIC by 2045.</text>
  </g>
</svg>

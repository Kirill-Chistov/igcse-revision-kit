<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Inhalation: external intercostal muscles contract, moving the ribs up and out; the diaphragm contracts and flattens; the volume of the thorax increases, pressure falls below atmospheric and air is drawn in. Exhalation: intercostal muscles relax, ribs move down and in; the diaphragm relaxes and domes upwards; volume decreases, pressure rises and air is forced out.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vn-t { font-size: 12.5px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .vn-k { font-size: 12.5px; font-weight: 700; fill: #0b5f54; }
    .vn-s { font-size: 12px; fill: #33475b; }
  </style>
  <text class="vn-t" x="10" y="16">INHALATION</text><rect x="123" y="30" width="14" height="40" fill="#f6dada" stroke="#a93226" stroke-width="1.4"/><path d="M110,70 L38,150 L38,190" fill="none" stroke="#8a7a4a" stroke-width="4" stroke-linecap="round"/><path d="M150,70 L222,150 L222,190" fill="none" stroke="#8a7a4a" stroke-width="4" stroke-linecap="round"/><path d="M122,76 C90,80 52,130 52,182 L122,182 Z" fill="#fbe3e0" stroke="#c9776b" stroke-width="1.4"/><path d="M138,76 C170,80 208,130 208,182 L138,182 Z" fill="#fbe3e0" stroke="#c9776b" stroke-width="1.4"/><path d="M38,190 C90,186 170,186 222,190" fill="none" stroke="#a0624a" stroke-width="6" stroke-linecap="round"/><path d="M130,62 L130,30" stroke="#0f7b6c" stroke-width="0"/><path d="M160,22 L142,44" stroke="#0f7b6c" stroke-width="3"/><path d="M138,50 l2,-11 l8,6z" fill="#0f7b6c"/><text class="vn-k" x="164" y="24">air in</text><path d="M32,140 L16,118" stroke="#0f7b6c" stroke-width="3"/><path d="M12,112 l2,11 l8,-6z" fill="#0f7b6c"/><path d="M228,140 L244,118" stroke="#0f7b6c" stroke-width="3"/><path d="M248,112 l-2,11 l-8,-6z" fill="#0f7b6c"/><path d="M130,196 L130,218" stroke="#0f7b6c" stroke-width="3"/><path d="M130,226 l-6,-10 h12z" fill="#0f7b6c"/>
  <text class="vn-t" x="390" y="16">EXHALATION</text><rect x="503" y="30" width="14" height="40" fill="#f6dada" stroke="#a93226" stroke-width="1.4"/><path d="M490,70 L432,160 L432,190" fill="none" stroke="#8a7a4a" stroke-width="4" stroke-linecap="round"/><path d="M530,70 L588,160 L588,190" fill="none" stroke="#8a7a4a" stroke-width="4" stroke-linecap="round"/><path d="M502,76 C470,80 446,130 446,150 L502,150 Z" fill="#fbe3e0" stroke="#c9776b" stroke-width="1.4"/><path d="M518,76 C550,80 574,130 574,150 L518,150 Z" fill="#fbe3e0" stroke="#c9776b" stroke-width="1.4"/><path d="M432,190 C470,140 550,140 588,190" fill="none" stroke="#a0624a" stroke-width="6" stroke-linecap="round"/><path d="M522,44 L540,22" stroke="#4c3fa8" stroke-width="3"/><path d="M544,16 l-2,11 l-8,-6z" fill="#4c3fa8"/><text class="vn-k" x="550" y="24" style="fill:#4c3fa8">air out</text><path d="M410,112 L424,132" stroke="#4c3fa8" stroke-width="3"/><path d="M428,138 l-1,-11 l-8,5z" fill="#4c3fa8"/><path d="M610,112 L596,132" stroke="#4c3fa8" stroke-width="3"/><path d="M592,138 l1,-11 l8,5z" fill="#4c3fa8"/><path d="M510,192 L510,170" stroke="#4c3fa8" stroke-width="3"/><path d="M510,162 l-6,10 h12z" fill="#4c3fa8"/>
  <line x1="380" y1="6" x2="380" y2="330" stroke="#dfe5ea" stroke-width="1.4"/>
  <text class="vn-s" x="14" y="246"><tspan font-weight="700" fill="#0f7b6c">1</tspan>  external intercostal muscles contract: ribs move up and out</text><text class="vn-s" x="14" y="262"><tspan font-weight="700" fill="#0f7b6c">2</tspan>  diaphragm contracts and flattens</text><text class="vn-s" x="14" y="278"><tspan font-weight="700" fill="#0f7b6c">3</tspan>  volume of thorax increases</text><text class="vn-s" x="14" y="294"><tspan font-weight="700" fill="#0f7b6c">4</tspan>  pressure falls below atmospheric</text><text class="vn-s" x="14" y="310"><tspan font-weight="700" fill="#0f7b6c">5</tspan>  air is drawn into the lungs</text>
  <text class="vn-s" x="394" y="246"><tspan font-weight="700" fill="#4c3fa8">1</tspan>  intercostal muscles relax: ribs move down and in</text><text class="vn-s" x="394" y="262"><tspan font-weight="700" fill="#4c3fa8">2</tspan>  diaphragm relaxes and domes up</text><text class="vn-s" x="394" y="278"><tspan font-weight="700" fill="#4c3fa8">3</tspan>  volume of thorax decreases</text><text class="vn-s" x="394" y="294"><tspan font-weight="700" fill="#4c3fa8">4</tspan>  pressure rises above atmospheric</text><text class="vn-s" x="394" y="310"><tspan font-weight="700" fill="#4c3fa8">5</tspan>  air is forced out of the lungs</text>
  <text class="vn-s" x="250" y="120">ribs</text><text class="vn-s" x="232" y="206" >diaphragm</text>
</svg>

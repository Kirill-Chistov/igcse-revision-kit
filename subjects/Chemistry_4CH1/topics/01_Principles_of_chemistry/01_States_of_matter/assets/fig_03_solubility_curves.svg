160</text><line x1="90.0" y1="30.0" x2="510.0" y2="30.0" stroke="#dfe5ea" stroke-width="0.8"/><text x="82.0" y="34.0" font-size="12" fill="#33475b" text-anchor="end" font-weight="normal" font-style="normal" >180</text><line x1="90.0" y1="280.0" x2="515.0" y2="280.0" stroke="#16283c" stroke-width="1.5"/><line x1="90.0" y1="280.0" x2="90.0" y2="25.0" stroke="#16283c" stroke-width="1.5"/><text x="300.0" y="318.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >temperature / °C</text><text x="28.0" y="155.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" transform="rotate(-90 28 155.0)">solubility / g per 100 g water</text><path d="M90.0,261.5 C98.8,259.8 125.0,255.2 142.5,251.0 C160.0,246.7 177.5,241.9 195.0,236.1 C212.5,230.3 230.0,223.9 247.5,216.4 C265.0,208.9 282.5,200.4 300.0,191.2 C317.5,182.1 335.0,171.9 352.5,161.2 C370.0,150.6 387.5,139.4 405.0,127.2 C422.5,115.1 440.0,102.0 457.5,88.3 C475.0,74.7 501.2,52.5 510.0,45.3" stroke="#0f7b6c" stroke-width="2.6" fill="none" /><path d="M90.0,230.4 C107.5,230.3 160.0,230.2 195.0,230.0 C230.0,229.8 265.0,229.5 300.0,229.2 C335.0,228.9 370.0,228.6 405.0,228.2 C440.0,227.8 492.5,226.9 510.0,226.7" stroke="#4c3fa8" stroke-width="2.6" fill="none" /><text x="436.5" y="57.8" font-size="13" fill="#0f7b6c" text-anchor="end" font-weight="bold" font-style="normal" >potassium nitrate</text><text x="499.5" y="218.7" font-size="13" fill="#4c3fa8" text-anchor="end" font-weight="bold" font-style="normal" >sodium chloride</text><line x1="405.0" y1="280.0" x2="405.0" y2="127.2" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="405.0" y1="127.2" x2="90.0" y2="127.2" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="195.0" y1="280.0" x2="195.0" y2="236.1" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="195.0" y1="236.1" x2="90.0" y2="236.1" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="405.0" cy="127.2" r="4.0" fill="#c0392b" /><circle cx="195.0" cy="236.1" r="4.0" fill="#c0392b" /><text x="540.0" y="60.0" font-size="14" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal" >Reading the curve</text><text x="540.0" y="84.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >Any point on the curve is a</text><text x="540.0" y="101.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >saturated solution.</text><text x="540.0" y="126.0" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal" >KNO₃ at 60 °C: 110 g / 100 g</text><text x="540.0" y="143.0" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal" >KNO₃ at 20 °C: 32 g / 100 g</text><text x="540.0" y="168.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >Cool a saturated solution in</text><text x="540.0" y="185.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >100 g water from 60 °C to 20 °C:</text><text x="540.0" y="202.0" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal" >110 − 32 = 78 g crystallises.</text><text x="540.0" y="227.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >Below the curve: unsaturated.</text><text x="540.0" y="244.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >Steep curve: solubility changes</text><text x="540.0" y="261.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >a lot with temperature.</text></svg>

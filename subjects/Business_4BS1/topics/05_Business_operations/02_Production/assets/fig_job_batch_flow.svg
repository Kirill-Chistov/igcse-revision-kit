<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
    <g id="gearish">
      <circle r="13" fill="#fdf6e5" stroke="#d99a17" stroke-width="2"/>
      <path d="M-6,-3 A7,7 0 1 1 -3,6" fill="none" stroke="#a5720c" stroke-width="2"/>
      <path d="M-9,-6 L-6,-3 L-2,-6" fill="none" stroke="#a5720c" stroke-width="2"/>
    </g>
  </defs>

  <!-- lane backgrounds -->
  <rect x="4" y="6" width="712" height="92" rx="6" fill="#f8fafb" stroke="#dfe5ea"/>
  <rect x="4" y="106" width="712" height="100" rx="6" fill="#f8fafb" stroke="#dfe5ea"/>
  <rect x="4" y="214" width="712" height="94" rx="6" fill="#f8fafb" stroke="#dfe5ea"/>

  <!-- lane labels -->
  <text x="18" y="46" font-size="17" font-weight="700" fill="#16283c">Job</text>
  <text x="18" y="64" font-size="12.5" fill="#33475b">one-off, made to order</text>
  <text x="18" y="150" font-size="17" font-weight="700" fill="#16283c">Batch</text>
  <text x="18" y="168" font-size="12.5" fill="#33475b">groups of identical items</text>
  <text x="18" y="256" font-size="17" font-weight="700" fill="#16283c">Flow</text>
  <text x="18" y="274" font-size="12.5" fill="#33475b">continuous production line</text>

  <!-- JOB lane -->
  <rect x="190" y="24" width="38" height="46" rx="3" fill="#ffffff" stroke="#33475b" stroke-width="1.5"/>
  <line x1="197" y1="36" x2="221" y2="36" stroke="#6b7a88" stroke-width="1.5"/>
  <line x1="197" y1="44" x2="221" y2="44" stroke="#6b7a88" stroke-width="1.5"/>
  <line x1="197" y1="52" x2="221" y2="52" stroke="#6b7a88" stroke-width="1.5"/>
  <line x1="197" y1="60" x2="213" y2="60" stroke="#6b7a88" stroke-width="1.5"/>
  <text x="209" y="88" text-anchor="middle" font-size="12.5" fill="#33475b">customer's order</text>
  <line x1="248" y1="47" x2="298" y2="47" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="306" y="25" width="190" height="44" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/>
  <text x="401" y="44" text-anchor="middle" font-size="13.5" fill="#0b5f54" font-weight="700">skilled workers make it</text>
  <text x="401" y="60" text-anchor="middle" font-size="12.5" fill="#0b5f54">to the customer's specification</text>
  <line x1="504" y1="47" x2="554" y2="47" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <polygon points="590,25 596,40 612,41 600,51 604,67 590,58 576,67 580,51 568,41 584,40" fill="#16283c"/>
  <text x="590" y="88" text-anchor="middle" font-size="12.5" fill="#33475b">one unique product</text>

  <!-- BATCH lane -->
  <g fill="#16283c">
    <rect x="184" y="128" width="16" height="16"/><rect x="206" y="128" width="16" height="16"/><rect x="228" y="128" width="16" height="16"/><rect x="250" y="128" width="16" height="16"/><rect x="272" y="128" width="16" height="16"/>
  </g>
  <text x="236" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#16283c">Batch A</text>
  <use href="#gearish" x="326" y="136"/>
  <text x="326" y="166" text-anchor="middle" font-size="11.5" fill="#a5720c">change-over:</text>
  <text x="326" y="180" text-anchor="middle" font-size="11.5" fill="#a5720c">machines reset</text>
  <text x="326" y="194" text-anchor="middle" font-size="11.5" fill="#a5720c">(down time)</text>
  <g fill="#6b7a88">
    <circle cx="380" cy="136" r="8"/><circle cx="402" cy="136" r="8"/><circle cx="424" cy="136" r="8"/><circle cx="446" cy="136" r="8"/><circle cx="468" cy="136" r="8"/>
  </g>
  <text x="424" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#16283c">Batch B</text>
  <use href="#gearish" x="516" y="136"/>
  <text x="516" y="166" text-anchor="middle" font-size="11.5" fill="#a5720c">change-over</text>
  <g fill="#ffffff" stroke="#16283c" stroke-width="1.6">
    <polygon points="570,145 579,127 588,145"/><polygon points="592,145 601,127 610,145"/><polygon points="614,145 623,127 632,145"/><polygon points="636,145 645,127 654,145"/><polygon points="658,145 667,127 676,145"/>
  </g>
  <text x="623" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#16283c">Batch C</text>
  <line x1="292" y1="136" x2="308" y2="136" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="342" y1="136" x2="364" y2="136" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="480" y1="136" x2="498" y2="136" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="532" y1="136" x2="556" y2="136" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- FLOW lane -->
  <text x="270" y="232" text-anchor="middle" font-size="12" fill="#6b7a88">stage 1</text>
  <text x="432" y="232" text-anchor="middle" font-size="12" fill="#6b7a88">stage 2</text>
  <text x="581" y="232" text-anchor="middle" font-size="12" fill="#6b7a88">stage 3</text>
  <line x1="352" y1="222" x2="352" y2="266" stroke="#9aa7b3" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="512" y1="222" x2="512" y2="266" stroke="#9aa7b3" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="190" y="266" width="460" height="10" rx="5" fill="#dfe5ea" stroke="#33475b" stroke-width="1.3"/>
  <g fill="#ffffff" stroke="#33475b" stroke-width="1.2">
    <circle cx="200" cy="284" r="5"/><circle cx="320" cy="284" r="5"/><circle cx="440" cy="284" r="5"/><circle cx="560" cy="284" r="5"/><circle cx="640" cy="284" r="5"/>
  </g>
  <g fill="#16283c">
    <rect x="200" y="248" width="16" height="16"/><rect x="232" y="248" width="16" height="16"/><rect x="264" y="248" width="16" height="16"/><rect x="296" y="248" width="16" height="16"/><rect x="328" y="248" width="16" height="16"/><rect x="360" y="248" width="16" height="16"/><rect x="392" y="248" width="16" height="16"/><rect x="424" y="248" width="16" height="16"/><rect x="456" y="248" width="16" height="16"/><rect x="488" y="248" width="16" height="16"/><rect x="520" y="248" width="16" height="16"/><rect x="552" y="248" width="16" height="16"/><rect x="584" y="248" width="16" height="16"/><rect x="616" y="248" width="16" height="16"/>
  </g>
  <line x1="656" y1="256" x2="706" y2="256" stroke="#33475b" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="420" y="302" text-anchor="middle" font-size="12.5" fill="#33475b">identical products move non-stop from one stage to the next</text>
</svg>

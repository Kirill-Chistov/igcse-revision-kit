<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Automated greenhouse: temperature sensor, ADC, microprocessor compares with stored range, actuators switch heater or open window, temperature changes and the loop repeats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="cl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <style>
    .cl-t{font-size:16px;font-weight:700;fill:#1e293b;text-anchor:middle}
    .cl-s{font-size:13px;fill:#334155;text-anchor:middle}
    .cl-n{font-size:13px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .cl-l{font-size:12px;fill:#475569;text-anchor:middle;font-style:italic}
    .cl-line{stroke:#1e293b;stroke-width:2;fill:none}
  </style>

  <!-- 1 sensor -->
  <rect x="10" y="45" width="170" height="90" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="32" cy="67" r="12" fill="#0f766e"/><text class="cl-n" x="32" y="72">1</text>
  <text class="cl-t" x="105" y="72">Sensor</text>
  <text class="cl-s" x="95" y="97">temperature sensor</text>
  <text class="cl-s" x="95" y="115">takes readings continuously</text>

  <!-- 2 ADC -->
  <rect x="210" y="45" width="130" height="90" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="232" cy="67" r="12" fill="#475569"/><text class="cl-n" x="232" y="72">2</text>
  <text class="cl-t" x="285" y="72">ADC</text>
  <text class="cl-s" x="275" y="97">converts analogue</text>
  <text class="cl-s" x="275" y="115">reading to digital</text>

  <!-- 3 microprocessor -->
  <rect x="370" y="20" width="215" height="140" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
  <circle cx="392" cy="42" r="12" fill="#4c3fa8"/><text class="cl-n" x="392" y="47">3</text>
  <text class="cl-t" x="487" y="47">Microprocessor</text>
  <text class="cl-s" x="477" y="72">compares reading with the</text>
  <text class="cl-s" x="477" y="90">stored range, e.g. 20–25 °C</text>
  <text class="cl-s" x="477" y="118">outside range → sends signal</text>
  <text class="cl-s" x="477" y="136">inside range → no action</text>

  <!-- 4 actuators -->
  <rect x="615" y="45" width="195" height="90" rx="8" fill="#fdf3e1" stroke="#b45309" stroke-width="2"/>
  <circle cx="637" cy="67" r="12" fill="#b45309"/><text class="cl-n" x="637" y="72">4</text>
  <text class="cl-t" x="722" y="72">Actuators</text>
  <text class="cl-s" x="712" y="97">too cold: heater on</text>
  <text class="cl-s" x="712" y="115">too hot: motor opens window</text>

  <!-- 5 process -->
  <rect x="210" y="215" width="375" height="60" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="232" cy="245" r="12" fill="#1e293b"/><text class="cl-n" x="232" y="250">5</text>
  <text class="cl-t" x="405" y="240">Greenhouse temperature changes</text>
  <text class="cl-s" x="405" y="261">sensor takes the next reading: the loop repeats continuously</text>

  <!-- arrows -->
  <line class="cl-line" x1="180" y1="90" x2="207" y2="90" marker-end="url(#cl-a)"/>
  <line class="cl-line" x1="340" y1="90" x2="367" y2="90" marker-end="url(#cl-a)"/>
  <line class="cl-line" x1="585" y1="90" x2="612" y2="90" marker-end="url(#cl-a)"/>
  <polyline class="cl-line" points="712,135 712,245 588,245" marker-end="url(#cl-a)"/>
  <polyline class="cl-line" points="210,245 95,245 95,138" marker-end="url(#cl-a)"/>
  <text class="cl-l" x="152" y="238">feedback</text>
</svg>

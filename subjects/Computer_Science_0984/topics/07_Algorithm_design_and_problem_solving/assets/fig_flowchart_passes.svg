<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 734" width="420" height="734" role="img"
     aria-label="Flowchart: input 30 marks, count the marks of 50 or more, output the count" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fcp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" font-size="19" fill="#16283c" text-anchor="middle">
    <!-- flow lines -->
    <g stroke="#16283c" stroke-width="2" fill="none" marker-end="url(#fcp-arr)">
      <path d="M210 48 V68"/>
      <path d="M210 126 V148"/>
      <path d="M210 194 V212"/>
      <path d="M210 258 V276"/>
      <path d="M210 358 V380"/>
      <path d="M210 424 V452"/>
      <path d="M310 318 H395 V440 H212"/>
      <path d="M210 496 V514"/>
      <path d="M100 556 H25 V138 H208"/>
      <path d="M210 596 V618"/>
      <path d="M210 664 V684"/>
    </g>
    <!-- shapes -->
    <g fill="#ffffff" stroke="#16283c" stroke-width="2">
      <rect x="150" y="8" width="120" height="40" rx="20"/>
      <rect x="80" y="70" width="260" height="56"/>
      <path d="M100 150 H340 L320 194 H80 Z"/>
      <path d="M100 214 H340 L320 258 H80 Z"/>
      <path d="M210 278 L310 318 L210 358 L110 318 Z"/>
      <rect x="66" y="382" width="288" height="42"/>
      <rect x="80" y="454" width="260" height="42"/>
      <path d="M210 516 L320 556 L210 596 L100 556 Z"/>
      <path d="M78 620 H362 L342 664 H58 Z"/>
      <rect x="150" y="686" width="120" height="40" rx="20"/>
    </g>
    <!-- text -->
    <text x="210" y="35">START</text>
    <text x="210" y="93">PassCount ← 0</text>
    <text x="210" y="117">Student ← 0</text>
    <text x="210" y="179">OUTPUT "Enter mark"</text>
    <text x="210" y="243">INPUT Mark</text>
    <text x="210" y="324">Mark &gt;= 50?</text>
    <text x="210" y="410">PassCount ← PassCount + 1</text>
    <text x="210" y="482">Student ← Student + 1</text>
    <text x="210" y="562">Student &lt; 30?</text>
    <text x="210" y="649" font-size="18">OUTPUT PassCount, " passed"</text>
    <text x="210" y="713">STOP</text>
    <!-- branch labels -->
    <g font-size="16" font-weight="700" fill="#0b5f54">
      <text x="236" y="376">Yes</text>
      <text x="336" y="310">No</text>
      <text x="62" y="548">Yes</text>
      <text x="232" y="614">No</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 276" width="820" height="276" role="img" aria-label="Bubble sort of 5, 1, 4, 2, 8: the comparisons in pass 1, then the list after each pass" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Carlito, Calibri, sans-serif" font-size="17" fill="#16283c">
    <text x="16" y="22" font-weight="700" font-size="17">Pass 1 — compare each adjacent pair</text>
    <rect x="16" y="36" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="36" y="59" text-anchor="middle" font-weight="700">5</text>
    <rect x="60" y="36" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="80" y="59" text-anchor="middle" font-weight="700">1</text>
    <rect x="104" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="124" y="59" text-anchor="middle">4</text>
    <rect x="148" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="168" y="59" text-anchor="middle">2</text>
    <rect x="192" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="212" y="59" text-anchor="middle">8</text>
    <text x="250" y="59" font-size="16">5 &gt; 1 → swap</text>
    <rect x="16" y="84" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="36" y="107" text-anchor="middle">1</text>
    <rect x="60" y="84" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="80" y="107" text-anchor="middle" font-weight="700">5</text>
    <rect x="104" y="84" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="124" y="107" text-anchor="middle" font-weight="700">4</text>
    <rect x="148" y="84" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="168" y="107" text-anchor="middle">2</text>
    <rect x="192" y="84" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="212" y="107" text-anchor="middle">8</text>
    <text x="250" y="107" font-size="16">5 &gt; 4 → swap</text>
    <rect x="16" y="132" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="36" y="155" text-anchor="middle">1</text>
    <rect x="60" y="132" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="80" y="155" text-anchor="middle">4</text>
    <rect x="104" y="132" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="124" y="155" text-anchor="middle" font-weight="700">5</text>
    <rect x="148" y="132" width="40" height="34" rx="3" fill="#fdf6e5" stroke="#d99a17" stroke-width="2.2"/><text x="168" y="155" text-anchor="middle" font-weight="700">2</text>
    <rect x="192" y="132" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="212" y="155" text-anchor="middle">8</text>
    <text x="250" y="155" font-size="16">5 &gt; 2 → swap</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" width="760" height="342" role="img" aria-label="Industrial fermenter: a steel vessel with a motor-driven stirrer with paddles, a water jacket with cooling water in and out, a sterile nutrient inlet, sterile air bubbled in through a sparger at the base, temperature and pH probes, an acid or alkali inlet, a waste gas outlet and a product outlet at the bottom." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .fm-l { font-size: 12.5px; font-weight: 700; }
    .fm-s { font-size: 12px; fill: #33475b; }
  </style>
  <defs>
    <marker id="fm-in" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker>
    <marker id="fm-out" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a88"/></marker>
    <marker id="fm-w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fa8"/></marker>
  </defs>
  <!-- water jacket (outer) -->
  <path d="M282,82 L282,280 Q282,320 322,320 L438,320 Q478,320 478,280 L478,82 Z" fill="#dcecf7" stroke="#33475b" stroke-width="2"/>
  <!-- vessel (inner) -->
  <path d="M298,76 L298,276 Q298,304 326,304 L434,304 Q462,304 462,276 L462,76 Z" fill="#ffffff" stroke="#33475b" stroke-width="2"/>
  <path d="M300,108 L300,276 Q300,302 326,302 L434,302 Q460,302 460,276 L460,108 Z" fill="#f6ecc8"/>
  <line x1="300" y1="108" x2="460" y2="108" stroke="#c9a94f" stroke-width="1.2"/>
  <rect x="292" y="68" width="176" height="10" rx="2" fill="#8fa3b8" stroke="#33475b" stroke-width="1.4"/>
  <!-- bubbles -->
  <g fill="none" stroke="#8fa3b8" stroke-width="1"><circle cx="340" cy="270" r="3"/><circle cx="360" cy="248" r="3"/><circle cx="406" cy="262" r="3"/><circle cx="424" cy="236" r="3"/><circle cx="336" cy="200" r="3"/><circle cx="432" cy="182" r="3"/><circle cx="350" cy="138" r="3"/><circle cx="414" cy="126" r="3"/><circle cx="396" cy="176" r="3"/></g>
  <!-- motor and stirrer -->
  <rect x="352" y="22" width="56" height="30" rx="4" fill="#33475b"/>
  <line x1="380" y1="52" x2="380" y2="278" stroke="#33475b" stroke-width="4"/>
  <g fill="#6b7a88" stroke="#33475b" stroke-width="1"><rect x="344" y="150" width="72" height="8" rx="2"/><rect x="344" y="220" width="72" height="8" rx="2"/></g>
  <!-- sparger -->
  <path d="M200,292 L380,292" stroke="#0f7b6c" stroke-width="4"/>
  <rect x="332" y="287" width="96" height="9" rx="4" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
  <g fill="#0f7b6c"><circle cx="344" cy="291.5" r="1.4"/><circle cx="360" cy="291.5" r="1.4"/><circle cx="376" cy="291.5" r="1.4"/><circle cx="392" cy="291.5" r="1.4"/><circle cx="408" cy="291.5" r="1.4"/></g>
  <!-- nutrient inlet -->
  <path d="M200,46 L320,46 L320,70" fill="none" stroke="#0f7b6c" stroke-width="4" marker-end="url(#fm-in)"/>
  <!-- gas outlet -->
  <path d="M440,68 L440,46 L552,46" fill="none" stroke="#6b7a88" stroke-width="4" marker-end="url(#fm-out)"/>
  <!-- cooling water -->
  <path d="M478,100 L552,100" fill="none" stroke="#6b9fd4" stroke-width="4" marker-end="url(#fm-w)"/>
  <path d="M552,284 L480,284" fill="none" stroke="#6b9fd4" stroke-width="4" marker-end="url(#fm-w)"/>
  <!-- acid / alkali inlet -->
  <path d="M552,140 L462,140" fill="none" stroke="#0f7b6c" stroke-width="3" marker-end="url(#fm-in)"/>
  <!-- probes -->
  <line x1="200" y1="172" x2="336" y2="172" stroke="#33475b" stroke-width="3"/>
  <circle cx="338" cy="172" r="4" fill="#c0392b"/>
  <line x1="200" y1="210" x2="336" y2="210" stroke="#33475b" stroke-width="3"/>
  <circle cx="338" cy="210" r="4" fill="#4c3fa8"/>
  <!-- product outlet -->
  <path d="M380,320 L380,332" stroke="#33475b" stroke-width="5"/>
  <rect x="370" y="324" width="20" height="6" fill="#33475b"/>
  <!-- labels left -->
  <text class="fm-l" x="194" y="50" text-anchor="end">nutrients in (sterile)</text>
  <text class="fm-l" x="194" y="176" text-anchor="end">temperature probe</text>
  <text class="fm-l" x="194" y="214" text-anchor="end">pH probe</text>
  <text class="fm-l" x="194" y="290" text-anchor="end">sterile air in</text>
  <text class="fm-s" x="194" y="305" text-anchor="end">bubbled through a sparger</text>
  <!-- labels right -->
  <text class="fm-l" x="414" y="34">motor</text>
  <text class="fm-l" x="558" y="50">waste gases out</text>
  <text class="fm-l" x="558" y="104">cooling water out</text>
  <text class="fm-l" x="558" y="144">acid or alkali in</text>
  <line x1="470" y1="196" x2="554" y2="196" stroke="#6b7a88" stroke-width="1"/>
  <text class="fm-l" x="558" y="200">water jacket</text>
  <line x1="416" y1="224" x2="554" y2="240" stroke="#6b7a88" stroke-width="1"/>
  <text class="fm-l" x="558" y="244">stirrer (paddles)</text>
  <text class="fm-l" x="558" y="288">cooling water in</text>
  <text class="fm-l" x="398" y="334">product out</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="SSL: the browser requests a secure connection, asks the server to identify itself, receives and checks the SSL certificate, tells the server to begin, and encrypted transfer starts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="ast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="asts" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .ssl-box{fill:#334155}
    .ssl-h{font-size:14px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .ssl-m{font-size:13px;fill:#1e293b;text-anchor:middle}
    .ssl-n{font-size:11px;font-weight:700;fill:#ffffff;text-anchor:middle}
  </style>
  <rect class="ssl-box" x="30" y="8" width="150" height="30" rx="4"/><text class="ssl-h" x="105" y="28">Web browser</text>
  <rect class="ssl-box" x="460" y="8" width="150" height="30" rx="4"/><text class="ssl-h" x="535" y="28">Web server</text>
  <line x1="105" y1="38" x2="105" y2="292" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="535" y1="38" x2="535" y2="292" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>

  <g stroke="#334155" stroke-width="1.8">
    <line x1="107" y1="70" x2="531" y2="70" marker-end="url(#as)"/>
    <line x1="107" y1="108" x2="531" y2="108" marker-end="url(#as)"/>
    <line x1="533" y1="146" x2="109" y2="146" marker-end="url(#as)"/>
    <line x1="107" y1="214" x2="531" y2="214" marker-end="url(#as)"/>
    <line x1="533" y1="252" x2="109" y2="252" marker-end="url(#as)"/>
  </g>
  <g fill="#0f766e">
    <circle cx="130" cy="58" r="8"/><circle cx="130" cy="96" r="8"/><circle cx="510" cy="134" r="8"/>
    <circle cx="130" cy="202" r="8"/><circle cx="510" cy="240" r="8"/>
  </g>
  <text class="ssl-n" x="130" y="62">1</text><text class="ssl-n" x="130" y="100">2</text><text class="ssl-n" x="510" y="138">3</text>
  <text class="ssl-n" x="130" y="206">5</text><text class="ssl-n" x="510" y="244">6</text>
  <text class="ssl-m" x="320" y="62">requests a connection to the SSL-secured website</text>
  <text class="ssl-m" x="320" y="100">asks the web server to identify itself</text>
  <text class="ssl-m" x="320" y="138">sends a copy of its SSL certificate</text>
  <text class="ssl-m" x="320" y="206">certificate valid: message to begin communication</text>
  <text class="ssl-m" x="320" y="244">acknowledges — encrypted two-way data transfer begins</text>

  <rect x="40" y="160" width="290" height="28" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <circle cx="56" cy="174" r="8" fill="#0f766e"/><text class="ssl-n" x="56" y="178">4</text>
  <text x="70" y="179" font-size="13" fill="#134e4a">browser checks the certificate is authentic</text>

  <line x1="109" y1="280" x2="531" y2="280" stroke="#0f766e" stroke-width="3" marker-start="url(#asts)" marker-end="url(#ast)"/>
  <rect x="245" y="270" width="150" height="20" fill="#ffffff"/>
  <text x="320" y="285" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">encrypted data</text>
</svg>

 stroke-width="1.5" marker-end="url(#c2g1-arr)"/><rect x="336.0" y="20.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="390.0" y="44.0" font-size="11.2" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">FILTER</text><text x="390.0" y="59.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">to remove</text><text x="390.0" y="74.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">the excess solid</text><line x1="446.0" y1="55.0" x2="460.0" y2="55.0" stroke="#16283c" stroke-width="1.5" marker-end="url(#c2g1-arr)"/><rect x="462.0" y="20.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="516.0" y="44.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">heat filtrate to the</text><text x="516.0" y="59.0" font-size="11.2" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">CRYSTALLISATION</text><text x="516.0" y="74.0" font-size="11.2" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">POINT</text><line x1="572.0" y1="55.0" x2="586.0" y2="55.0" stroke="#16283c" stroke-width="1.5" marker-end="url(#c2g1-arr)"/><rect x="588.0" y="20.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="642.0" y="44.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">cool; filter off</text><text x="642.0" y="59.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">crystals; rinse;</text><text x="642.0" y="74.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">dry between papers</text><rect x="8.0" y="110.0" width="190.0" height="82.0" rx="6" fill="#f4ecf7" stroke="#16283c" stroke-width="1.2"/><text x="22.0" y="134.0" font-size="20" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">B</text><text x="44.0" y="132.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Soluble salt</text><text x="44.0" y="148.0" font-size="11.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">from ACID + ALKALI</text><text x="44.0" y="163.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">(both soluble)</text><text x="44.0" y="178.0" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal">Paper 2 only</text><rect x="210.0" y="116.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="264.0" y="140.0" font-size="11.2" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">TITRATE with</text><text x="264.0" y="155.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">indicator to find</text><text x="264.0" y="170.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">the volumes</text><line x1="320.0" y1="151.0" x2="334.0" y2="151.0" stroke="#16283c" stroke-width="1.5" marker-end="url(#c2g1-arr)"/><rect x="336.0" y="116.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="390.0" y="140.0" font-size="11.2" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">REPEAT with same</text><text x="390.0" y="155.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">volumes, NO</text><text x="390.0" y="170.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">indicator</text><line x1="446.0" y1="151.0" x2="460.0" y2="151.0" stroke="#16283c" stroke-width="1.5" marker-end="url(#c2g1-arr)"/><rect x="462.0" y="116.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="516.0" y="140.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">heat to the</text><text x="516.0" y="155.0" font-size="11.2" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">CRYSTALLISATION</text><text x="516.0" y="170.0" font-size="11.2" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">POINT</text><line x1="572.0" y1="151.0" x2="586.0" y2="151.0" stroke="#16283c" stroke-width="1.5" marker-end="url(#c2g1-arr)"/><rect x="588.0" y="116.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="642.0" y="140.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">cool; filter off</text><text x="642.0" y="155.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">crystals;</text><text x="642.0" y="170.0" font-size="11.2" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">dry</text><rect x="8.0" y="206.0" width="190.0" height="82.0" rx="6" fill="#fdf2e9" stroke="#16283c" stroke-width="1.2"/><text x="22.0" y="230.0" font-size="20" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">C</text><text x="44.0" y="228.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Insoluble salt</text><text x="44.0" y="244.0" font-size="11.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">from TWO SOLUBLE</text><text x="44.0" y="259.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">reactants</text><text x="44.0" y="274.0" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal">Paper 2 only</text><rect x="210.0" y="212.0" width="108.0" height="70.0" rx="5" fill="white" stroke="#8795a1" stroke-width="1.1"/><text x="264.0" y="236.0" font-size="1
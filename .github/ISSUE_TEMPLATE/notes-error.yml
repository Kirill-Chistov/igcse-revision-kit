name: Notes error
description: Something in the notes is wrong, missing or unclear
labels: ["notes"]
body:
  - type: input
    id: where
    attributes: { label: Subject and topic PDF, placeholder: "Physics_4PH1 · 03_Waves.pdf, page 4" }
    validations: { required: true }
  - type: input
    id: point
    attributes: { label: Specification point, placeholder: "3.12" }
  - type: textarea
    id: what
    attributes: { label: What is wrong, and what should it say? }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Source, description: "Specification page, mark scheme (session + question) or textbook — no copyrighted text, a reference is enough" }

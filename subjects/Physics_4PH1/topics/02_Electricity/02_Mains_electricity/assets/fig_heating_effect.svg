<text x="330" y="22" font-size="11.5" text-anchor="middle" font-weight="700" fill="#9a4f12">collision: energy passes to the ion, which vibrates more</text>
<text x="18" y="178" font-size="11.5" font-weight="700" fill="#1f6fb2">← electrons drift from − to +</text>
<text x="458" y="178" font-size="11.5" text-anchor="end" font-weight="700" fill="#16283c">conventional current (+ to −) →</text>
<circle cx="490" cy="46" r="9" fill="#16283c" stroke="#16283c" stroke-width="1"/>
<text x="490" y="50" font-size="11.5" text-anchor="middle" font-weight="700" fill="white">1</text>
<text x="506" y="50" font-size="12" fill="#16283c">Free electrons drift through the</text>
<text x="506" y="65" font-size="12" fill="#16283c">metal: this is the current.</text>
<circle cx="490" cy="94" r="9" fill="#16283c" stroke="#16283c" stroke-width="1"/>
<text x="490" y="98" font-size="11.5" text-anchor="middle" font-weight="700" fill="white">2</text>
<text x="506" y="98" font-size="12" fill="#16283c">They collide with the vibrating</text>
<text x="506" y="113" font-size="12" fill="#16283c">metal ions, passing energy to them.</text>
<circle cx="490" cy="142" r="9" fill="#16283c" stroke="#16283c" stroke-width="1"/>
<text x="490" y="146" font-size="11.5" text-anchor="middle" font-weight="700" fill="white">3</text>
<text x="506" y="146" font-size="12" fill="#16283c">The ions vibrate more, so the</text>
<text x="506" y="161" font-size="12" fill="#16283c">temperature of the resistor rises.</text>

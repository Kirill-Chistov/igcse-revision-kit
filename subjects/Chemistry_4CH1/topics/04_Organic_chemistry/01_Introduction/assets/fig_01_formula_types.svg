<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" font-family="Carlito, Calibri, Lato, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="360.0" y="20.0" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">Butane written five ways</text>
<rect x="0" y="44" width="720" height="34" fill="#f3f8fb"/>
<text x="12.0" y="66.0" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Molecular formula</text>
<text x="200.0" y="66.0" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">C₄H₁₀</text>
<text x="400.0" y="66.0" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">actual number of atoms of each element in a molecule</text>
<rect x="0" y="78" width="720" height="34" fill="#ffffff"/>
<text x="12.0" y="100.0" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Empirical formula</text>
<text x="200.0" y="100.0" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">C₂H₅</text>
<text x="400.0" y="100.0" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">simplest whole-number ratio of atoms of each element</text>
<rect x="0" y="112" width="720" height="34" fill="#f3f8fb"/>
<text x="12.0" y="134.0" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">General formula</text>
<text x="200.0" y="134.0" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">CₙH₂ₙ₊₂</text>
<text x="400.0" y="134.0" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">fits every member of the homologous series (alkanes)</text>
<rect x="0" y="146" width="720" height="34" fill="#ffffff"/>
<text x="12.0" y="168.0" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Structural formula</text>
<text x="200.0" y="168.0" font-size="16" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">CH₃CH₂CH₂CH₃</text>
<text x="400.0" y="168.0" font-size="13" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">atom arrangement carbon by carbon; bonds not drawn</text>
<rect x="0" y="180" width="720" height="92" fill="#f3f8fb"/>
<text x="12.0" y="230.0" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Displayed formula</text>

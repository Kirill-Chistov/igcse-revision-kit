<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="Genetic diagrams for height in pea plants, T tall dominant, t short recessive. A: Tt crossed with Tt gives gametes T and t from each parent; offspring 1 TT, 2 Tt, 1 tt; 3 tall to 1 short; probability of short 1 in 4. B: Tt crossed with tt gives 1 Tt to 1 tt; 1 tall to 1 short; probability of short 1 in 2.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .gd-t { font-size: 12px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .gd-r { font-size: 11.5px; font-weight: 700; fill: #6b7a88; }
    .gd-v { font-size: 13px; }
    .gd-g { font-size: 13px; font-weight: 700; }
    .gd-s { font-size: 11px; fill: #33475b; }
  </style>
  <text class="gd-r" x="8" y="44">Parents’ phenotypes</text>
  <text class="gd-r" x="8" y="70">Parents’ genotypes</text>
  <text class="gd-r" x="8" y="104">Gametes</text>
  <text class="gd-r" x="8" y="175">Punnett square</text>
  <text class="gd-r" x="8" y="252">Offspring genotypes</text>
  <text class="gd-r" x="8" y="276">Offspring phenotypes</text>
  <text class="gd-r" x="8" y="300">Probability of short</text>

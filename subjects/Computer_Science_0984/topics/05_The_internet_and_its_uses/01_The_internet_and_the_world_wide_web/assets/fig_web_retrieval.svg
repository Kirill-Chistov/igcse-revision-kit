<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="The browser gets the web server's IP address from the DNS, then requests the page from the web server, which returns HTML that the browser renders" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="ahT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .webret-box{fill:#f1f5f9;stroke:#334155;stroke-width:1.5}
    .webret-t{font-size:15px;font-weight:700;fill:#1e293b;text-anchor:middle}
    .webret-s{font-size:12px;fill:#475569;text-anchor:middle}
    .webret-lab{font-size:13px;fill:#1e293b}
    .webret-n{font-size:12px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .webret-c{fill:#0f766e}
  </style>

  <!-- browser -->
  <rect class="webret-box" x="20" y="112" width="190" height="70" rx="6"/>
  <text class="webret-t" x="115" y="142">Web browser</text>
  <text class="webret-s" x="115" y="162">on the user's device</text>
  <circle class="webret-c" cx="30" cy="92" r="9"/><text class="webret-n" x="30" y="96">1</text>
  <text class="webret-lab" x="44" y="97">URL typed into the address bar</text>
  <circle class="webret-c" cx="30" cy="206" r="9"/><text class="webret-n" x="30" y="210">7</text>
  <text class="webret-lab" x="44" y="211">HTML rendered;</text>
  <text class="webret-lab" x="44" y="227">web page displayed</text>

  <!-- DNS -->
  <rect class="webret-box" x="390" y="16" width="150" height="58" rx="6"/>
  <text class="webret-t" x="465" y="41">DNS server</text>
  <text class="webret-s" x="465" y="59">domain names + IP addresses</text>
  <rect x="566" y="16" width="84" height="58" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text class="webret-s" x="608" y="41">another</text>
  <text class="webret-s" x="608" y="57">DNS server</text>
  <line x1="542" y1="38" x2="564" y2="38" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="564" y1="54" x2="542" y2="54" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <circle class="webret-c" cx="553" cy="92" r="9"/><text class="webret-n" x="553" y="96">3</text>
  <text class="webret-s" x="608" y="96">if not found</text>

  <!-- web server -->
  <rect class="webret-box" x="410" y="206" width="220" height="64" rx="6"/>
  <text class="webret-t" x="520" y="232">Web server</text>
  <text class="webret-s" x="520" y="252">stores the website's HTML files</text>

  <!-- browser <-> DNS -->
  <line x1="212" y1="120" x2="386" y2="30" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="388" y1="66" x2="214" y2="146" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ahT)"/>
  <circle class="webret-c" cx="222" cy="44" r="9"/><text class="webret-n" x="222" y="48">2</text>
  <text class="webret-lab" x="236" y="49">domain name</text>
  <circle class="webret-c" cx="312" cy="128" r="9"/><text class="webret-n" x="312" y="132">4</text>
  <text class="webret-lab" x="326" y="133" fill="#0f766e">IP address of web server</text>

  <!-- browser <-> web server -->
  <line x1="212" y1="168" x2="406" y2="218" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="406" y1="258" x2="214" y2="180" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ahT)"/>
  <circle class="webret-c" cx="276" cy="166" r="9"/><text class="webret-n" x="276" y="170">5</text>
  <text class="webret-lab" x="290" y="171">HTTP request (to the IP address)</text>
  <circle class="webret-c" cx="236" cy="262" r="9"/><text class="webret-n" x="236" y="266">6</text>
  <text class="webret-lab" x="250" y="267" fill="#0f766e">HTML files sent back</text>
</svg>

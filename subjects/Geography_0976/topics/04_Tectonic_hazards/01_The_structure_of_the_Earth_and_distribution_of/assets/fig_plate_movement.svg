<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-label="Cross-section showing mantle convection currents under two plates moving apart at a ridge, with ridge push at the ridge and slab pull where plate edges sink at trenches" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="pm-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
    <marker id="pm-k" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
  </defs>
  <!-- mantle and core -->
  <rect x="0" y="60" width="800" height="222" fill="#f3d2bd"/>
  <rect x="0" y="282" width="800" height="30" fill="#f0b45a"/>
  <!-- plates (lithosphere) -->
  <path d="M398 58 L120 72 Q86 74 70 96 L28 168 L46 178 L90 108 Q104 94 126 93 L398 82 Z" fill="#8a6a52" stroke="#16283c" stroke-width="1.2"/>
  <path d="M402 58 L680 72 Q714 74 730 96 L772 168 L754 178 L710 108 Q696 94 674 93 L402 82 Z" fill="#8a6a52" stroke="#16283c" stroke-width="1.2"/>
  <!-- ridge magma -->
  <path d="M393 84 L400 50 L407 84 Z" fill="#c0392b"/>
  <!-- convection cells -->
  <g fill="none" stroke="#c0392b" stroke-width="3">
    <path d="M378 236 Q392 170 372 112" marker-end="url(#pm-a)"/>
    <path d="M345 104 Q250 92 168 112" marker-end="url(#pm-a)"/>
    <path d="M150 132 Q132 196 162 242" marker-end="url(#pm-a)"/>
    <path d="M186 258 Q270 272 352 252" marker-end="url(#pm-a)"/>
    <path d="M422 236 Q408 170 428 112" marker-end="url(#pm-a)"/>
    <path d="M455 104 Q550 92 632 112" marker-end="url(#pm-a)"/>
    <path d="M650 132 Q668 196 638 242" marker-end="url(#pm-a)"/>
    <path d="M614 258 Q530 272 448 252" marker-end="url(#pm-a)"/>
  </g>
  <!-- plate movement arrows -->
  <g stroke="#16283c" stroke-width="3" fill="none">
    <line x1="330" y1="40" x2="250" y2="44" marker-end="url(#pm-k)"/>
    <line x1="470" y1="40" x2="550" y2="44" marker-end="url(#pm-k)"/>
  </g>
  <g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
    <text x="400" y="18" font-size="14" font-weight="700" text-anchor="middle">RIDGE PUSH</text>
    <text x="400" y="33" font-size="12.5" text-anchor="middle">new, hot plate stands high at the ridge and slides away from it</text>
    <text x="240" y="84" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PLATE</text>
    <text x="560" y="84" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PLATE</text>
    <text x="95" y="62" font-size="12.5" text-anchor="middle">trench</text>
    <text x="705" y="62" font-size="12.5" text-anchor="middle">trench</text>
    <text x="14" y="214" font-size="14" font-weight="700">SLAB PULL</text>
    <text x="14" y="230" font-size="12.5">old, cold, dense plate</text>
    <text x="14" y="245" font-size="12.5">sinks at the trench and</text>
    <text x="14" y="260" font-size="12.5">pulls the plate behind it</text>
    <line x1="40" y1="200" x2="40" y2="186" stroke="#16283c" stroke-width="1"/>
    <text x="245" y="170" font-size="13" text-anchor="middle">hot, less dense mantle</text>
    <text x="245" y="185" font-size="13" text-anchor="middle">rises in the middle,</text>
    <text x="245" y="200" font-size="13" text-anchor="middle">spreads under the plates,</text>
    <text x="245" y="215" font-size="13" text-anchor="middle">cools and sinks</text>
    <text x="560" y="178" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">CONVECTION</text>
    <text x="560" y="194" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">CURRENT</text>
    <text x="560" y="212" font-size="12.5" text-anchor="middle">drags the plates along</text>
    <text x="400" y="302" font-size="13.5" font-weight="700" text-anchor="middle">CORE — heats the base of the mantle</text>
    <text x="785" y="274" font-size="12.5" text-anchor="end">MANTLE</text>
  </g>
</svg>

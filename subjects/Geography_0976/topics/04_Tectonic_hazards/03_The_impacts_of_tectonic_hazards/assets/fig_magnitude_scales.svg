<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="The Mercalli intensity scale I to XII with grouped descriptions of effects, and the volcanic explosivity index 0 to 8 with volume of material erupted and eruption column height" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g font-family="Carlito, Calibri, sans-serif">
<text x="10" y="20" font-size="14.5" font-weight="700" fill="#16283c">MERCALLI SCALE (I–XII) — intensity: what people feel and the damage seen at a place</text>
<rect x="10" y="30" width="63" height="30" fill="#fdecb4"/>
<text x="41.5" y="50" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">I</text>
<rect x="75" y="30" width="63" height="30" fill="#f4d9a5"/>
<text x="106.5" y="50" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">II</text>
<rect x="140" y="30" width="63" height="30" fill="#eac797"/>
<text x="171.5" y="50" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">III</text>
<rect x="205" y="30" width="63" height="30" fill="#e1b488"/>
<text x="236.5" y="50" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">IV</text>
<rect x="270" y="30" width="63" height="30" fill="#d8a17a"/>
<text x="301.5" y="50" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">V</text>
<rect x="335" y="30" width="63" height="30" fill="#ce8e6b"/>
<text x="366.5" y="50" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">VI</text>
<rect x="400" y="30" width="63" height="30" fill="#c57c5d"/>
<text x="431.5" y="50" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">VII</text>
<rect x="465" y="30" width="63" height="30" fill="#bb694e"/>
<text x="496.5" y="50" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">VIII</text>
<rect x="530" y="30" width="63" height="30" fill="#b25640"/>
<text x="561.5" y="50" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">IX</text>
<rect x="595" y="30" width="63" height="30" fill="#a94331"/>
<text x="626.5" y="50" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">X</text>
<rect x="660" y="30" width="63" height="30" fill="#9f3123"/>
<text x="691.5" y="50" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">XI</text>
<rect x="725" y="30" width="63" height="30" fill="#961e14"/>
<text x="756.5" y="50" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">XII</text>
<path d="M10 66 L10 72 L203 72 L203 66" fill="none" stroke="#6b7a88" stroke-width="1"/>
<text x="106.5" y="88" font-size="12.3" fill="#33475b" text-anchor="middle">Felt by few people,</text>
<text x="106.5" y="103" font-size="12.3" fill="#33475b" text-anchor="middle">mostly indoors</text>
<path d="M205 66 L205 72 L333 72 L333 66" fill="none" stroke="#6b7a88" stroke-width="1"/>
<text x="269.0" y="88" font-size="12.3" fill="#33475b" text-anchor="middle">Felt by most; windows</text>
<text x="269.0" y="103" font-size="12.3" fill="#33475b" text-anchor="middle">rattle, dishes break</text>
<path d="M335 66 L335 72 L463 72 L463 66" fill="none" stroke="#6b7a88" stroke-width="1"/>
<text x="399.0" y="88" font-size="12.3" fill="#33475b" text-anchor="middle">Hard to stand; poorly</text>
<text x="399.0" y="103" font-size="12.3" fill="#33475b" text-anchor="middle">built buildings damaged</text>
<path d="M465 66 L465 72 L593 72 L593 66" fill="none" stroke="#6b7a88" stroke-width="1"/>
<text x="529.0" y="88" font-size="12.3" fill="#33475b" text-anchor="middle">Ordinary buildings badly</text>
<text x="529.0" y="103" font-size="12.3" fill="#33475b" text-anchor="middle">damaged; some collapse</text>
<path d="M595 66 L595 72 L788 72 L788 66" fill="none" stroke="#6b7a88" stroke-width="1"/>
<text x="691.5" y="88" font-size="12.3" fill="#33475b" text-anchor="middle">Most buildings and bridges</text>
<text x="691.5" y="103" font-size="12.3" fill="#33475b" text-anchor="middle">destroyed; ground cracks</text>
<text x="10" y="150" font-size="14.5" font-weight="700" fill="#16283c">VOLCANIC EXPLOSIVITY INDEX (VEI 0–8) — how explosive an eruption is</text>
<rect x="166" y="270" width="64" height="8" fill="#fdecb4" stroke="#16283c" stroke-width="0.6"/>
<text x="198" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">0</text>
<text x="198" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">&lt;0.00001</text>
<text x="198" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">&lt;0.1</text>
<rect x="236" y="259" width="64" height="19" fill="#f0d2a0" stroke="#16283c" stroke-width="0.6"/>
<text x="268" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">1</text>
<text x="268" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">0.00001</text>
<text x="268" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">0.1–1</text>
<rect x="306" y="248" width="64" height="30" fill="#e3b88c" stroke="#16283c" stroke-width="0.6"/>
<text x="338" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">2</text>
<text x="338" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">0.001</text>
<text x="338" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">1–5</text>
<rect x="376" y="237" width="64" height="41" fill="#d69f78" stroke="#16283c" stroke-width="0.6"/>
<text x="408" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">3</text>
<text x="408" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">0.01</text>
<text x="408" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">3–15</text>
<rect x="446" y="226" width="64" height="52" fill="#ca8564" stroke="#16283c" stroke-width="0.6"/>
<text x="478" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">4</text>
<text x="478" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">0.1</text>
<text x="478" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">10–25</text>
<rect x="516" y="215" width="64" height="63" fill="#bd6b50" stroke="#16283c" stroke-width="0.6"/>
<text x="548" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">5</text>
<text x="548" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">1</text>
<text x="548" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">&gt;25</text>
<rect x="586" y="204" width="64" height="74" fill="#b0523c" stroke="#16283c" stroke-width="0.6"/>
<text x="618" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">6</text>
<text x="618" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">10</text>
<text x="618" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">&gt;25</text>
<rect x="656" y="193" width="64" height="85" fill="#a33828" stroke="#16283c" stroke-width="0.6"/>
<text x="688" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">7</text>
<text x="688" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">100</text>
<text x="688" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">&gt;25</text>
<rect x="726" y="182" width="64" height="96" fill="#961e14" stroke="#16283c" stroke-width="0.6"/>
<text x="758" y="296" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">8</text>
<text x="758" y="316" font-size="12.3" fill="#33475b" text-anchor="middle">1 000</text>
<text x="758" y="334" font-size="12.3" fill="#33475b" text-anchor="middle">&gt;25</text>
<text x="10" y="296" font-size="12.5" font-weight="700" fill="#16283c">VEI</text>
<text x="10" y="316" font-size="12.5" fill="#16283c">Erupted, at least (km³)</text>
<text x="10" y="334" font-size="12.5" fill="#16283c">Ash column height (km)</text>
<text x="10" y="182" font-size="12.5" fill="#33475b">From VEI 2 upwards,</text>
<text x="10" y="197" font-size="12.5" fill="#33475b">each step = 10 times</text>
<text x="10" y="212" font-size="12.5" fill="#33475b">more material erupted.</text>
<text x="166" y="172" font-size="12.3" fill="#6b7a88">gentle, effusive</text>
<text x="790" y="172" font-size="12.3" fill="#6b7a88" text-anchor="end">rare, hugely explosive</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img"
     aria-label="Structure diagram: Class results system divided into Enter marks, Calculate results, Output results and Save marks, with further sub-systems below" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Carlito, Calibri, sans-serif" font-size="16" text-anchor="middle" fill="#16283c">
    <!-- connectors -->
    <g stroke="#16283c" stroke-width="1.6" fill="none">
      <path d="M410 52 V76 M115 76 H750 M115 76 V100 M395 76 V100 M620 76 V100 M750 76 V100"/>
      <path d="M115 144 V166 M60 166 H170 M60 166 V190 M170 166 V190"/>
      <path d="M395 144 V166 M290 166 H500 M290 166 V190 M395 166 V190 M500 166 V190"/>
    </g>
    <!-- level 0 -->
    <rect x="300" y="8" width="220" height="44" rx="3" fill="#16283c"/>
    <text x="410" y="36" fill="#ffffff" font-weight="700" font-size="18">Class results</text>
    <!-- level 1 -->
    <g fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8">
      <rect x="30" y="100" width="170" height="44" rx="3"/>
      <rect x="310" y="100" width="170" height="44" rx="3"/>
      <rect x="555" y="100" width="130" height="44" rx="3"/>
      <rect x="695" y="100" width="115" height="44" rx="3"/>
    </g>
    <g font-weight="700">
      <text x="115" y="128">Enter marks</text>
      <text x="395" y="128">Calculate results</text>
      <text x="620" y="128">Output results</text>
      <text x="752" y="128">Save marks</text>
    </g>
    <!-- level 2 -->
    <g fill="#ffffff" stroke="#6b7a88" stroke-width="1.4">
      <rect x="12" y="190" width="96" height="52" rx="3"/>
      <rect x="122" y="190" width="96" height="52" rx="3"/>
      <rect x="242" y="190" width="96" height="52" rx="3"/>
      <rect x="347" y="190" width="96" height="52" rx="3"/>
      <rect x="452" y="190" width="96" height="52" rx="3"/>
    </g>
    <g font-size="15">
      <text x="60" y="212">Input</text><text x="60" y="231">mark</text>
      <text x="170" y="212">Validate</text><text x="170" y="231">mark</text>
      <text x="290" y="212">Total and</text><text x="290" y="231">average</text>
      <text x="395" y="212">Highest and</text><text x="395" y="231">lowest</text>
      <text x="500" y="212">Count</text><text x="500" y="231">passes</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-label="A router joins a local network of a laptop, a PC and a printer, each with a NIC, a MAC address and an IP address assigned by the router, to the internet, where a web server has a static IP address. The router assigns IP addresses, sends data to its destination using the destination IP address, and connects the local network to the internet." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .rt-h { font-size: 13px; font-weight: 700; }
    .rt-s { font-size: 11px; fill: #33475b; }
    .rt-m { font-size: 10.5px; fill: #33475b; font-family: "DejaVu Sans Mono", Consolas, monospace; }
    .rt-w { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .rt-r { font-size: 11.5px; }
    .rt-n { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
  </style>
  <!-- LAN frame -->
  <rect x="4" y="4" width="440" height="228" rx="10" fill="#f6f9fb" stroke="#8a97a6" stroke-dasharray="6 4"/>
  <text class="rt-s" x="16" y="224" font-style="italic">local network (LAN)</text>

  <g>
    <rect x="16" y="14" width="190" height="56" rx="7" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.3"/>
    <text class="rt-h" x="26" y="31">Laptop</text><text class="rt-s" x="80" y="31">NIC (wireless)</text>
    <text class="rt-m" x="26" y="47">MAC 3C-22-FB-8A-01-7D</text>
    <text class="rt-m" x="26" y="62">IP  192.168.1.2</text>

    <rect x="16" y="82" width="190" height="56" rx="7" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.3"/>
    <text class="rt-h" x="26" y="99">PC</text><text class="rt-s" x="80" y="99">NIC (wired)</text>
    <text class="rt-m" x="26" y="115">MAC 00-1A-2B-3C-4D-5E</text>
    <text class="rt-m" x="26" y="130">IP  192.168.1.3</text>

    <rect x="16" y="150" width="190" height="56" rx="7" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.3"/>
    <text class="rt-h" x="26" y="167">Printer</text><text class="rt-s" x="80" y="167">NIC (wired)</text>
    <text class="rt-m" x="26" y="183">MAC 08-00-27-B1-9C-44</text>
    <text class="rt-m" x="26" y="198">IP  192.168.1.4</text>
  </g>
  <g stroke="#16283c" stroke-width="1.8">
    <line x1="206" y1="42" x2="300" y2="100" stroke-dasharray="4 3"/>
    <line x1="206" y1="110" x2="300" y2="112"/>
    <line x1="206" y1="178" x2="300" y2="124"/>
  </g>

  <rect x="300" y="82" width="120" height="60" rx="8" fill="#16283c"/>
  <text class="rt-w" x="360" y="118" text-anchor="middle">ROUTER</text>

  <!-- internet -->
  <path d="M520,128 C500,128 494,104 514,98 C512,78 540,70 552,84 C562,66 596,68 600,90 C622,88 630,112 612,122 C616,138 590,142 580,134 C568,146 536,144 530,132 Z" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.5"/>
  <text class="rt-h" x="562" y="112" text-anchor="middle" style="fill:#4c3fa8">Internet</text>
  <line x1="420" y1="112" x2="498" y2="112" stroke="#16283c" stroke-width="2.4"/>
  <line x1="626" y1="112" x2="660" y2="112" stroke="#16283c" stroke-width="2.4"/>
  <rect x="660" y="80" width="94" height="64" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3"/>
  <text class="rt-h" x="707" y="99" text-anchor="middle">Web server</text>
  <text class="rt-s" x="707" y="114" text-anchor="middle">static IP</text>
  <text class="rt-m" x="707" y="130" text-anchor="middle">203.0.113.10</text>

  <!-- router roles -->
  <g stroke="#b7791f" stroke-width="1.2" stroke-dasharray="3 3" fill="none">
    <line x1="300" y1="40" x2="330" y2="80"/>
    <line x1="462" y1="28" x2="404" y2="80"/>
    <line x1="460" y1="180" x2="404" y2="144"/>
  </g>
  <circle cx="232" cy="20" r="8" fill="#b7791f"/><text class="rt-n" x="232" y="24" text-anchor="middle">1</text>
  <text class="rt-r" x="245" y="18">assigns an IP address to each</text>
  <text class="rt-r" x="245" y="32">device that joins the LAN</text>
  <circle cx="466" cy="20" r="8" fill="#b7791f"/><text class="rt-n" x="466" y="24" text-anchor="middle">2</text>
  <text class="rt-r" x="479" y="18">sends each packet towards its specific</text>
  <text class="rt-r" x="479" y="32">destination, using its destination IP address</text>
  <circle cx="466" cy="186" r="8" fill="#b7791f"/><text class="rt-n" x="466" y="190" text-anchor="middle">3</text>
  <text class="rt-r" x="479" y="184">connects the local network</text>
  <text class="rt-r" x="479" y="198">to the internet</text>
</svg>

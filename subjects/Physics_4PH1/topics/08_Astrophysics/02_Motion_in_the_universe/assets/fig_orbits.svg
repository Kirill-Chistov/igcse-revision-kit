<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" width="820" height="336" role="img" aria-label="Gravitational force towards the Sun at right angles to a planet's velocity; nearly circular planet and moon orbits and an elongated comet orbit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/></marker>
</defs>

<g font-family="Carlito, Calibri, sans-serif">
<text x="190.0" y="24.0" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">(a) Why an object orbits</text>
<circle cx="190" cy="170" r="110" fill="none" stroke="#6b7a88" stroke-width="1.6" stroke-dasharray="6 5"/>
<circle cx="190" cy="170" r="26" fill="#f2c14e" stroke="#b7791f" stroke-width="1.6"/>
<text x="190.0" y="175.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="700">Sun</text>
<line x1="202.0" y1="60.0" x2="285.0" y2="60.0" stroke="#0f7b6c" stroke-width="2.6" marker-end="url(#aht)"/>
<line x1="190.0" y1="72.0" x2="190.0" y2="122.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#ahr)"/>
<circle cx="190.0" cy="60.0" r="10" fill="#5b8fd6" stroke="#16283c" stroke-width="1.4"/>
<text x="174.0" y="52.0" font-size="13" fill="#16283c" text-anchor="end" font-weight="700">planet</text>
<text x="250.0" y="38.0" font-size="13" fill="#0f7b6c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">velocity</text>
<text x="250.0" y="52.0" font-size="12" fill="#0f7b6c" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(along the orbit)</text>
<text x="182.0" y="98.0" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">gravitational force</text>
<text x="182.0" y="113.0" font-size="12" fill="#c0392b" text-anchor="end" font-weight="400" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(towards the centre)</text>
<text x="190.0" y="306.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="400">Force at 90° to the motion: it changes the</text>
<text x="190.0" y="322.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="400">direction of motion all the time, not the speed.</text>
<text x="610.0" y="24.0" font-size="15" fill="#16283c" text-anchor="middle" font-weight="700">(b) Orbit shapes</text>
<ellipse cx="505" cy="165" rx="82" ry="78" fill="none" stroke="#5b8fd6" stroke-width="2.2"/>
<ellipse cx="652.5" cy="165" rx="160" ry="62" fill="none" stroke="#4c3fa8" stroke-width="2.2" stroke-dasharray="7 4"/>
<circle cx="505" cy="165" r="10" fill="#f2c14e" stroke="#b7791f" stroke-width="1.4"/>
<text x="505.0" y="191.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Sun</text>
<circle cx="505" cy="243" r="20" fill="none" stroke="#6b7a88" stroke-width="1.3"/>
<circle cx="505" cy="243" r="7" fill="#5b8fd6" stroke="#16283c" stroke-width="1.2"/>
<circle cx="490.9" cy="228.9" r="3.5" fill="#6b7a88"/>
<text x="479.0" y="251.0" font-size="12" fill="#16283c" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">moon orbits a planet</text>
<text x="415.0" y="95.0" font-size="12" fill="#2a5fa8" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">planet: nearly</text>
<text x="415.0" y="109.0" font-size="12" fill="#2a5fa8" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">circular orbit</text>
<text x="505.0" y="91.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="400"></text>
<circle cx="492.5" cy="165" r="4" fill="#4c3fa8"/>
<circle cx="812.5" cy="165" r="4" fill="#4c3fa8"/>
<text x="808.5" y="143.0" font-size="12" fill="#4c3fa8" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">comet: very</text>
<text x="808.5" y="157.0" font-size="12" fill="#4c3fa8" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">elongated ellipse</text>
<text x="808.5" y="191.0" font-size="12" fill="#4c3fa8" text-anchor="end" font-weight="400" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">far from Sun:</text>
<text x="808.5" y="205.0" font-size="12" fill="#4c3fa8" text-anchor="end" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">slowest</text>
<text x="565.0" y="73.0" font-size="12" fill="#4c3fa8" text-anchor="start" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">close to Sun: fastest</text>
<line x1="575.0" y1="79.0" x2="497.0" y2="157.0" stroke="#4c3fa8" stroke-width="1.4" marker-end="url(#ahp)"/>
<text x="610.0" y="306.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="400">Planet speed stays about the same; comet speed</text>
<text x="610.0" y="322.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="400">changes a lot around its orbit.</text>
</g>
</svg>

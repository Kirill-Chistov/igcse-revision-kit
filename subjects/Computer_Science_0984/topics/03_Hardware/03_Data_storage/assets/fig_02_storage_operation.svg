<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 272" width="780" height="272" role="img" aria-label="Three storage technologies. Magnetic: a spinning platter divided into tracks and sectors, read and written by an electromagnetic read/write head on an arm. Optical: a single spiral track of pits and lands read by a laser; lands reflect light back, pits scatter it. Solid-state: a flash memory cell transistor with a control gate above a floating gate, separated by insulating layers; electrons trapped in the floating gate store the bit." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .st-h { font-size: 14px; font-weight: 700; }
    .st-l { font-size: 11.5px; }
    .st-s { font-size: 11px; fill: #33475b; }
  </style>
  <defs>
    <marker id="st-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8433a"/></marker>
  </defs>

  <!-- panel frames -->
  <rect x="3" y="3" width="250" height="266" rx="8" fill="#f6f9fb" stroke="#2f6f9f" stroke-width="1.4"/>
  <rect x="265" y="3" width="250" height="266" rx="8" fill="#f6f9fb" stroke="#4c3fa8" stroke-width="1.4"/>
  <rect x="527" y="3" width="250" height="266" rx="8" fill="#f6f9fb" stroke="#0f7b6c" stroke-width="1.4"/>
  <text class="st-h" x="128" y="24" text-anchor="middle" style="fill:#2f6f9f">Magnetic — e.g. HDD</text>
  <text class="st-h" x="390" y="24" text-anchor="middle" style="fill:#4c3fa8">Optical — CD, DVD, Blu-ray</text>
  <text class="st-h" x="652" y="24" text-anchor="middle" style="fill:#0b5f54">Solid-state — SSD, SD, USB</text>

  <!-- MAGNETIC: platter -->
  <g>
    <circle cx="100" cy="140" r="82" fill="#dfe8f0" stroke="#2f6f9f" stroke-width="1.4"/>
    <circle cx="100" cy="140" r="68" fill="none" stroke="#2f6f9f" stroke-width="0.9"/>
    <circle cx="100" cy="140" r="54" fill="none" stroke="#2f6f9f" stroke-width="0.9"/>
    <circle cx="100" cy="140" r="40" fill="none" stroke="#2f6f9f" stroke-width="0.9"/>
    <circle cx="100" cy="140" r="26" fill="none" stroke="#2f6f9f" stroke-width="0.9"/>
    <!-- sector lines -->
    <g stroke="#2f6f9f" stroke-width="0.7">
      <line x1="100" y1="114" x2="100" y2="58"/><line x1="100" y1="166" x2="100" y2="222"/>
      <line x1="74" y1="140" x2="18" y2="140"/><line x1="126" y1="140" x2="182" y2="140"/>
      <line x1="118.4" y1="121.6" x2="158" y2="82"/><line x1="81.6" y1="121.6" x2="42" y2="82"/>
      <line x1="81.6" y1="158.4" x2="42" y2="198"/><line x1="118.4" y1="158.4" x2="158" y2="198"/>
    </g>
    <!-- highlighted sector: between r=54 and 68, angle 0..45 below the x-axis -->
    <path d="M46,140 L32,140 A68,68 0 0 0 51.9,188.1 L61.8,178.2 A54,54 0 0 1 46,140 Z" fill="#2f6f9f" opacity="0.85"/>
    <circle cx="100" cy="140" r="9" fill="#16283c"/>
    <!-- arm and head -->
    <line x1="232" y1="226" x2="132" y2="100" stroke="#6b7a88" stroke-width="7" stroke-linecap="round"/>
    <circle cx="232" cy="226" r="8" fill="#6b7a88"/>
    <rect x="122" y="90" width="18" height="12" rx="2" fill="#b8433a" transform="rotate(-38 131 96)"/>
    <!-- labels -->
    <text class="st-l" x="12" y="46">platter (spins)</text>
    <line x1="40" y1="50" x2="52" y2="72" stroke="#16283c" stroke-width="0.8"/>
    <text class="st-l" x="150" y="52">read/write head</text>
    <text class="st-s" x="150" y="65">(electromagnet)</text>
    <line x1="160" y1="69" x2="138" y2="88" stroke="#16283c" stroke-width="0.8"/>
    <text class="st-l" x="8" y="214">sector</text>
    <line x1="26" y1="204" x2="44" y2="176" stroke="#16283c" stroke-width="0.8"/>
    <text class="st-l" x="8" y="240">track</text>
    <line x1="36" y1="236" x2="70" y2="200" stroke="#16283c" stroke-width="0.8"/>
    <text class="st-s" x="12" y="258">tiny areas magnetised one way = 1, other way = 0</text>
  </g>

  <!-- OPTICAL -->
  <g>
    <circle cx="335" cy="92" r="52" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.4"/>
    <path d="M343,92 A8,8 0 0 1 327,92 A12,12 0 0 1 351,92 A16,16 0 0 1 319,92 A20,20 0 0 1 359,92 A24,24 0 0 1 311,92 A28,28 0 0 1 367,92 A32,32 0 0 1 303,92 A36,36 0 0 1 375,92 A40,40 0 0 1 295,92 A44,44 0 0 1 383,92" fill="none" stroke="#4c3fa8" stroke-width="0.9"/>
    <circle cx="335" cy="92" r="6" fill="#ffffff" stroke="#4c3fa8"/>
    <text class="st-l" x="398" y="70">one spiral track,</text>
    <text class="st-l" x="398" y="84">centre → edge</text>
    <line x1="397" y1="80" x2="378" y2="88" stroke="#16283c" stroke-width="0.8"/>
    <!-- cross-section of track -->
    <text class="st-s" x="390" y="150" text-anchor="middle">close-up of the track</text>
    <path d="M280,168 L318,168 L318,182 L346,182 L346,168 L400,168 L400,182 L428,182 L428,168 L500,168 L500,196 L280,196 Z" fill="#c9c4ee" stroke="#4c3fa8" stroke-width="1.2"/>
    <text class="st-s" x="299" y="164" text-anchor="middle">land</text>
    <text class="st-s" x="332" y="178" text-anchor="middle">pit</text>
    <text class="st-s" x="372" y="164" text-anchor="middle">land</text>
    <text class="st-s" x="414" y="178" text-anchor="middle">pit</text>
    <!-- laser -->
    <rect x="344" y="236" width="56" height="18" rx="3" fill="#b8433a"/>
    <text class="st-l" x="372" y="249" text-anchor="middle" style="fill:#ffffff;font-weight:700">laser</text>
    <line x1="364" y1="236" x2="372" y2="199" stroke="#b8433a" stroke-width="1.6" marker-end="url(#st-ar)"/>
    <line x1="380" y1="199" x2="388" y2="236" stroke="#b8433a" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#st-ar)"/>
    <text class="st-s" x="408" y="218">land: light reflected</text>
    <text class="st-s" x="408" y="231">back to a sensor</text>
    <text class="st-s" x="408" y="244">pit: light scattered</text>
    <text class="st-s" x="276" y="222">writing: laser</text>
    <text class="st-s" x="276" y="235">burns pits</text>
  </g>

  <!-- SOLID-STATE: flash cell -->
  <g>
    <text class="st-s" x="652" y="44" text-anchor="middle">one memory cell (a transistor)</text>
    <rect x="590" y="62" width="120" height="30" rx="3" fill="#0f7b6c"/>
    <text class="st-l" x="650" y="82" text-anchor="middle" style="fill:#ffffff;font-weight:700">control gate</text>
    <rect x="590" y="92" width="120" height="8" fill="#ffffff" stroke="#8a97a6" stroke-width="0.8"/>
    <rect x="590" y="100" width="120" height="32" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text class="st-l" x="650" y="113" text-anchor="middle" style="font-weight:700">floating gate</text>
    <g font-size="10" font-weight="700" text-anchor="middle" fill="#b8433a">
      <circle cx="612" cy="124" r="5" fill="#fbeceb" stroke="#b8433a" stroke-width="0.8"/><text x="612" y="127.5" style="fill:#b8433a">−</text>
      <circle cx="632" cy="124" r="5" fill="#fbeceb" stroke="#b8433a" stroke-width="0.8"/><text x="632" y="127.5" style="fill:#b8433a">−</text>
      <circle cx="668" cy="124" r="5" fill="#fbeceb" stroke="#b8433a" stroke-width="0.8"/><text x="668" y="127.5" style="fill:#b8433a">−</text>
      <circle cx="688" cy="124" r="5" fill="#fbeceb" stroke="#b8433a" stroke-width="0.8"/><text x="688" y="127.5" style="fill:#b8433a">−</text>
    </g>
    <rect x="590" y="132" width="120" height="8" fill="#ffffff" stroke="#8a97a6" stroke-width="0.8"/>
    <rect x="555" y="140" width="190" height="40" fill="#dfe8f0" stroke="#6b7a88" stroke-width="1"/>
    <rect x="560" y="140" width="40" height="20" fill="#c3d0dc"/><rect x="700" y="140" width="40" height="20" fill="#c3d0dc"/>
    <text class="st-s" x="580" y="154" text-anchor="middle">source</text>
    <text class="st-s" x="720" y="154" text-anchor="middle">drain</text>
    <text class="st-s" x="650" y="174" text-anchor="middle">silicon</text>
    <text class="st-s" x="718" y="96" >insulating</text>
    <text class="st-s" x="718" y="108">layers</text>
    <line x1="716" y1="98" x2="711" y2="96" stroke="#16283c" stroke-width="0.8"/>
    <line x1="716" y1="104" x2="711" y2="136" stroke="#16283c" stroke-width="0.8"/>
    <text class="st-l" x="540" y="204">Electrons trapped in the floating gate</text>
    <text class="st-l" x="540" y="218">(surrounded by insulation) stay there</text>
    <text class="st-l" x="540" y="232">with no power: charged or not = 0 or 1.</text>
    <text class="st-s" x="540" y="252">Cells are arranged as NAND or NOR flash.</text>
  </g>
</svg>

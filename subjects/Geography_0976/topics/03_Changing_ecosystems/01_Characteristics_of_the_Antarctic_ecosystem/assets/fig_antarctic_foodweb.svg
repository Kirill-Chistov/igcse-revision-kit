<text x="14" y="208" font-size="9.5" fill="#6b7a88" text-anchor="start" font-weight="700">CONSUMERS</text>
<text x="14" y="356" font-size="10" fill="#16283c" text-anchor="start" font-weight="400">Arrows show the direction energy flows (from the food to the feeder). Almost everything depends on krill.</text>
<text x="14" y="369" font-size="10" fill="#33475b" text-anchor="start" font-weight="400">On land (under 1% is ice-free): mosses, lichens and only two native flowering plants; penguin and seal droppings fertilise the thin soil.</text>

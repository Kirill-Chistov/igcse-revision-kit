<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2a5f80"/></marker>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0f7b6c"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#c0392b"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">The drainage basin system — a hillslope in cross-section</text>

  <!-- ground: rock -->
  <path d="M30,150 L620,292 L645,332 L715,332 L740,292 L900,270 L900,470 L30,470 Z" fill="#e4e1dc"/>
  <!-- groundwater zone (below the water table) -->
  <path d="M30,300 L633,314 L645,332 L715,332 L727,314 L900,300 L900,470 L30,470 Z" fill="#bcd6e8" opacity="0.75"/>
  <path d="M30,300 L633,314 M727,314 L900,300" fill="none" stroke="#2a5f80" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="42" y="294" font-size="11.5" fill="#2a5f80">water table</text>
  <!-- soil -->
  <path d="M30,150 L620,292 L633,312 L30,194 Z" fill="#d9c7a3"/>
  <path d="M740,292 L900,270 L900,300 L750,308 Z" fill="#d9c7a3"/>
  <path d="M30,150 L620,292 M740,292 L900,270" fill="none" stroke="#4b6b3d" stroke-width="2.4"/>
  <!-- river channel -->
  <path d="M632.5,312 L645,332 L715,332 L727.5,312 Z" fill="#7fb2d4"/>
  <path d="M620,292 L645,332 L715,332 L740,292" fill="none" stroke="#8a6f33" stroke-width="1.6"/>

  <!-- cloud and rain -->
  <g fill="#c9d3dc">
    <ellipse cx="140" cy="62" rx="70" ry="24"/><ellipse cx="220" cy="54" rx="70" ry="28"/>
    <ellipse cx="300" cy="64" rx="66" ry="22"/><ellipse cx="200" cy="76" rx="120" ry="16"/>
  </g>
  <g stroke="#2a5f80" stroke-width="1.8" stroke-linecap="round">
    <line x1="92" y1="94" x2="86" y2="120"/><line x1="112" y1="104" x2="106" y2="130"/>
    <line x1="132" y1="94" x2="126" y2="120"/><line x1="152" y1="104" x2="146" y2="130"/>
    <line x1="172" y1="94" x2="166" y2="120"/><line x1="192" y1="104" x2="186" y2="130"/>
    <line x1="212" y1="94" x2="206" y2="120"/><line x1="232" y1="104" x2="226" y2="130"/>
    <line x1="302" y1="92" x2="298" y2="112"/><line x1="322" y1="96" x2="318" y2="116"/>
    <line x1="342" y1="92" x2="338" y2="112"/><line x1="362" y1="96" x2="358" y2="116"/>
  </g>
  <text x="392" y="58" font-size="13.5" font-weight="700" fill="#2a5f80">PRECIPITATION</text>
  <text x="392" y="74" font-size="12.5" fill="#2a5f80">rain, snow, hail — the input</text>

  <!-- tree -->
  <rect x="326" y="176" width="9" height="47" fill="#8a6f33"/>
  <circle cx="330" cy="160" r="36" fill="#7fae6a"/>
  <text x="330" y="164" font-size="11" font-style="italic" fill="#1f3d17" text-anchor="middle">interception</text>
  <text x="330" y="176" font-size="11" font-style="italic" fill="#1f3d17" text-anchor="middle">store</text>
  <text x="262" y="126" font-size="12.5" font-weight="700" fill="#0f7b6c" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">interception</text>
  <line x1="266" y1="124" x2="298" y2="140" stroke="#0f7b6c" stroke-width="1.3" marker-end="url(#t)"/>
  <!-- transpiration -->
  <line x1="358" y1="136" x2="392" y2="100" stroke="#c0392b" stroke-width="2.6" marker-end="url(#r)"/>
  <text x="398" y="104" font-size="12.5" font-weight="700" fill="#c0392b">transpiration</text>

  <!-- infiltration and percolation -->
  <line x1="190" y1="166" x2="190" y2="206" stroke="#0f7b6c" stroke-width="2.6" marker-end="url(#t)"/>
  <text x="140" y="160" font-size="12.5" font-weight="700" fill="#0f7b6c" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">infiltration</text>
  <line x1="110" y1="200" x2="110" y2="282" stroke="#0f7b6c" stroke-width="2.6" marker-end="url(#t)"/>
  <text x="118" y="262" font-size="12.5" font-weight="700" fill="#0f7b6c">percolation</text>
  <text x="38" y="190" font-size="11" font-style="italic" fill="#6b5424">soil water store</text>

  <!-- throughflow -->
  <line x1="240" y1="218" x2="560" y2="287" stroke="#0f7b6c" stroke-width="2.6" marker-end="url(#t)"/>
  <text x="300" y="266" font-size="12.5" font-weight="700" fill="#0f7b6c">throughflow</text>
  <text x="300" y="280" font-size="11.5" fill="#0f7b6c">(downslope through the soil)</text>

  <!-- overland flow -->
  <line x1="410" y1="231" x2="585" y2="273" stroke="#0f7b6c" stroke-width="2.6" marker-end="url(#t)"/>
  <text x="420" y="214" font-size="12.5" font-weight="700" fill="#0f7b6c">overland flow</text>
  <text x="420" y="228" font-size="11.5" fill="#0f7b6c">(over the surface)</text>

  <!-- groundwater flow -->
  <line x1="150" y1="352" x2="626" y2="338" stroke="#0f7b6c" stroke-width="2.6" marker-end="url(#t)"/>
  <text x="250" y="374" font-size="12.5" font-weight="700" fill="#0f7b6c">groundwater flow</text>
  <text x="250" y="388" font-size="11.5" fill="#0f7b6c">(slowly through saturated rock)</text>
  <text x="42" y="440" font-size="11" font-style="italic" fill="#2a5f80">groundwater store</text>

  <!-- evaporation -->
  <line x1="690" y1="304" x2="700" y2="232" stroke="#c0392b" stroke-width="2.6" marker-end="url(#r)"/>
  <text x="708" y="244" font-size="12.5" font-weight="700" fill="#c0392b">evaporation</text>

  <!-- evapotranspiration -->
  <text x="520" y="152" font-size="12.5" font-weight="700" fill="#c0392b">EVAPOTRANSPIRATION</text>
  <text x="520" y="167" font-size="12" fill="#c0392b">= evaporation + transpiration (output)</text>

  <!-- channel flow -->
  <text x="752" y="346" font-size="12.5" font-weight="700" fill="#0f7b6c">CHANNEL FLOW</text>
  <text x="752" y="361" font-size="11.5" fill="#0f7b6c">along the river (channel store)</text>
  <text x="752" y="380" font-size="12.5" font-weight="700" fill="#c0392b">→ discharge to the sea</text>
  <text x="752" y="395" font-size="11.5" fill="#c0392b">(output)</text>
  <line x1="750" y1="342" x2="712" y2="324" stroke="#0f7b6c" stroke-width="1.2"/>

  <!-- key -->
  <rect x="660" y="40" width="226" height="84" rx="4" fill="#ffffff" stroke="#dfe5ea"/>
  <line x1="672" y1="58" x2="704" y2="58" stroke="#2a5f80" stroke-width="3" marker-end="url(#b)"/>
  <text x="712" y="62" font-size="12" fill="#16283c">input</text>
  <line x1="672" y1="78" x2="704" y2="78" stroke="#0f7b6c" stroke-width="3" marker-end="url(#t)"/>
  <text x="712" y="82" font-size="12" fill="#16283c">flows (transfers) within the basin</text>
  <line x1="672" y1="98" x2="704" y2="98" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
  <text x="712" y="102" font-size="12" fill="#16283c">outputs</text>
  <text x="712" y="118" font-size="11.5" font-style="italic" fill="#6b7a88">italic = stores</text>
</svg>

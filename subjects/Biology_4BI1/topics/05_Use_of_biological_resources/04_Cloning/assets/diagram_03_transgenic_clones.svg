<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 92" width="760" height="92" role="img" aria-label="A human gene is inserted into a body cell of a sheep or goat; the cell is cloned by nuclear transfer into enucleated eggs and the embryos placed in surrogate mothers; the resulting herd of identical transgenic animals all make the human protein in their milk; the protein is extracted and purified." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .tc-h { font-size: 12.5px; font-weight: 700; }
    .tc-s { font-size: 12px; fill: #33475b; }
  </style>
  <defs><marker id="tc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker></defs>
  <rect x="4" y="4" width="170" height="84" rx="7" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.5"/>
  <text class="tc-h" x="89.0" y="25" text-anchor="middle">Add the human gene</text>
  <text class="tc-s" x="89.0" y="42" text-anchor="middle">gene for a human protein</text>
  <text class="tc-s" x="89.0" y="57" text-anchor="middle">inserted into a body cell</text>
  <text class="tc-s" x="89.0" y="72" text-anchor="middle">of a sheep or goat</text>
  <line x1="176" y1="46.0" x2="193" y2="46.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#tc-ar)"/>
  <rect x="195" y="4" width="170" height="84" rx="7" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.5"/>
  <text class="tc-h" x="280.0" y="25" text-anchor="middle">Clone the cell</text>
  <text class="tc-s" x="280.0" y="42" text-anchor="middle">its nucleus is put into</text>
  <text class="tc-s" x="280.0" y="57" text-anchor="middle">enucleated eggs; embryos</text>
  <text class="tc-s" x="280.0" y="72" text-anchor="middle">go to surrogates (Fig. 2)</text>
  <line x1="367" y1="46.0" x2="384" y2="46.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#tc-ar)"/>
  <rect x="386" y="4" width="170" height="84" rx="7" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.5"/>
  <text class="tc-h" x="471.0" y="25" text-anchor="middle">Identical herd</text>
  <text class="tc-s" x="471.0" y="42" text-anchor="middle">every animal has the gene</text>
  <text class="tc-s" x="471.0" y="57" text-anchor="middle">and makes the human</text>
  <text class="tc-s" x="471.0" y="72" text-anchor="middle">protein in its milk</text>
  <line x1="558" y1="46.0" x2="575" y2="46.0" stroke="#33475b" stroke-width="1.8" marker-end="url(#tc-ar)"/>
  <rect x="577" y="4" width="170" height="84" rx="7" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.5"/>
  <text class="tc-h" x="662.0" y="25" text-anchor="middle">Extract</text>
  <text class="tc-s" x="662.0" y="42" text-anchor="middle">protein separated</text>
  <text class="tc-s" x="662.0" y="57" text-anchor="middle">from the milk and</text>
  <text class="tc-s" x="662.0" y="72" text-anchor="middle">purified for medicine</text>
</svg>

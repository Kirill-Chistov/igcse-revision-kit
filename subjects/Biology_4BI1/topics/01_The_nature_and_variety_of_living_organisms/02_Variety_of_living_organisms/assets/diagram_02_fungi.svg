<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" width="760" height="282" role="img" aria-label="Fungi. A: Mucor grows as a mycelium, a network of thread-like hyphae spreading over and into its food. B: one hypha, with a chitin cell wall and many nuclei in its cytoplasm, feeds by saprotrophic nutrition: it secretes digestive enzymes onto the food, the food is digested outside the hypha into small soluble molecules, and these are absorbed. C: yeast is a single-celled fungus." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vg2-p   { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #a0621c; }
    .vg2-l   { font-size: 12.5px; fill: #16283c; }
    .vg2-lb  { font-size: 12.5px; font-weight: 700; fill: #16283c; }
    .vg2-st  { font-size: 12.5px; fill: #16283c; }
    .vg2-num { font-weight: 700; font-size: 12px; fill: #ffffff; text-anchor: middle; }
    .vg2-hy  { fill: none; stroke: #a0621c; stroke-width: 2.4; stroke-linecap: round; }
    .vg2-ldr { fill: none; stroke: #8fa3b8; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="f2r" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/>
    </marker>
    <marker id="f2g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1e8449"/>
    </marker>
  </defs>

  <!-- ============ A: Mucor mycelium on food ============ -->
  <text class="vg2-p" x="6" y="16">A  MUCOR</text>
  <rect x="10" y="176" width="220" height="70" rx="6" fill="#f3e3c3" stroke="#c9a66b" stroke-width="1.4"/>
  <text class="vg2-l" x="120" y="264" text-anchor="middle" style="fill:#7a5a25">hyphae grow over and into food, e.g. bread</text>
  <!-- hyphae over and into the food -->
  <path class="vg2-hy" d="M14,170 C50,160 80,168 118,156 C150,146 185,160 228,150"/>
  <path class="vg2-hy" d="M40,166 C44,188 34,206 46,226"/>
  <path class="vg2-hy" d="M80,166 C92,190 84,210 100,232"/>
  <path class="vg2-hy" d="M130,154 C140,180 132,200 150,222"/>
  <path class="vg2-hy" d="M186,156 C196,178 188,200 204,226"/>
  <path class="vg2-hy" d="M100,162 C104,140 118,120 128,96"/>
  <path class="vg2-hy" d="M160,152 C170,132 176,120 190,104"/>
  <path class="vg2-hy" d="M60,166 C56,146 50,130 40,116"/>
  <path class="vg2-hy" d="M128,96 C134,84 144,78 156,76"/>
  <text class="vg2-lb" x="12" y="44">mycelium</text>
  <text class="vg2-l"  x="12" y="59">= network of hyphae</text>
  <path class="vg2-ldr" d="M60,64 L50,122"/>
  <!-- zoom ring -->
  <circle cx="128" cy="100" r="22" fill="none" stroke="#16283c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M150,96 L262,70" fill="none" stroke="#16283c" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M146,114 L262,146" fill="none" stroke="#16283c" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ============ B: one hypha feeding ============ -->
  <text class="vg2-p" x="268" y="16">B  ONE HYPHA — SAPROTROPHIC NUTRITION</text>
  <!-- hypha tube -->
  <path d="M266,64 H552 A26,26 0 0 1 552,116 H266" fill="#fbf1e4" stroke="#a0621c" stroke-width="5"/>
  <path d="M266,70 H552 A20,20 0 0 1 552,110 H266" fill="#fffaf2" stroke="none"/>
  <g fill="#6b4a1a">
    <circle cx="292" cy="82" r="5"/><circle cx="330" cy="98" r="5"/><circle cx="372" cy="80" r="5"/>
    <circle cx="414" cy="99" r="5"/><circle cx="456" cy="83" r="5"/><circle cx="500" cy="97" r="5"/>
    <circle cx="540" cy="84" r="5"/>
  </g>
  <!-- labels on hypha -->
  <path class="vg2-ldr" d="M596,58 L566,66"/>
  <text class="vg2-lb" x="598" y="54">cell wall of chitin</text>
  <path class="vg2-ldr" d="M596,92 L546,88"/>
  <text class="vg2-lb" x="598" y="88">many nuclei</text>
  <text class="vg2-l"  x="598" y="103">in the cytoplasm</text>

  <!-- food surface with large molecules -->
  <rect x="266" y="162" width="310" height="58" rx="6" fill="#f3e3c3" stroke="#c9a66b" stroke-width="1.4"/>
    <g fill="#e6b85c" stroke="#a0621c" stroke-width="1">
    <!-- large molecules = chains -->
    <circle cx="290" cy="182" r="5"/><circle cx="300" cy="182" r="5"/><circle cx="310" cy="182" r="5"/><circle cx="320" cy="182" r="5"/><circle cx="330" cy="182" r="5"/>
    <circle cx="290" cy="200" r="5"/><circle cx="300" cy="200" r="5"/><circle cx="310" cy="200" r="5"/><circle cx="320" cy="200" r="5"/>
  </g>
  <text class="vg2-l" x="280" y="215">large, insoluble</text>
  <g fill="#e6b85c" stroke="#a0621c" stroke-width="1">
    <!-- small molecules after digestion -->
    <circle cx="456" cy="176" r="5"/><circle cx="474" cy="188" r="5"/><circle cx="494" cy="177" r="5"/>
    <circle cx="512" cy="189" r="5"/><circle cx="532" cy="178" r="5"/><circle cx="548" cy="190" r="5"/>
  </g>

  <!-- step 1: enzymes secreted -->
  <path d="M310,118 C312,132 312,146 312,158" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#f2r)"/>
  <path d="M340,118 C340,132 336,146 332,158" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#f2r)"/>
  <!-- step 2 marker: digestion arrow within food -->
  <path d="M346,187 H436" fill="none" stroke="#16283c" stroke-width="1.8" marker-end="url(#f2g)"/>
  <!-- step 3: absorption -->
  <path d="M470,164 C470,150 470,136 470,122" fill="none" stroke="#1e8449" stroke-width="2.2" marker-end="url(#f2g)"/>
  <path d="M498,164 C500,150 502,136 502,122" fill="none" stroke="#1e8449" stroke-width="2.2" marker-end="url(#f2g)"/>

  <g>
    <circle cx="276" cy="140" r="9" fill="#c0392b"/><text class="vg2-num" x="276" y="144">1</text>
    <circle cx="410" cy="140" r="9" fill="#16283c"/><text class="vg2-num" x="410" y="144">2</text>
    <circle cx="536" cy="140" r="9" fill="#1e8449"/><text class="vg2-num" x="536" y="144">3</text>
  </g>
  <text class="vg2-st" x="266" y="244"><tspan font-weight="700" fill="#c0392b">1</tspan> digestive enzymes secreted onto the food</text>
  <text class="vg2-st" x="266" y="261"><tspan font-weight="700">2</tspan> food digested <tspan font-weight="700">outside</tspan> the hypha into small soluble molecules</text>
  <text class="vg2-l" x="456" y="215">small, soluble</text>
  <text class="vg2-st" x="266" y="278"><tspan font-weight="700" fill="#1e8449">3</tspan> the soluble products are absorbed into the hypha</text>

  <!-- ============ C: yeast ============ -->
  <text class="vg2-p" x="612" y="140">C  YEAST</text>
  <ellipse cx="672" cy="194" rx="34" ry="26" fill="#fbf1e4" stroke="#a0621c" stroke-width="3"/>
  <circle cx="664" cy="196" r="7" fill="#6b4a1a"/>
  <text class="vg2-l" x="616" y="240">single-celled fungus</text>
</svg>

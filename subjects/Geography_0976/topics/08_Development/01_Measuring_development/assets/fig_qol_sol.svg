<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" role="img" aria-label="Standard of living sits inside quality of life; factors affecting each" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Carlito, Calibri, sans-serif">
    <!-- quality of life (outer) -->
    <rect x="6" y="6" width="888" height="360" rx="14" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
    <text x="24" y="34" font-size="17" font-weight="700" fill="#4c3fa8">QUALITY OF LIFE</text>
    <text x="160" y="34" font-size="15" fill="#33475b">— overall well-being: material and non-material factors</text>

    <!-- standard of living (inner) -->
    <rect x="300" y="96" width="300" height="176" rx="12" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="2.5"/>
    <text x="450" y="128" font-size="17" font-weight="700" fill="#0b5f54" text-anchor="middle">STANDARD OF LIVING</text>
    <text x="450" y="148" font-size="14" font-style="italic" fill="#0b5f54" text-anchor="middle">material wealth — what people can afford</text>
    <g font-size="14.5" fill="#16283c">
      <text x="322" y="176">• income and employment</text>
      <text x="322" y="198">• housing</text>
      <text x="322" y="220">• food and clean water</text>
      <text x="322" y="242">• goods and services: electricity,</text>
      <text x="334" y="260">transport, possessions</text>
    </g>

    <!-- non-material factor cards -->
    <g font-size="14" fill="#16283c">
      <rect x="24" y="52" width="252" height="100" rx="8" fill="#fff" stroke="#4c3fa8" stroke-width="1.3"/>
      <text x="38" y="76" font-size="15" font-weight="700" fill="#4c3fa8">Health</text>
      <text x="38" y="98">access to health care and</text>
      <text x="38" y="117">medicines; disease; diet</text>

      <rect x="24" y="170" width="252" height="100" rx="8" fill="#fff" stroke="#4c3fa8" stroke-width="1.3"/>
      <text x="38" y="194" font-size="15" font-weight="700" fill="#4c3fa8">Education</text>
      <text x="38" y="216">access to schools; literacy;</text>
      <text x="38" y="235">skills for better-paid work</text>

      <rect x="624" y="52" width="252" height="100" rx="8" fill="#fff" stroke="#4c3fa8" stroke-width="1.3"/>
      <text x="638" y="76" font-size="15" font-weight="700" fill="#4c3fa8">Environment</text>
      <text x="638" y="98">air and water pollution; noise;</text>
      <text x="638" y="117">green space; natural hazards;</text>
      <text x="638" y="136">climate</text>

      <rect x="624" y="170" width="252" height="100" rx="8" fill="#fff" stroke="#4c3fa8" stroke-width="1.3"/>
      <text x="638" y="194" font-size="15" font-weight="700" fill="#4c3fa8">Safety and freedom</text>
      <text x="638" y="216">crime; conflict; corruption;</text>
      <text x="638" y="235">political freedom and</text>
      <text x="638" y="254">human rights</text>

      <rect x="24" y="286" width="852" height="64" rx="8" fill="#fff" stroke="#4c3fa8" stroke-width="1.3"/>
      <text x="38" y="310" font-size="15" font-weight="700" fill="#4c3fa8">Society and personal life</text>
      <text x="38" y="334">equality (gender, ethnicity, rich and poor); family and community; working hours and leisure time; happiness</text>
    </g>
  </g>
</svg>

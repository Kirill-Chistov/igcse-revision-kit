<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 226" width="700" height="226" role="img" aria-label="How arguments are passed to parameters and a function returns a value" font-family="Carlito, Calibri, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker></defs>
<rect x="18" y="26" width="230" height="56" rx="3" fill="#f3f5f7" stroke="#c9d1d9" stroke-width="1"/>
<text x="18.0" y="18.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="bold" style="white-space:pre">Main program</text>
<text x="34.0" y="48.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">RoomArea ← Area(4.0, 5.5)</text>
<text x="34.0" y="70.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">OUTPUT RoomArea</text>
<rect x="18" y="134" width="452" height="84" rx="3" fill="#f3f5f7" stroke="#c9d1d9" stroke-width="1"/>
<text x="18.0" y="126.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="bold" style="white-space:pre">Function definition</text>
<text x="34.0" y="158.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">FUNCTION Area(Length : REAL, Width : REAL) RETURNS REAL</text>
<text x="34.0" y="178.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">    RETURN Length * Width</text>
<text x="34.0" y="198.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">ENDFUNCTION</text>
<path d="M171.0 54 C171.0 95 167.0 105 167.0 143" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#art)"/>
<path d="M210.1 54 C210.1 95 280.5 105 280.5 143" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#art)"/>
<path d="M470 176 L492 176 L492 44 L237.6 44" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#ara)"/>
<circle cx="523" cy="36" r="8" fill="#0f766e"/>
<text x="523.0" y="40.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" style="white-space:pre">1</text>
<text x="538.0" y="40.0" font-size="12" fill="#16283c" text-anchor="start" font-weight="normal" style="white-space:pre">Arguments are passed to</text>
<text x="538.0" y="56.0" font-size="12" fill="#16283c" text-anchor="start" font-weight="normal" style="white-space:pre">parameters in order:</text>
<text x="538.0" y="72.0" font-size="12" fill="#16283c" text-anchor="start" font-weight="normal" style="white-space:pre">4.0 → Length, 5.5 → Width</text>
<circle cx="523" cy="126" r="8" fill="#b45309"/>
<text x="523.0" y="130.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" style="white-space:pre">2</text>
<text x="538.0" y="130.0" font-size="12" fill="#16283c" text-anchor="start" font-weight="normal" style="white-space:pre">RETURN sends back 22.0,</text>
<text x="538.0" y="146.0" font-size="12" fill="#16283c" text-anchor="start" font-weight="normal" style="white-space:pre">which replaces the call:</text>
<text x="538.0" y="162.0" font-size="12" fill="#16283c" text-anchor="start" font-weight="normal" style="white-space:pre">RoomArea ← 22.0</text>
</svg>

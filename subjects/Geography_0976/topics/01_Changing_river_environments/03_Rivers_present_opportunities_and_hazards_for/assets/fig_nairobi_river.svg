<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="w" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2a5f80"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">The Nairobi River — schematic, not to scale</text>
  <text x="16" y="42" font-size="12" fill="#6b7a88">Places as named in the class notes, from source (west) to the Athi River (east). Basin about 40 km long.</text>

  <!-- city area -->
  <rect x="160" y="70" width="520" height="140" rx="10" fill="#f1efe9"/>
  <text x="170" y="88" font-size="12" font-weight="700" fill="#8e8a82">NAIROBI — densely populated</text>

  <!-- rivers -->
  <path d="M70,130 C140,118 200,142 280,130 C360,118 420,142 500,130 C580,118 640,142 720,130 C770,122 800,128 838,132" fill="none" stroke="#3d7ea6" stroke-width="5" stroke-linecap="round"/>
  <path d="M812,230 C826,190 832,160 838,132 C846,100 856,80 872,60" fill="none" stroke="#3d7ea6" stroke-width="7" stroke-linecap="round"/>
  <line x1="380" y1="104" x2="440" y2="104" stroke="#2a5f80" stroke-width="2" marker-end="url(#w)"/>
  <text x="446" y="108" font-size="11.5" fill="#2a5f80">flow</text>
  <text x="850" y="214" font-size="12.5" font-weight="700" fill="#2a5f80">Athi</text>
  <text x="850" y="228" font-size="12.5" font-weight="700" fill="#2a5f80">River</text>

  <!-- places -->
  <g fill="#16283c">
    <circle cx="70" cy="130" r="6"/><circle cx="200" cy="136" r="4.5"/><circle cx="310" cy="126" r="4.5"/>
    <circle cx="420" cy="134" r="4.5"/><circle cx="520" cy="127" r="4.5"/><circle cx="620" cy="133" r="4.5"/><circle cx="740" cy="127" r="5"/>
  </g>
  <g font-size="12.5" fill="#16283c" text-anchor="middle">
    <text x="70" y="112" font-weight="700">Ondiri Swamp</text><text x="70" y="98" font-size="11.5" fill="#6b7a88">source</text>
    <text x="200" y="118">Kangemi</text>
    <text x="310" y="112">CBD</text>
    <text x="420" y="160">Eastleigh</text>
    <text x="520" y="112">Kariobangi</text>
    <text x="620" y="160">Dandora</text>
    <text x="740" y="112" font-weight="700">Ruai</text>
  </g>
  <!-- 2.5 km stretch -->
  <path d="M282,144 L282,150 L338,150 L338,144" fill="none" stroke="#0f7b6c" stroke-width="1.6"/>
  <text x="250" y="168" font-size="11.5" fill="#0f7b6c">2.5 km clean-up stretch,</text>
  <text x="250" y="181" font-size="11.5" fill="#0f7b6c">Museum Hill – Globe Cinema</text>

  <!-- algae counts -->
  <line x1="40" y1="240" x2="780" y2="240" stroke="#dfe5ea"/>
  <rect x="58" y="232" width="24" height="8" fill="#6ba35a"/>
  <rect x="728" y="164" width="24" height="76" fill="#6ba35a"/>
  <text x="92" y="238" font-size="12" font-weight="700" fill="#3f6b33">100 at Ondiri Swamp</text>
  <text x="720" y="200" font-size="12" font-weight="700" fill="#3f6b33" text-anchor="end">947 at Ruai — the most</text>
  <text x="720" y="214" font-size="12" font-weight="700" fill="#3f6b33" text-anchor="end">polluted downstream site</text>
</svg>

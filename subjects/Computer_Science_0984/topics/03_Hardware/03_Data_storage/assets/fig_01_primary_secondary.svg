<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="The CPU accesses primary storage (RAM and ROM) directly. Secondary storage (HDD, SSD, optical discs, SD cards, USB drives) is not directly accessed by the CPU: data is copied into RAM first." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .ps-h { font-size: 14px; font-weight: 700; }
    .ps-s { font-size: 11.5px; fill: #33475b; }
    .ps-w { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .ps-a { font-size: 11.5px; font-weight: 700; }
  </style>
  <defs><marker id="ps-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker></defs>

  <rect x="8" y="40" width="120" height="70" rx="8" fill="#16283c"/>
  <text class="ps-w" x="68" y="80" text-anchor="middle">CPU</text>

  <rect x="240" y="12" width="230" height="126" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="ps-h" x="355" y="34" text-anchor="middle" style="fill:#0b5f54">PRIMARY STORAGE</text>
  <rect x="256" y="46" width="94" height="44" rx="6" fill="#ffffff" stroke="#0f7b6c"/>
  <text class="ps-h" x="303" y="66" text-anchor="middle">RAM</text>
  <text class="ps-s" x="303" y="81" text-anchor="middle">volatile</text>
  <rect x="360" y="46" width="94" height="44" rx="6" fill="#ffffff" stroke="#0f7b6c"/>
  <text class="ps-h" x="407" y="66" text-anchor="middle">ROM</text>
  <text class="ps-s" x="407" y="81" text-anchor="middle">non-volatile</text>
  <text class="ps-s" x="355" y="110" text-anchor="middle">directly accessed by the CPU</text>
  <text class="ps-s" x="355" y="125" text-anchor="middle">small, fast</text>

  <rect x="582" y="12" width="170" height="126" rx="8" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.6"/>
  <text class="ps-h" x="667" y="34" text-anchor="middle" style="fill:#2f6f9f">SECONDARY STORAGE</text>
  <text class="ps-s" x="667" y="56" text-anchor="middle">HDD · SSD · CD/DVD/Blu-ray</text>
  <text class="ps-s" x="667" y="71" text-anchor="middle">SD card · USB drive</text>
  <text class="ps-s" x="667" y="96" text-anchor="middle">NOT directly accessed by CPU</text>
  <text class="ps-s" x="667" y="111" text-anchor="middle">permanent (non-volatile)</text>
  <text class="ps-s" x="667" y="126" text-anchor="middle">large, slower</text>

  <line x1="134" y1="75" x2="234" y2="75" stroke="#16283c" stroke-width="2.4" marker-start="url(#ps-ar)" marker-end="url(#ps-ar)"/>
  <text class="ps-a" x="184" y="67" text-anchor="middle">direct</text>
  <line x1="476" y1="75" x2="576" y2="75" stroke="#16283c" stroke-width="2.4" marker-start="url(#ps-ar)" marker-end="url(#ps-ar)"/>
  <text class="ps-a" x="526" y="67" text-anchor="middle">copied</text>
  <text class="ps-s" x="526" y="93" text-anchor="middle">into RAM</text>
  <text class="ps-s" x="526" y="107" text-anchor="middle">before use</text>
</svg>

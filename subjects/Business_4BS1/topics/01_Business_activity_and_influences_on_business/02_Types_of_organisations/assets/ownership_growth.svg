<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="og-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16283c"/>
    </marker>
  </defs>
  <text x="6" y="18" font-size="11.5" font-weight="700" fill="#6b7a88" letter-spacing="0.8">PRIVATE SECTOR</text>
  <text x="645" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b7a88" letter-spacing="0.8">PUBLIC SECTOR</text>
  <line x1="562" y1="6" x2="562" y2="296" stroke="#6b7a88" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g font-size="12" fill="#33475b" text-anchor="middle">
    <rect x="6" y="150" width="130" height="80" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="71" y="170" font-size="13.5" font-weight="700" fill="#16283c">Sole trader</text>
    <text x="71" y="191">one owner; small,</text>
    <text x="71" y="207">low-risk business</text>

    <rect x="143" y="120" width="130" height="110" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="208" y="140" font-size="13.5" font-weight="700" fill="#16283c">Partnership</text>
    <text x="208" y="161">owners sharing</text>
    <text x="208" y="177">skills and capital,</text>
    <text x="208" y="193">e.g. professionals</text>

    <rect x="280" y="90" width="130" height="140" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="345" y="110" font-size="13.5" font-weight="700" fill="#16283c">Private limited</text>
    <text x="345" y="126" font-size="13.5" font-weight="700" fill="#16283c">company (Ltd)</text>
    <text x="345" y="147">family or growing</text>
    <text x="345" y="163">firms wanting</text>
    <text x="345" y="179">limited liability</text>
    <text x="345" y="195">and to keep control</text>

    <rect x="417" y="60" width="130" height="170" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="482" y="80" font-size="13.5" font-weight="700" fill="#16283c">Public limited</text>
    <text x="482" y="96" font-size="13.5" font-weight="700" fill="#16283c">company (plc)</text>
    <text x="482" y="117">large firms needing</text>
    <text x="482" y="133">very large finance</text>

    <rect x="578" y="100" width="134" height="130" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.4"/>
    <text x="645" y="120" font-size="13.5" font-weight="700" fill="#16283c">Public</text>
    <text x="645" y="136" font-size="13.5" font-weight="700" fill="#16283c">corporation</text>
    <text x="645" y="157">government-owned;</text>
    <text x="645" y="173">essential services,</text>
    <text x="645" y="189">e.g. water, post</text>
  </g>
  <g font-size="12" fill="#16283c">
    <text x="10" y="253">more finance available, larger size, more legal formalities; limited liability from Ltd</text>
    <line x1="10" y1="261" x2="546" y2="261" stroke="#16283c" stroke-width="1.6" marker-end="url(#og-arr)"/>
    <text x="10" y="283">owners keep more control and privacy</text>
    <line x1="546" y1="291" x2="10" y2="291" stroke="#16283c" stroke-width="1.6" marker-end="url(#og-arr)"/>
  </g>
</svg>

  <text class="qd-s" x="24" y="214">tape measures = axes of a grid</text>
  <path d="M28,203 l0,-6" stroke="#d99a17" stroke-width="3"/>
  <rect x="206" y="202" width="14" height="14" fill="none" stroke="#b8433a" stroke-width="2"/>
  <text class="qd-s" x="226" y="214">quadrat at random coordinates</text>
  <text class="qd-s" x="24" y="234">○ = one daisy (the species counted)</text>
  <!-- method -->
  <rect x="384" y="10" width="370" height="226" rx="8" fill="#f3f5f7" stroke="#8a97a6" stroke-width="1.2"/>
  <text class="qd-h" x="398" y="32">Method</text>
  <circle cx="406" cy="52" r="8" fill="#0f7b6c"/><text class="qd-n" x="406" y="56" text-anchor="middle">1</text>
  <text class="qd-m" x="422" y="56">Lay two tape measures at right angles to make a grid.</text>
  <circle cx="406" cy="75" r="8" fill="#0f7b6c"/><text class="qd-n" x="406" y="79" text-anchor="middle">2</text>
  <text class="qd-m" x="422" y="79">Use a random number generator to pick coordinates;</text>
  <text class="qd-m" x="422" y="93">place the quadrat (e.g. 0.5 m × 0.5 m) there.</text>
  <circle cx="406" cy="112" r="8" fill="#0f7b6c"/><text class="qd-n" x="406" y="116" text-anchor="middle">3</text>
  <text class="qd-m" x="422" y="116">Count the individuals of the species inside the quadrat.</text>
  <circle cx="406" cy="135" r="8" fill="#0f7b6c"/><text class="qd-n" x="406" y="139" text-anchor="middle">4</text>
  <text class="qd-m" x="422" y="139">Repeat for at least 10 quadrats; calculate the mean</text>
  <text class="qd-m" x="422" y="153">number per quadrat.</text>
  <circle cx="406" cy="172" r="8" fill="#0f7b6c"/><text class="qd-n" x="406" y="176" text-anchor="middle">5</text>
  <text class="qd-m" x="422" y="176">Repeat in area B with the same quadrat size and</text>
  <text class="qd-m" x="422" y="190">the same number of quadrats.</text>
  <circle cx="406" cy="209" r="8" fill="#0f7b6c"/><text class="qd-n" x="406" y="213" text-anchor="middle">6</text>
  <text class="qd-m" x="422" y="213">Scale the mean up to estimate each population</text>
  <text class="qd-m" x="422" y="227">(worked example below) and compare A and B.</text>

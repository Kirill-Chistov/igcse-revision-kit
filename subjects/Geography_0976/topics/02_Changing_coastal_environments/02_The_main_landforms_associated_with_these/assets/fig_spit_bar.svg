<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Plan views of a spit with a recurved end and salt marsh, and a bar with a lagoon behind it">
  <defs>
    <marker id="sb-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
    <marker id="sb-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b5f54"/></marker>
    <pattern id="sb-marsh" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#b7cfa2"/><path d="M2,7 L3,3 M3,7 L3,2 M4,7 L5,3" stroke="#5f8a45" stroke-width="0.8"/>
    </pattern>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
    <!-- spit -->
    <text x="0" y="18" font-size="18" font-weight="700" fill="#0b5f54">Spit</text>
    <text x="40" y="18" font-size="13" fill="#33475b">sand or shingle joined to the land at one end</text>
    <rect x="0" y="28" width="400" height="242" fill="#cfe3ee"/>
    <path d="M0,28 L235,28 C238,70 232,108 215,140 L0,140 Z" fill="#dfe8cf" stroke="#6f8a5a" stroke-width="1.3"/>
    <path d="M322,28 L400,28 L400,150 L346,150 C332,118 324,80 322,28 Z" fill="#dfe8cf" stroke="#6f8a5a" stroke-width="1.3"/>
    <path d="M285,28 C278,60 300,90 305,108 C312,125 325,140 336,162" fill="none" stroke="#2c6e91" stroke-width="3"/>
    <path d="M218,138 C240,140 270,142 292,138 C300,132 296,124 286,120 C266,114 244,112 228,116 Z" fill="url(#sb-marsh)"/>
    <path d="M190,146 C240,152 280,154 300,150 C314,147 318,136 306,124" fill="none" stroke="#e3c27a" stroke-width="13" stroke-linecap="round"/>
    <line x1="20" y1="168" x2="178" y2="168" stroke="#0b5f54" stroke-width="3.5" marker-end="url(#sb-arr-t)"/>
    <text x="20" y="186" font-size="13.5" font-weight="700" fill="#0b5f54">longshore drift</text>
    <line x1="30" y1="258" x2="84" y2="204" stroke="#16283c" stroke-width="2.5" marker-end="url(#sb-arr)"/>
    <text x="92" y="238" font-size="13">prevailing wind</text>
    <line x1="372" y1="250" x2="330" y2="176" stroke="#16283c" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#sb-arr)"/>
    <text x="356" y="244" font-size="12.5" text-anchor="end">secondary wind</text>
    <text x="356" y="258" font-size="12.5" text-anchor="end">and waves</text>
    <text x="252" y="176" font-size="15" font-weight="700" text-anchor="middle">spit</text>
    <line x1="349" y1="108" x2="313" y2="125" stroke="#16283c" stroke-width="1"/>
    <text x="352" y="96" font-size="12.5" font-weight="700">recurved</text>
    <text x="352" y="110" font-size="12.5" font-weight="700">(hooked)</text>
    <text x="352" y="124" font-size="12.5" font-weight="700">end</text>
    <line x1="170" y1="100" x2="244" y2="122" stroke="#16283c" stroke-width="1"/>
    <text x="165" y="96" font-size="12.5" font-weight="700" text-anchor="end">salt marsh</text>
    <line x1="150" y1="126" x2="210" y2="140" stroke="#16283c" stroke-width="1"/>
    <text x="145" y="124" font-size="12.5" text-anchor="end">coast changes direction</text>
    <text x="298" y="46" font-size="12" font-style="italic" fill="#2c6e91">river</text>

    <!-- bar -->
    <text x="420" y="18" font-size="18" font-weight="700" fill="#0b5f54">Bar</text>
    <text x="456" y="18" font-size="13" fill="#33475b">a spit that grows right across a bay</text>
    <rect x="420" y="28" width="400" height="242" fill="#cfe3ee"/>
    <path d="M495,200 C505,160 520,110 560,95 C600,80 650,80 700,95 C740,110 752,160 760,200 Z" fill="#a9cbbd"/>
    <path d="M420,28 L820,28 L820,200 L760,200 C752,160 740,110 700,95 C650,80 600,80 560,95 C520,110 505,160 495,200 L420,200 Z" fill="#dfe8cf" stroke="#6f8a5a" stroke-width="1.3"/>
    <path d="M492,199 C560,206 690,206 763,199" fill="none" stroke="#e3c27a" stroke-width="13" stroke-linecap="round"/>
    <line x1="470" y1="240" x2="740" y2="240" stroke="#0b5f54" stroke-width="3.5" marker-end="url(#sb-arr-t)"/>
    <text x="605" y="260" font-size="13.5" font-weight="700" fill="#0b5f54" text-anchor="middle">longshore drift</text>
    <text x="628" y="226" font-size="15" font-weight="700" text-anchor="middle">bar</text>
    <text x="628" y="150" font-size="15" font-weight="700" text-anchor="middle">lagoon</text>
    <text x="628" y="167" font-size="12.5" text-anchor="middle">(the old bay, now cut off from the sea)</text>
    <text x="457" y="130" font-size="13" font-weight="700" text-anchor="middle">headland</text>
    <text x="790" y="130" font-size="13" font-weight="700" text-anchor="middle">headland</text>

    <!-- key -->
    <g font-size="12.5" fill="#33475b">
      <rect x="0" y="282" width="22" height="10" fill="#e3c27a"/><text x="28" y="291">sand / shingle</text>
      <rect x="130" y="281" width="22" height="12" fill="url(#sb-marsh)"/><text x="158" y="291">salt marsh (sheltered water)</text>
      <rect x="420" y="281" width="22" height="12" fill="#a9cbbd"/><text x="448" y="291">lagoon</text>
    </g>
  </g>
</svg>

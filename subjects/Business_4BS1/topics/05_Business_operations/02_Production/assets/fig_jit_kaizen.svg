<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <rect x="4" y="4" width="346" height="254" rx="7" fill="#f8fafb" stroke="#dfe5ea"/>
  <rect x="370" y="4" width="346" height="254" rx="7" fill="#f8fafb" stroke="#dfe5ea"/>

  <!-- JIT -->
  <text x="177" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#16283c">Just-in-time (JIT)</text>
  <g font-size="13.5" fill="#16283c">
    <rect x="30" y="42" width="220" height="32" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/>
    <text x="140" y="63" text-anchor="middle">1  Customer order received</text>
    <rect x="30" y="94" width="220" height="32" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/>
    <text x="140" y="115" text-anchor="middle">2  Components ordered</text>
    <rect x="30" y="146" width="220" height="32" rx="5" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
    <text x="140" y="167" text-anchor="middle" font-weight="700" fill="#0b5f54">3  Arrive just when needed</text>
    <rect x="30" y="198" width="220" height="32" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/>
    <text x="140" y="219" text-anchor="middle">4  Product made and sent</text>
  </g>
  <line x1="140" y1="76" x2="140" y2="91" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="140" y1="128" x2="140" y2="143" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="140" y1="180" x2="140" y2="195" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- empty store -->
  <rect x="266" y="118" width="70" height="60" fill="#ffffff" stroke="#6b7a88" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="262,120 301,96 340,120" fill="none" stroke="#6b7a88" stroke-width="1.4"/>
  <text x="301" y="146" text-anchor="middle" font-size="12" fill="#6b7a88">stock:</text>
  <text x="301" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#33475b">almost none</text>
  <text x="177" y="249" text-anchor="middle" font-size="12" font-style="italic" fill="#33475b">relies on suppliers delivering on time</text>

  <!-- KAIZEN -->
  <text x="543" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#16283c">Kaizen cycle</text>
  <circle cx="543" cy="142" r="78" fill="none" stroke="#cfe4dd" stroke-width="10"/>
  <path d="M580,74 A78,78 0 0 1 616,120" fill="none" stroke="#0f7b6c" stroke-width="2" marker-end="url(#at)"/>
  <path d="M614,170 A78,78 0 0 1 595,200" fill="none" stroke="#0f7b6c" stroke-width="2" marker-end="url(#at)"/>
  <path d="M508,212 A78,78 0 0 1 470,168" fill="none" stroke="#0f7b6c" stroke-width="2" marker-end="url(#at)"/>
  <path d="M470,114 A78,78 0 0 1 489,86" fill="none" stroke="#0f7b6c" stroke-width="2" marker-end="url(#at)"/>
  <text x="543" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b5f54">continuous</text>
  <text x="543" y="155" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b5f54">improvement</text>
  <g font-size="12.5" fill="#16283c" text-anchor="middle">
    <rect x="483" y="46" width="120" height="36" rx="5" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="543" y="61">spot a small</text><text x="543" y="75">problem or waste</text>
    <rect x="596" y="124" width="112" height="36" rx="5" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="652" y="139">workers suggest</text><text x="652" y="153">an improvement</text>
    <rect x="483" y="204" width="120" height="36" rx="5" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="543" y="219">make the</text><text x="543" y="233">small change</text>
    <rect x="378" y="124" width="112" height="36" rx="5" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.4"/>
    <text x="434" y="139">check the result,</text><text x="434" y="153">then repeat</text>
  </g>
</svg>

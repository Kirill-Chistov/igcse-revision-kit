<text x="200.0" y="214.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="400" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">equal arrows = equal pressure</text>
<text x="612.0" y="22.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700">(b) Pressure increases with depth</text>

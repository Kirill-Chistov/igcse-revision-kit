<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="A boiling tube of yeast in glucose solution under a layer of oil stands in a water bath with a thermometer. A delivery tube carries gas into a test tube of limewater, where bubbles are counted. Method: boil and cool glucose solution; add yeast and oil; equilibrate in the water bath; count bubbles for one minute; repeat at other temperatures." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .yp-t { font-size: 12.5px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.06em; }
    .yp-l { font-size: 12px; font-weight: 700; }
    .yp-s { font-size: 12px; fill: #33475b; }
    .yp-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>
  <!-- bench -->
  <line x1="6" y1="250" x2="400" y2="250" stroke="#8a6a3a" stroke-width="2"/>
  <!-- water bath -->
  <rect x="20" y="130" width="250" height="120" fill="#f4f7f9" stroke="#33475b" stroke-width="2"/>
  <rect x="22" y="145" width="246" height="103" fill="#dcecf7"/>
  <line x1="22" y1="145" x2="268" y2="145" stroke="#6b9fd4" stroke-width="1.2"/>
  <!-- boiling tube -->
  <path d="M95,72 L95,223 A15,15 0 0 0 125,223 L125,72" fill="#ffffff" stroke="#33475b" stroke-width="1.8"/>
  <path d="M96.5,118 L96.5,223 A13.5,13.5 0 0 0 123.5,223 L123.5,118 Z" fill="#f3e3a8"/>
  <rect x="96.5" y="108" width="27" height="10" fill="#e0a83c"/>
  <g fill="#b08a3a"><circle cx="104" cy="140" r="1.6"/><circle cx="115" cy="152" r="1.6"/><circle cx="108" cy="170" r="1.6"/><circle cx="118" cy="186" r="1.6"/><circle cx="103" cy="200" r="1.6"/><circle cx="112" cy="214" r="1.6"/><circle cx="117" cy="228" r="1.6"/><circle cx="106" cy="230" r="1.6"/></g>
  <rect x="91" y="58" width="38" height="16" rx="2" fill="#4a3b2f"/>
  <!-- delivery tube -->
  <path d="M110,58 L110,34 L330,34 L330,226" fill="none" stroke="#33475b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M110,58 L110,34 L330,34 L330,226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <!-- test tube with limewater -->
  <path d="M315,100 L315,228 A15,15 0 0 0 345,228 L345,100" fill="#ffffff" stroke="#33475b" stroke-width="1.8"/>
  <path d="M316.5,150 L316.5,228 A13.5,13.5 0 0 0 343.5,228 L343.5,150 Z" fill="#e9eef2"/>
  <g fill="none" stroke="#6b7a88" stroke-width="1.1"><circle cx="333" cy="208" r="3"/><circle cx="330" cy="190" r="3.5"/><circle cx="334" cy="170" r="3"/></g>
  <!-- thermometer -->
  <rect x="249" y="70" width="7" height="160" rx="3.5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/>
  <circle cx="252.5" cy="232" r="6" fill="#c0392b"/>
  <line x1="252.5" y1="232" x2="252.5" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <!-- labels -->
  <text class="yp-s" x="252" y="62" text-anchor="middle">thermometer</text>
  <line x1="126" y1="113" x2="158" y2="100" stroke="#6b7a88" stroke-width="1"/>
  <text class="yp-l" x="162" y="96">oil layer:</text>
  <text class="yp-s" x="162" y="110">keeps O₂ out</text>
  <line x1="126" y1="188" x2="152" y2="188" stroke="#6b7a88" stroke-width="1"/>
  <text class="yp-l" x="156" y="176">yeast in</text>
  <text class="yp-l" x="156" y="190">glucose</text>
  <text class="yp-l" x="156" y="204">solution</text>
  <text class="yp-s" x="145" y="268" text-anchor="middle">water bath at a set temperature</text>
  <text class="yp-l" x="330" y="268" text-anchor="middle">limewater</text>
  <text class="yp-s" x="330" y="282" text-anchor="middle">count bubbles</text>
  <!-- method -->
  <line x1="410" y1="8" x2="410" y2="282" stroke="#dfe5ea" stroke-width="1.4"/>
  <text class="yp-t" x="428" y="24">METHOD</text>
  <g>
    <circle cx="436" cy="50" r="8" fill="#0f7b6c"/><text class="yp-n" x="436" y="54" text-anchor="middle">1</text>
    <text class="yp-s" x="452" y="54">Boil glucose solution to remove oxygen; cool it.</text>
    <circle cx="436" cy="84" r="8" fill="#0f7b6c"/><text class="yp-n" x="436" y="88" text-anchor="middle">2</text>
    <text class="yp-s" x="452" y="88">Add yeast; pour a layer of oil on top; fit the</text>
    <text class="yp-s" x="452" y="103">bung and delivery tube.</text>
    <circle cx="436" cy="133" r="8" fill="#0f7b6c"/><text class="yp-n" x="436" y="137" text-anchor="middle">3</text>
    <text class="yp-s" x="452" y="137">Stand the tube in a water bath at 20 °C for</text>
    <text class="yp-s" x="452" y="152">5 minutes so it reaches that temperature.</text>
    <circle cx="436" cy="182" r="8" fill="#0f7b6c"/><text class="yp-n" x="436" y="186" text-anchor="middle">4</text>
    <text class="yp-s" x="452" y="186">Count the bubbles entering the limewater</text>
    <text class="yp-s" x="452" y="201">in 1 minute.</text>
    <circle cx="436" cy="231" r="8" fill="#0f7b6c"/><text class="yp-n" x="436" y="235" text-anchor="middle">5</text>
    <text class="yp-s" x="452" y="235">Repeat at 30, 40, 50 and 60 °C. Repeat each</text>
    <text class="yp-s" x="452" y="250">temperature and calculate a mean.</text>
  </g>
</svg>

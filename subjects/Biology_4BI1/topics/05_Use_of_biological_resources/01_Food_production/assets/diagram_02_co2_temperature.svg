<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-label="Graph A: rate of photosynthesis against carbon dioxide concentration at 15 and 25 degrees Celsius; both curves rise then level off, the 25 degree curve at a higher rate. Graph B: rate against temperature rises to an optimum and then falls steeply as enzymes denature." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .ct-t { font-size: 12.5px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .ct-a { font-size: 12px; fill: #33475b; }
    .ct-l { font-size: 12px; font-weight: 700; }
    .ct-n { font-size: 11.5px; fill: #33475b; font-style: italic; }
  </style>
  <defs>
    <marker id="ct-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
  </defs>
  <!-- Panel A -->
  <text class="ct-t" x="8" y="16">A  INCREASING CARBON DIOXIDE</text>
  <line x1="50" y1="215" x2="352" y2="215" stroke="#33475b" stroke-width="1.6" marker-end="url(#ct-ar)"/>
  <line x1="50" y1="215" x2="50" y2="32" stroke="#33475b" stroke-width="1.6" marker-end="url(#ct-ar)"/>
  <text class="ct-a" x="200" y="236" text-anchor="middle">carbon dioxide concentration</text>
  <text class="ct-a" x="0" y="0" transform="translate(36 124) rotate(-90)" text-anchor="middle">rate of photosynthesis</text>
  <path d="M52,212 C90,130 140,62 215,61 L345,60" fill="none" stroke="#0f7b6c" stroke-width="3"/>
  <path d="M52,212 C90,160 125,122 185,121 L345,121" fill="none" stroke="#6b9fd4" stroke-width="3"/>
  <text class="ct-l" x="345" y="52" text-anchor="end" style="fill:#0b5f54">25 °C</text>
  <text class="ct-l" x="345" y="113" text-anchor="end" style="fill:#3b6fa8">15 °C</text>
  <text class="ct-n" x="150" y="184" text-anchor="middle">rising: CO₂ is the</text>
  <text class="ct-n" x="150" y="198" text-anchor="middle">limiting factor</text>
  <line x1="120" y1="172" x2="95" y2="150" stroke="#6b7a88" stroke-width="1" marker-end="url(#ct-ar)"/>
  <text class="ct-n" x="262" y="150" text-anchor="middle">level: another factor</text>
  <text class="ct-n" x="262" y="164" text-anchor="middle">(temperature, light) limits</text>
  <line x1="262" y1="138" x2="262" y2="126" stroke="#6b7a88" stroke-width="1" marker-end="url(#ct-ar)"/>
  <!-- divider -->
  <line x1="384" y1="6" x2="384" y2="256" stroke="#dfe5ea" stroke-width="1.4"/>
  <!-- Panel B -->
  <text class="ct-t" x="404" y="16">B  INCREASING TEMPERATURE</text>
  <line x1="446" y1="215" x2="748" y2="215" stroke="#33475b" stroke-width="1.6" marker-end="url(#ct-ar)"/>
  <line x1="446" y1="215" x2="446" y2="32" stroke="#33475b" stroke-width="1.6" marker-end="url(#ct-ar)"/>
  <text class="ct-a" x="596" y="236" text-anchor="middle">temperature</text>
  <text class="ct-a" x="0" y="0" transform="translate(432 124) rotate(-90)" text-anchor="middle">rate of photosynthesis</text>
  <path d="M448,205 C520,190 580,120 628,66 C640,54 650,56 660,72 C675,100 688,170 700,210" fill="none" stroke="#0f7b6c" stroke-width="3"/>
  <line x1="640" y1="58" x2="640" y2="215" stroke="#6b7a88" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ct-l" x="640" y="46" text-anchor="middle">optimum</text>
  <text class="ct-n" x="532" y="118" text-anchor="middle">enzymes work</text>
  <text class="ct-n" x="532" y="132" text-anchor="middle">faster</text>
  <text class="ct-n" x="712" y="118" text-anchor="middle">enzymes</text>
  <text class="ct-n" x="712" y="132" text-anchor="middle">denature</text>
</svg>

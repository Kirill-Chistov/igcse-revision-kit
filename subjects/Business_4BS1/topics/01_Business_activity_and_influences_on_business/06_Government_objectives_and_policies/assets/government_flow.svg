    <text x="612" y="44" font-size="14" font-weight="700" fill="#16283c">Public spending</text>
    <text x="612" y="74" font-weight="700" fill="#16283c">Public services</text>
    <text x="612" y="90">health, education,</text>
    <text x="612" y="106">police, defence</text>
    <text x="612" y="134" font-weight="700" fill="#16283c">Infrastructure</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" font-family="Carlito, Calibri, Lato, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="c4b-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker></defs>
<rect x="4" y="150" width="132" height="64" rx="7" fill="#fbe5c8" stroke="#16283c" stroke-width="1.2"/>
<text x="70.0" y="171.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">hydrocarbon fuel</text>
<text x="70.0" y="187.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#33475b">burned in air</text>
<text x="70.0" y="203.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#33475b">(e.g. car engine)</text>
<line x1="136.0" y1="182.0" x2="176.0" y2="46.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="180" y="18" width="170" height="56" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="265.0" y="43.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">plenty of oxygen</text>
<text x="265.0" y="59.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#33475b">complete combustion</text>
<line x1="350.0" y1="46.0" x2="380.0" y2="46.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="384" y="22" width="160" height="48" rx="7" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<text x="464.0" y="51.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">carbon dioxide + water</text>
<line x1="136.0" y1="182.0" x2="176.0" y2="126.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="180" y="98" width="170" height="56" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="265.0" y="123.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">limited oxygen</text>
<text x="265.0" y="139.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#33475b">incomplete combustion</text>
<line x1="350.0" y1="126.0" x2="380.0" y2="126.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="384" y="102" width="160" height="48" rx="7" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<text x="464.0" y="123.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">carbon monoxide (CO)</text>
<text x="464.0" y="139.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#33475b">and/or carbon (soot) + water</text>
<line x1="544.0" y1="126.0" x2="562.0" y2="126.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<text x="566.0" y="114.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#c0392b">CO is poisonous: it reduces</text>
<text x="566.0" y="129.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#c0392b">the capacity of the blood</text>
<text x="566.0" y="144.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#c0392b">to carry oxygen</text>
<line x1="136.0" y1="182.0" x2="176.0" y2="218.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="180" y="190" width="170" height="56" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="265.0" y="215.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">high temperature in engine</text>
<text x="265.0" y="231.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#33475b">N₂ and O₂ from the air react</text>
<line x1="350.0" y1="218.0" x2="380.0" y2="218.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="384" y="194" width="160" height="48" rx="7" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<text x="464.0" y="223.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">oxides of nitrogen (NOₓ)</text>
<line x1="136.0" y1="182.0" x2="176.0" y2="300.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="180" y="272" width="170" height="56" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="265.0" y="297.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">sulfur impurities</text>
<text x="265.0" y="313.0" font-size="12.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#33475b">in the fuel burn</text>
<line x1="350.0" y1="300.0" x2="380.0" y2="300.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="384" y="276" width="160" height="48" rx="7" fill="#ffffff" stroke="#16283c" stroke-width="1.2"/>
<text x="464.0" y="305.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">sulfur dioxide (SO₂)</text>
<line x1="544.0" y1="218.0" x2="590.0" y2="250.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<line x1="544.0" y1="300.0" x2="590.0" y2="270.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4b-a)"/>
<rect x="594" y="222" width="122" height="78" rx="7" fill="#f6d5d1" stroke="#c0392b" stroke-width="1.3"/>
<text x="655.0" y="242.0" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#16283c">dissolve in</text>
<text x="655.0" y="257.0" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#16283c">rain water →</text>
<text x="655.0" y="272.0" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#16283c">nitric and</text>
<text x="655.0" y="287.0" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#16283c">sulfuric acids</text>
<text x="655.0" y="318.0" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#c0392b">ACID RAIN</text>
</svg>

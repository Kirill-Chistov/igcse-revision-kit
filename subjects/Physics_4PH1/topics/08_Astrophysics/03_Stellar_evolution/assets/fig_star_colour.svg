<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 186" width="820" height="186" role="img" aria-label="Star colours from blue (hottest) through white, yellow and orange to red (coolest) with typical surface temperatures" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/></marker>
</defs>
<defs><linearGradient id="sc" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#5a7df0"/><stop offset="0.25" stop-color="#b9cbff"/>
<stop offset="0.45" stop-color="#f7f7f2"/><stop offset="0.62" stop-color="#ffe680"/>
<stop offset="0.8" stop-color="#ffab4a"/><stop offset="1" stop-color="#e2452f"/></linearGradient></defs>
<g font-family="Carlito, Calibri, sans-serif">
<rect x="60" y="40" width="700" height="44" rx="8" fill="url(#sc)" stroke="#16283c" stroke-width="1.2"/>
<text x="110.0" y="67.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">blue</text>
<text x="250.0" y="67.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">blue-white</text>
<text x="380.0" y="67.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">white</text>
<text x="500.0" y="67.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">yellow</text>
<text x="610.0" y="67.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">orange</text>
<text x="715.0" y="67.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">red</text>
<text x="110.0" y="106.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="400">> 25 000 K</text>
<text x="250.0" y="106.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="400">≈ 15 000 K</text>
<text x="380.0" y="106.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="400">≈ 9000 K</text>
<text x="500.0" y="106.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="400">≈ 6000 K</text>
<text x="610.0" y="106.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="400">≈ 4500 K</text>
<text x="715.0" y="106.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="400">≈ 3000 K</text>
<text x="500.0" y="124.0" font-size="12" fill="#6b7a88" text-anchor="middle" font-weight="400" font-style="italic">e.g. the Sun</text>
<line x1="750.0" y1="152.0" x2="70.0" y2="152.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahr)"/>
<text x="410.0" y="172.0" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">hotter surface: more of the light is short-wavelength (blue), so the star looks bluer</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 224" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
    <g id="tick">
      <circle r="9" fill="#1e8449"/>
      <path d="M-4.5,0.5 L-1.2,4 L4.8,-3.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="4" y="4" width="712" height="106" rx="6" fill="#f8fafb" stroke="#dfe5ea"/>
  <rect x="4" y="116" width="712" height="104" rx="6" fill="#f8fafb" stroke="#dfe5ea"/>

  <!-- QUALITY CONTROL -->
  <text x="16" y="52" font-size="16.5" font-weight="700" fill="#16283c">Quality control</text>
  <text x="16" y="70" font-size="12.5" fill="#33475b">faults found at the end</text>
  <g font-size="13" fill="#16283c" text-anchor="middle">
    <rect x="160" y="44" width="62" height="34" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/><text x="191" y="66">stage 1</text>
    <rect x="238" y="44" width="62" height="34" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/><text x="269" y="66">stage 2</text>
    <rect x="316" y="44" width="62" height="34" rx="5" fill="#ffffff" stroke="#33475b" stroke-width="1.4"/><text x="347" y="66">stage 3</text>
  </g>
  <line x1="222" y1="61" x2="236" y2="61" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="300" y1="61" x2="314" y2="61" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="378" y1="61" x2="400" y2="61" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="406" y="36" width="126" height="50" rx="6" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6"/>
  <text x="469" y="57" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a5720c">Inspectors check</text>
  <text x="469" y="74" text-anchor="middle" font-size="12.5" fill="#a5720c">finished products</text>
  <path d="M536,52 L552,32 L566,32" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M536,72 L552,83 L566,83" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="572" y="14" width="136" height="36" rx="6" fill="#eaf7ef" stroke="#1e8449" stroke-width="1.5"/>
  <text x="640" y="37" text-anchor="middle" font-size="13" fill="#1e8449"><tspan font-weight="700">Pass</tspan> → customers</text>
  <rect x="572" y="62" width="136" height="42" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.5"/>
  <text x="640" y="80" text-anchor="middle" font-size="13" fill="#c0392b"><tspan font-weight="700">Reject</tspan> → scrap or</text>
  <text x="640" y="96" text-anchor="middle" font-size="13" fill="#c0392b">rework (waste)</text>

  <!-- TQM -->
  <text x="16" y="168" font-size="16.5" font-weight="700" fill="#16283c">TQM</text>
  <text x="16" y="186" font-size="12.5" fill="#33475b">quality built in at every</text>
  <text x="16" y="201" font-size="12.5" fill="#33475b">stage, by every worker</text>
  <text x="269" y="138" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1e8449">every worker checks their own work</text>
  <g font-size="13" fill="#16283c" text-anchor="middle">
    <rect x="160" y="158" width="62" height="34" rx="5" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/><text x="191" y="180">stage 1</text>
    <rect x="238" y="158" width="62" height="34" rx="5" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/><text x="269" y="180">stage 2</text>
    <rect x="316" y="158" width="62" height="34" rx="5" fill="#ffffff" stroke="#1e8449" stroke-width="1.6"/><text x="347" y="180">stage 3</text>
  </g>
  <use href="#tick" x="218" y="158"/>
  <use href="#tick" x="296" y="158"/>
  <use href="#tick" x="374" y="158"/>
  <line x1="222" y1="175" x2="236" y2="175" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="300" y1="175" x2="314" y2="175" stroke="#33475b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="378" y1="175" x2="400" y2="175" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="406" y="152" width="302" height="46" rx="6" fill="#eaf7ef" stroke="#1e8449" stroke-width="1.5"/>
  <text x="557" y="172" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e8449">Right first time — zero defects</text>
  <text x="557" y="189" text-anchor="middle" font-size="12.5" fill="#1e8449">→ customers; little scrap or rework</text>
</svg>

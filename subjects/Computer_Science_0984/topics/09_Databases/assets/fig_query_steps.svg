<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Working out the output of an SQL query in three steps: WHERE, SELECT, ORDER BY" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker></defs>
<g font-family="Carlito, Calibri, sans-serif" font-size="14" fill="#16283c">
<rect x="10" y="8" width="800" height="54" rx="6" fill="#f3f5f7" stroke="#c9d3dc"/>
<text x="24" y="30" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13"><tspan font-weight="700" fill="#4c3fa8">SELECT</tspan> Model, DailyRate <tspan font-weight="700" fill="#4c3fa8">FROM</tspan> BIKE</text>
<text x="24" y="50" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13"><tspan font-weight="700" fill="#0f7b6c">WHERE</tspan> Available = TRUE <tspan font-weight="700" fill="#0f7b6c">AND</tspan> DailyRate &lt; 13.00 <tspan font-weight="700" fill="#b7791f">ORDER BY</tspan> DailyRate <tspan font-weight="700" fill="#b7791f">ASC</tspan>;</text>
<circle cx="21" cy="93" r="11" fill="#0f7b6c"/><text x="21" y="98" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">1</text>
<text x="38" y="98" font-weight="700" fill="#0f7b6c">WHERE — test every record</text>
<rect x="10" y="114" width="352" height="26" fill="#0f7b6c"/>
<text x="41.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">BikeID</text>
<text x="126.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Available = TRUE</text>
<text x="236.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">DailyRate &lt; 13.00</text>
<text x="327.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">keep?</text>
<rect x="10" y="140" width="352" height="24" fill="#e7f3ef"/>
<text x="41.0" y="156" text-anchor="middle" font-weight="700" fill="#16283c">B001</text>
<text x="126.0" y="156" text-anchor="middle" font-size="13.5">TRUE <tspan fill="#0f7b6c" font-weight="700">✓</tspan></text>
<text x="236.0" y="156" text-anchor="middle" font-size="13.5">12.50 <tspan fill="#0f7b6c" font-weight="700">✓</tspan></text>
<text x="327.0" y="156" text-anchor="middle" font-weight="700" fill="#0f7b6c">yes</text>
<line x1="10" y1="164" x2="362" y2="164" stroke="#c9d3dc"/>
<text x="41.0" y="180" text-anchor="middle" font-weight="700" fill="#9aa7b3">B002</text>
<text x="126.0" y="180" text-anchor="middle" font-size="13.5">FALSE <tspan fill="#c0392b" font-weight="700">✗</tspan></text>
<text x="236.0" y="180" text-anchor="middle" font-size="13.5">15.00 <tspan fill="#c0392b" font-weight="700">✗</tspan></text>
<text x="327.0" y="180" text-anchor="middle" font-weight="700" fill="#9aa7b3">no</text>
<line x1="10" y1="188" x2="362" y2="188" stroke="#c9d3dc"/>
<rect x="10" y="188" width="352" height="24" fill="#e7f3ef"/>
<text x="41.0" y="204" text-anchor="middle" font-weight="700" fill="#16283c">B003</text>
<text x="126.0" y="204" text-anchor="middle" font-size="13.5">TRUE <tspan fill="#0f7b6c" font-weight="700">✓</tspan></text>
<text x="236.0" y="204" text-anchor="middle" font-size="13.5">9.00 <tspan fill="#0f7b6c" font-weight="700">✓</tspan></text>
<text x="327.0" y="204" text-anchor="middle" font-weight="700" fill="#0f7b6c">yes</text>
<line x1="10" y1="212" x2="362" y2="212" stroke="#c9d3dc"/>
<text x="41.0" y="228" text-anchor="middle" font-weight="700" fill="#9aa7b3">B004</text>
<text x="126.0" y="228" text-anchor="middle" font-size="13.5">TRUE <tspan fill="#0f7b6c" font-weight="700">✓</tspan></text>
<text x="236.0" y="228" text-anchor="middle" font-size="13.5">14.00 <tspan fill="#c0392b" font-weight="700">✗</tspan></text>
<text x="327.0" y="228" text-anchor="middle" font-weight="700" fill="#9aa7b3">no</text>
<line x1="10" y1="236" x2="362" y2="236" stroke="#c9d3dc"/>
<text x="41.0" y="252" text-anchor="middle" font-weight="700" fill="#9aa7b3">B005</text>
<text x="126.0" y="252" text-anchor="middle" font-size="13.5">TRUE <tspan fill="#0f7b6c" font-weight="700">✓</tspan></text>
<text x="236.0" y="252" text-anchor="middle" font-size="13.5">18.50 <tspan fill="#c0392b" font-weight="700">✗</tspan></text>
<text x="327.0" y="252" text-anchor="middle" font-weight="700" fill="#9aa7b3">no</text>
<line x1="10" y1="260" x2="362" y2="260" stroke="#c9d3dc"/>
<text x="41.0" y="276" text-anchor="middle" font-weight="700" fill="#9aa7b3">B006</text>
<text x="126.0" y="276" text-anchor="middle" font-size="13.5">FALSE <tspan fill="#c0392b" font-weight="700">✗</tspan></text>
<text x="236.0" y="276" text-anchor="middle" font-size="13.5">8.00 <tspan fill="#0f7b6c" font-weight="700">✓</tspan></text>
<text x="327.0" y="276" text-anchor="middle" font-weight="700" fill="#9aa7b3">no</text>
<line x1="10" y1="284" x2="362" y2="284" stroke="#c9d3dc"/>
<rect x="10" y="114" width="352" height="170" fill="none" stroke="#16283c" stroke-width="1.3"/>
<text x="10" y="304" font-size="12.5" fill="#33475b">AND: both conditions must be true to keep a record.</text>
<circle cx="411" cy="93" r="11" fill="#4c3fa8"/><text x="411" y="98" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">2</text>
<text x="428" y="98" font-weight="700" fill="#4c3fa8">SELECT — named fields</text>
<rect x="408" y="114" width="180" height="26" fill="#4c3fa8"/>
<text x="460.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Model</text>
<text x="550.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">DailyRate</text>
<text x="460.0" y="156" text-anchor="middle">Trailblazer</text><text x="550.0" y="156" text-anchor="middle">12.50</text>
<line x1="408" y1="164" x2="588" y2="164" stroke="#c9d3dc"/>
<text x="460.0" y="180" text-anchor="middle">CityGo</text><text x="550.0" y="180" text-anchor="middle">9.00</text>
<line x1="408" y1="188" x2="588" y2="188" stroke="#c9d3dc"/>
<rect x="408" y="114" width="180" height="74" fill="none" stroke="#16283c" stroke-width="1.3"/>
<text x="408" y="208" font-size="12.5" fill="#33475b">still in table order</text>
<circle cx="637" cy="93" r="11" fill="#b7791f"/><text x="637" y="98" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">3</text>
<text x="654" y="98" font-weight="700" fill="#b7791f">ORDER BY … ASC</text>
<rect x="634" y="114" width="180" height="26" fill="#4c3fa8"/>
<text x="686.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Model</text>
<text x="776.0" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">DailyRate</text>
<text x="686.0" y="156" text-anchor="middle">CityGo</text><text x="776.0" y="156" text-anchor="middle">9.00</text>
<line x1="634" y1="164" x2="814" y2="164" stroke="#c9d3dc"/>
<text x="686.0" y="180" text-anchor="middle">Trailblazer</text><text x="776.0" y="180" text-anchor="middle">12.50</text>
<line x1="634" y1="188" x2="814" y2="188" stroke="#c9d3dc"/>
<rect x="634" y="114" width="180" height="74" fill="none" stroke="#16283c" stroke-width="2.2"/>
<text x="634" y="208" font-size="12.5" fill="#33475b">smallest DailyRate first</text>
<text x="634" y="228" font-size="13" font-weight="700" fill="#16283c">= the output</text>
<line x1="368" y1="164" x2="402" y2="164" stroke="#16283c" stroke-width="1.8" marker-end="url(#ar2)"/>
<line x1="594" y1="164" x2="628" y2="164" stroke="#16283c" stroke-width="1.8" marker-end="url(#ar2)"/>
</g></svg>
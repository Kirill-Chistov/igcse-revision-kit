<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 322" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ldc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="ldc-art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker><marker id="ldc-arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker><marker id="ldc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="960" height="322" fill="#ffffff"/>
<rect x="8" y="14" width="196" height="34" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.4" />
<text x="106" y="37" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Overgrazing</text>
<line x1="206" y1="31" x2="240" y2="96" stroke="#16283c" stroke-width="1.6" marker-end="url(#ldc-ar)"/>
<rect x="8" y="58" width="196" height="34" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.4" />
<text x="106" y="81" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Overcultivation</text>
<line x1="206" y1="75" x2="240" y2="96" stroke="#16283c" stroke-width="1.6" marker-end="url(#ldc-ar)"/>
<rect x="8" y="102" width="196" height="34" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.4" />
<text x="106" y="125" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Deforestation</text>
<line x1="206" y1="119" x2="240" y2="96" stroke="#16283c" stroke-width="1.6" marker-end="url(#ldc-ar)"/>
<rect x="8" y="146" width="196" height="34" rx="6" fill="#dcecf5" stroke="#2f6f9f" stroke-width="1.4" />
<text x="106" y="169" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Drought / climate change</text>
<line x1="206" y1="163" x2="240" y2="96" stroke="#16283c" stroke-width="1.6" marker-end="url(#ldc-ar)"/>
<rect x="244" y="58" width="150" height="80" rx="8" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6" />
<text x="319" y="84" font-size="17" font-weight="700" fill="#16283c" text-anchor="middle">Vegetation lost</text>
<text x="319" y="106.0" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">bare soil exposed</text>
<rect x="418" y="58" width="150" height="80" rx="8" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6" />
<text x="493" y="84" font-size="17" font-weight="700" fill="#16283c" text-anchor="middle">Soil erosion</text>
<text x="493" y="106.0" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">rain and wind</text>
<text x="493" y="123.08" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">remove topsoil</text>
<rect x="592" y="58" width="150" height="80" rx="8" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.6" />
<text x="667" y="84" font-size="17" font-weight="700" fill="#16283c" text-anchor="middle">Fertility falls</text>
<text x="667" y="106.0" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">less organic matter</text>
<text x="667" y="123.08" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">and water; low yields</text>
<rect x="766" y="58" width="150" height="80" rx="8" fill="#f3e2c7" stroke="#d99a17" stroke-width="1.6" />
<text x="841" y="84" font-size="17" font-weight="700" fill="#16283c" text-anchor="middle">Desertification</text>
<text x="841" y="106.0" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">land abandoned,</text>
<text x="841" y="123.08" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">desert-like</text>
<line x1="394" y1="98" x2="416" y2="98" stroke="#16283c" stroke-width="2.2" marker-end="url(#ldc-ar)"/>
<line x1="568" y1="98" x2="590" y2="98" stroke="#16283c" stroke-width="2.2" marker-end="url(#ldc-ar)"/>
<line x1="742" y1="98" x2="764" y2="98" stroke="#16283c" stroke-width="2.2" marker-end="url(#ldc-ar)"/>
<path d="M841,58 L841,20 L230,20 L210,24" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ldc-arr)"/>
<rect x="420" y="8" width="250" height="22" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="0" />
<text x="545" y="24" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">more pressure on the remaining land</text>
<rect x="8" y="232" width="300" height="80" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6" />
<text x="158" y="256" font-size="16" font-weight="700" fill="#0f7b6c" text-anchor="middle">MANAGE: Reduce pressure</text>
<text x="158" y="278.0" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">smaller herds, rotational grazing,</text>
<text x="158" y="295.08" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">efficient stoves, higher yields</text>
<line x1="158" y1="232" x2="106" y2="192" stroke="#0f7b6c" stroke-width="2" marker-end="url(#ldc-art)"/>
<rect x="330" y="232" width="300" height="80" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6" />
<text x="480" y="256" font-size="16" font-weight="700" fill="#0f7b6c" text-anchor="middle">MANAGE: Keep soil covered</text>
<text x="480" y="278.0" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">trees, cover crops, mulch,</text>
<text x="480" y="295.08" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">agroforestry</text>
<line x1="480" y1="232" x2="319" y2="142" stroke="#0f7b6c" stroke-width="2" marker-end="url(#ldc-art)"/>
<rect x="652" y="232" width="300" height="80" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6" />
<text x="802" y="256" font-size="16" font-weight="700" fill="#0f7b6c" text-anchor="middle">MANAGE: Slow water and wind</text>
<text x="802" y="278.0" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">terraces, contour strips,</text>
<text x="802" y="295.08" font-size="14" font-weight="400" fill="#33475b" text-anchor="middle">stone lines, shelterbelts</text>
<line x1="802" y1="232" x2="493" y2="142" stroke="#0f7b6c" stroke-width="2" marker-end="url(#ldc-art)"/>
</svg>

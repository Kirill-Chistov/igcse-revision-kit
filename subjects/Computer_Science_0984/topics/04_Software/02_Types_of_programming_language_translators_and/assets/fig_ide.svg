<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .code { font-size: 14px; fill: #1e293b; }
    .kw { fill: #0f766e; font-weight: bold; }
    .str { fill: #b45309; }
    .no { font-size: 12px; fill: #94a3b8; }
    .lab { font-size: 13.5px; font-weight: bold; fill: #0f766e; }
    .lead { stroke: #0f766e; stroke-width: 1.1; fill: none; }
    .small { font-size: 12px; fill: #475569; }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="420" height="254" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <rect x="10" y="10" width="420" height="24" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text class="small" x="22" y="27">Program.txt</text>
  <rect x="356" y="14" width="66" height="17" rx="3" fill="#0f766e"/>
  <text x="389" y="27" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">▶ Run</text>

  <!-- editor -->
  <line x1="36" y1="34" x2="36" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <text class="no" x="30" y="56" text-anchor="end">1</text>
  <text class="no" x="30" y="76" text-anchor="end">2</text>
  <text class="no" x="30" y="96" text-anchor="end">3</text>
  <text class="no" x="30" y="136" text-anchor="end">5</text>
  <text class="no" x="30" y="156" text-anchor="end">6</text>
  <text class="no" x="30" y="176" text-anchor="end">7</text>
  <circle cx="17" cy="112" r="4.5" fill="#dc2626"/>
  <text class="no" x="30" y="116" text-anchor="end">4</text>

  <text class="code" x="44" y="56"><tspan class="kw">DECLARE</tspan> Total : <tspan class="kw">INTEGER</tspan></text>
  <text class="code" x="44" y="76">Total ← 0</text>
  <text class="code" x="44" y="96"><tspan class="kw">FOR</tspan> Count ← 1 <tspan class="kw">TO</tspan> 10</text>
  <rect x="38" y="102" width="330" height="19" fill="#fef9c3"/>
  <text class="code" x="72" y="116">Total ← Total + Count</text>
  <text class="code" x="44" y="136"><tspan class="kw">NEXT</tspan> Count</text>
  <text class="code" x="44" y="156"><tspan class="kw">OUTPUT</tspan> <tspan class="str">"Total is "</tspan>, Totl</text>
  <path d="M157,160 q2,3 4,0 t4,0 t4,0 t4,0 t4,0" stroke="#dc2626" stroke-width="1.3" fill="none"/>
  <text class="code" x="44" y="176"><tspan class="kw">OUTPUT</tspan> Tot</text>
  <line x1="116" y1="163" x2="116" y2="179" stroke="#1e293b" stroke-width="1.2"/>

  <!-- auto-correction tooltip -->
  <rect x="204" y="122" width="116" height="22" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1"/>
  <text class="small" x="262" y="137" text-anchor="middle">Did you mean Total?</text>
  <line x1="204" y1="140" x2="178" y2="153" stroke="#b45309" stroke-width="1"/>

  <!-- auto-completion list -->
  <rect x="96" y="182" width="72" height="20" rx="2" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
  <text class="code" x="104" y="197">Total</text>

  <!-- run-time pane -->
  <line x1="10" y1="206" x2="430" y2="206" stroke="#334155" stroke-width="1.2"/>
  <text class="small" x="20" y="224" font-weight="bold">Debugger</text>
  <text class="code" y="248"><tspan x="20">Paused at line 4</tspan><tspan x="160">Count = 3</tspan><tspan x="260">Total = 3</tspan></text>

  <!-- labels -->
  <line class="lead" x1="466" y1="22" x2="424" y2="22"/>
  <text class="lab" x="470" y="27">translators</text>
  <line class="lead" x1="466" y1="62" x2="372" y2="62"/>
  <text class="lab" x="470" y="67">code editor</text>
  <line class="lead" x1="466" y1="92" x2="172" y2="92"/>
  <text class="lab" x="470" y="97">prettyprint</text>
  <line class="lead" x1="466" y1="133" x2="322" y2="133"/>
  <text class="lab" x="470" y="138">auto-correction</text>
  <line class="lead" x1="466" y1="165" x2="182" y2="165"/>
  <text class="lab" x="470" y="169">error diagnostics</text>
  <line class="lead" x1="466" y1="192" x2="170" y2="192"/>
  <text class="lab" x="470" y="197">auto-completion</text>
  <line class="lead" x1="466" y1="236" x2="432" y2="236"/>
  <text class="lab" x="470" y="241">run-time environment</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Von Neumann architecture. Inside the CPU: program counter, memory address register, current instruction register, memory data register, control unit with clock, arithmetic logic unit and accumulator. The MAR connects to RAM by the one-way address bus, the MDR by the two-way data bus, and the control unit by the two-way control bus." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vn-ab { font-size: 16px; font-weight: 700; }
    .vn-fn { font-size: 11.5px; fill: #33475b; }
    .vn-bus { font-size: 13px; font-weight: 700; }
    .vn-bs { font-size: 11px; fill: #33475b; }
    .vn-cap { font-size: 15px; font-weight: 700; fill: #0b5f54; }
    .vn-note { font-size: 11px; fill: #33475b; font-style: italic; }
  </style>
  <defs>
    <marker id="vn-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker>
    <marker id="vn-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a6"/></marker>
  </defs>

  <!-- CPU -->
  <rect x="10" y="10" width="480" height="285" rx="10" fill="#f6f9fb" stroke="#0f7b6c" stroke-width="2"/>
  <text class="vn-cap" x="24" y="32">CPU</text>

  <!-- registers -->
  <g>
    <rect x="30" y="45" width="140" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/>
    <text class="vn-ab" x="100" y="65" text-anchor="middle">PC</text>
    <text class="vn-fn" x="100" y="81" text-anchor="middle">program counter</text>

    <rect x="330" y="45" width="140" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/>
    <text class="vn-ab" x="400" y="65" text-anchor="middle">MAR</text>
    <text class="vn-fn" x="400" y="81" text-anchor="middle">memory address register</text>

    <rect x="30" y="125" width="140" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/>
    <text class="vn-ab" x="100" y="145" text-anchor="middle">CIR</text>
    <text class="vn-fn" x="100" y="161" text-anchor="middle">current instruction register</text>

    <rect x="330" y="125" width="140" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/>
    <text class="vn-ab" x="400" y="145" text-anchor="middle">MDR</text>
    <text class="vn-fn" x="400" y="161" text-anchor="middle">memory data register</text>

    <rect x="350" y="205" width="120" height="44" rx="6" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.4"/>
    <text class="vn-ab" x="407" y="225" text-anchor="middle">ACC</text>
    <text class="vn-fn" x="407" y="241" text-anchor="middle">accumulator</text>
  </g>

  <!-- units -->
  <rect x="30" y="200" width="140" height="54" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="vn-ab" x="100" y="223" text-anchor="middle">CU</text>
  <text class="vn-fn" x="100" y="240" text-anchor="middle">control unit</text>
  <rect x="195" y="262" width="115" height="24" rx="5" fill="#ffffff" stroke="#8a97a6" stroke-width="1.2"/>
  <text class="vn-fn" x="252" y="278" text-anchor="middle">clock (timing signals)</text>

  <rect x="195" y="200" width="115" height="54" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="vn-ab" x="252" y="223" text-anchor="middle">ALU</text>
  <text class="vn-fn" x="252" y="240" text-anchor="middle">arithmetic logic unit</text>

  <!-- internal transfers -->
  <line x1="172" y1="67" x2="326" y2="67" stroke="#8a97a6" stroke-width="1.6" marker-end="url(#vn-ag)"/>
  <text class="vn-bs" x="249" y="60" text-anchor="middle">address copied</text>
  <line x1="328" y1="147" x2="174" y2="147" stroke="#8a97a6" stroke-width="1.6" marker-end="url(#vn-ag)"/>
  <text class="vn-bs" x="249" y="140" text-anchor="middle">instruction copied</text>
  <line x1="100" y1="171" x2="100" y2="196" stroke="#8a97a6" stroke-width="1.6" marker-end="url(#vn-ag)"/>
  <line x1="172" y1="227" x2="191" y2="227" stroke="#8a97a6" stroke-width="1.6" marker-end="url(#vn-ag)"/>
  <line x1="316" y1="227" x2="345" y2="227" stroke="#8a97a6" stroke-width="1.6" marker-start="url(#vn-ag)" marker-end="url(#vn-ag)"/>

  <!-- RAM -->
  <rect x="590" y="30" width="160" height="235" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
  <text class="vn-ab" x="670" y="54" text-anchor="middle" style="fill:#4c3fa8">RAM</text>
  <text class="vn-fn" x="670" y="70" text-anchor="middle">instructions and data</text>
  <g font-size="11">
    <rect x="606" y="82" width="128" height="170" fill="#ffffff" stroke="#4c3fa8" stroke-width="1"/>
    <line x1="660" y1="82" x2="660" y2="252" stroke="#4c3fa8" stroke-width="1"/>
    <text class="vn-bs" x="633" y="97" text-anchor="middle" font-weight="700">address</text>
    <text class="vn-bs" x="697" y="97" text-anchor="middle" font-weight="700">contents</text>
    <line x1="606" y1="104" x2="734" y2="104" stroke="#4c3fa8" stroke-width="1"/>
    <text class="vn-bs" x="633" y="122" text-anchor="middle">0100</text><text class="vn-bs" x="697" y="122" text-anchor="middle">instruction</text>
    <text class="vn-bs" x="633" y="146" text-anchor="middle">0101</text><text class="vn-bs" x="697" y="146" text-anchor="middle">instruction</text>
    <text class="vn-bs" x="633" y="170" text-anchor="middle">0110</text><text class="vn-bs" x="697" y="170" text-anchor="middle">data</text>
    <text class="vn-bs" x="633" y="194" text-anchor="middle">0111</text><text class="vn-bs" x="697" y="194" text-anchor="middle">data</text>
    <text class="vn-bs" x="633" y="218" text-anchor="middle">…</text><text class="vn-bs" x="697" y="218" text-anchor="middle">…</text>
  </g>

  <!-- buses -->
  <line x1="472" y1="67" x2="585" y2="67" stroke="#16283c" stroke-width="3" marker-end="url(#vn-ar)"/>
  <text class="vn-bus" x="530" y="58" text-anchor="middle">Address bus</text>
  <text class="vn-bs" x="530" y="84" text-anchor="middle">one way</text>

  <line x1="476" y1="147" x2="585" y2="147" stroke="#16283c" stroke-width="3" marker-start="url(#vn-ar)" marker-end="url(#vn-ar)"/>
  <text class="vn-bus" x="530" y="138" text-anchor="middle">Data bus</text>
  <text class="vn-bs" x="530" y="164" text-anchor="middle">two way</text>

  <path d="M100,258 L100,318 L670,318 L670,271" fill="none" stroke="#16283c" stroke-width="3" stroke-linejoin="round" marker-start="url(#vn-ar)" marker-end="url(#vn-ar)"/>
  <text class="vn-bus" x="440" y="312" text-anchor="middle">Control bus — two way (control and timing signals)</text>
</svg>

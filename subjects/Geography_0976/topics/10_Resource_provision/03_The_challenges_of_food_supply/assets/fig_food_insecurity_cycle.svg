<text x="790" y="42" font-size="19" font-weight="700" fill="#16283c" text-anchor="middle">Weakened health</text>
<text x="790" y="65" font-size="15" font-weight="400" fill="#33475b" text-anchor="middle">illness, stunting, poor concentration</text>

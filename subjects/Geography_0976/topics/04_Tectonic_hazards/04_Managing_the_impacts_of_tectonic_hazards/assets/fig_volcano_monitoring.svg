<polygon points="386.0,170.0 387.6,173.8 391.7,174.1 388.6,176.8 389.5,180.9 386.0,178.7 382.5,180.9 383.4,176.8 380.3,174.1 384.4,173.8" fill="#d99a17" stroke="#16283c" stroke-width="0.6"/>

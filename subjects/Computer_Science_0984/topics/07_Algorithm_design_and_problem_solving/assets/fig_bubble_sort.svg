    <rect x="596" y="84" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="616" y="107" text-anchor="middle">1</text>
    <rect x="640" y="84" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="660" y="107" text-anchor="middle">4</text>
    <rect x="684" y="84" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="704" y="107" text-anchor="middle">2</text>
    <rect x="728" y="84" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="748" y="107" text-anchor="middle">5</text>
    <rect x="772" y="84" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="792" y="107" text-anchor="middle" font-weight="700">8</text>
    <text x="450" y="155" font-size="16">After pass 2</text>
    <rect x="596" y="132" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="616" y="155" text-anchor="middle">1</text>
    <rect x="640" y="132" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="660" y="155" text-anchor="middle">2</text>
    <rect x="684" y="132" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="704" y="155" text-anchor="middle">4</text>
    <rect x="728" y="132" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="748" y="155" text-anchor="middle" font-weight="700">5</text>
    <rect x="772" y="132" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="792" y="155" text-anchor="middle" font-weight="700">8</text>
    <text x="450" y="203" font-size="16">After pass 3</text>
    <rect x="596" y="180" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="616" y="203" text-anchor="middle" font-weight="700">1</text>
    <rect x="640" y="180" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="660" y="203" text-anchor="middle" font-weight="700">2</text>
    <rect x="684" y="180" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="704" y="203" text-anchor="middle" font-weight="700">4</text>
    <rect x="728" y="180" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="748" y="203" text-anchor="middle" font-weight="700">5</text>
    <rect x="772" y="180" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="792" y="203" text-anchor="middle" font-weight="700">8</text>
    <text x="450" y="244" font-size="16">Pass 3 makes <tspan font-weight="700">no swaps</tspan>, so the list</text>

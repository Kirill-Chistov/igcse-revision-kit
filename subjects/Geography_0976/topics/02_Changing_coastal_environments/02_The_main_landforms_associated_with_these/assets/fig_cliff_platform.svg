<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="Three stages in the formation of a wave-cut notch, cliff retreat and a wave-cut platform">
  <defs>
    <marker id="cp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#16283c" transform="translate(0,-30)">
    <!-- panel 1 -->
    <g>
      <rect x="0" y="140" width="260" height="80" fill="#cfe3ee"/>
      <path d="M150,70 L260,70 L260,220 L0,220 L0,208 L150,196 L150,184 Q180,167 150,150 Z" fill="#c9bea7" stroke="#7a6f5c" stroke-width="1.5"/>
      <rect x="150" y="64" width="110" height="7" fill="#8fb069"/>
      <line x1="0" y1="140" x2="150" y2="140" stroke="#2c6e91" stroke-width="1.3" stroke-dasharray="5 3"/>
      <line x1="0" y1="186" x2="150" y2="186" stroke="#2c6e91" stroke-width="1.3" stroke-dasharray="5 3"/>
      <text x="4" y="135" font-size="11.5" fill="#2c6e91">high tide</text>
      <text x="4" y="181" font-size="11.5" fill="#2c6e91">low tide</text>
      <path d="M120,125 L160,164" stroke="#16283c" stroke-width="1.2" marker-end="url(#cp-arr)"/>
      <text x="118" y="120" font-size="13" font-weight="700" text-anchor="end">wave-cut notch</text>
      <text x="200" y="115" font-size="15" font-weight="700" text-anchor="middle">cliff</text>
    </g>
    <!-- panel 2 -->
    <g transform="translate(280,0)">
      <rect x="0" y="140" width="260" height="80" fill="#cfe3ee"/>
      <path d="M150,70 L260,70 L260,220 L0,220 L0,208 L150,196 L150,188 L205,176 Q215,160 196,146 L150,142 Z" fill="#c9bea7" stroke="#7a6f5c" stroke-width="1.5"/>
      <rect x="150" y="64" width="110" height="7" fill="#8fb069"/>
      <path d="M198,146 L190,70" stroke="#8e2a1f" stroke-width="1.6" stroke-dasharray="5 3"/>
      <g fill="#a99f8a" stroke="#6d6453" stroke-width="1">
        <path d="M112,198 l12,-9 l10,5 l-2,6 z"/><path d="M132,196 l9,-8 l9,4 l0,6 z"/><path d="M96,200 l7,-6 l8,4 z"/>
      </g>
      <text x="142" y="92" font-size="13" font-weight="700" fill="#8e2a1f" text-anchor="end">overhang</text>
      <text x="142" y="107" font-size="13" font-weight="700" fill="#8e2a1f" text-anchor="end">collapses</text>
      <text x="96" y="186" font-size="12" text-anchor="middle" fill="#6b4f16">debris removed</text>
    </g>
    <!-- panel 3 -->
    <g transform="translate(560,0)">
      <rect x="0" y="140" width="260" height="80" fill="#cfe3ee"/>
      <path d="M215,70 L260,70 L260,220 L0,220 L0,200 L60,194 L215,182 L215,176 Q232,162 215,150 Z" fill="#c9bea7" stroke="#7a6f5c" stroke-width="1.5"/>
      <rect x="215" y="64" width="45" height="7" fill="#8fb069"/>
      <path d="M150,70 L150,136" stroke="#6b7a88" stroke-width="1.3" stroke-dasharray="3 3"/>
      <line x1="152" y1="90" x2="208" y2="90" stroke="#16283c" stroke-width="1.6" marker-end="url(#cp-arr)"/>
      <text x="146" y="86" font-size="12" text-anchor="end" fill="#33475b">old cliff</text>
      <text x="146" y="100" font-size="12" text-anchor="end" fill="#33475b">position</text>
      <text x="180" y="82" font-size="12.5" font-weight="700" text-anchor="middle">retreat</text>
      <path d="M110,175 L110,188" stroke="#16283c" stroke-width="1.2" marker-end="url(#cp-arr)"/>
      <text x="100" y="160" font-size="13" font-weight="700" text-anchor="middle">wave-cut platform</text>
      <text x="100" y="173" font-size="11.5" text-anchor="middle" fill="#33475b">exposed at low tide</text>
    </g>
    <!-- captions -->
    <g font-size="13.5">
      <text x="0" y="252"><tspan font-weight="700">1</tspan> Destructive waves attack the cliff</text>
      <text x="0" y="268">base between high and low tide by</text>
      <text x="0" y="284">hydraulic action and corrasion.</text>
      <text x="280" y="252"><tspan font-weight="700">2</tspan> The notch deepens until the</text>
      <text x="280" y="268">unsupported overhang collapses;</text>
      <text x="280" y="284">waves carry the rock debris away.</text>
      <text x="560" y="252"><tspan font-weight="700">3</tspan> Repeated, the cliff retreats inland,</text>
      <text x="560" y="268">leaving a gently sloping, rocky</text>
      <text x="560" y="284">wave-cut platform in front of it.</text>
    </g>
  </g>
</svg>

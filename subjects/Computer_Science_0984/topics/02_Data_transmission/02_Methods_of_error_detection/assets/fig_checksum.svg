<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="680" height="150" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Checksum process">
<defs><marker id="ck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="ckg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="ckr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs>
<text x="131" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">SENDER</text>
<text x="400" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">RECEIVER</text>
<line x1="265" y1="4" x2="265" y2="146" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="4" y="30" width="130" height="90" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="69.0" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">Calculates a</text>
<text x="69.0" y="71.2" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">checksum from</text>
<text x="69.0" y="87.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">the block using</text>
<text x="69.0" y="103.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">an agreed algorithm</text>
<rect x="150" y="30" width="104" height="90" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="202.0" y="63.1" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">Sends the</text>
<text x="202.0" y="79.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">block with</text>
<text x="202.0" y="95.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">the checksum</text>
<rect x="276" y="30" width="128" height="90" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="340.0" y="55.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">Recalculates the</text>
<text x="340.0" y="71.2" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">checksum from the</text>
<text x="340.0" y="87.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">received block</text>
<text x="340.0" y="103.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">(same algorithm)</text>
<rect x="420" y="30" width="100" height="90" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="470.0" y="63.1" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">Compares</text>
<text x="470.0" y="79.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">the two</text>
<text x="470.0" y="95.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#134e4a">checksums</text>
<rect x="540" y="22" width="136" height="48" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="608.0" y="42.2" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Same:</text>
<text x="608.0" y="58.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">no error detected</text>
<rect x="540" y="80" width="136" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="608.0" y="97.1" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Different: error —</text>
<text x="608.0" y="113.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">the block is</text>
<text x="608.0" y="129.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">re-sent</text>
<line x1="135" y1="75" x2="147" y2="75" stroke="#0f766e" stroke-width="2.2" marker-end="url(#ck)"/>
<line x1="255" y1="75" x2="273" y2="75" stroke="#0f766e" stroke-width="2.2" marker-end="url(#ck)"/>
<line x1="405" y1="75" x2="417" y2="75" stroke="#0f766e" stroke-width="2.2" marker-end="url(#ck)"/>
<line x1="521" y1="68" x2="537" y2="50" stroke="#0f766e" stroke-width="2.2" marker-end="url(#ck)"/>
<line x1="521" y1="82" x2="537" y2="104" stroke="#0f766e" stroke-width="2.2" marker-end="url(#ck)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="gf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-size="12.5" fill="#33475b" text-anchor="middle">
    <rect x="10" y="20" width="190" height="56" rx="8" fill="#ffffff" stroke="#16283c" stroke-width="1.4"/>
    <text x="105" y="44" font-size="14" font-weight="700" fill="#16283c">Consumers</text>
    <text x="105" y="62">(households)</text>
    <rect x="10" y="164" width="190" height="56" rx="8" fill="#ffffff" stroke="#16283c" stroke-width="1.4"/>
    <text x="105" y="197" font-size="14" font-weight="700" fill="#16283c">Businesses</text>

    <rect x="290" y="92" width="150" height="56" rx="8" fill="#16283c"/>
    <text x="365" y="126" font-size="15" font-weight="700" fill="#ffffff">Government</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="During exercise muscles respire faster, needing more oxygen and glucose and producing more carbon dioxide, so the heart beats faster and more strongly and more blood reaches the muscles each minute. When frightened, stressed or excited the adrenal glands release adrenaline, which increases heart rate so more oxygen and glucose reach the muscles, preparing the body for fight or flight.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .hr-t { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; }
    .hr-s { font-size: 12px; fill: #33475b; }
  </style>
  <text class="hr-t" x="6" y="16" style="fill:#0f7b6c">DURING EXERCISE</text><rect x="6" y="24" width="172" height="58" rx="7" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.6"/><text class="hr-s" x="92.0" y="46" text-anchor="middle">muscles contract more,</text><text class="hr-s" x="92.0" y="61" text-anchor="middle">so respire faster</text><path d="M180,53 L190,53" stroke="#0f7b6c" stroke-width="2.4"/><path d="M197,53 l-8,-5 v10z" fill="#0f7b6c"/><rect x="198" y="24" width="172" height="58" rx="7" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.6"/><text class="hr-s" x="284.0" y="46" text-anchor="middle">need more O₂ and glucose;</text><text class="hr-s" x="284.0" y="61" text-anchor="middle">more CO₂ to remove</text><path d="M372,53 L382,53" stroke="#0f7b6c" stroke-width="2.4"/><path d="M389,53 l-8,-5 v10z" fill="#0f7b6c"/><rect x="390" y="24" width="172" height="58" rx="7" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.6"/><text class="hr-s" x="476.0" y="46" text-anchor="middle">heart beats faster</text><text class="hr-s" x="476.0" y="61" text-anchor="middle">and more strongly</text><path d="M564,53 L574,53" stroke="#0f7b6c" stroke-width="2.4"/><path d="M581,53 l-8,-5 v10z" fill="#0f7b6c"/><rect x="582" y="24" width="172" height="58" rx="7" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.6"/><text class="hr-s" x="668.0" y="46" text-anchor="middle">more blood reaches the</text><text class="hr-s" x="668.0" y="61" text-anchor="middle">muscles each minute</text>
  <text class="hr-t" x="6" y="108" style="fill:#4c3fa8">ADRENALINE</text><rect x="6" y="116" width="172" height="58" rx="7" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.6"/><text class="hr-s" x="92.0" y="138" text-anchor="middle">fright, stress or</text><text class="hr-s" x="92.0" y="153" text-anchor="middle">excitement</text><path d="M180,145 L190,145" stroke="#4c3fa8" stroke-width="2.4"/><path d="M197,145 l-8,-5 v10z" fill="#4c3fa8"/><rect x="198" y="116" width="172" height="58" rx="7" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.6"/><text class="hr-s" x="284.0" y="138" text-anchor="middle">adrenal glands</text><text class="hr-s" x="284.0" y="153" text-anchor="middle">release adrenaline</text><path d="M372,145 L382,145" stroke="#4c3fa8" stroke-width="2.4"/><path d="M389,145 l-8,-5 v10z" fill="#4c3fa8"/><rect x="390" y="116" width="172" height="58" rx="7" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.6"/><text class="hr-s" x="476.0" y="138" text-anchor="middle">adrenaline increases</text><text class="hr-s" x="476.0" y="153" text-anchor="middle">heart rate</text><path d="M564,145 L574,145" stroke="#4c3fa8" stroke-width="2.4"/><path d="M581,145 l-8,-5 v10z" fill="#4c3fa8"/><rect x="582" y="116" width="172" height="58" rx="7" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.6"/><text class="hr-s" x="668.0" y="138" text-anchor="middle">more O₂ and glucose to</text><text class="hr-s" x="668.0" y="153" text-anchor="middle">muscles: "fight or flight"</text>
</svg>

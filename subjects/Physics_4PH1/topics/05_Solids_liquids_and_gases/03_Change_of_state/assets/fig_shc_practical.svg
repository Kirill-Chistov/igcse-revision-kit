<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 268" width="820" height="268" role="img" aria-label="Specific heat capacity apparatus: insulated metal block with an immersion heater connected to a joulemeter and low-voltage supply, and a thermometer in a second hole">
<defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 820 250" width="820" height="250" role="img" aria-label="Sequence from crack to cave, arch, stack and stump on a headland">
  <g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
    <!-- 1 crack -->
    <g>
      <path d="M0,50 L150,50 L150,190 L0,190 Z" fill="#d6d1c3" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="0" y="44" width="150" height="7" fill="#8fb069"/>
      <path d="M96,150 L92,136 L99,124 L94,110 L98,98" fill="none" stroke="#2d2a25" stroke-width="3"/>
      <rect x="0" y="150" width="160" height="40" fill="#cfe3ee" fill-opacity="0.85"/>
      <line x1="0" y1="150" x2="160" y2="150" stroke="#2c6e91" stroke-width="1.3"/>
      <line x1="0" y1="172" x2="160" y2="172" stroke="#2c6e91" stroke-width="1.1" stroke-dasharray="4 3"/>
      <text x="4" y="164" font-size="10.5" fill="#2c6e91">high tide</text>
      <text x="4" y="185" font-size="10.5" fill="#2c6e91">low tide</text>
    </g>
    <!-- 2 cave -->
    <g transform="translate(165,0)">
      <path d="M0,50 L150,50 L150,190 L0,190 Z" fill="#d6d1c3" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="0" y="44" width="150" height="7" fill="#8fb069"/>
      <path d="M78,150 Q80,114 97,111 Q114,114 116,150 Z" fill="#3d3a34"/>
      <rect x="0" y="150" width="160" height="40" fill="#cfe3ee" fill-opacity="0.85"/>
      <line x1="0" y1="150" x2="160" y2="150" stroke="#2c6e91" stroke-width="1.3"/>
      <line x1="0" y1="172" x2="160" y2="172" stroke="#2c6e91" stroke-width="1.1" stroke-dasharray="4 3"/>
    </g>
    <!-- 3 arch -->
    <g transform="translate(330,0)">
      <path d="M0,50 L150,50 L150,190 L0,190 Z" fill="#d6d1c3" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="0" y="44" width="150" height="7" fill="#8fb069"/>
      <path d="M72,190 L72,150 Q74,94 97,90 Q120,94 122,150 L122,190 Z" fill="#ffffff" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="0" y="150" width="160" height="40" fill="#cfe3ee" fill-opacity="0.85"/>
      <line x1="0" y1="150" x2="160" y2="150" stroke="#2c6e91" stroke-width="1.3"/>
      <line x1="0" y1="172" x2="160" y2="172" stroke="#2c6e91" stroke-width="1.1" stroke-dasharray="4 3"/>
    </g>
    <!-- 4 stack -->
    <g transform="translate(495,0)">
      <path d="M0,50 L68,50 L70,190 L0,190 Z" fill="#d6d1c3" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="0" y="44" width="68" height="7" fill="#8fb069"/>
      <path d="M100,62 L136,62 L139,190 L97,190 Z" fill="#d6d1c3" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="100" y="56" width="36" height="7" fill="#8fb069"/>
      <g fill="#b3ad9e" stroke="#7d786b" stroke-width="1"><path d="M74,190 l6,-12 l9,4 l2,8 z"/><path d="M142,190 l5,-9 l8,5 l0,4 z"/></g>
      <rect x="0" y="150" width="160" height="40" fill="#cfe3ee" fill-opacity="0.85"/>
      <line x1="0" y1="150" x2="160" y2="150" stroke="#2c6e91" stroke-width="1.3"/>
      <line x1="0" y1="172" x2="160" y2="172" stroke="#2c6e91" stroke-width="1.1" stroke-dasharray="4 3"/>
    </g>
    <!-- 5 stump -->
    <g transform="translate(660,0)">
      <path d="M0,50 L68,50 L70,190 L0,190 Z" fill="#d6d1c3" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="0" y="44" width="68" height="7" fill="#8fb069"/>
      <path d="M100,160 L136,160 L139,190 L97,190 Z" fill="#d6d1c3" stroke="#7d786b" stroke-width="1.5"/>
      <rect x="0" y="150" width="160" height="40" fill="#cfe3ee" fill-opacity="0.85"/>
      <line x1="0" y1="150" x2="160" y2="150" stroke="#2c6e91" stroke-width="1.3"/>
      <line x1="0" y1="172" x2="160" y2="172" stroke="#2c6e91" stroke-width="1.1" stroke-dasharray="4 3"/>
    </g>
    <!-- captions -->
    <g font-size="13">
      <text x="0" y="214" font-size="16" font-weight="700">1 Crack</text>
      <text x="0" y="231">Hydraulic action and</text>
      <text x="0" y="246">corrasion widen a</text>
      <text x="0" y="261">crack (joint or fault).</text>
      <text x="165" y="214" font-size="16" font-weight="700">2 Cave</text>
      <text x="165" y="231">The crack is eroded</text>
      <text x="165" y="246">into a cave.</text>
      <text x="330" y="214" font-size="16" font-weight="700">3 Arch</text>
      <text x="330" y="231">The cave is eroded right</text>
      <text x="330" y="246">through the headland.</text>
      <text x="495" y="214" font-size="16" font-weight="700">4 Stack</text>
      <text x="495" y="231">Erosion and weathering</text>
      <text x="495" y="246">weaken the arch roof</text>
      <text x="495" y="261">until it collapses,</text>
      <text x="495" y="276">leaving an isolated stack.</text>
      <text x="660" y="214" font-size="16" font-weight="700">5 Stump</text>
      <text x="660" y="231">Waves undercut the</text>
      <text x="660" y="246">stack until it collapses</text>
      <text x="660" y="261">into a stump, covered</text>
      <text x="660" y="276">at high tide.</text>
    </g>
  </g>
</svg>

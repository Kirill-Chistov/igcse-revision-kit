  <text class="im-s" x="374" y="196" text-anchor="middle"><tspan font-weight="700">specific</tspan> to the pathogen's antigens;</text>
  <text class="im-s" x="374" y="210" text-anchor="middle">they bind and mark it for destruction</text>

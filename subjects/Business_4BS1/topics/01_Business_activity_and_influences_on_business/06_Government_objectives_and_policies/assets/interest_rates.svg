<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="ir-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16283c"/>
    </marker>
  </defs>
  <rect x="8" y="95" width="122" height="54" rx="8" fill="#16283c"/>
  <text x="69" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Interest</text>
  <text x="69" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">rates rise</text>
  <g font-size="11.5" font-weight="700" fill="#6b7a88" letter-spacing="0.8">
    <text x="165" y="14">BUSINESSES</text>
    <text x="165" y="166">CONSUMERS</text>
  </g>
  <g font-size="12.5" fill="#33475b" text-anchor="middle">
    <rect x="165" y="20" width="175" height="56" rx="7" fill="#ffffff" stroke="#16283c" stroke-width="1.4"/>
    <text x="252" y="44">Borrowing costs more</text>
    <text x="252" y="61">(loans, overdrafts)</text>
    <rect x="370" y="20" width="175" height="56" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.4"/>
    <text x="457" y="44">Costs rise, profit falls;</text>
    <text x="457" y="61">investment is put off</text>

    <rect x="165" y="172" width="175" height="60" rx="7" fill="#ffffff" stroke="#16283c" stroke-width="1.4"/>
    <text x="252" y="190">Loan and mortgage</text>
    <text x="252" y="206">repayments rise;</text>
    <text x="252" y="222">saving pays more</text>
    <rect x="370" y="172" width="175" height="60" rx="7" fill="#ffffff" stroke="#16283c" stroke-width="1.4"/>
    <text x="457" y="190">Less disposable income;</text>
    <text x="457" y="206">more is saved →</text>
    <text x="457" y="222">consumer spending falls</text>
    <rect x="575" y="172" width="137" height="60" rx="7" fill="#fdeded" stroke="#c0392b" stroke-width="1.4"/>
    <text x="643" y="190">Sales fall, esp.</text>
    <text x="643" y="206">goods bought on</text>
    <text x="643" y="222">credit, e.g. cars</text>
  </g>
  <g stroke="#16283c" stroke-width="1.7" fill="none">
    <line x1="132" y1="112" x2="162" y2="62" marker-end="url(#ir-arr)"/>
    <line x1="132" y1="132" x2="162" y2="186" marker-end="url(#ir-arr)"/>
    <line x1="342" y1="48" x2="366" y2="48" marker-end="url(#ir-arr)"/>
    <line x1="342" y1="202" x2="366" y2="202" marker-end="url(#ir-arr)"/>
    <line x1="547" y1="202" x2="571" y2="202" marker-end="url(#ir-arr)"/>
  </g>
  <line x1="643" y1="168" x2="545" y2="66" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ir-arr)"/>
  <text x="608" y="110" font-size="11.5" fill="#c0392b">lower revenue</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 136" font-family="Carlito, Calibri, sans-serif" role="img">
<title>Step-up and step-down transformers in electricity transmission</title>
<g transform="translate(0,-10)">
<rect x="14" y="44" width="76" height="40" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
<rect x="64" y="20" width="12" height="24" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.4"/>
<text x="52.0" y="69.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#16283c">power station</text>
<rect x="126" y="42" width="84" height="44" rx="4" fill="#cfd4d9" stroke="#6b7a88" stroke-width="1.4"/>
<text x="168.0" y="61.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#16283c">step-up</text>
<text x="168.0" y="76.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#16283c">transformer</text>
<rect x="490" y="42" width="84" height="44" rx="4" fill="#cfd4d9" stroke="#6b7a88" stroke-width="1.4"/>
<text x="532.0" y="61.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#16283c">step-down</text>
<text x="532.0" y="76.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#16283c">transformer</text>
<line x1="90" y1="64" x2="126" y2="64" stroke="#16283c" stroke-width="1.8"/>
<line x1="574" y1="64" x2="612" y2="64" stroke="#16283c" stroke-width="1.8"/>
<path d="M 210,56 Q 270,72 330,56 Q 390,72 450,56 L 490,56" fill="none" stroke="#16283c" stroke-width="1.4"/>
<path d="M 210,68 Q 270,84 330,68 Q 390,84 450,68 L 490,68" fill="none" stroke="#16283c" stroke-width="1.4"/>
<path d="M 318,100 L 330,40 L 342,100 M 314,56 H 346 M 318,68 H 342" fill="none" stroke="#6b7a88" stroke-width="1.6"/>
<path d="M 438,100 L 450,40 L 462,100 M 434,56 H 466 M 438,68 H 462" fill="none" stroke="#6b7a88" stroke-width="1.6"/>
<path d="M 612,86 V 56 L 645,30 L 678,56 V 86 Z" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.4"/>
<text x="645.0" y="72.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#16283c">homes</text>
<text x="52.0" y="116.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">generates a.c.</text>
<text x="168.0" y="116.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">voltage ↑ to</text>
<text x="168.0" y="129.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">hundreds of kV,</text>
<text x="168.0" y="142.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">current ↓</text>
<text x="390.0" y="116.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">high voltage, small current:</text>
<text x="390.0" y="129.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">little energy wasted</text>
<text x="532.0" y="116.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">voltage ↓</text>
<text x="532.0" y="129.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#33475b">to 230 V</text>
</g>
</svg>

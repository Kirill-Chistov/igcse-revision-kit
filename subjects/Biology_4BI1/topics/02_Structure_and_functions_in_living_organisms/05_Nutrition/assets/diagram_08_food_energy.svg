<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Measuring the energy in food: a boiling tube clamped on a stand holds a measured volume of water with a thermometer; a weighed piece of food is lit and held on a mounted needle under the tube until it has burned completely; the temperature rise of the water is recorded.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .fe-l { font-size: 12.5px; font-weight: 700; }
    .fe-s { font-size: 12px; fill: #33475b; }
    .fe-ld { fill: none; stroke: #8fa3b8; stroke-width: 1.1; }
  </style>
  <!-- stand -->
  <rect x="80" y="192" width="120" height="10" fill="#33475b"/>
  <path d="M100,192 L100,20" stroke="#33475b" stroke-width="5"/>
  <path d="M100,60 L186,60" stroke="#33475b" stroke-width="4"/>
  <!-- boiling tube -->
  <path d="M190,24 L190,120 A12,12 0 0 0 214,120 L214,24" fill="#ffffff" stroke="#33475b" stroke-width="1.8"/>
  <path d="M191,70 L191,120 A11,11 0 0 0 213,120 L213,70 Z" fill="#dcecf7"/>
  <rect x="184" y="54" width="36" height="12" rx="3" fill="#6b7a88"/>
  <!-- thermometer -->
  <path d="M202,6 L202,118" stroke="#33475b" stroke-width="4" stroke-linecap="round"/>
  <path d="M202,84 L202,118" stroke="#c0392b" stroke-width="2"/>
  <circle cx="202" cy="120" r="4" fill="#c0392b"/>
  <!-- food on needle -->
  <path d="M300,176 L210,166" stroke="#33475b" stroke-width="2"/>
  <rect x="296" y="170" width="40" height="12" rx="3" fill="#b86e12"/>
  <ellipse cx="206" cy="166" rx="8" ry="6" fill="#d9b98a" stroke="#8a6a3a" stroke-width="1"/>
  <path d="M198,160 C194,150 204,146 202,136 C212,146 214,152 210,160 Z" fill="#f0a030"/>
  <!-- labels -->
  <path class="fe-ld" d="M260,40 L206,40"/>
  <text class="fe-l" x="264" y="36">thermometer</text>
  <text class="fe-s" x="264" y="50">record the starting and highest temperature</text>
  <path class="fe-ld" d="M260,96 L214,96"/>
  <text class="fe-l" x="264" y="92">boiling tube with a measured volume of water</text>
  <text class="fe-s" x="264" y="106">e.g. 20 cm³ (= 20 g)</text>
  <path class="fe-ld" d="M260,150 L214,158"/>
  <text class="fe-l" x="264" y="146">weighed food sample, burning</text>
  <text class="fe-s" x="264" y="160">on a mounted needle; relight until it no longer burns</text>
  <text class="fe-s" x="350" y="190">same volume of water and same distance from the tube each time</text>
</svg>

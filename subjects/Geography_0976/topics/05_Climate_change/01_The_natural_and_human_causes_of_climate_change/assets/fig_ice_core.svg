<text x="70" y="342" font-size="11.5" fill="#6b7a88" text-anchor="middle">deep: oldest</text>
<line x1="112" y1="70" x2="140" y2="70" stroke="#16283c" stroke-width="1.3" marker-end="none"/>
<circle cx="112" cy="70" r="2.5" fill="#16283c"/>
<text x="146" y="62" font-size="13" font-weight="700" fill="#0b5f54">Layers</text>
<text x="146" y="78" font-size="12" fill="#33475b">Each year’s snowfall forms a layer.</text>
<text x="146" y="93" font-size="12" fill="#33475b">Count the layers to date the ice.</text>
<line x1="112" y1="168" x2="140" y2="168" stroke="#16283c" stroke-width="1.3" marker-end="none"/>
<circle cx="112" cy="168" r="2.5" fill="#16283c"/>
<text x="146" y="160" font-size="13" font-weight="700" fill="#0b5f54">Air bubbles</text>
<text x="146" y="176" font-size="12" fill="#33475b">Air trapped as snow turned to ice is a</text>
<text x="146" y="191" font-size="12" fill="#33475b">sample of the old atmosphere → CO₂ level.</text>
<line x1="112" y1="263" x2="140" y2="263" stroke="#16283c" stroke-width="1.3" marker-end="none"/>
<circle cx="112" cy="263" r="2.5" fill="#16283c"/>
<text x="146" y="255" font-size="13" font-weight="700" fill="#0b5f54">Chemistry of the ice</text>
<text x="146" y="271" font-size="12" fill="#33475b">The oxygen isotope ratio in the ice shows</text>
<text x="146" y="286" font-size="12" fill="#33475b">the temperature when the snow fell.</text>

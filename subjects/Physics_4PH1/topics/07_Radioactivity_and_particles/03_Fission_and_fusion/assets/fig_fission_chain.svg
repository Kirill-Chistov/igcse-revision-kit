<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
  </defs>
  <!-- ===== Panel 1: one fission ===== -->
  <text x="175" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">1 · One fission of uranium-235</text>
  <!-- incoming neutron -->
  <circle cx="22" cy="140" r="7" fill="#9aa5ae" stroke="#16283c"/>
  <line x1="31" y1="140" x2="66" y2="140" stroke="#6b4fa0" stroke-width="2" marker-end="url(#n)"/>
  <text x="22" y="122" font-size="11.5" fill="#33475b" text-anchor="middle">neutron</text>
  <!-- U-235 -->
  <circle cx="100" cy="140" r="30" fill="#e8c07a" stroke="#16283c" stroke-width="2"/>
  <text x="100" y="138" font-size="12.5" font-weight="700" fill="#16283c" text-anchor="middle">U-235</text>
  <text x="100" y="152" font-size="10.5" fill="#33475b" text-anchor="middle">absorbs it</text>
  <line x1="134" y1="140" x2="168" y2="140" stroke="#16283c" stroke-width="2" marker-end="url(#a)"/>
  <text x="151" y="130" font-size="10.5" fill="#33475b" text-anchor="middle">splits</text>
  <!-- daughters -->
  <circle cx="236" cy="74" r="28" fill="#f1d9a8" stroke="#16283c" stroke-width="2"/>
  <text x="236" y="78" font-size="10.5" font-weight="700" fill="#16283c" text-anchor="middle">daughter</text>
  <circle cx="236" cy="210" r="25" fill="#f1d9a8" stroke="#16283c" stroke-width="2"/>
  <text x="236" y="214" font-size="10.5" font-weight="700" fill="#16283c" text-anchor="middle">daughter</text>
  <line x1="180" y1="126" x2="210" y2="96" stroke="#16283c" stroke-width="2"/>
  <line x1="180" y1="154" x2="214" y2="192" stroke="#16283c" stroke-width="2"/>
  <line x1="264" y1="64" x2="300" y2="50" stroke="#c0392b" stroke-width="2.4" marker-end="url(#a)"/>
  <line x1="261" y1="220" x2="300" y2="236" stroke="#c0392b" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="304" y="46" font-size="11" font-weight="700" fill="#c0392b">fast</text>
  <text x="304" y="250" font-size="11" font-weight="700" fill="#c0392b">fast</text>
  <!-- neutrons out -->
  <circle cx="232" cy="124" r="6" fill="#9aa5ae" stroke="#16283c"/>
  <circle cx="232" cy="142" r="6" fill="#9aa5ae" stroke="#16283c"/>
  <circle cx="232" cy="160" r="6" fill="#9aa5ae" stroke="#16283c"/>
  <line x1="240" y1="124" x2="272" y2="116" stroke="#6b4fa0" stroke-width="1.8" marker-end="url(#n)"/>
  <line x1="240" y1="142" x2="272" y2="142" stroke="#6b4fa0" stroke-width="1.8" marker-end="url(#n)"/>
  <line x1="240" y1="160" x2="272" y2="168" stroke="#6b4fa0" stroke-width="1.8" marker-end="url(#n)"/>
  <text x="278" y="138" font-size="11.5" font-weight="700" fill="#6b4fa0">2 or 3</text>
  <text x="278" y="152" font-size="11.5" font-weight="700" fill="#6b4fa0">neutrons</text>
  <text x="175" y="272" font-size="11.5" fill="#33475b" text-anchor="middle">Two <tspan font-weight="700">radioactive</tspan> daughter nuclei + a few neutrons.</text>
  <text x="175" y="287" font-size="11.5" fill="#33475b" text-anchor="middle">Energy is released as their <tspan font-weight="700">kinetic energy</tspan>.</text>

  <!-- ===== Panel 2: chain reaction ===== -->
  <line x1="352" y1="10" x2="352" y2="285" stroke="#d5dde3" stroke-width="1.5"/>
  <text x="540" y="18" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">2 · A chain reaction</text>
  <g stroke="#6b4fa0" stroke-width="1.6" marker-end="url(#n)">
    <line x1="368" y1="150" x2="394" y2="150"/>
    <line x1="420" y1="140" x2="480" y2="80"/>
    <line x1="420" y1="150" x2="480" y2="150"/>
    <line x1="420" y1="160" x2="480" y2="220"/>
    <line x1="508" y1="74" x2="580" y2="44"/>
    <line x1="508" y1="80" x2="580" y2="80"/>
    <line x1="508" y1="144" x2="580" y2="118"/>
    <line x1="508" y1="150" x2="580" y2="152"/>
    <line x1="508" y1="156" x2="580" y2="186"/>
    <line x1="508" y1="220" x2="580" y2="220"/>
    <line x1="508" y1="226" x2="580" y2="256"/>
  </g>
  <g fill="#e8c07a" stroke="#16283c" stroke-width="1.5">
    <circle cx="407" cy="150" r="12"/>
    <circle cx="494" cy="76" r="12"/><circle cx="494" cy="150" r="12"/><circle cx="494" cy="222" r="12"/>
    <circle cx="594" cy="42" r="12"/><circle cx="594" cy="80" r="12"/><circle cx="594" cy="116" r="12"/>
    <circle cx="594" cy="152" r="12"/><circle cx="594" cy="188" r="12"/><circle cx="594" cy="222" r="12"/><circle cx="594" cy="258" r="12"/>
  </g>
  <text x="622" y="96" font-size="11.5" fill="#33475b">each circle =</text>
  <text x="622" y="110" font-size="11.5" fill="#33475b">one U-235</text>
  <text x="622" y="124" font-size="11.5" fill="#33475b">nucleus splitting</text>
  <text x="622" y="170" font-size="11.5" font-weight="700" fill="#c0392b">neutrons from</text>
  <text x="622" y="184" font-size="11.5" font-weight="700" fill="#c0392b">one fission</text>
  <text x="622" y="198" font-size="11.5" font-weight="700" fill="#c0392b">cause the next</text>
</svg>

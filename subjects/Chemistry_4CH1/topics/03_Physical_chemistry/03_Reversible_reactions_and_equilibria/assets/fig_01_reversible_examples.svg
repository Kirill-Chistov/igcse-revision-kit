<text x="200" y="22" font-size="14" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">A  Hydrated ⇌ anhydrous copper(II) sulfate</text>
<rect x="20" y="110" width="130" height="80" rx="8" fill="#dbe9fb" stroke="#4c3fa8" stroke-width="1.6"/>
<text x="85" y="135.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">hydrated</text>
<text x="85" y="150.5" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">CuSO₄·5H₂O</text>
<text x="85" y="175" font-size="12" fill="#4c3fa8" text-anchor="middle" font-weight="bold" font-style="normal">blue crystals</text>
<rect x="250" y="110" width="130" height="80" rx="8" fill="#ffffff" stroke="#16283c" stroke-width="1.6"/>
<text x="315" y="135.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">anhydrous</text>
<text x="315" y="150.5" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">CuSO₄ + 5H₂O</text>
<text x="315" y="175" font-size="12" fill="#33475b" text-anchor="middle" font-weight="bold" font-style="normal">white powder</text>
<path d="M95,105 C120,55 280,55 305,105" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#c3c1-arr-c0392b)"/>
<text x="200" y="50" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" font-style="normal">heat: water driven off as steam</text>
<text x="200" y="66" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">endothermic</text>
<path d="M305,195 C280,245 120,245 95,195" stroke="#4c3fa8" stroke-width="2" fill="none" marker-end="url(#c3c1-arr-4c3fa8)"/>
<text x="200" y="258" font-size="12" fill="#4c3fa8" text-anchor="middle" font-weight="bold" font-style="normal">add water: turns blue, gets hot</text>
<text x="200" y="274" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal">exothermic</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 820 250" width="820" height="250" role="img"
     aria-label="Thermal power station: boiler heated by fuel, nuclear reactor, hot rocks or focused sunlight; steam turns a turbine which turns a generator; condenser returns water to the boiler">
  <defs>
    <marker id="p4ts-grey" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa7b3"/>
    </marker>
    <marker id="p4ts-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f7b6c"/>
    </marker>
    <marker id="p4ts-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e6da4"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <!-- boiler -->
    <rect x="20" y="60" width="170" height="130" rx="8" fill="#fdeded" stroke="#c0392b" stroke-width="1.8"/>
    <text x="105" y="82" font-size="15" font-weight="700" fill="#16283c" text-anchor="middle">Boiler</text>
    <g font-size="12.5" text-anchor="middle">
      <text x="105" y="102">water heated by:</text>
      <text x="105" y="120">burning fossil fuel</text>
      <text x="105" y="137">a nuclear reactor</text>
      <text x="105" y="154">hot rocks (geothermal)</text>
      <text x="105" y="171">focused sunlight</text>
    </g>
    <!-- steam pipe -->
    <line x1="190" y1="92" x2="264" y2="92" stroke="#9aa7b3" stroke-width="8" marker-end="url(#p4ts-grey)"/>
    <text x="229" y="78" font-size="12.5" font-weight="700" text-anchor="middle">steam</text>
    <!-- turbine -->
    <polygon points="270,70 370,50 370,150 270,130" fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.8"/>
    <g stroke="#4c3fa8" stroke-width="1.5">
      <line x1="290" y1="67" x2="290" y2="134"/>
      <line x1="310" y1="63" x2="310" y2="138"/>
      <line x1="330" y1="59" x2="330" y2="142"/>
      <line x1="350" y1="55" x2="350" y2="146"/>
    </g>
    <text x="300" y="172" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">Turbine</text>
    <text x="300" y="188" font-size="12" fill="#6b7a88" text-anchor="middle">kinetic store</text>
    <!-- shaft -->
    <line x1="370" y1="100" x2="440" y2="100" stroke="#33475b" stroke-width="6"/>
    <!-- generator -->
    <rect x="440" y="55" width="120" height="90" rx="10" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
    <circle cx="500" cy="100" r="30" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.5"/>
    <rect x="486" y="86" width="14" height="28" fill="#e59a8f"/><rect x="500" y="86" width="14" height="28" fill="#a9c4dd"/>
    <text x="493" y="105" font-size="12" font-weight="700" text-anchor="middle">N</text>
    <text x="507" y="105" font-size="12" font-weight="700" text-anchor="middle">S</text>
    <text x="500" y="172" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">Generator</text>
    <!-- output -->
    <line x1="560" y1="100" x2="648" y2="100" stroke="#0f7b6c" stroke-width="3" marker-end="url(#p4ts-teal)"/>
    <text x="604" y="90" font-size="12.5" font-weight="700" fill="#0f7b6c" text-anchor="middle">electrically</text>
    <rect x="655" y="72" width="150" height="56" rx="8" fill="#f4f6f8" stroke="#6b7a88" stroke-width="1.5"/>
    <text x="730" y="96" font-size="13.5" font-weight="700" fill="#16283c" text-anchor="middle">to the National Grid</text>
    <text x="730" y="114" font-size="12" text-anchor="middle">via transformers</text>
    <!-- condenser loop -->
    <line x1="362" y1="146" x2="362" y2="212" stroke="#9aa7b3" stroke-width="8"/>
    <rect x="250" y="212" width="160" height="52" rx="8" fill="#e3eef7" stroke="#2e6da4" stroke-width="1.8"/>
    <text x="330" y="234" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">Condenser</text>
    <text x="330" y="252" font-size="12" text-anchor="middle">steam cooled back to water</text>
    <path d="M250,240 L105,240 L105,196" stroke="#2e6da4" stroke-width="3.5" fill="none" marker-end="url(#p4ts-blue)"/>
    <text x="178" y="232" font-size="12" text-anchor="middle">water pumped back</text>
    <text x="425" y="234" font-size="12.5" fill="#c0392b">energy wasted heating the surroundings</text>
    <text x="425" y="251" font-size="12.5" fill="#c0392b">(cooling water, air, cooling towers)</text>
  </g>
</svg>

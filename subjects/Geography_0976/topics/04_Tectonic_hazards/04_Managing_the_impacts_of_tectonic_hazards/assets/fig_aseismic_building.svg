<text x="10" y="30" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">COUNTERWEIGHT ON THE ROOF</text>
<text x="10" y="46" font-size="12.5" fill="#33475b" text-anchor="start">a heavy mass on springs moves</text>
<text x="10" y="61" font-size="12.5" fill="#33475b" text-anchor="start">against the sway and reduces it</text>
<polyline points="250,26 300,26 368,50" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="150" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">CROSS-BRACING</text>
<text x="10" y="166" font-size="12.5" fill="#33475b" text-anchor="start">steel X-frames stop floors</text>
<text x="10" y="181" font-size="12.5" fill="#33475b" text-anchor="start">and walls twisting</text>
<polyline points="150,146 260,146 330,150" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="10" y="262" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">BASE ISOLATORS</text>
<text x="10" y="278" font-size="12.5" fill="#33475b" text-anchor="start">rubber and steel pads between</text>
<text x="10" y="293" font-size="12.5" fill="#33475b" text-anchor="start">building and foundations absorb</text>
<text x="10" y="308" font-size="12.5" fill="#33475b" text-anchor="start">the shaking</text>
<polyline points="178,258 260,258 318,306" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="560" y="110" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">FLEXIBLE FRAME</text>
<text x="560" y="126" font-size="12.5" fill="#33475b" text-anchor="start">steel or steel-reinforced</text>
<text x="560" y="141" font-size="12.5" fill="#33475b" text-anchor="start">concrete bends without</text>
<text x="560" y="156" font-size="12.5" fill="#33475b" text-anchor="start">snapping</text>
<polyline points="554,106 500,106 486,120" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="560" y="206" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">AUTOMATIC SHUT-OFF</text>
<text x="560" y="222" font-size="12.5" fill="#33475b" text-anchor="start">gas and power cut off</text>
<text x="560" y="237" font-size="12.5" fill="#33475b" text-anchor="start">when shaking starts → fewer fires</text>
<polyline points="554,202 530,202 510,288" fill="none" stroke="#16283c" stroke-width="1"/>
<text x="560" y="272" font-size="14" font-weight="700" fill="#16283c" text-anchor="start">DEEP FOUNDATIONS</text>
<text x="560" y="288" font-size="12.5" fill="#33475b" text-anchor="start">piles anchor the building</text>
<text x="560" y="303" font-size="12.5" fill="#33475b" text-anchor="start">into solid rock</text>
<polyline points="554,268 540,268 540,340 472,340" fill="none" stroke="#16283c" stroke-width="1"/>

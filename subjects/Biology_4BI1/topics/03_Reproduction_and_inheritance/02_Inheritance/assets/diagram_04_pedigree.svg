<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Family pedigree for a recessive condition. Generation I: unaffected parents 1 and 2. Generation II: affected son 3, unaffected daughter 4 and unaffected son 5, who has children with affected woman 6. Generation III: affected daughter 7 and unaffected son 8. Deduced genotypes: 1 and 2 Nn, 3 nn, 5 Nn, 6 nn, 7 nn, 8 Nn, 4 NN or Nn.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .pd-t { font-size: 12px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .pd-n { font-size: 11px; font-weight: 700; }
    .pd-g { font-size: 11.5px; font-weight: 700; fill: #0f7b6c; }
    .pd-s { font-size: 11px; fill: #33475b; }
    .pd-l { font-size: 12px; font-weight: 700; }
  </style>
  <text class="pd-t" x="6" y="52">I</text><text class="pd-t" x="6" y="132">II</text><text class="pd-t" x="6" y="212">III</text>
  <path d="M162,50 L218,50 M190,50 L190,92 M100,92 L280,92 M100,92 L100,118 M190,92 L190,118 M280,92 L280,118" stroke="#16283c" stroke-width="1.4" fill="none"/>
  <rect x="138" y="38" width="24" height="24" fill="#ffffff" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="135" y="35" text-anchor="end">1</text><text class="pd-g" x="150" y="78" text-anchor="middle">Nn</text>
  <circle cx="230" cy="50" r="12.5" fill="#ffffff" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="215" y="35" text-anchor="end">2</text><text class="pd-g" x="230" y="78" text-anchor="middle">Nn</text>
  <rect x="88" y="118" width="24" height="24" fill="#33475b" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="85" y="115" text-anchor="end">3</text><text class="pd-g" x="100" y="158" text-anchor="middle">nn</text>
  <circle cx="190" cy="130" r="12.5" fill="#ffffff" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="175" y="115" text-anchor="end">4</text><text class="pd-g" x="190" y="158" text-anchor="middle">NN or Nn</text>
  <rect x="268" y="118" width="24" height="24" fill="#ffffff" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="265" y="115" text-anchor="end">5</text><text class="pd-g" x="280" y="158" text-anchor="middle">Nn</text>
  <path d="M292,130 L348,130 M320,130 L320,172 M280,172 L370,172 M280,172 L280,198 M370,172 L370,198" stroke="#16283c" stroke-width="1.4" fill="none"/>
  <circle cx="360" cy="130" r="12.5" fill="#33475b" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="345" y="115" text-anchor="end">6</text><text class="pd-g" x="360" y="158" text-anchor="middle">nn</text>
  <circle cx="280" cy="210" r="12.5" fill="#33475b" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="265" y="195" text-anchor="end">7</text><text class="pd-g" x="280" y="238" text-anchor="middle">nn</text>
  <rect x="358" y="198" width="24" height="24" fill="#ffffff" stroke="#16283c" stroke-width="1.6"/><text class="pd-n" x="355" y="195" text-anchor="end">8</text><text class="pd-g" x="370" y="238" text-anchor="middle">Nn</text>
  <rect x="30" y="254" width="14" height="14" fill="#fff" stroke="#16283c" stroke-width="1.4"/><text class="pd-s" x="50" y="265">male</text>
  <circle cx="100" cy="261" r="7.5" fill="#fff" stroke="#16283c" stroke-width="1.4"/><text class="pd-s" x="112" y="265">female</text>
  <rect x="160" y="254" width="14" height="14" fill="#33475b" stroke="#16283c" stroke-width="1.4"/><text class="pd-s" x="180" y="265">affected</text>
  <text class="pd-s" x="30" y="284">N = normal allele (dominant); n = allele for the condition (recessive)</text>
  <text class="pd-l" x="450" y="30">How to read it</text>
  <text class="pd-s" x="450" y="50"><tspan font-weight="700">1</tspan>  Find two unaffected parents with an affected child</text>
  <text class="pd-s" x="462" y="64">(1 and 2 → 3). The condition must be recessive:</text>
  <text class="pd-s" x="462" y="78">each parent carries a hidden n allele, so both are Nn.</text>
  <text class="pd-s" x="450" y="102"><tspan font-weight="700">2</tspan>  Every affected person is nn (3, 6, 7).</text>
  <text class="pd-s" x="450" y="126"><tspan font-weight="700">3</tspan>  An unaffected person with an affected parent or</text>
  <text class="pd-s" x="462" y="140">child must be Nn: 5 (child 7 is nn) and 8 (mother 6).</text>
  <text class="pd-s" x="450" y="164"><tspan font-weight="700">4</tspan>  If nothing decides it, write NN or Nn (4).</text>
  <text class="pd-s" x="450" y="188"><tspan font-weight="700">5</tspan>  Probability: 5 × 6 is Nn × nn, so each child has</text>
  <text class="pd-s" x="462" y="202">a 1 in 2 chance of being affected (→ genetic diagram).</text>
  <line x1="432" y1="10" x2="432" y2="284" stroke="#dfe5ea" stroke-width="1.4"/>
  </svg>

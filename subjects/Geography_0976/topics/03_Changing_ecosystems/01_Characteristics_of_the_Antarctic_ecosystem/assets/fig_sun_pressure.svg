<path d="M150.3,143.0 A100,100 0 0 0 150.3,161.0" fill="none" stroke="#c0392b" stroke-width="4"/>
<polygon points="30,232.5 190.7,232.5 232.7,250.5 30,250.5" fill="#f5c542" opacity="0.35"/>
<line x1="30" y1="232.5" x2="188.7" y2="232.5" stroke="#e0a100" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="30" y1="250.5" x2="230.7" y2="250.5" stroke="#e0a100" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M190.7,232.5 A100,100 0 0 0 232.7,250.5" fill="none" stroke="#2e6fa3" stroke-width="4"/>
<text x="30" y="137.0" font-size="10" fill="#8a6d00" font-weight="700">same energy</text>
<text x="30" y="226.5" font-size="10" fill="#8a6d00" font-weight="700">same energy</text>
<text x="18" y="50" font-size="10.5" fill="#8f2b20" font-weight="700">Near the equator: sun high in the sky</text>
<text x="18" y="63" font-size="10" fill="#33475b">energy concentrated on a small area; short path</text>
<text x="18" y="75" font-size="10" fill="#33475b">through the atmosphere → strong heating</text>
<text x="18" y="264" font-size="10.5" fill="#1f5a86" font-weight="700">Antarctica: sun low in the sky</text>
<text x="18" y="276" font-size="10" fill="#33475b">same energy spread over a larger area and through more</text>
<text x="18" y="288" font-size="10" fill="#33475b">atmosphere; white snow reflects most of it (high albedo)</text>
<rect x="386" y="6" width="368" height="286" fill="#f7fafb" stroke="#dfe5ea" rx="4"/>
<text x="570" y="26" font-size="13" font-weight="700" fill="#16283c" text-anchor="middle">2  High pressure over the ice sheet</text>
<rect x="396" y="216" width="348" height="16" fill="#d9ebe6"/>
<path d="M406,216 C456,176 490.0,138 570.0,136 C650.0,138 684,176 734,216 Z" fill="#ffffff" stroke="#5d7385" stroke-width="1.3"/>
<text x="570.0" y="186" font-size="10.5" fill="#33475b" text-anchor="middle">ice sheet — much of it over 2,000 m high</text>
<text x="416" y="246" font-size="9.5" fill="#2c5a7a" font-style="italic">Southern Ocean</text>
<text x="724" y="246" font-size="9.5" fill="#2c5a7a" font-style="italic" text-anchor="end">Southern Ocean</text>
<line x1="526.0" y1="62" x2="526.0" y2="120" stroke="#2e6fa3" stroke-width="2.2" marker-end="url(#ab)"/>
<line x1="570.0" y1="62" x2="570.0" y2="120" stroke="#2e6fa3" stroke-width="2.2" marker-end="url(#ab)"/>
<line x1="614.0" y1="62" x2="614.0" y2="120" stroke="#2e6fa3" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="570.0" y="56" font-size="10.5" fill="#1f5a86" text-anchor="middle" font-weight="700">very cold, dense air sinks</text>
<circle cx="654.0" cy="104" r="15" fill="#fff" stroke="#16283c" stroke-width="1.4"/><text x="654.0" y="110" font-size="17" font-weight="700" fill="#16283c" text-anchor="middle">H</text>
<text x="676.0" y="100" font-size="10" fill="#16283c">high</text><text x="676.0" y="112" font-size="10" fill="#16283c">pressure</text>
<path d="M540.0,124 C470.0,130 476,168 420,202" fill="none" stroke="#2e6fa3" stroke-width="2.2" marker-end="url(#ab)"/>
<path d="M600.0,124 C670.0,130 664,168 720,202" fill="none" stroke="#2e6fa3" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="408" y="120" font-size="10" fill="#1f5a86" font-weight="700">katabatic winds</text>
<text x="408" y="132" font-size="9.5" fill="#33475b">air flows out and</text>
<text x="408" y="143" font-size="9.5" fill="#33475b">down the slope</text>
<text x="404" y="264" font-size="10.5" fill="#16283c" font-weight="700">Sinking air warms slightly, so clouds rarely form →</text>
<text x="404" y="276" font-size="10" fill="#33475b">clear skies and very little precipitation. Cold air also holds</text>
<text x="404" y="288" font-size="10" fill="#33475b">very little water vapour — Antarctica is a cold desert.</text>
</svg>
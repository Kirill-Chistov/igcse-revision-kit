<text x="80" y="168" font-size="11.5" fill="#6b7a88" text-anchor="middle">dark, cooler patches</text>
<text x="80" y="182" font-size="11.5" fill="#6b7a88" text-anchor="middle">caused by magnetic activity</text>
<text x="150" y="70" font-size="12.5" font-weight="700" fill="#16283c">More sunspots</text>
<text x="150" y="88" font-size="12.5" font-weight="400" fill="#33475b">= a more active Sun</text>
<text x="150" y="105" font-size="12.5" font-weight="400" fill="#33475b">→ slightly more energy</text>
<text x="150" y="122" font-size="12.5" font-weight="400" fill="#33475b">reaches Earth → warming</text>
<text x="150" y="145" font-size="12.5" font-weight="700" fill="#16283c">Numbers rise and fall</text>
<text x="150" y="163" font-size="12.5" font-weight="400" fill="#33475b">on an ≈ 11-year cycle</text>
<rect x="22" y="200" width="306" height="82" rx="6" fill="#eef2f5"/>
<text x="32" y="218" font-size="12" fill="#33475b">Maunder Minimum, 1645–1715: almost no</text>
<text x="32" y="233" font-size="12" fill="#33475b">sunspots — during the coldest part of the</text>
<text x="32" y="248" font-size="12" fill="#33475b">“Little Ice Age”.</text>
<text x="32" y="269" font-size="12" fill="#33475b">Effect is small: solar output has not risen</text>
<text x="32" y="284" font-size="12" fill="#33475b">since the 1980s, but temperatures have.</text>
<text x="370" y="32" font-size="15" font-weight="700" fill="#16283c">Large explosive volcanic eruptions</text>
<rect x="362" y="62" width="436" height="36" fill="#eeedfb"/>

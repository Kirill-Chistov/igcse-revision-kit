<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-label="Left: a strawberry plant sends out a runner along the soil surface; a new plant grows roots and leaves where the runner touches the soil and later becomes a separate clone. Right: taking a cutting in three steps: cut a shoot below a leaf, remove the lower leaves and dip the cut end in rooting powder, then plant it in damp compost under a plastic bag.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .ap-t { font-size: 12px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .ap-l { font-size: 12px; font-weight: 700; }
    .ap-s { font-size: 11px; fill: #33475b; }
    .ap-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .ld { stroke: #8fa3b8; stroke-width: 1; fill: none; }
  </style>
  <text class="ap-t" x="6" y="16">A  NATURAL: RUNNERS (strawberry)</text>
  <text class="ap-t" x="400" y="16">B  ARTIFICIAL: CUTTINGS</text>
  <line x1="386" y1="6" x2="386" y2="258" stroke="#dfe5ea" stroke-width="1.4"/>
  <rect x="6" y="170" width="370" height="40" fill="#efe3d0"/><path d="M6,170 L376,170" stroke="#8a6a3a" stroke-width="1.4"/>

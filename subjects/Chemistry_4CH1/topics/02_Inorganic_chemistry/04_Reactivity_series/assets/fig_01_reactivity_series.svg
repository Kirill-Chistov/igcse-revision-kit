<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Carlito, Calibri, Lato, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="c2d1-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="c2d1-arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="c2d1-arrP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c3fa8"/></marker></defs><rect x="150.0" y="34.0" width="150.0" height="26.0" rx="0" fill="#eaf1f7" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="52.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">K</text><text x="192.0" y="52.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">potassium</text><rect x="150.0" y="60.0" width="150.0" height="26.0" rx="0" fill="#f7f9fb" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="78.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Na</text><text x="192.0" y="78.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">sodium</text><rect x="150.0" y="86.0" width="150.0" height="26.0" rx="0" fill="#eaf1f7" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="104.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Li</text><text x="192.0" y="104.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">lithium</text><rect x="150.0" y="112.0" width="150.0" height="26.0" rx="0" fill="#f7f9fb" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="130.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Ca</text><text x="192.0" y="130.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">calcium</text><rect x="150.0" y="138.0" width="150.0" height="26.0" rx="0" fill="#eaf1f7" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="156.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Mg</text><text x="192.0" y="156.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">magnesium</text><rect x="150.0" y="164.0" width="150.0" height="26.0" rx="0" fill="#f7f9fb" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="182.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Al</text><text x="192.0" y="182.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">aluminium</text><rect x="150.0" y="190.0" width="150.0" height="26.0" rx="0" fill="#eaf1f7" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="208.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Zn</text><text x="192.0" y="208.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">zinc</text><rect x="150.0" y="216.0" width="150.0" height="26.0" rx="0" fill="#f7f9fb" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="234.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Fe</text><text x="192.0" y="234.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">iron</text><line x1="130.0" y1="248.0" x2="600.0" y2="248.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="187.0" y="240.0" width="76.0" height="16.0" rx="0" fill="white" stroke="none" stroke-width="1.2"/><text x="225.0" y="252.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" font-style="normal">hydrogen</text><rect x="150.0" y="258.0" width="150.0" height="26.0" rx="0" fill="#eaf1f7" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="276.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Cu</text><text x="192.0" y="276.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">copper</text><rect x="150.0" y="284.0" width="150.0" height="26.0" rx="0" fill="#f7f9fb" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="302.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Ag</text><text x="192.0" y="302.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">silver</text><rect x="150.0" y="310.0" width="150.0" height="26.0" rx="0" fill="#eaf1f7" stroke="#b8c4ce" stroke-width="0.8"/><text x="160.0" y="328.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">Au</text><text x="192.0" y="328.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">gold</text><line x1="100.0" y1="336.0" x2="100.0" y2="34.0" stroke="#16283c" stroke-width="2.2" marker-end="url(#c2d1-arr)"/><text transform="rotate(-90 88 185.0)" x="88.0" y="185.0" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">more reactive</text><path d="M308,37 L316,37 L316,135 L308,135" stroke="#16283c" stroke-width="1.4" fill="none"/><text x="324.0" y="75.0" font-size="11.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">react with cold water</text><text x="324.0" y="90.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">→ metal hydroxide + hydrogen</text><text x="324.0" y="105.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">(K, Na, Li: very vigorous)</text><path d="M308,141 L316,141 L316,239 L308,239" stroke="#16283c" stroke-width="1.4" fill="none"/><text x="324.0" y="179.0" font-size="11.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">react with steam</text><text x="324.0" y="194.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">→ metal oxide + hydrogen</text><text x="324.0" y="209.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">(Mg: very slow with cold water)</text><path d="M523,37 L531,37 L531,135 L523,135" stroke="#c0392b" stroke-width="1.4" fill="none"/><text x="539.0" y="82.5" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal">react with dilute acid</text><text x="539.0" y="97.5" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">too violently to try</text><path d="M523,141 L531,141 L531,239 L523,239" stroke="#16283c" stroke-width="1.4" fill="none"/><text x="539.0" y="179.0" font-size="11.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">react with dilute acid</text><text x="539.0" y="194.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">→ salt + hydrogen</text><text x="539.0" y="209.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">(fastest at the top)</text><path d="M308,261 L316,261 L316,333 L308,333" stroke="#16283c" stroke-width="1.4" fill="none"/><text x="324.0" y="293.5" font-size="11.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">no reaction with water, steam</text><text x="324.0" y="308.5" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">or dilute acids</text></svg>
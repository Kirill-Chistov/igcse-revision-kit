<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" role="img" aria-label="The three pillars of sustainable development" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Carlito, Calibri, sans-serif" text-anchor="middle">
    <!-- roof -->
    <path d="M90 62 L450 6 L810 62 Z" fill="#16283c"/>
    <text x="450" y="44" font-size="17" font-weight="700" fill="#fff">SUSTAINABLE DEVELOPMENT</text>
    <rect x="90" y="62" width="720" height="26" fill="#33475b"/>
    <text x="450" y="80" font-size="14" fill="#fff">meets today's needs without harming future generations</text>

    <!-- pillars -->
    <rect x="115" y="96" width="210" height="102" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
    <rect x="345" y="96" width="210" height="102" fill="#fdf6e5" stroke="#d99a17" stroke-width="2"/>
    <rect x="575" y="96" width="210" height="102" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="2"/>

    <g font-size="14" fill="#16283c">
      <text x="220" y="119" font-size="16" font-weight="700" fill="#4c3fa8">ECONOMIC</text>
      <text x="220" y="142">jobs and incomes that keep</text>
      <text x="220" y="161">rising without using up the</text>
      <text x="220" y="180">resources they depend on</text>

      <text x="450" y="119" font-size="16" font-weight="700" fill="#9a6a08">SOCIAL</text>
      <text x="450" y="142">basic needs met (food, water,</text>
      <text x="450" y="161">health care, education) and</text>
      <text x="450" y="180">shared by all groups</text>

      <text x="680" y="119" font-size="16" font-weight="700" fill="#0b5f54">ENVIRONMENTAL</text>
      <text x="680" y="142">soils, water, forests, wildlife</text>
      <text x="680" y="161">and climate protected for</text>
      <text x="680" y="180">future generations</text>
    </g>

    <!-- base -->
    <rect x="90" y="198" width="720" height="32" fill="#6b7a88"/>
    <text x="450" y="219" font-size="14" font-weight="700" fill="#fff">If any one pillar fails, the development cannot last</text>
  </g>
</svg>

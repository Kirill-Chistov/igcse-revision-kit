<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="680" height="236" role="img" aria-label="Scope of a global variable and a local variable" font-family="Carlito, Calibri, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker></defs>
<rect x="110" y="8" width="460" height="220" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="126.0" y="32.0" font-size="13.5" fill="#0f766e" text-anchor="start" font-weight="bold" style="white-space:pre">Main program — global scope</text>
<text x="126.0" y="56.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">DECLARE Total : INTEGER         // global</text>
<rect x="126" y="72" width="420" height="110" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
<text x="140.0" y="94.0" font-size="13.5" fill="#b45309" text-anchor="start" font-weight="bold" style="white-space:pre">PROCEDURE AddBonus — local scope</text>
<text x="140.0" y="116.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">    DECLARE Bonus : INTEGER   // local</text>
<text x="140.0" y="134.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">    Bonus ← 5</text>
<text x="140.0" y="152.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">    Total ← Total + Bonus</text>
<text x="372.0" y="152.0" font-size="12.5" fill="#15803d" text-anchor="start" font-weight="bold" style="white-space:pre">✓ global can be used here</text>
<text x="140.0" y="170.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">ENDPROCEDURE</text>
<text x="126.0" y="208.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" style="white-space:pre">OUTPUT Bonus</text>
<text x="240.0" y="208.0" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="bold" style="white-space:pre">✗ error: Bonus does not exist outside AddBonus</text>
</svg>

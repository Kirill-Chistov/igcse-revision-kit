<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Robot arm labelled with the three characteristics of a robot: mechanical structure, electrical components (sensors, microprocessor, actuators) and programmable controller" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .rb-h{font-size:14px;font-weight:700}
    .rb-t{font-size:13px;fill:#1e293b}
    .rb-b{font-size:13px;font-weight:700;fill:#1e293b}
    .rb-lead{stroke:#64748b;stroke-width:1.2;fill:none}
  </style>

  <!-- legend: the three characteristics -->
  <rect x="20" y="10" width="220" height="30" rx="15" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text class="rb-h" x="130" y="30" text-anchor="middle" fill="#334155">1  Mechanical structure</text>
  <rect x="260" y="10" width="300" height="30" rx="15" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
  <text class="rb-h" x="410" y="30" text-anchor="middle" fill="#0f5f55">2  Electrical components</text>
  <rect x="580" y="10" width="220" height="30" rx="15" fill="#e8f0fb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="rb-h" x="690" y="30" text-anchor="middle" fill="#1d4ed8">3  Programmable</text>

  <!-- floor -->
  <line x1="250" y1="300" x2="560" y2="300" stroke="#94a3b8" stroke-width="2"/>

  <!-- robot arm (grey = mechanical structure) -->
  <rect x="300" y="262" width="110" height="38" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="335" y="238" width="40" height="26" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <line x1="355" y1="228" x2="420" y2="120" stroke="#94a3b8" stroke-width="24" stroke-linecap="round"/>
  <line x1="420" y1="120" x2="515" y2="150" stroke="#94a3b8" stroke-width="18" stroke-linecap="round"/>
  <!-- gripper (end effector) -->
  <rect x="518" y="143" width="16" height="20" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <line x1="534" y1="146" x2="556" y2="138" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="534" y1="160" x2="556" y2="168" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- actuators: motors at the joints (amber) -->
  <circle cx="355" cy="228" r="16" fill="#fdf3e1" stroke="#b45309" stroke-width="3"/>
  <circle cx="420" cy="120" r="14" fill="#fdf3e1" stroke="#b45309" stroke-width="3"/>
  <circle cx="515" cy="150" r="10" fill="#fdf3e1" stroke="#b45309" stroke-width="3"/>

  <!-- sensor: camera on the forearm (teal) -->
  <rect x="468" y="112" width="26" height="16" rx="3" fill="#0f766e" transform="rotate(17 481 120)"/>
  <circle cx="490" cy="123" r="4" fill="#e6f4f1"/>

  <!-- controller (microprocessor + program) -->
  <rect x="60" y="250" width="170" height="54" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
  <text class="rb-b" x="145" y="272" text-anchor="middle">Controller</text>
  <text class="rb-t" x="145" y="291" text-anchor="middle">microprocessor + program</text>
  <line x1="230" y1="281" x2="300" y2="281" stroke="#4c3fa8" stroke-width="3"/>

  <!-- labels: left -->
  <text class="rb-b" x="20" y="95" fill="#334155">1  Frame: base, arm sections,</text>
  <text class="rb-t" x="38" y="113">joints and an end effector</text>
  <text class="rb-t" x="38" y="131">(e.g. gripper, welder, spray gun)</text>
  <polyline class="rb-lead" points="230,105 370,160"/>

  <text class="rb-b" x="20" y="185" fill="#4c3fa8">2  Microprocessor: processes</text>
  <text class="rb-t" x="38" y="203">sensor data, decides, and</text>
  <text class="rb-t" x="38" y="221">signals the actuators</text>
  <polyline class="rb-lead" points="110,226 110,250"/>

  <text class="rb-b" x="20" y="322" fill="#1d4ed8">3  Programmable: runs a program that can be changed to do a new task</text>

  <!-- labels: right -->
  <text class="rb-b" x="590" y="85" fill="#0f5f55">2  Sensors (camera, proximity,</text>
  <text class="rb-t" x="608" y="103">pressure): sense the surroundings</text>
  <polyline class="rb-lead" points="588,95 495,115"/>

  <text class="rb-b" x="590" y="200" fill="#b45309">2  Actuators (motors at each</text>
  <text class="rb-t" x="608" y="218">joint): move the structure</text>
  <polyline class="rb-lead" points="588,205 525,158"/>
  <polyline class="rb-lead" points="588,210 371,232"/>
</svg>

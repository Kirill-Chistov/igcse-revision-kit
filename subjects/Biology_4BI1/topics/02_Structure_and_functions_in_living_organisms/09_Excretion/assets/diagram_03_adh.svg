<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" role="img" aria-label="Control of blood water content by ADH. When there is too little water in the blood the brain detects it and the pituitary gland releases more ADH; the collecting ducts become more permeable, more water is reabsorbed and a small volume of concentrated urine is produced. When there is too much water, less ADH is released, less water is reabsorbed and a large volume of dilute urine is produced. This is negative feedback.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .ad-t { font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; }
    .ad-s { font-size: 11.5px; fill: #33475b; }
    .ad-k { font-size: 12px; font-weight: 700; fill: #0b5f54; }
  </style>
  <text class="ad-t" x="6" y="14" style="fill:#c0392b">TOO LITTLE WATER IN THE BLOOD (e.g. sweating, not drinking)</text><rect x="6" y="22" width="139" height="62" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text class="ad-s" x="75.5" y="40" text-anchor="middle">blood too</text><text class="ad-s" x="75.5" y="54" text-anchor="middle">concentrated</text><path d="M146,53 L153,53" stroke="#c0392b" stroke-width="2.2"/><path d="M158,53 l-6,-4 v8z" fill="#c0392b"/><rect x="158" y="22" width="139" height="62" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text class="ad-s" x="227.5" y="40" text-anchor="middle">detected by</text><text class="ad-s" x="227.5" y="54" text-anchor="middle">the brain</text><path d="M298,53 L305,53" stroke="#c0392b" stroke-width="2.2"/><path d="M310,53 l-6,-4 v8z" fill="#c0392b"/><rect x="310" y="22" width="139" height="62" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text class="ad-s" x="379.5" y="40" text-anchor="middle">pituitary gland</text><text class="ad-s" x="379.5" y="54" text-anchor="middle">releases MORE ADH</text><path d="M450,53 L457,53" stroke="#c0392b" stroke-width="2.2"/><path d="M462,53 l-6,-4 v8z" fill="#c0392b"/><rect x="462" y="22" width="139" height="62" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text class="ad-s" x="531.5" y="40" text-anchor="middle">collecting ducts</text><text class="ad-s" x="531.5" y="54" text-anchor="middle">more permeable:</text><text class="ad-s" x="531.5" y="68" text-anchor="middle">more water reabsorbed</text><path d="M602,53 L609,53" stroke="#c0392b" stroke-width="2.2"/><path d="M614,53 l-6,-4 v8z" fill="#c0392b"/><rect x="614" y="22" width="139" height="62" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text class="ad-s" x="683.5" y="40" text-anchor="middle">small volume of</text><text class="ad-s" x="683.5" y="54" text-anchor="middle">concentrated urine;</text><text class="ad-s" x="683.5" y="68" text-anchor="middle">blood water rises</text>
  <text class="ad-t" x="6" y="114" style="fill:#2e6fa3">TOO MUCH WATER IN THE BLOOD (e.g. drinking a lot)</text><rect x="6" y="122" width="139" height="62" rx="7" fill="#ffffff" stroke="#2e6fa3" stroke-width="1.6"/><text class="ad-s" x="75.5" y="140" text-anchor="middle">blood too</text><text class="ad-s" x="75.5" y="154" text-anchor="middle">dilute</text><path d="M146,153 L153,153" stroke="#2e6fa3" stroke-width="2.2"/><path d="M158,153 l-6,-4 v8z" fill="#2e6fa3"/><rect x="158" y="122" width="139" height="62" rx="7" fill="#ffffff" stroke="#2e6fa3" stroke-width="1.6"/><text class="ad-s" x="227.5" y="140" text-anchor="middle">detected by</text><text class="ad-s" x="227.5" y="154" text-anchor="middle">the brain</text><path d="M298,153 L305,153" stroke="#2e6fa3" stroke-width="2.2"/><path d="M310,153 l-6,-4 v8z" fill="#2e6fa3"/><rect x="310" y="122" width="139" height="62" rx="7" fill="#ffffff" stroke="#2e6fa3" stroke-width="1.6"/><text class="ad-s" x="379.5" y="140" text-anchor="middle">pituitary gland</text><text class="ad-s" x="379.5" y="154" text-anchor="middle">releases LESS ADH</text><path d="M450,153 L457,153" stroke="#2e6fa3" stroke-width="2.2"/><path d="M462,153 l-6,-4 v8z" fill="#2e6fa3"/><rect x="462" y="122" width="139" height="62" rx="7" fill="#ffffff" stroke="#2e6fa3" stroke-width="1.6"/><text class="ad-s" x="531.5" y="140" text-anchor="middle">collecting ducts</text><text class="ad-s" x="531.5" y="154" text-anchor="middle">less permeable:</text><text class="ad-s" x="531.5" y="168" text-anchor="middle">less water reabsorbed</text><path d="M602,153 L609,153" stroke="#2e6fa3" stroke-width="2.2"/><path d="M614,153 l-6,-4 v8z" fill="#2e6fa3"/><rect x="614" y="122" width="139" height="62" rx="7" fill="#ffffff" stroke="#2e6fa3" stroke-width="1.6"/><text class="ad-s" x="683.5" y="140" text-anchor="middle">large volume of</text><text class="ad-s" x="683.5" y="154" text-anchor="middle">dilute urine;</text><text class="ad-s" x="683.5" y="168" text-anchor="middle">blood water falls</text>
  <text class="ad-k" x="380" y="206" text-anchor="middle">Negative feedback: either change is reversed, returning blood water content to normal.</text>
</svg>

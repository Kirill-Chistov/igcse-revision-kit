<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" font-family="Carlito, Calibri, sans-serif">
  <g stroke="#6b7a88" stroke-width="1.4">
    <line x1="360" y1="150" x2="110" y2="38"/>
    <line x1="360" y1="150" x2="360" y2="38"/>
    <line x1="360" y1="150" x2="610" y2="38"/>
    <line x1="360" y1="150" x2="110" y2="150"/>
    <line x1="360" y1="150" x2="610" y2="150"/>
    <line x1="360" y1="150" x2="235" y2="262"/>
    <line x1="360" y1="150" x2="485" y2="262"/>
  </g>
  <rect x="285" y="125" width="150" height="50" rx="8" fill="#16283c"/>
  <text x="360" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Business</text>
  <g font-size="12.5" fill="#33475b" text-anchor="middle">
    <rect x="15" y="10" width="190" height="56" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
    <text x="110" y="30" font-weight="700" fill="#16283c">Owners / shareholders</text>
    <text x="110" y="47">profit, dividends,</text>
    <text x="110" y="61">value of their shares</text>

    <rect x="265" y="10" width="190" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.3"/>
    <text x="360" y="30" font-weight="700" fill="#16283c">Employees</text>
    <text x="360" y="47">fair pay, job security,</text>
    <text x="360" y="61">good working conditions</text>

    <rect x="515" y="10" width="190" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.3"/>
    <text x="610" y="30" font-weight="700" fill="#16283c">Customers</text>
    <text x="610" y="47">good quality, fair prices,</text>
    <text x="610" y="61">good service</text>

    <rect x="15" y="122" width="190" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.3"/>
    <text x="110" y="142" font-weight="700" fill="#16283c">Suppliers</text>
    <text x="110" y="159">regular orders,</text>
    <text x="110" y="173">paid on time</text>

    <rect x="515" y="122" width="190" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.3"/>
    <text x="610" y="142" font-weight="700" fill="#16283c">Lenders (e.g. banks)</text>
    <text x="610" y="159">loans repaid</text>
    <text x="610" y="173">with interest</text>

    <rect x="140" y="234" width="190" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.3"/>
    <text x="235" y="254" font-weight="700" fill="#16283c">Government</text>
    <text x="235" y="271">taxes paid, laws obeyed,</text>
    <text x="235" y="285">jobs created</text>

    <rect x="390" y="234" width="190" height="56" rx="6" fill="#ffffff" stroke="#16283c" stroke-width="1.3"/>
    <text x="485" y="254" font-weight="700" fill="#16283c">Local community</text>
    <text x="485" y="271">local jobs, little pollution,</text>
    <text x="485" y="285">noise or traffic</text>
  </g>
</svg>

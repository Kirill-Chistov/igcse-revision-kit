<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" role="img" aria-label="Input devices and sensors send data to the CPU or microprocessor, which processes it and sends results to output devices and actuators. An actuator's action changes what the sensor measures next." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .io-h { font-size: 14px; font-weight: 700; }
    .io-s { font-size: 11.5px; fill: #33475b; }
    .io-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .io-ws { font-size: 11.5px; fill: #dfe8f0; }
    .io-n { font-size: 11px; font-style: italic; fill: #33475b; }
  </style>
  <defs>
    <marker id="io-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker>
    <marker id="io-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a6"/></marker>
  </defs>

  <rect x="10" y="12" width="225" height="84" rx="8" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.6"/>
  <text class="io-h" x="22" y="34" style="fill:#2f6f9f">INPUT DEVICE</text>
  <text class="io-s" x="22" y="52">converts data from the outside world</text>
  <text class="io-s" x="22" y="67">into a form the computer can process</text>
  <text class="io-s" x="22" y="86" font-style="italic">keyboard, mouse, scanner, microphone …</text>

  <rect x="10" y="110" width="225" height="84" rx="8" fill="#eaf2f9" stroke="#2f6f9f" stroke-width="1.6" stroke-dasharray="0"/>
  <text class="io-h" x="22" y="132" style="fill:#2f6f9f">SENSOR (an input device)</text>
  <text class="io-s" x="22" y="150">measures a physical property of the</text>
  <text class="io-s" x="22" y="165">surroundings, automatically and</text>
  <text class="io-s" x="22" y="180">continuously</text>

  <rect x="290" y="62" width="180" height="84" rx="8" fill="#16283c"/>
  <text class="io-w" x="380" y="96" text-anchor="middle">CPU / microprocessor</text>
  <text class="io-ws" x="380" y="116" text-anchor="middle">processes the data</text>

  <rect x="525" y="12" width="225" height="84" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="io-h" x="537" y="34" style="fill:#0b5f54">OUTPUT DEVICE</text>
  <text class="io-s" x="537" y="52">converts processed data into a form</text>
  <text class="io-s" x="537" y="67">people can see or hear, or a physical copy</text>
  <text class="io-s" x="537" y="86" font-style="italic">screen, projector, printer, speaker …</text>

  <rect x="525" y="110" width="225" height="84" rx="8" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
  <text class="io-h" x="537" y="132" style="fill:#0b5f54">ACTUATOR (an output device)</text>
  <text class="io-s" x="537" y="150">turns a signal from the computer into</text>
  <text class="io-s" x="537" y="165">physical movement</text>
  <text class="io-s" x="537" y="184" font-style="italic">motor, valve, switch …</text>

  <line x1="237" y1="54" x2="286" y2="88" stroke="#16283c" stroke-width="2" marker-end="url(#io-ar)"/>
  <line x1="237" y1="152" x2="286" y2="120" stroke="#16283c" stroke-width="2" marker-end="url(#io-ar)"/>
  <line x1="472" y1="88" x2="521" y2="54" stroke="#16283c" stroke-width="2" marker-end="url(#io-ar)"/>
  <line x1="472" y1="120" x2="521" y2="152" stroke="#16283c" stroke-width="2" marker-end="url(#io-ar)"/>

  <path d="M637,196 L637,218 L122,218 L122,199" fill="none" stroke="#8a97a6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#io-ag)"/>
  <text class="io-n" x="380" y="236" text-anchor="middle">the action changes the surroundings, and so the sensor's next reading (control systems → 6.1)</text>
</svg>

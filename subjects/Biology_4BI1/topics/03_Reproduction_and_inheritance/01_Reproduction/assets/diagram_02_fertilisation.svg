<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Carpel in section: a pollen grain on the stigma grows a pollen tube down the style and into the ovule through the micropyle; the male nucleus fuses with the female nucleus to form a zygote. After fertilisation the ovary becomes the fruit, the ovule becomes the seed, the ovule wall becomes the seed coat and the zygote becomes the embryo.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .pt-t { font-size: 12px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.05em; }
    .pt-l { font-size: 12px; font-weight: 700; }
    .pt-s { font-size: 11px; fill: #33475b; }
    .pt-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .ld { stroke: #8fa3b8; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="pt-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7b6c"/></marker>
  </defs>
  <text class="pt-t" x="6" y="16">A  POLLEN TUBE AND FERTILISATION</text>
  <text class="pt-t" x="430" y="16">B  AFTER FERTILISATION</text>
  <line x1="414" y1="6" x2="414" y2="296" stroke="#dfe5ea" stroke-width="1.4"/>

  <!-- carpel -->
  <ellipse cx="200" cy="48" rx="26" ry="10" fill="#a9d8c6" stroke="#0f7b6c" stroke-width="1.6"/>
  <path d="M190,56 L190,150 L210,150 L210,56" fill="#e6f3ec" stroke="#0f7b6c" stroke-width="1.6"/>
  <ellipse cx="200" cy="212" rx="72" ry="66" fill="#e6f3ec" stroke="#0f7b6c" stroke-width="1.8"/>
  <rect x="191" y="140" width="18" height="16" fill="#e6f3ec"/>
  <!-- ovule -->
  <path d="M196,262 C170,258 162,230 166,206 C170,180 186,168 200,168 C214,168 230,180 234,206 C238,230 230,258 204,262" fill="#fff7e0" stroke="#b8860b" stroke-width="1.8"/>
  <circle cx="200" cy="244" r="7" fill="#4c3fa8"/>
  <!-- pollen grain + tube -->
  <circle cx="214" cy="36" r="8" fill="#e8b93a" stroke="#9a7b2f" stroke-width="1.2"/>
  <path d="M212,44 C206,70 203,110 203,146 C203,170 250,176 252,214 C254,252 226,270 202,262" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="249" cy="232" r="3.6" fill="#c0392b"/>
  <!-- number badges -->
  <circle cx="246" cy="32" r="9" fill="#0f7b6c"/><text class="pt-n" x="246" y="36" text-anchor="middle">1</text>
  <circle cx="232" cy="104" r="9" fill="#0f7b6c"/><text class="pt-n" x="232" y="108" text-anchor="middle">2</text>
  <circle cx="176" cy="276" r="9" fill="#0f7b6c"/><text class="pt-n" x="176" y="280" text-anchor="middle">3</text>
  <circle cx="200" cy="222" r="9" fill="#0f7b6c"/><text class="pt-n" x="200" y="226" text-anchor="middle">4</text>
  <!-- labels left -->
  <text class="pt-l" x="8" y="52">stigma</text><path class="ld" d="M48,48 L172,48"/>
  <text class="pt-l" x="8" y="104">style</text><path class="ld" d="M38,100 L188,100"/>
  <text class="pt-l" x="8" y="170">ovary</text><path class="ld" d="M42,166 L146,176"/>
  <text class="pt-l" x="8" y="206">ovule</text><path class="ld" d="M42,202 L166,206"/>
  <text class="pt-l" x="8" y="240">female nucleus</text>
  <text class="pt-s" x="8" y="253">(egg cell)</text><path class="ld" d="M92,236 L192,243"/>
  <text class="pt-l" x="8" y="288">micropyle</text><path class="ld" d="M62,284 L196,265"/>
  <!-- step key right of carpel -->
  <text class="pt-s" x="274" y="40"><tspan font-weight="700">1</tspan> pollen grain lands on</text>
  <text class="pt-s" x="284" y="53">stigma (pollination)</text>
  <text class="pt-s" x="274" y="100"><tspan font-weight="700">2</tspan> pollen tube grows down</text>
  <text class="pt-s" x="284" y="113">the style, carrying the</text>
  <text class="pt-s" x="284" y="126">male nucleus</text>
  <text class="pt-s" x="274" y="212"><tspan font-weight="700">3</tspan> tube enters the ovule</text>
  <text class="pt-s" x="284" y="225">through the micropyle</text>
  <text class="pt-s" x="274" y="256"><tspan font-weight="700">4</tspan> male nucleus fuses with</text>
  <text class="pt-s" x="284" y="269">female nucleus</text>
  <text class="pt-s" x="284" y="282">= fertilisation → zygote</text>
  <text class="pt-l" x="274" y="160" style="fill:#c0392b">pollen tube</text>
  <path class="ld" d="M272,156 L236,166"/>

  <!-- B fruit -->
  <ellipse cx="560" cy="192" rx="112" ry="72" fill="#fbe3c8" stroke="#c46f1c" stroke-width="2.4"/>
  <ellipse cx="560" cy="196" rx="44" ry="32" fill="#f3e2b4" stroke="#8a6a3a" stroke-width="3"/>
  <path d="M536,204 C540,184 560,176 578,182 C592,188 590,204 578,210 C566,214 552,210 546,214" fill="#9ccf84" stroke="#4f8a3c" stroke-width="1.4"/>
  <path d="M546,214 L534,222" stroke="#4f8a3c" stroke-width="2"/>
  <!-- labels B -->
  <text class="pt-l" x="430" y="48">ovary</text><text class="pt-s" x="466" y="48">→</text><text class="pt-l" x="482" y="48" style="fill:#c46f1c">fruit</text>
  <text class="pt-l" x="430" y="66">ovule</text><text class="pt-s" x="466" y="66">→</text><text class="pt-l" x="482" y="66" style="fill:#8a6a3a">seed</text>
  <text class="pt-l" x="560" y="48">ovule wall</text><text class="pt-s" x="620" y="48">→</text><text class="pt-l" x="636" y="48" style="fill:#8a6a3a">seed coat (testa)</text>
  <text class="pt-l" x="560" y="66">zygote</text><text class="pt-s" x="620" y="66">→</text><text class="pt-l" x="636" y="66" style="fill:#4f8a3c">embryo</text>
  <text class="pt-s" x="430" y="90">zygote divides by mitosis to form the embryo; seed stores food;</text>
  <text class="pt-s" x="430" y="103">petals, stamens, style and stigma wither and fall off</text>
  <text class="pt-l" x="684" y="150">fruit</text><path class="ld" d="M682,146 L660,160"/>
  <text class="pt-s" x="684" y="163">(ovary wall)</text>
  <text class="pt-l" x="684" y="200">seed coat</text><path class="ld" d="M682,196 L603,196"/>
  <text class="pt-l" x="684" y="240">embryo</text><path class="ld" d="M682,236 L584,206"/>
  <text class="pt-l" x="430" y="284">seed (from ovule)</text><path class="ld" d="M500,274 L530,222"/>
</svg>

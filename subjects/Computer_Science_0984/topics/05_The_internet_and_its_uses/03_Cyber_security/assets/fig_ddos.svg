<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="An attacker controls many infected computers which all send requests to one web server; the overloaded server cannot answer a genuine user" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .ddos-box{fill:#f1f5f9;stroke:#334155;stroke-width:1.4}
    .ddos-bot{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.2}
    .ddos-t{font-size:14px;font-weight:700;fill:#1e293b;text-anchor:middle}
    .ddos-s{font-size:12px;fill:#475569;text-anchor:middle}
    .ddos-bt{font-size:11px;fill:#7f1d1d;text-anchor:middle}
  </style>

  <rect class="ddos-box" x="10" y="78" width="100" height="44" rx="5"/>
  <text class="ddos-t" x="60" y="98">Attacker</text>
  <text class="ddos-s" x="60" y="114">controls them</text>

  <g stroke="#64748b" stroke-width="1.1" stroke-dasharray="3 3">
    <line x1="110" y1="100" x2="200" y2="21"/><line x1="110" y1="100" x2="200" y2="51"/>
    <line x1="110" y1="100" x2="200" y2="81"/><line x1="110" y1="100" x2="200" y2="111"/>
    <line x1="110" y1="100" x2="200" y2="141"/><line x1="110" y1="100" x2="200" y2="171"/>
  </g>

  <g>
    <rect class="ddos-bot" x="200" y="10" width="110" height="22" rx="3"/><text class="ddos-bt" x="255" y="25">infected computer</text>
    <rect class="ddos-bot" x="200" y="40" width="110" height="22" rx="3"/><text class="ddos-bt" x="255" y="55">infected computer</text>
    <rect class="ddos-bot" x="200" y="70" width="110" height="22" rx="3"/><text class="ddos-bt" x="255" y="85">infected computer</text>
    <rect class="ddos-bot" x="200" y="100" width="110" height="22" rx="3"/><text class="ddos-bt" x="255" y="115">infected computer</text>
    <rect class="ddos-bot" x="200" y="130" width="110" height="22" rx="3"/><text class="ddos-bt" x="255" y="145">infected computer</text>
    <rect class="ddos-bot" x="200" y="160" width="110" height="22" rx="3"/><text class="ddos-bt" x="255" y="175">infected computer</text>
  </g>

  <g stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ad)">
    <line x1="312" y1="21" x2="468" y2="72"/><line x1="312" y1="51" x2="468" y2="80"/>
    <line x1="312" y1="81" x2="468" y2="88"/><line x1="312" y1="111" x2="468" y2="96"/>
    <line x1="312" y1="141" x2="468" y2="104"/><line x1="312" y1="171" x2="468" y2="112"/>
  </g>
  <text x="385" y="30" font-size="12" fill="#b91c1c" text-anchor="middle">flood of requests</text>

  <rect x="470" y="60" width="160" height="64" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text class="ddos-t" x="550" y="84">Web server</text>
  <text class="ddos-s" x="550" y="102">overloaded — cannot</text>
  <text class="ddos-s" x="550" y="116">respond to genuine requests</text>

  <rect class="ddos-box" x="360" y="178" width="120" height="34" rx="5"/>
  <text class="ddos-t" x="420" y="200">Genuine user</text>
  <line x1="480" y1="186" x2="540" y2="130" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M500 150 l16 16 M516 150 l-16 16" stroke="#b91c1c" stroke-width="2.6"/>
  <text x="532" y="186" font-size="12" fill="#b91c1c">request not served</text>
</svg>

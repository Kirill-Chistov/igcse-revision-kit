<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#16283c"/></marker>
    <marker id="k2" markerWidth="7" markerHeight="7" refX="0" refY="2.5" orient="auto"><path d="M5,0 L0,2.5 L5,5 z" fill="#16283c"/></marker>
    <clipPath id="above"><rect x="90" y="40" width="600" height="117"/></clipPath>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">Storm hydrographs for two drainage basins after the same storm</text>

  <!-- rainfall bars hanging from the top -->
  <g fill="#7fb2d4">
    <rect x="99" y="40" width="15" height="10"/><rect x="115" y="40" width="15" height="22"/>
    <rect x="132" y="40" width="15" height="38"/><rect x="149" y="40" width="15" height="50"/>
    <rect x="165" y="40" width="15" height="28"/><rect x="182" y="40" width="15" height="12"/>
  </g>
  <text x="206" y="54" font-size="12" fill="#2a5f80">rainfall</text>

  <!-- axes -->
  <line x1="90" y1="40" x2="90" y2="300" stroke="#16283c" stroke-width="1.4"/>
  <line x1="90" y1="300" x2="690" y2="300" stroke="#16283c" stroke-width="1.4"/>
  <g font-size="11.5" fill="#33475b" text-anchor="middle">
    <text x="90" y="316">0</text><text x="190" y="316">12</text><text x="290" y="316">24</text><text x="390" y="316">36</text>
    <text x="490" y="316">48</text><text x="590" y="316">60</text><text x="690" y="316">72</text>
  </g>
  <text x="390" y="336" font-size="12.5" fill="#16283c" text-anchor="middle">time from the start of the rainfall (hours)</text>
  <text x="62" y="175" font-size="12.5" fill="#16283c" text-anchor="middle" transform="rotate(-90 62 175)">river discharge (m³/s)</text>

  <!-- flood shading: curve A above bankfull -->
  <path d="M140,252 C175,252 198,100 223,100 C252,100 330,236 430,247 L430,300 L140,300 Z" fill="#c0392b" opacity="0.18" clip-path="url(#above)"/>
  <!-- bankfull -->
  <line x1="90" y1="157" x2="690" y2="157" stroke="#16283c" stroke-width="1.3" stroke-dasharray="7 4"/>
  <text x="440" y="150" font-size="12" fill="#16283c">bankfull discharge — above this the river floods</text>

  <!-- peak rainfall line -->
  <line x1="157" y1="92" x2="157" y2="296" stroke="#6b7a88" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="154" y="108" font-size="11.5" fill="#6b7a88" text-anchor="end">peak rainfall</text>
  <!-- curves -->
  <path d="M90,252 L165,252 C230,252 290,199 340,199 C400,199 470,236 560,248 C610,252 650,252 690,252" fill="none" stroke="#0f7b6c" stroke-width="3.2"/>
  <path d="M90,252 L140,252 C175,252 198,100 223,100 C252,100 330,236 430,247 C520,252 600,252 690,252" fill="none" stroke="#c0392b" stroke-width="3.2"/>
  <line x1="223" y1="104" x2="223" y2="296" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="340" y1="203" x2="340" y2="296" stroke="#0f7b6c" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- labels on curves -->
  <text x="232" y="94" font-size="12" font-weight="700" fill="#c0392b">peak discharge</text>
  <text x="146" y="184" font-size="12" fill="#c0392b" text-anchor="end">rising</text>
  <text x="146" y="197" font-size="12" fill="#c0392b" text-anchor="end">limb</text>
  <text x="272" y="124" font-size="12" fill="#c0392b">falling limb</text>
  <text x="560" y="243" font-size="12" fill="#33475b">base flow (groundwater)</text>

  <!-- lag times -->
  <line x1="159" y1="270" x2="221" y2="270" stroke="#c0392b" stroke-width="1.6" marker-end="url(#k)" marker-start="url(#k2)"/>
  <text x="228" y="274" font-size="11.5" font-weight="700" fill="#c0392b">lag time A</text>
  <line x1="159" y1="287" x2="338" y2="287" stroke="#0f7b6c" stroke-width="1.6" marker-end="url(#k)" marker-start="url(#k2)"/>
  <text x="345" y="291" font-size="11.5" font-weight="700" fill="#0f7b6c">lag time B</text>

  <!-- key -->
  <rect x="706" y="60" width="180" height="200" rx="4" fill="#f8fafb" stroke="#dfe5ea"/>
  <line x1="718" y1="80" x2="748" y2="80" stroke="#c0392b" stroke-width="3.2"/>
  <text x="754" y="84" font-size="12.5" font-weight="700" fill="#c0392b">Basin A — "flashy"</text>
  <text x="718" y="102" font-size="11.5" fill="#33475b">urban, deforested, steep,</text>
  <text x="718" y="116" font-size="11.5" fill="#33475b">impermeable or saturated</text>
  <text x="718" y="130" font-size="11.5" fill="#33475b">→ short lag time, high peak</text>
  <line x1="718" y1="160" x2="748" y2="160" stroke="#0f7b6c" stroke-width="3.2"/>
  <text x="754" y="164" font-size="12.5" font-weight="700" fill="#0f7b6c">Basin B — "subdued"</text>
  <text x="718" y="182" font-size="11.5" fill="#33475b">forested, gentle slopes,</text>
  <text x="718" y="196" font-size="11.5" fill="#33475b">permeable, dry soil</text>
  <text x="718" y="210" font-size="11.5" fill="#33475b">→ long lag time, low peak</text>
  <rect x="718" y="228" width="20" height="12" fill="#c0392b" opacity="0.18"/>
  <text x="744" y="238" font-size="11.5" fill="#33475b">flood (A only)</text>
</svg>

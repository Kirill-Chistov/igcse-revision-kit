<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Carlito, Calibri, Lato, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="c1b2-arr0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="c1b2-arr1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a88"/></marker></defs><text x="180.0" y="22.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >Filtration</text><text x="180.0" y="40.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >insoluble solid from a liquid</text><path d="M95,70 L150,140 L205,70" stroke="#16283c" stroke-width="1.5" fill="none" /><path d="M144,132 L144,180 M156,132 L156,180" stroke="#16283c" stroke-width="1.5" fill="none" /><path d="M104,73 L150,130 L196,73" stroke="#0f7b6c" stroke-width="1.2" fill="none" stroke-dasharray="4 3" /><path d="M122,100 L150,126 L178,100 Q150,106 122,100 Z" stroke="None" stroke-width="1.5" fill="#c8a36a" /><path d="M138,170 L138,195 L105,255 L195,255 L162,195 L162,170" stroke="#16283c" stroke-width="1.5" fill="none" /><path d="M113,240 L187,240 L195,254 L105,254 Z" stroke="None" stroke-width="1.5" fill="#d6ebf7" /><circle cx="150.0" cy="188.0" r="2.0" fill="#7fb3d5" /><line x1="220.0" y1="112.0" x2="175.0" y2="112.0" stroke="#16283c" stroke-width="1" marker-end="url(#c1b2-arr0)"/><text x="224.0" y="108.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal" >residue</text><text x="224.0" y="123.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal" >(insoluble solid,</text><text x="224.0" y="136.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal" >e.g. sand)</text><line x1="220.0" y1="82.0" x2="195.0" y2="82.0" stroke="#16283c" stroke-width="1" marker-end="url(#c1b2-arr0)"/><text x="224.0" y="86.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="normal" font-style="normal" >filter paper</text><line x1="220.0" y1="247.0" x2="186.0" y2="247.0" stroke="#16283c" stroke-width="1" marker-end="url(#c1b2-arr0)"/><text x="224.0" y="243.0" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal" >filtrate</text><text x="224.0" y="257.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal" >(liquid that passes through)</text><line x1="362.0" y1="15.0" x2="362.0" y2="280.0" stroke="#dfe5ea" stroke-width="1.2"/><text x="540.0" y="22.0" font-size="14" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >Crystallisation</text><text x="540.0" y="40.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >soluble solid from its solution</text><path d="M405,110 Q450,158 495,110" stroke="#16283c" stroke-width="1.6" fill="#f3f8fb" /><path d="M413,120 Q450,154 487,120 Z" stroke="None" stroke-width="1.5" fill="#cfe4dd" /><line x1="400.0" y1="148.0" x2="500.0" y2="148.0" stroke="#16283c" stroke-width="2"/><line x1="410.0" y1="148.0" x2="402.0" y2="220.0" stroke="#16283c" stroke-width="1.6"/><line x1="490.0" y1="148.0" x2="498.0" y2="220.0" stroke="#16283c" stroke-width="1.6"/><path d="M441,190 Q440,174 450,162 Q460,174 459,190 Z" stroke="#d35400" stroke-width="1.2" fill="#f8c471" /><rect x="443.0" y="190.0" width="14.0" height="18.0" rx="0" fill="#aab4bd" stroke="#33475b" stroke-width="1" /><text x="450.0" y="222.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >heat</text><path d="M440,106 q-5,-7 0,-14 q5,-7 0,-14" stroke="#6b7a88" stroke-width="1.2" fill="none" /><path d="M460,106 q-5,-7 0,-14 q5,-7 0,-14" stroke="#6b7a88" stroke-width="1.2" fill="none" /><text x="450.0" y="58.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >1  heat to evaporate</text><text x="450.0" y="72.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >some of the water</text><line x1="512.0" y1="130.0" x2="562.0" y2="130.0" stroke="#6b7a88" stroke-width="1.6" marker-end="url(#c1b2-arr1)"/><path d="M595,110 Q640,158 685,110" stroke="#16283c" stroke-width="1.6" fill="#f3f8fb" /><path d="M603,120 Q640,154 677,120 Z" stroke="None" stroke-width="1.5" fill="#cfe4dd" /><rect x="620.0" y="119.0" width="8.0" height="8.0" rx="0" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.2" transform="rotate(30 624 123)"/><rect x="632.0" y="124.0" width="8.0" height="8.0" rx="0" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.2" transform="rotate(30 636 128)"/><rect x="645.0" y="123.0" width="8.0" height="8.0" rx="0" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.2" transform="rotate(30 649 127)"/><rect x="656.0" y="118.0" width="8.0" height="8.0" rx="0" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.2" transform="rotate(30 660 122)"/><rect x="638.0" y="117.0" width="8.0" height="8.0" rx="0" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.2" transform="rotate(30 642 121)"/><rect x="610.0" y="115.0" width="8.0" height="8.0" rx="0" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.2" transform="rotate(30 614 119)"/><text x="640.0" y="56.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >2  leave to cool:</text><text x="640.0" y="70.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >crystals form</text><text x="640.0" y="188.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >3  filter off the</text><text x="640.0" y="202.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >crystals and dry</text><text x="640.0" y="216.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >them (e.g. in a</text><text x="640.0" y="230.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal" >warm oven)</text><text x="540.0" y="262.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >Stop heating when crystals start to form:</text><text x="540.0" y="276.0" font-size="11.5" fill="#33475b" text-anchor="middle" font-weight="normal" font-style="normal" >the solution is then saturated.</text></svg>

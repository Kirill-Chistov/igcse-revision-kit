<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" role="img" aria-label="How the eight characteristics of living organisms connect: nutrition supplies food; respiration in every cell releases energy from it; that energy is used for movement, growth and development, reproduction, response and control of internal conditions; excretion removes the waste products of metabolism. Egestion of undigested food is not excretion." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .ch1-t   { font-weight: 700; font-size: 15px; }
    .ch1-s   { font-size: 12.5px; fill: #33475b; }
    .ch1-c   { text-anchor: middle; }
    .ch1-lab { font-size: 12px; font-style: italic; fill: #0b5f54; }
    .ch1-org { font-weight: 700; font-size: 12px; letter-spacing: 0.08em; fill: #0f7b6c; }
    .ch1-arr { stroke: #0f7b6c; stroke-width: 2.2; fill: none; }
    .ch1-en  { stroke: #d99a17; stroke-width: 2.6; fill: none; }
  </style>
  <defs>
    <marker id="c1a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#0f7b6c"/>
    </marker>
    <marker id="c1e" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#d99a17"/>
    </marker>
  </defs>

  <!-- organism boundary -->
  <rect x="165" y="22" width="589" height="282" rx="16" fill="#fbfdfc" stroke="#0f7b6c" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="ch1-org" x="182" y="44">LIVING ORGANISM — MADE OF CELLS</text>

  <!-- nutrition (input) -->
  <rect x="8" y="118" width="140" height="92" rx="10" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
  <text class="ch1-t ch1-c" x="78" y="146">NUTRITION</text>
  <text class="ch1-s ch1-c" x="78" y="166">takes in food (animals)</text>
  <text class="ch1-s ch1-c" x="78" y="182">or makes it by</text>
  <text class="ch1-s ch1-c" x="78" y="198">photosynthesis (plants)</text>
  <line class="ch1-arr" x1="148" y1="164" x2="210" y2="164" marker-end="url(#c1a)"/>
  <text class="ch1-lab ch1-c" x="78" y="230">food = energy source</text>
  <text class="ch1-lab ch1-c" x="78" y="245">+ raw materials</text>

  <!-- respiration (centre) -->
  <rect x="210" y="112" width="172" height="104" rx="12" fill="#0f7b6c"/>
  <text class="ch1-t ch1-c" x="296" y="142" style="fill:#ffffff">RESPIRATION</text>
  <text class="ch1-s ch1-c" x="296" y="163" style="fill:#e7f3ef">in every living cell,</text>
  <text class="ch1-s ch1-c" x="296" y="179" style="fill:#e7f3ef">all the time:</text>
  <text class="ch1-s ch1-c" x="296" y="197" style="fill:#ffffff;font-weight:700">releases energy from food</text>

  <!-- energy bus -->
  <line class="ch1-en" x1="382" y1="164" x2="428" y2="164"/>
  <line class="ch1-en" x1="428" y1="76" x2="428" y2="260"/>
  <text class="ch1-lab ch1-c" x="404" y="155" style="fill:#a8740c">energy</text>
  <g>
    <line class="ch1-en" x1="428" y1="76"  x2="456" y2="76"  marker-end="url(#c1e)"/>
    <line class="ch1-en" x1="428" y1="122" x2="456" y2="122" marker-end="url(#c1e)"/>
    <line class="ch1-en" x1="428" y1="168" x2="456" y2="168" marker-end="url(#c1e)"/>
    <line class="ch1-en" x1="428" y1="214" x2="456" y2="214" marker-end="url(#c1e)"/>
    <line class="ch1-en" x1="428" y1="260" x2="456" y2="260" marker-end="url(#c1e)"/>
  </g>
  <g fill="#fdf6e5" stroke="#d99a17" stroke-width="1.5">
    <rect x="455" y="58" width="290" height="36" rx="8"/>
    <rect x="455" y="104" width="290" height="36" rx="8"/>
    <rect x="455" y="150" width="290" height="36" rx="8"/>
    <rect x="455" y="196" width="290" height="36" rx="8"/>
    <rect x="455" y="242" width="290" height="36" rx="8"/>
  </g>
  <text x="470" y="81"><tspan class="ch1-t">MOVEMENT</tspan><tspan class="ch1-s"> — changes position</tspan></text>
  <text x="470" y="127"><tspan class="ch1-t">GROWTH &amp; DEVELOPMENT</tspan><tspan class="ch1-s"> — new cells</tspan></text>
  <text x="470" y="173"><tspan class="ch1-t">REPRODUCTION</tspan><tspan class="ch1-s"> — makes offspring</tspan></text>
  <text x="470" y="219"><tspan class="ch1-t">RESPONSE</tspan><tspan class="ch1-s"> — reacts to changes outside</tspan></text>
  <text x="470" y="265"><tspan class="ch1-t">CONTROL</tspan><tspan class="ch1-s"> — keeps conditions inside steady</tspan></text>

  <!-- excretion (output) -->
  <line class="ch1-arr" x1="296" y1="216" x2="296" y2="326" marker-end="url(#c1a)"/>
  <text class="ch1-lab" x="306" y="252">waste products of</text>
  <text class="ch1-lab" x="306" y="267">metabolism, e.g. CO₂</text>
  <text class="ch1-lab" x="306" y="282">from respiration</text>
  <rect x="120" y="332" width="352" height="62" rx="10" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
  <text class="ch1-t ch1-c" x="296" y="352">EXCRETION</text>
  <text class="ch1-s ch1-c" x="296" y="372">removes them from the body: CO₂, urea;</text>
  <text class="ch1-s ch1-c" x="296" y="387">in plants also O₂ made in photosynthesis</text>

  <!-- egestion: not excretion -->
  <rect x="490" y="332" width="264" height="62" rx="10" fill="#fdeded" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="ch1-t ch1-c" x="622" y="355" style="fill:#c0392b">✗ Egestion is NOT excretion</text>
  <text class="ch1-s ch1-c" x="622" y="376">faeces = undigested food, never inside cells</text>
</svg>

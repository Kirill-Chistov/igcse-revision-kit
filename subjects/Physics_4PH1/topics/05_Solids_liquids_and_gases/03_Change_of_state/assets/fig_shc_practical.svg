<line x1="204.0" y1="120.0" x2="204.0" y2="186.0" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="204.0" cy="190.0" r="6.0" fill="#c0392b" stroke="#16283c" stroke-width="1.2"/>
<rect x="295.0" y="70.0" width="14.0" height="132.0" rx="3" fill="#56606b" stroke="#16283c" stroke-width="1.2"/>
<path d="M299 70 V50 H470" fill="none" stroke="#16283c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M305 70 V62 H470" fill="none" stroke="#16283c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="470.0" y="36.0" width="120.0" height="58.0" rx="5" fill="#eef2f5" stroke="#16283c" stroke-width="1.6"/>
<text x="530.0" y="58.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="700">joulemeter</text>
<rect x="500.0" y="66.0" width="60.0" height="18.0" rx="2" fill="#ffffff" stroke="#16283c" stroke-width="1.1"/>
<text x="530.0" y="80.0" font-size="12" fill="#16283c" text-anchor="middle" font-weight="400" font-style="italic">E / J</text>
<line x1="590.0" y1="50.0" x2="650.0" y2="50.0" stroke="#16283c" stroke-width="1.6" stroke-linecap="round"/>
<line x1="590.0" y1="62.0" x2="650.0" y2="62.0" stroke="#16283c" stroke-width="1.6" stroke-linecap="round"/>
<rect x="650.0" y="36.0" width="140.0" height="58.0" rx="5" fill="#eef2f5" stroke="#16283c" stroke-width="1.6"/>
<text x="720.0" y="60.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="700">low-voltage</text>
<text x="720.0" y="76.0" font-size="13" fill="#16283c" text-anchor="middle" font-weight="700">power supply</text>
<text x="192.0" y="42.0" font-size="13" fill="#33475b" text-anchor="end" font-weight="400">thermometer</text>

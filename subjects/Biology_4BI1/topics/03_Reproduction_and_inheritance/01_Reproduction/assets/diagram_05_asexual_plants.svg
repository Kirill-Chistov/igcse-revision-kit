  <path d="M666,168 L734,168 L726,212 L674,212 Z" fill="#c69c6d" stroke="#8a6a3a" stroke-width="1.4"/><rect x="668" y="168" width="64" height="8" fill="#6b4a2b"/>
  <path d="M700,184 q-4.0,8.0 -8,16" stroke="#f5efe6" stroke-width="1.3" fill="none"/>
  <path d="M700,184 q3.0,10.0 6,20" stroke="#f5efe6" stroke-width="1.3" fill="none"/>
  <path d="M700,184 q0.0,12.0 0,24" stroke="#f5efe6" stroke-width="1.3" fill="none"/>
  <circle cx="460" cy="34" r="9" fill="#0f7b6c"/><text class="ap-n" x="460" y="38" text-anchor="middle">1</text>
  <text class="ap-s" x="460" y="232" text-anchor="middle">cut a shoot just</text><text class="ap-s" x="460" y="245" text-anchor="middle">below a leaf</text>
  <circle cx="580" cy="34" r="9" fill="#0f7b6c"/><text class="ap-n" x="580" y="38" text-anchor="middle">2</text>
  <text class="ap-s" x="580" y="232" text-anchor="middle">remove lower leaves;</text><text class="ap-s" x="580" y="245" text-anchor="middle">dip in rooting powder</text>
  <circle cx="700" cy="34" r="9" fill="#0f7b6c"/><text class="ap-n" x="700" y="38" text-anchor="middle">3</text>
  <text class="ap-s" x="700" y="232" text-anchor="middle">damp compost;</text><text class="ap-s" x="700" y="245" text-anchor="middle">plastic bag over it</text>
  <text class="ap-s" x="606" y="196">(plant</text><text class="ap-s" x="606" y="208">hormones)</text>
  </svg>

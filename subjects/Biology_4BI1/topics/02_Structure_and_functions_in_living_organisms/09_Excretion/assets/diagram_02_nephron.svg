<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A nephron. Blood enters the glomerulus, a knot of capillaries inside the Bowman's capsule, through a wide arteriole and leaves through a narrower one. 1: ultrafiltration forces water, glucose, urea and ions into the capsule. 2: in the proximal convoluted tubule all the glucose is selectively reabsorbed. 3: the loop of Henle makes the surrounding tissue salty. The distal convoluted tubule leads to the collecting duct. 4: water is reabsorbed from the collecting duct, controlled by ADH. Urine flows to the ureter.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .np-l { font-size: 12px; font-weight: 700; }
    .np-s { font-size: 11.5px; fill: #33475b; }
    .np-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .np-t { fill: none; stroke: #d9b24a; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .np-ti { fill: none; stroke: #fdf3d0; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .np-ld { fill: none; stroke: #8fa3b8; stroke-width: 1.1; }
  </style>
  <!-- tubule outer then inner (lumen) -->
  <g>
    <path class="np-t" d="M136,88 C140,60 160,110 176,80 C190,56 206,104 222,78 C236,56 252,100 262,84 L270,100 L270,282 C270,300 300,300 300,282 L300,110 C310,80 326,120 340,92 C352,70 368,110 384,86 C396,68 410,92 420,80 L444,80"/>
    <path class="np-ti" d="M136,88 C140,60 160,110 176,80 C190,56 206,104 222,78 C236,56 252,100 262,84 L270,100 L270,282 C270,300 300,300 300,282 L300,110 C310,80 326,120 340,92 C352,70 368,110 384,86 C396,68 410,92 420,80 L444,80"/>
    <path d="M456,30 L456,316" stroke="#d9b24a" stroke-width="14"/>
    <path d="M456,30 L456,316" stroke="#fdf3d0" stroke-width="8"/>
  </g>
  <!-- Bowman's capsule -->
  <path d="M56,54 C74,34 124,34 136,66 L136,110 C124,142 74,142 56,122" fill="#fdf3d0" stroke="#b8860b" stroke-width="4"/>
  <path d="M62,62 C78,46 118,46 128,70 L128,106 C118,130 78,130 62,114" fill="#fffaf0" stroke="#b8860b" stroke-width="1.2"/>
  <!-- glomerulus -->
  <path d="M0,80 L66,80" stroke="#c0392b" stroke-width="6"/>
  <path d="M0,98 L66,98" stroke="#c0392b" stroke-width="3.5"/>
  <g fill="none" stroke="#c0392b" stroke-width="3">
    <path d="M66,80 C70,62 90,58 96,70 C104,58 122,66 116,80 C126,88 118,106 106,100 C104,114 84,114 84,102 C72,108 64,100 66,98"/>
    <path d="M78,78 C88,74 100,84 92,92 C86,98 76,92 80,86"/>
  </g>
  <text class="np-s" x="2" y="73">blood in</text>
  <text class="np-s" x="2" y="114">out</text>
  <!-- process markers -->
  <g>
    <circle cx="150" cy="130" r="10" fill="#0f7b6c"/><text class="np-n" x="150" y="134" text-anchor="middle">1</text>
    <circle cx="196" cy="126" r="10" fill="#0f7b6c"/><text class="np-n" x="196" y="130" text-anchor="middle">2</text>
    <circle cx="324" cy="230" r="10" fill="#0f7b6c"/><text class="np-n" x="324" y="234" text-anchor="middle">3</text>
    <circle cx="484" cy="200" r="10" fill="#0f7b6c"/><text class="np-n" x="484" y="204" text-anchor="middle">4</text>
  </g>
  <!-- reabsorption arrows -->
  <path d="M196,94 L196,112" stroke="#c0392b" stroke-width="2.2"/><path d="M196,116 l-4,-7 h8z" fill="#c0392b"/>
  <path d="M468,170 L500,170" stroke="#2e6fa3" stroke-width="2.2"/><path d="M506,170 l-7,-4 v8z" fill="#2e6fa3"/>
  <path d="M468,236 L500,236" stroke="#2e6fa3" stroke-width="2.2"/><path d="M506,236 l-7,-4 v8z" fill="#2e6fa3"/>
  <!-- structure labels -->
  <text class="np-l" x="20" y="24">Bowman's capsule</text><path class="np-ld" d="M76,28 L86,40"/>
  <text class="np-l" x="6" y="166">glomerulus</text><path class="np-ld" d="M50,154 L90,108"/>
  <text class="np-l" x="150" y="30">proximal convoluted tubule</text><path class="np-ld" d="M190,34 L200,66"/>
  <text class="np-l" x="190" y="232" text-anchor="end">loop of Henle</text><path class="np-ld" d="M194,228 L264,228"/>
  <text class="np-l" x="330" y="30">distal convoluted tubule</text><path class="np-ld" d="M380,34 L378,76"/>
  <text class="np-l" x="468" y="26">collecting duct</text>
  <text class="np-l" x="468" y="318">urine → ureter</text><text class="np-s" x="470" y="160">water</text><text class="np-s" x="470" y="258">to blood</text>
  <!-- process text -->
  <line x1="530" y1="44" x2="530" y2="300" stroke="#dfe5ea" stroke-width="1.4"/>
  <text class="np-l" x="544" y="54"><tspan fill="#0f7b6c">1</tspan>  Ultrafiltration</text>
  <text class="np-s" x="544" y="68">wide arteriole in, narrow out → high</text>
  <text class="np-s" x="544" y="82">pressure forces small molecules out</text>
  <text class="np-l" x="544" y="108"><tspan fill="#0f7b6c">2</tspan>  Selective reabsorption</text>
  <text class="np-s" x="544" y="122">all glucose back into the blood</text>
  <text class="np-s" x="544" y="136">(with some water and ions)</text>
  <text class="np-l" x="544" y="162"><tspan fill="#0f7b6c">3</tspan>  Loop of Henle</text>
  <text class="np-s" x="544" y="176">makes the tissue around the</text>
  <text class="np-s" x="544" y="190">collecting duct salty</text>
  <text class="np-l" x="544" y="216"><tspan fill="#0f7b6c">4</tspan>  Water reabsorbed</text>
  <text class="np-s" x="544" y="230">by osmosis from the collecting</text>
  <text class="np-s" x="544" y="244">duct; amount set by ADH</text>
  <text class="np-s" x="544" y="276">urine: water, urea, ions</text>
</svg>

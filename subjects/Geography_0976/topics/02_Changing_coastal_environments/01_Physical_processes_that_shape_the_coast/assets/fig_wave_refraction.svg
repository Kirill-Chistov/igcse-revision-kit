<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 335" width="820" height="335" role="img" aria-label="Wave refraction: wave crests bend round a headland, concentrating energy on it and spreading energy out in the bays">
  <defs>
    <marker id="wr-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b03a2e"/></marker>
    <clipPath id="wr-clip"><rect x="0" y="0" width="820" height="300"/></clipPath>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
    <g clip-path="url(#wr-clip)">
      <rect x="0" y="0" width="820" height="300" fill="#cfe3ee"/>
      <!-- shallow-water edge -->
      <path d="M0,122 C80,120 170,112 240,127 C290,142 320,177 345,217 C365,247 392,258 410,258 C428,258 455,247 475,217 C500,177 530,142 580,127 C650,112 740,120 820,122" fill="none" stroke="#2c6e91" stroke-width="1.4" stroke-dasharray="6 4"/>
      <!-- crests -->
      <g fill="none" stroke="#2c6e91" stroke-width="2.4">
        <path d="M0,142 C150,127 250,127 300,167 C330,197 368,264 410,264 C452,264 490,197 520,167 C570,127 670,127 820,142"/>
        <path d="M0,192 C200,180 300,187 340,217 C365,242 388,287 410,287 C432,287 455,242 480,217 C520,187 620,180 820,192"/>
        <path d="M0,247 C220,240 330,252 365,270 C385,282 396,307 410,307 C424,307 435,282 455,270 C490,252 600,240 820,247"/>
        <path d="M0,302 C300,298 380,318 410,318 C440,318 520,298 820,302"/>
      </g>
      <!-- land -->
      <path d="M0,0 L820,0 L820,70 C740,72 660,60 590,75 C540,88 505,120 480,165 C465,190 450,205 410,208 C370,205 355,190 340,165 C315,120 280,88 230,75 C160,60 80,72 0,70 Z" fill="#dfe8cf" stroke="#6f8a5a" stroke-width="1.5"/>
      <!-- bay beaches -->
      <path d="M40,72 C100,67 170,64 230,78 C262,86 288,103 306,125" fill="none" stroke="#e3c783" stroke-width="9"/>
      <path d="M780,72 C720,67 650,64 590,78 C558,86 532,103 514,125" fill="none" stroke="#e3c783" stroke-width="9"/>
      <!-- energy arrows -->
      <g fill="none" stroke="#b03a2e" stroke-width="2.6" marker-end="url(#wr-arr)">
        <path d="M330,330 C330,290 345,250 372,214"/>
        <path d="M490,330 C490,290 475,250 448,214"/>
        <path d="M410,330 L410,217"/>
        <path d="M150,330 C150,250 130,160 100,85"/>
        <path d="M205,330 C205,250 225,170 250,95"/>
        <path d="M670,330 C670,250 690,160 720,85"/>
        <path d="M615,330 C615,250 595,170 570,95"/>
      </g>
      <g font-weight="700" text-anchor="middle">
        <text x="410" y="128" font-size="17">HEADLAND</text>
        <text x="410" y="152" font-size="13.5" fill="#8e2a1f">energy concentrated</text>
        <text x="410" y="168" font-size="13.5" fill="#8e2a1f">→ erosion</text>
        <text x="150" y="26" font-size="17">BAY</text>
        <text x="150" y="46" font-size="13.5" fill="#0b5f54">energy spread out → deposition (beach)</text>
        <text x="670" y="26" font-size="17">BAY</text>
        <text x="670" y="46" font-size="13.5" fill="#0b5f54">energy spread out → deposition (beach)</text>
      </g>
    </g>
    <g font-size="13" fill="#33475b">
      <line x1="10" y1="320" x2="45" y2="320" stroke="#2c6e91" stroke-width="2.4"/>
      <text x="52" y="324">wave crest</text>
      <line x1="150" y1="320" x2="185" y2="320" stroke="#b03a2e" stroke-width="2.6" marker-end="url(#wr-arr)"/>
      <text x="192" y="324">direction of wave energy</text>
      <line x1="370" y1="320" x2="405" y2="320" stroke="#2c6e91" stroke-width="1.4" stroke-dasharray="6 4"/>
      <text x="412" y="324">edge of shallow water — waves slow down once they cross it</text>
    </g>
  </g>
</svg>

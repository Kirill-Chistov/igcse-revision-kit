<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 700 244" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16283c"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 z" fill="#16283c"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
  </defs>
  <text x="16" y="66" font-size="16" font-weight="700" fill="#16283c">A river channel in cross-section</text>

  <!-- ground -->
  <path d="M20,90 L110,90 L200,200 L280,225 L420,225 L520,190 L610,90 L680,90 L680,280 L20,280 Z" fill="#efe6d2"/>
  <!-- water -->
  <path d="M134.5,120 L200,200 L280,225 L420,225 L520,190 L583,120 Z" fill="#dbeaf3"/>
  <line x1="134.5" y1="120" x2="583" y2="120" stroke="#3d7ea6" stroke-width="2"/>
  <!-- wetted perimeter -->
  <path d="M134.5,120 L200,200 L280,225 L420,225 L520,190 L583,120" fill="none" stroke="#c0392b" stroke-width="4.5"/>
  <!-- bank line above water -->
  <path d="M20,90 L110,90 L134.5,120 M583,120 L610,90 L680,90" fill="none" stroke="#8a6f33" stroke-width="2"/>

  <!-- width -->
  <line x1="138" y1="104" x2="579" y2="104" stroke="#16283c" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a2)"/>
  <text x="358" y="96" font-size="13" font-weight="700" fill="#16283c" text-anchor="middle">WIDTH</text>

  <!-- depth -->
  <line x1="350" y1="124" x2="350" y2="221" stroke="#16283c" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a2)"/>
  <text x="358" y="160" font-size="13" font-weight="700" fill="#16283c">DEPTH</text>
  <text x="358" y="175" font-size="12" fill="#33475b">(water surface to bed)</text>

  <text x="230" y="150" font-size="12.5" font-weight="700" fill="#2a5f80">CROSS-SECTIONAL</text>
  <text x="230" y="165" font-size="12.5" font-weight="700" fill="#2a5f80">AREA (shaded)</text>

  <text x="60" y="258" font-size="12" font-weight="700" fill="#16283c">CHANNEL = the bed and banks</text>

  <!-- wetted perimeter label -->
  <text x="430" y="262" font-size="13" font-weight="700" fill="#c0392b">WETTED PERIMETER</text>
  <text x="430" y="277" font-size="12" fill="#c0392b">length of bed and banks in contact with the water</text>
  <line x1="470" y1="250" x2="470" y2="212" stroke="#c0392b" stroke-width="1.2" marker-end="url(#r)"/>

</svg>

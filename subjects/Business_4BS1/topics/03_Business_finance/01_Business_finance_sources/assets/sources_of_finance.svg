<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Sources of finance: internal (personal savings, retained profit, selling assets) and external, split into short-term (overdraft, trade payables) and long-term (loan capital, share capital, venture capital, crowdfunding)">
  <g font-family="Carlito, Calibri, sans-serif" text-anchor="middle">
    <!-- connectors -->
    <g stroke="#6b7a88" stroke-width="1.6" fill="none">
      <path d="M400 50 V68 H135 V85"/>
      <path d="M400 68 H535 V85"/>
      <path d="M535 131 V140 H400 V150"/>
      <path d="M535 140 H655 V150"/>
      <path d="M135 131 V160"/>
    </g>

    <!-- root -->
    <rect x="290" y="10" width="220" height="40" rx="6" fill="#16283c"/>
    <text x="400" y="36" font-size="18" font-weight="700" fill="#ffffff">Sources of finance</text>

    <!-- internal -->
    <rect x="20" y="85" width="230" height="46" rx="6" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="2"/>
    <text x="135" y="106" font-size="16" font-weight="700" fill="#0b5f54">INTERNAL</text>
    <text x="135" y="124" font-size="13" fill="#33475b">from the owner or the business itself</text>
    <g font-size="15" font-weight="700" fill="#16283c">
      <rect x="35" y="160" width="200" height="36" rx="5" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.4"/>
      <text x="135" y="183">Personal savings</text>
      <rect x="35" y="205" width="200" height="36" rx="5" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.4"/>
      <text x="135" y="228">Retained profit</text>
      <rect x="35" y="250" width="200" height="36" rx="5" fill="#ffffff" stroke="#0f7b6c" stroke-width="1.4"/>
      <text x="135" y="273">Selling assets</text>
    </g>

    <!-- matching note -->
    <rect x="20" y="310" width="230" height="78" rx="6" fill="#f4f7f9" stroke="#dfe5ea" stroke-width="1.2"/>
    <text x="135" y="332" font-size="13.5" font-weight="700" fill="#16283c">Match the finance to the need</text>
    <text x="135" y="354" font-size="13" fill="#33475b">short-term need → short-term source</text>
    <text x="135" y="374" font-size="13" fill="#33475b">long-term need → long-term source</text>

    <!-- external -->
    <rect x="290" y="85" width="490" height="46" rx="6" fill="#eef2f5" stroke="#33475b" stroke-width="2"/>
    <text x="535" y="106" font-size="16" font-weight="700" fill="#16283c">EXTERNAL</text>
    <text x="535" y="124" font-size="13" fill="#33475b">from people or organisations outside the business</text>

    <!-- short-term -->
    <rect x="300" y="150" width="200" height="40" rx="6" fill="#fdf6e5" stroke="#d99a17" stroke-width="2"/>
    <text x="400" y="168" font-size="14.5" font-weight="700" fill="#8a5d06">SHORT-TERM</text>
    <text x="400" y="184" font-size="12.5" fill="#33475b">usually repaid within a year</text>
    <g font-size="15" font-weight="700" fill="#16283c">
      <rect x="310" y="205" width="180" height="36" rx="5" fill="#ffffff" stroke="#d99a17" stroke-width="1.4"/>
      <text x="400" y="228">Overdraft</text>
      <rect x="310" y="250" width="180" height="36" rx="5" fill="#ffffff" stroke="#d99a17" stroke-width="1.4"/>
      <text x="400" y="273">Trade payables</text>
    </g>

    <!-- long-term -->
    <rect x="530" y="150" width="250" height="40" rx="6" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
    <text x="655" y="168" font-size="14.5" font-weight="700" fill="#4c3fa8">LONG-TERM</text>
    <text x="655" y="184" font-size="12.5" fill="#33475b">more than a year</text>
    <g font-size="15" font-weight="700" fill="#16283c">
      <rect x="545" y="205" width="220" height="36" rx="5" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.4"/>
      <text x="655" y="228">Loan capital</text>
      <rect x="545" y="250" width="220" height="46" rx="5" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.4"/>
      <text x="655" y="269">Share capital</text>
      <text x="655" y="287" font-size="12" font-weight="400" fill="#33475b">incl. stock market flotation (plc)</text>
      <rect x="545" y="305" width="220" height="36" rx="5" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.4"/>
      <text x="655" y="328">Venture capital</text>
      <rect x="545" y="350" width="220" height="36" rx="5" fill="#ffffff" stroke="#4c3fa8" stroke-width="1.4"/>
      <text x="655" y="373">Crowdfunding</text>
    </g>
  </g>
</svg>

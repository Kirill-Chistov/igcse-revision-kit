  <path class="rg-ax" d="M440,30 L440,170 L720,170"/>
  <text class="rg-l" x="430" y="105.0" transform="rotate(-90 430 105.0)" text-anchor="middle">rate of reaction</text>
  <text class="rg-l" x="580.0" y="204" text-anchor="middle">pH</text>
  <text class="rg-t" x="440" y="185" text-anchor="middle">0</text><text class="rg-t" x="480" y="185" text-anchor="middle">2</text><text class="rg-t" x="520" y="185" text-anchor="middle">4</text><text class="rg-t" x="560" y="185" text-anchor="middle">6</text><text class="rg-t" x="600" y="185" text-anchor="middle">8</text><text class="rg-t" x="640" y="185" text-anchor="middle">10</text><text class="rg-t" x="680" y="185" text-anchor="middle">12</text><text class="rg-t" x="720" y="185" text-anchor="middle">14</text>
  <path class="rg-d" d="M440.0,160.6 L445.0,153.3 L450.0,142.4 L455.0,127.9 L460.0,110.4 L465.0,91.9 L470.0,75.3 L475.0,63.7 L480.0,59.5 L485.0,63.7 L490.0,75.3 L495.0,91.9 L500.0,110.4 L505.0,127.9 L510.0,142.4 L515.0,153.3 L520.0,160.6 L525.0,165.1 L530.0,167.7 L535.0,169.0 L540.0,169.6"/>
  <path class="rg-c" d="M490.0,169.8 L495.0,169.7 L500.0,169.3 L505.0,168.8 L510.0,167.8 L515.0,166.2 L520.0,163.8 L525.0,160.2 L530.0,155.0 L535.0,148.1 L540.0,139.3 L545.0,128.5 L550.0,116.2 L555.0,103.0 L560.0,89.8 L565.0,77.7 L570.0,68.0 L575.0,61.7 L580.0,59.5 L585.0,61.7 L590.0,68.0 L595.0,77.7 L600.0,89.8 L605.0,103.0 L610.0,116.2 L615.0,128.5 L620.0,139.3 L625.0,148.1 L630.0,155.0 L635.0,160.2 L640.0,163.8 L645.0,166.2 L650.0,167.8 L655.0,168.8 L660.0,169.3 L665.0,169.7 L670.0,169.8"/>
  <text class="rg-s" x="498" y="62">stomach</text><text class="rg-s" x="498" y="76">protease</text>
  <text class="rg-s" x="580" y="51.5" text-anchor="middle">amylase</text>
  <text class="rg-s" x="628.0" y="105.0">each enzyme has</text>
  <text class="rg-s" x="628.0" y="119.0">its own optimum pH</text>
</svg>

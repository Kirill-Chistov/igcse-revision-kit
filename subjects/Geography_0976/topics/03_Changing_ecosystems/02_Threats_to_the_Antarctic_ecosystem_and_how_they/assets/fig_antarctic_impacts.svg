<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="300" fill="#fff"/>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6fa3"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a88"/></marker></defs>
<text x="14" y="16" font-size="12.5" fill="#16283c" text-anchor="start" font-weight="700">How warming destroys the ecosystem — and why it matters beyond Antarctica</text>
<rect x="14" y="120" width="120" height="56" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="74.0" y="145.1" font-size="11.5" font-weight="700" fill="#8f2b20" text-anchor="middle">Warmer air</text>
<text x="74.0" y="159.2" font-size="10.7" font-weight="400" fill="#33475b" text-anchor="middle">and sea</text>
<rect x="160" y="40" width="138" height="48" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="229.0" y="61.2" font-size="10.5" font-weight="700" fill="#6b4a00" text-anchor="middle">Less sea ice,</text>
<text x="229.0" y="74.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">melting earlier</text>
<rect x="312" y="40" width="138" height="48" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="381.0" y="61.2" font-size="10.5" font-weight="700" fill="#6b4a00" text-anchor="middle">Fewer ice algae</text>
<text x="381.0" y="74.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">krill lose winter food</text>
<path d="M298,64 L311,64" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<rect x="464" y="40" width="138" height="48" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="533.0" y="61.2" font-size="10.5" font-weight="700" fill="#6b4a00" text-anchor="middle">Fewer krill</text>
<text x="533.0" y="74.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">also caught by fishing</text>
<path d="M450,64 L463,64" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<rect x="616" y="40" width="138" height="48" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="685.0" y="61.2" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="middle">Penguins, seals, whales</text>
<text x="685.0" y="74.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">that eat krill decline</text>
<path d="M602,64 L615,64" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M134,130 L159,72" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<text x="160" y="34" font-size="10" fill="#6b4a00" text-anchor="start" font-weight="700">1  The food web (local → whole Southern Ocean)</text>
<rect x="160" y="124" width="138" height="48" rx="5" fill="#e8f1f7" stroke="#2e6fa3" stroke-width="1.2"/>
<text x="229.0" y="145.2" font-size="10.5" font-weight="700" fill="#1f4f75" text-anchor="middle">Ice shelves thin</text>
<text x="229.0" y="158.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">and break up</text>
<rect x="312" y="124" width="138" height="48" rx="5" fill="#e8f1f7" stroke="#2e6fa3" stroke-width="1.2"/>
<text x="381.0" y="145.2" font-size="10.5" font-weight="700" fill="#1f4f75" text-anchor="middle">Glaciers behind them</text>
<text x="381.0" y="158.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">flow faster into the sea</text>
<path d="M298,148 L311,148" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<rect x="464" y="124" width="138" height="48" rx="5" fill="#e8f1f7" stroke="#2e6fa3" stroke-width="1.2"/>
<text x="533.0" y="145.2" font-size="10.5" font-weight="700" fill="#1f4f75" text-anchor="middle">Global sea level</text>
<text x="533.0" y="158.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">rises</text>
<path d="M450,148 L463,148" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<rect x="616" y="124" width="138" height="48" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="685.0" y="145.2" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="middle">Low-lying coasts flood</text>
<text x="685.0" y="158.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">worldwide (Topic 5)</text>
<path d="M602,148 L615,148" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M134,148 L159,148" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<text x="160" y="118" font-size="10" fill="#1f4f75" text-anchor="start" font-weight="700">2  The ice (global)</text>
<rect x="160" y="208" width="138" height="48" rx="5" fill="#e8f1f7" stroke="#2e6fa3" stroke-width="1.2"/>
<text x="229.0" y="229.2" font-size="10.5" font-weight="700" fill="#1f4f75" text-anchor="middle">Less white ice</text>
<text x="229.0" y="242.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">and snow</text>
<rect x="312" y="208" width="138" height="48" rx="5" fill="#e8f1f7" stroke="#2e6fa3" stroke-width="1.2"/>
<text x="381.0" y="229.2" font-size="10.5" font-weight="700" fill="#1f4f75" text-anchor="middle">Dark sea and rock</text>
<text x="381.0" y="242.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">absorb more sunlight</text>
<path d="M298,232 L311,232" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<rect x="464" y="208" width="138" height="48" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="533.0" y="229.2" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="middle">Even more</text>
<text x="533.0" y="242.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">warming</text>
<path d="M450,232 L463,232" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M134,166 L159,224" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<text x="160" y="202" font-size="10" fill="#1f4f75" text-anchor="start" font-weight="700">3  A feedback loop (global)</text>
<path d="M533.0,256 L533.0,276 L74,276 L74,178" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#mr)"/>
<text x="454" y="291" font-size="9.5" fill="#8f2b20" text-anchor="end" font-weight="400" font-style="italic">loss of ice speeds up the warming that caused it</text>
</svg>
    <rect x="104" y="228" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="124" y="251" text-anchor="middle">2</text>
    <rect x="148" y="228" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="168" y="251" text-anchor="middle">5</text>
    <rect x="192" y="228" width="40" height="34" rx="3" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.5"/><text x="212" y="251" text-anchor="middle" font-weight="700">8</text>
    <text x="250" y="251" font-size="16">8 is now in its final place</text>
    <line x1="430" y1="8" x2="430" y2="268" stroke="#dfe5ea" stroke-width="2"/>
    <text x="450" y="22" font-weight="700" font-size="17">The whole sort</text>
    <text x="450" y="59" font-size="16">Start</text>
    <rect x="596" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="616" y="59" text-anchor="middle">5</text>
    <rect x="640" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="660" y="59" text-anchor="middle">1</text>
    <rect x="684" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="704" y="59" text-anchor="middle">4</text>
    <rect x="728" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="748" y="59" text-anchor="middle">2</text>
    <rect x="772" y="36" width="40" height="34" rx="3" fill="#ffffff" stroke="#6b7a88" stroke-width="1.5"/><text x="792" y="59" text-anchor="middle">8</text>

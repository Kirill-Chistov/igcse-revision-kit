<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Four diagrams of the processes at divergent, destructive, collision and conservative plate boundaries" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="bp-k" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker></defs>
<g font-family="Carlito, Calibri, sans-serif">
<g transform="translate(4 4)"><rect x="0" y="0" width="392" height="228" fill="#ffffff" stroke="#b9c4cd" stroke-width="1"/><rect x="0" y="0" width="392" height="24" fill="#16283c"/><text x="8" y="17" font-size="13.5" text-anchor="start" font-weight="700" fill="#ffffff">A  Divergent / constructive</text><rect x="1" y="44" width="390" height="183" fill="#f3d2bd"/><rect x="1" y="44" width="390" height="30" fill="#cfe3ef"/><polygon points="1,80 190,62 190,90 1,104" fill="#6f7f8c" stroke="#16283c" stroke-width="1"/><polygon points="391,80 202,62 202,90 391,104" fill="#6f7f8c" stroke="#16283c" stroke-width="1"/><path d="M168 226 Q182 150 190 66 L202 66 Q210 150 224 226 Z" fill="#c0392b"/><path d="M186 66 L196 50 L206 66 Z" fill="#c0392b"/><line x1="150" y1="56" x2="90" y2="62" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><line x1="242" y1="56" x2="302" y2="62" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><polygon points="178.0,77.0 179.9,81.5 184.7,81.8 181.0,85.0 182.1,89.7 178.0,87.2 173.9,89.7 175.0,85.0 171.3,81.8 176.1,81.5" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><polygon points="214.0,81.0 215.9,85.5 220.7,85.8 217.0,89.0 218.1,93.7 214.0,91.2 209.9,93.7 211.0,89.0 207.3,85.8 212.1,85.5" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><text x="196" y="40" font-size="12.5" text-anchor="middle" font-weight="400" fill="#16283c" font-style="italic">ridge</text><text x="60" y="94" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ffffff">oceanic</text><text x="332" y="94" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ffffff">oceanic</text><text x="12" y="122" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Plates move apart.</text><text x="12" y="138" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Pressure on the mantle falls,</text><text x="12" y="154" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">so it partly melts: magma rises</text><text x="12" y="170" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">into the gap, forming new crust.</text><text x="236" y="122" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Runny basalt lava →</text><text x="236" y="138" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">gentle eruptions.</text><text x="236" y="160" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Rock cracks as plates</text><text x="236" y="176" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">separate → small, shallow</text><text x="236" y="192" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">earthquakes.</text></g>
<g transform="translate(404 4)"><rect x="0" y="0" width="392" height="228" fill="#ffffff" stroke="#b9c4cd" stroke-width="1"/><rect x="0" y="0" width="392" height="24" fill="#16283c"/><text x="8" y="17" font-size="13.5" text-anchor="start" font-weight="700" fill="#ffffff">B  Convergent / destructive</text><rect x="1" y="44" width="390" height="183" fill="#f3d2bd"/><rect x="1" y="44" width="176" height="28" fill="#cfe3ef"/><path d="M176 64 L240 60 L262 46 L276 34 L286 30 L296 34 L310 48 L330 58 L391 60 L391 108 L230 104 Q200 96 182 80 Z" fill="#9b7b5f" stroke="#16283c" stroke-width="1"/><path d="M1 72 L150 74 Q176 76 196 92 L300 226 L272 226 L184 108 Q166 94 146 94 L1 92 Z" fill="#6f7f8c" stroke="#16283c" stroke-width="1"/><path d="M258 178 Q270 150 280 110 L284 40 L290 40 L292 110 Q300 150 300 178 Z" fill="#c0392b" fill-opacity="0.9"/><path d="M280 34 L286 22 L292 34 Z" fill="#c0392b"/><line x1="40" y1="58" x2="104" y2="60" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><line x1="372" y1="52" x2="334" y2="52" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><polygon points="186.0,89.0 187.9,93.5 192.7,93.8 189.0,97.0 190.1,101.7 186.0,99.2 181.9,101.7 183.0,97.0 179.3,93.8 184.1,93.5" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><polygon points="222.0,123.0 223.9,127.5 228.7,127.8 225.0,131.0 226.1,135.7 222.0,133.2 217.9,135.7 219.0,131.0 215.3,127.8 220.1,127.5" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><polygon points="254.0,159.0 255.9,163.5 260.7,163.8 257.0,167.0 258.1,171.7 254.0,169.2 249.9,171.7 251.0,167.0 247.3,163.8 252.1,163.5" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><text x="172" y="40" font-size="12.5" text-anchor="end" font-weight="400" fill="#16283c" font-style="italic">trench</text><text x="300" y="38" font-size="1" text-anchor="start" font-weight="400" fill="#16283c"></text><text x="8" y="114" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Denser oceanic plate is forced</text><text x="8" y="130" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">down under the continental</text><text x="8" y="146" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">plate (subduction).</text><text x="8" y="168" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Friction → earthquakes,</text><text x="8" y="184" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">shallow to deep.</text><text x="306" y="122" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Plate heats</text><text x="306" y="138" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">and melts →</text><text x="306" y="154" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">magma rises →</text><text x="306" y="170" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">explosive</text><text x="306" y="186" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">strato-volcanoes</text><text x="345" y="88" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ffffff">continental</text><text x="60" y="87" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ffffff">oceanic</text></g>
<g transform="translate(4 238)"><rect x="0" y="0" width="392" height="228" fill="#ffffff" stroke="#b9c4cd" stroke-width="1"/><rect x="0" y="0" width="392" height="24" fill="#16283c"/><text x="8" y="17" font-size="13.5" text-anchor="start" font-weight="700" fill="#ffffff">C  Convergent / collision</text><rect x="1" y="44" width="390" height="183" fill="#f3d2bd"/><path d="M1 76 L120 72 L150 60 L168 42 L184 32 L196 28 L210 34 L226 46 L246 62 L272 72 L391 76 L391 118 L270 120 Q230 142 196 146 Q160 142 122 120 L1 118 Z" fill="#9b7b5f" stroke="#16283c" stroke-width="1"/><path d="M196 30 L196 144" stroke="#16283c" stroke-width="1" stroke-dasharray="4 3"/><path d="M150 62 Q170 80 160 100 M176 44 Q190 70 180 110 M212 40 Q200 70 212 110 M238 58 Q222 80 232 100" fill="none" stroke="#5b4636" stroke-width="1.4"/><line x1="40" y1="62" x2="100" y2="62" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><line x1="352" y1="62" x2="292" y2="62" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><polygon points="186.0,83.0 187.9,87.5 192.7,87.8 189.0,91.0 190.1,95.7 186.0,93.2 181.9,95.7 183.0,91.0 179.3,87.8 184.1,87.5" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><polygon points="208.0,97.0 209.9,101.5 214.7,101.8 211.0,105.0 212.1,109.7 208.0,107.2 203.9,109.7 205.0,105.0 201.3,101.8 206.1,101.5" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><text x="8" y="170" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Two continental plates collide.</text><text x="8" y="186" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Both are light, so neither sinks:</text><text x="8" y="202" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">the crust crumples and is pushed</text><text x="8" y="218" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">up into fold mountains (Himalayas).</text><text x="250" y="170" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Pressure → strong,</text><text x="250" y="186" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">shallow earthquakes.</text><text x="250" y="202" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">No subduction, no</text><text x="250" y="218" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">magma → no volcanoes.</text></g>
<g transform="translate(404 238)"><rect x="0" y="0" width="392" height="228" fill="#ffffff" stroke="#b9c4cd" stroke-width="1"/><rect x="0" y="0" width="392" height="24" fill="#16283c"/><text x="8" y="17" font-size="13.5" text-anchor="start" font-weight="700" fill="#ffffff">D  Conservative / transform</text><text x="384" y="17" font-size="12" text-anchor="end" font-weight="400" fill="#c3d0dc" font-style="italic">seen from above</text><rect x="1" y="34" width="390" height="54" fill="#e9dccd"/><rect x="1" y="90" width="390" height="54" fill="#d9c7b3"/><line x1="1" y1="89" x2="391" y2="89" stroke="#16283c" stroke-width="2.4"/><line x1="150" y1="34" x2="150" y2="88" stroke="#6b7a88" stroke-width="5"/><line x1="214" y1="90" x2="214" y2="144" stroke="#6b7a88" stroke-width="5"/><text x="158" y="52" font-size="11.5" text-anchor="start" font-weight="400" fill="#16283c" font-style="italic">road, now offset</text><line x1="340" y1="62" x2="270" y2="62" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><line x1="52" y1="118" x2="122" y2="118" stroke="#16283c" stroke-width="3" marker-end="url(#bp-k)"/><polygon points="182.0,81.0 184.1,86.1 189.6,86.5 185.4,90.1 186.7,95.5 182.0,92.6 177.3,95.5 178.6,90.1 174.4,86.5 179.9,86.1" fill="#d99a17" stroke="#16283c" stroke-width="0.8"/><text x="360" y="83" font-size="11.5" text-anchor="end" font-weight="400" fill="#16283c" font-style="italic">fault</text><text x="8" y="164" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Plates slide past each other (opposite directions,</text><text x="8" y="180" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">or the same direction at different speeds).</text><text x="8" y="200" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">Friction locks them, pressure builds, then sudden slip</text><text x="8" y="216" font-size="12.5" text-anchor="start" font-weight="400" fill="#16283c">→ earthquake. Crust not destroyed → no volcanoes.</text></g>
</g></svg>
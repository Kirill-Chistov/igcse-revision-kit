<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.4; }
    .isr { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.8; }
    .dec { fill: #ffffff; stroke: #334155; stroke-width: 1.4; }
    .t { font-size: 14px; font-weight: bold; fill: #1e293b; }
    .s { font-size: 12.5px; fill: #475569; }
    .d { font-size: 13px; fill: #1e293b; }
    .yn { font-size: 12.5px; font-weight: bold; fill: #0f766e; }
    .num { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .ln { stroke: #334155; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- current task -->
  <rect class="box" x="20" y="20" width="240" height="48" rx="4"/>
  <text class="t" x="140" y="40" text-anchor="middle">Processor runs the current task</text>
  <text class="s" x="140" y="58" text-anchor="middle">(fetch–decode–execute cycles)</text>

  <!-- decision 1 -->
  <line class="ln" x1="140" y1="68" x2="140" y2="90" marker-end="url(#ah)"/>
  <polygon class="dec" points="140,92 255,135 140,178 25,135"/>
  <text class="d" x="140" y="131" text-anchor="middle">Interrupt signal</text>
  <text class="d" x="140" y="147" text-anchor="middle">received?</text>

  <!-- decision 2 -->
  <line class="ln" x1="140" y1="178" x2="140" y2="198" marker-end="url(#ah)"/>
  <text class="yn" x="148" y="193">Yes</text>
  <polygon class="dec" points="140,200 255,243 140,286 25,243"/>
  <text class="d" x="140" y="239" text-anchor="middle">Higher priority than</text>
  <text class="d" x="140" y="255" text-anchor="middle">the current task?</text>

  <!-- No loops back -->
  <polyline class="ln" points="25,135 8,135 8,44 18,44" marker-end="url(#ah)"/>
  <polyline class="ln" points="25,243 8,243 8,135"/>
  <text class="yn" x="12" y="128" text-anchor="start">No</text>
  <text class="yn" x="12" y="236" text-anchor="start">No</text>

  <!-- Yes to save -->
  <line class="ln" x1="255" y1="243" x2="328" y2="243" marker-end="url(#ah)"/>
  <text class="yn" x="276" y="236">Yes</text>

  <!-- right column, bottom to top -->
  <rect class="box" x="330" y="219" width="290" height="48" rx="4"/>
  <circle cx="348" cy="243" r="10" fill="#0f766e"/><text class="num" x="348" y="247" text-anchor="middle">1</text>
  <text class="t" x="366" y="239">Save the current task's state</text>
  <text class="s" x="366" y="257">contents of the registers, including the PC</text>

  <line class="ln" x1="475" y1="219" x2="475" y2="175" marker-end="url(#ah)"/>

  <rect class="isr" x="330" y="125" width="290" height="48" rx="4"/>
  <circle cx="348" cy="149" r="10" fill="#0f766e"/><text class="num" x="348" y="153" text-anchor="middle">2</text>
  <text class="t" x="366" y="145">Run the ISR for this interrupt</text>
  <text class="s" x="366" y="163">the interrupt is serviced</text>

  <line class="ln" x1="475" y1="125" x2="475" y2="78" marker-end="url(#ah)"/>

  <rect class="box" x="330" y="28" width="290" height="48" rx="4"/>
  <circle cx="348" cy="52" r="10" fill="#0f766e"/><text class="num" x="348" y="56" text-anchor="middle">3</text>
  <text class="t" x="366" y="48">Restore the saved register contents</text>
  <text class="s" x="366" y="66">the interrupted task carries on</text>

  <line class="ln" x1="330" y1="44" x2="262" y2="44" marker-end="url(#ah)"/>
</svg>

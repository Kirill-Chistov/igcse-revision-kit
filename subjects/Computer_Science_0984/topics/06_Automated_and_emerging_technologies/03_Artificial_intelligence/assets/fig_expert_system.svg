<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="Carlito, Calibri, sans-serif" role="img" aria-label="Expert system: the user talks to the interface; the inference engine uses the rule base and the knowledge base" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="es-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <style>
    .es-t{font-size:16px;font-weight:700;fill:#1e293b;text-anchor:middle}
    .es-s{font-size:13px;fill:#334155;text-anchor:middle}
    .es-l{font-size:12px;fill:#475569;text-anchor:middle;font-style:italic}
    .es-line{stroke:#1e293b;stroke-width:2;fill:none}
  </style>

  <!-- expert system boundary -->
  <rect x="150" y="8" width="665" height="234" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="170" y="30" font-size="14" font-weight="700" fill="#64748b">Expert system</text>

  <!-- user -->
  <circle cx="60" cy="98" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <path d="M30 150 Q30 118 60 118 Q90 118 90 150 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text class="es-t" x="60" y="175">User</text>

  <!-- interface -->
  <rect x="180" y="60" width="170" height="120" rx="8" fill="#e8f0fb" stroke="#1d4ed8" stroke-width="2"/>
  <text class="es-t" x="265" y="86">Interface</text>
  <text class="es-s" x="265" y="110">asks questions</text>
  <text class="es-s" x="265" y="128">takes the answers</text>
  <text class="es-s" x="265" y="146">shows the conclusion,</text>
  <text class="es-s" x="265" y="164">its probability and reasons</text>

  <!-- inference engine -->
  <rect x="400" y="60" width="200" height="120" rx="8" fill="#eeedfb" stroke="#4c3fa8" stroke-width="2"/>
  <text class="es-t" x="500" y="86">Inference engine</text>
  <text class="es-s" x="500" y="110">applies the rules to the facts</text>
  <text class="es-s" x="500" y="128">and the user's answers</text>
  <text class="es-s" x="500" y="146">picks the next question</text>
  <text class="es-s" x="500" y="164">reaches a conclusion</text>

  <!-- knowledge base -->
  <rect x="650" y="40" width="155" height="80" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text class="es-t" x="727" y="64">Knowledge base</text>
  <text class="es-s" x="727" y="86">facts about one area,</text>
  <text class="es-s" x="727" y="104">from human experts</text>

  <!-- rule base -->
  <rect x="650" y="140" width="155" height="80" rx="8" fill="#fdf3e1" stroke="#b45309" stroke-width="2"/>
  <text class="es-t" x="727" y="164">Rule base</text>
  <text class="es-s" x="727" y="186">IF … THEN rules for</text>
  <text class="es-s" x="727" y="204">using the facts</text>

  <!-- arrows -->
  <line class="es-line" x1="96" y1="120" x2="176" y2="120" marker-start="url(#es-a)" marker-end="url(#es-a)"/>
  <line class="es-line" x1="350" y1="120" x2="396" y2="120" marker-start="url(#es-a)" marker-end="url(#es-a)"/>
  <line class="es-line" x1="600" y1="100" x2="646" y2="82" marker-start="url(#es-a)" marker-end="url(#es-a)"/>
  <line class="es-line" x1="600" y1="140" x2="646" y2="178" marker-start="url(#es-a)" marker-end="url(#es-a)"/>
</svg>

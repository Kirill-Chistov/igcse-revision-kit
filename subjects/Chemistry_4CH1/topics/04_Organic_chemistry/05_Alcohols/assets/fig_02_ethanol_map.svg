<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" font-family="Carlito, Calibri, Lato, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="c4e-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker></defs>
<text x="125.0" y="16.0" font-size="12.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#33475b">MANUFACTURE</text>
<text x="592.0" y="16.0" font-size="12.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#33475b">OXIDATION</text>
<rect x="0" y="28" width="250" height="88" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="10.0" y="47.0" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Hydration of ethene</text>
<text x="10.0" y="63.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">C₂H₄ + H₂O → C₂H₅OH</text>
<text x="10.0" y="79.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">ethene + steam, phosphoric acid catalyst,</text>
<text x="10.0" y="95.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">about 300 °C, about 60–70 atm</text>
<rect x="0" y="134" width="250" height="104" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="10.0" y="153.0" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Fermentation of glucose</text>
<text x="10.0" y="169.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂</text>
<text x="10.0" y="185.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">enzymes in yeast,</text>
<text x="10.0" y="201.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">optimum temperature about 30 °C,</text>
<text x="10.0" y="217.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">in the absence of air</text>
<rect x="286" y="100" width="118" height="62" rx="9" fill="#cfe4dd" stroke="#16283c" stroke-width="1.6"/>
<text x="345.0" y="126.0" font-size="15" text-anchor="middle" font-weight="bold" font-style="normal" fill="#16283c">ethanol</text>
<text x="345.0" y="146.0" font-size="13.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1f618d">C₂H₅OH</text>
<line x1="250.0" y1="72.0" x2="284.0" y2="118.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4e-a)"/>
<line x1="250.0" y1="186.0" x2="284.0" y2="146.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4e-a)"/>
<rect x="440" y="28" width="280" height="56" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="450.0" y="47.0" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Burning in air or oxygen (complete combustion)</text>
<text x="450.0" y="63.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O</text>
<rect x="440" y="100" width="280" height="72" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="450.0" y="119.0" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Microbial oxidation (oxygen in the air)</text>
<text x="450.0" y="135.0" font-size="12" text-anchor="start" font-weight="bold" font-style="normal" fill="#1f618d">C₂H₅OH + O₂ → CH₃COOH + H₂O</text>
<text x="450.0" y="151.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">microbes turn wine into vinegar (ethanoic acid)</text>
<rect x="440" y="180" width="280" height="72" rx="7" fill="#f3f8fb" stroke="#16283c" stroke-width="1.2"/>
<text x="450.0" y="199.0" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#16283c">Heat with potassium dichromate(VI)</text>
<text x="450.0" y="215.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">in dilute sulfuric acid → ethanoic acid</text>
<text x="450.0" y="231.0" font-size="11.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#33475b">dichromate colour change: orange → green</text>
<line x1="404.0" y1="131.0" x2="438.0" y2="56.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4e-a)"/>
<line x1="404.0" y1="131.0" x2="438.0" y2="136.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4e-a)"/>
<line x1="404.0" y1="131.0" x2="438.0" y2="216.0" stroke="#16283c" stroke-width="1.4" marker-end="url(#c4e-a)"/>
</svg>

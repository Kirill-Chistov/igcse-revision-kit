<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 195" width="820" height="195" role="img" aria-label="The four ways the sea transports material: traction, saltation, suspension, solution">
  <defs>
    <marker id="tr-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16283c"/></marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#16283c">
    <rect x="0" y="10" width="820" height="105" fill="#cfe3ee"/>
    <g transform="translate(0,-55)">
    <rect x="0" y="170" width="820" height="18" fill="#e3cf9c"/>
    <line x1="0" y1="170" x2="820" y2="170" stroke="#a88a4e" stroke-width="1.5"/>

    <!-- traction -->
    <path d="M78,170 L74,146 L88,126 L114,120 L136,130 L144,152 L138,170 Z" fill="#8f8a80" stroke="#5c574d" stroke-width="1.5"/>
    <path d="M86,112 A28,18 0 0 1 142,114" fill="none" stroke="#16283c" stroke-width="2" marker-end="url(#tr-arr)"/>
    <!-- saltation -->
    <path d="M245,166 Q262,120 280,166 Q297,120 314,166 Q331,120 348,166" fill="none" stroke="#16283c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#tr-arr)"/>
    <ellipse cx="238" cy="163" rx="9" ry="7" fill="#a39a88" stroke="#5c574d" stroke-width="1.2"/>
    <!-- suspension -->
    <g fill="#9c8457" transform="translate(0,14)">
      <circle cx="455" cy="70" r="2.4"/><circle cx="478" cy="95" r="2"/><circle cx="500" cy="62" r="2.2"/><circle cx="520" cy="110" r="2.5"/>
      <circle cx="545" cy="80" r="2"/><circle cx="470" cy="130" r="2.3"/><circle cx="495" cy="148" r="2"/><circle cx="530" cy="140" r="2.2"/>
      <circle cx="560" cy="120" r="2"/><circle cx="512" cy="88" r="1.8"/><circle cx="462" cy="102" r="1.8"/><circle cx="548" cy="55" r="1.8"/>
      <circle cx="488" cy="120" r="1.8"/><circle cx="540" cy="100" r="2.4"/><circle cx="505" cy="128" r="1.8"/><circle cx="565" cy="150" r="2"/>
    </g>
    <!-- solution -->
    <g fill="none" stroke="#5a7d96" stroke-width="1.2" transform="translate(0,12)">
      <path d="M660,70 h8 M664,66 v8"/><path d="M700,95 h8"/><path d="M735,62 h8 M739,58 v8"/><path d="M755,120 h8"/>
      <path d="M680,130 h8 M684,126 v8"/><path d="M720,145 h8"/><path d="M770,85 h8 M774,81 v8"/><path d="M650,110 h8"/>
      <path d="M715,110 h8 M719,106 v8"/><path d="M690,58 h8"/>
    </g>

    <g text-anchor="middle">
      <text x="110" y="208" font-size="16" font-weight="700">Traction</text>
      <text x="110" y="226" font-size="13.5">large boulders are rolled</text>
      <text x="110" y="242" font-size="13.5">along the sea bed</text>
      <text x="300" y="208" font-size="16" font-weight="700">Saltation</text>
      <text x="300" y="226" font-size="13.5">pebbles are bounced</text>
      <text x="300" y="242" font-size="13.5">along the sea bed</text>
      <text x="505" y="208" font-size="16" font-weight="700">Suspension</text>
      <text x="505" y="226" font-size="13.5">fine sand and silt are</text>
      <text x="505" y="242" font-size="13.5">carried within the water</text>
      <text x="715" y="208" font-size="16" font-weight="700">Solution</text>
      <text x="715" y="226" font-size="13.5">minerals are dissolved</text>
      <text x="715" y="242" font-size="13.5">and carried in the water</text>
    </g>
    </g>
    <line x1="20" y1="30" x2="200" y2="30" stroke="#16283c" stroke-width="2" marker-end="url(#tr-arr)"/>
    <text x="210" y="35" font-size="14" fill="#33475b">direction the water moves the material</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 252" width="820" height="252" role="img"
     aria-label="Work done: pushing a box a distance d, lifting a box a height h, and carrying a box level where the upward force does no work">
  <defs>
    <marker id="p4wd-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="p4wd-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#33475b"/>
    </marker>
    <marker id="p4wd-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e6da4"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <line x1="272" y1="10" x2="272" y2="248" stroke="#dfe5ea" stroke-width="1.5"/>
    <line x1="545" y1="10" x2="545" y2="248" stroke="#dfe5ea" stroke-width="1.5"/>

    <!-- (a) pushing -->
    <text x="137" y="22" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">(a) Pushing</text>
    <line x1="15" y1="180" x2="260" y2="180" stroke="#33475b" stroke-width="2"/>
    <rect x="40" y="130" width="60" height="50" fill="none" stroke="#9aa7b3" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="170" y="130" width="60" height="50" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
    <line x1="118" y1="155" x2="168" y2="155" stroke="#c0392b" stroke-width="3.5" marker-end="url(#p4wd-red)"/>
    <text x="140" y="144" font-size="16" font-weight="700" fill="#c0392b" text-anchor="middle">F</text>
    <line x1="72" y1="200" x2="198" y2="200" stroke="#33475b" stroke-width="1.3" marker-start="url(#p4wd-dim)" marker-end="url(#p4wd-dim)"/>
    <text x="135" y="220" font-size="16" font-weight="700" text-anchor="middle">d</text>
    <text x="137" y="244" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">W = F × d</text>

    <!-- (b) lifting -->
    <text x="410" y="22" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">(b) Lifting</text>
    <line x1="290" y1="215" x2="530" y2="215" stroke="#33475b" stroke-width="2"/>
    <rect x="378" y="165" width="60" height="50" fill="none" stroke="#9aa7b3" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="378" y="60" width="60" height="50" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
    <line x1="366" y1="112" x2="366" y2="62" stroke="#c0392b" stroke-width="3.5" marker-end="url(#p4wd-red)"/>
    <text x="352" y="82" font-size="14" font-weight="700" fill="#c0392b" text-anchor="end">F = weight</text>
    <text x="352" y="99" font-size="14" font-weight="700" fill="#c0392b" text-anchor="end">= mg</text>
    <line x1="462" y1="112" x2="462" y2="213" stroke="#33475b" stroke-width="1.3" marker-start="url(#p4wd-dim)" marker-end="url(#p4wd-dim)"/>
    <text x="474" y="168" font-size="16" font-weight="700">h</text>
    <text x="410" y="244" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">W = mg × h = GPE gained</text>

    <!-- (c) carrying level -->
    <text x="680" y="22" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">(c) Carrying level</text>
    <line x1="560" y1="215" x2="805" y2="215" stroke="#33475b" stroke-width="2"/>
    <rect x="585" y="100" width="60" height="50" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.8"/>
    <rect x="730" y="100" width="60" height="50" fill="none" stroke="#9aa7b3" stroke-width="1.5" stroke-dasharray="5 3"/>
    <line x1="615" y1="100" x2="615" y2="52" stroke="#c0392b" stroke-width="3.5" marker-end="url(#p4wd-red)"/>
    <text x="626" y="70" font-size="14" font-weight="700" fill="#c0392b">F (upward)</text>
    <line x1="615" y1="178" x2="752" y2="178" stroke="#2e6da4" stroke-width="2.5" marker-end="url(#p4wd-blue)"/>
    <text x="683" y="198" font-size="13" fill="#2e6da4" text-anchor="middle">movement: sideways</text>
    <text x="680" y="244" font-size="14" font-weight="700" fill="#16283c" text-anchor="middle">upward force does no work: W = 0</text>
  </g>
</svg>

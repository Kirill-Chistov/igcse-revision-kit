<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208" role="img" aria-label="Diffusion: net movement of particles from higher to lower concentration, passive. Osmosis: net movement of water molecules from a dilute solution to a concentrated solution through a partially permeable membrane; the larger solute molecules cannot pass. Active transport: movement from lower to higher concentration, against the gradient, through a carrier protein, using energy from respiration.">

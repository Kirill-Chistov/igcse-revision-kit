<text x="640.0" y="92.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">shallow:</text>
<text x="640.0" y="107.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="400" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">smaller pressure</text>

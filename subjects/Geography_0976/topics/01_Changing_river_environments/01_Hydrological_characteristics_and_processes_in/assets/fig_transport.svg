<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16283c"/></marker>
    <marker id="t" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0f7b6c"/></marker>
  </defs>
  <text x="16" y="24" font-size="16" font-weight="700" fill="#16283c">The four ways a river transports its load — side view of the channel</text>

  <!-- water -->
  <rect x="16" y="40" width="868" height="186" fill="#dbeaf3"/>
  <line x1="16" y1="40" x2="884" y2="40" stroke="#3d7ea6" stroke-width="2"/>
  <line x1="380" y1="60" x2="520" y2="60" stroke="#16283c" stroke-width="2.6" marker-end="url(#k)"/>
  <text x="530" y="65" font-size="13" font-weight="700" fill="#16283c">direction of flow</text>
  <!-- bed -->
  <rect x="16" y="226" width="868" height="30" fill="#e8dcc0"/>
  <g fill="#c9b58a">
    <circle cx="40" cy="236" r="6"/><circle cx="70" cy="240" r="5"/><circle cx="330" cy="238" r="6"/><circle cx="360" cy="240" r="4"/>
    <circle cx="520" cy="238" r="5"/><circle cx="600" cy="240" r="6"/><circle cx="700" cy="238" r="5"/><circle cx="820" cy="240" r="6"/>
  </g>

  <!-- traction: boulder rolling -->
  <ellipse cx="150" cy="198" rx="44" ry="28" fill="#8e8a82"/>
  <path d="M112,166 A48,34 0 0 1 192,168" fill="none" stroke="#0f7b6c" stroke-width="2.4" marker-end="url(#t)"/>
  <!-- saltation: bouncing pebbles -->
  <g fill="#a79a7c">
    <circle cx="270" cy="219" r="7"/><circle cx="330" cy="219" r="7"/><circle cx="390" cy="219" r="7"/>
  </g>
  <path d="M270,212 Q300,150 330,212 Q360,150 390,212 Q420,150 450,212" fill="none" stroke="#0f7b6c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#t)"/>
  <!-- suspension: fine particles -->
  <g fill="#9b7b4a">
    <circle cx="520" cy="90" r="2.2"/><circle cx="545" cy="120" r="2.2"/><circle cx="570" cy="85" r="2.2"/><circle cx="600" cy="140" r="2.2"/>
    <circle cx="625" cy="100" r="2.2"/><circle cx="650" cy="160" r="2.2"/><circle cx="535" cy="170" r="2.2"/><circle cx="580" cy="190" r="2.2"/>
    <circle cx="615" cy="75" r="2.2"/><circle cx="660" cy="120" r="2.2"/><circle cx="555" cy="150" r="2.2"/><circle cx="640" cy="200" r="2.2"/>
    <circle cx="510" cy="130" r="2.2"/><circle cx="590" cy="110" r="2.2"/><circle cx="675" cy="85" r="2.2"/><circle cx="600" cy="175" r="2.2"/>
  </g>
  <!-- solution: dissolved ions -->
  <g font-size="12" font-weight="700" fill="#4c3fa8">
    <text x="740" y="95">+</text><text x="780" y="120">−</text><text x="820" y="90">+</text><text x="760" y="160">−</text>
    <text x="805" y="150">+</text><text x="845" y="125">−</text><text x="735" y="195">+</text><text x="850" y="185">+</text><text x="790" y="205">−</text>
  </g>

  <!-- labels -->
  <g font-size="13">
    <text x="30" y="276" font-weight="700" fill="#16283c">TRACTION</text>
    <text x="30" y="292" fill="#33475b">large boulders rolled</text>
    <text x="30" y="307" fill="#33475b">along the bed</text>

    <text x="250" y="276" font-weight="700" fill="#16283c">SALTATION</text>
    <text x="250" y="292" fill="#33475b">pebbles and sand bounced</text>
    <text x="250" y="307" fill="#33475b">along the bed</text>

    <text x="490" y="276" font-weight="700" fill="#16283c">SUSPENSION</text>
    <text x="490" y="292" fill="#33475b">fine clay and silt carried within</text>
    <text x="490" y="307" fill="#33475b">the water (turns it brown)</text>

    <text x="720" y="276" font-weight="700" fill="#16283c">SOLUTION</text>
    <text x="720" y="292" fill="#33475b">minerals dissolved in the</text>
    <text x="720" y="307" fill="#33475b">water, carried invisibly</text>
  </g>
  <!-- bedload bracket -->
  <path d="M30,318 L30,324 L440,324 L440,318" fill="none" stroke="#8a6f33" stroke-width="1.4"/>
  <text x="235" y="322" font-size="11.5" font-weight="700" fill="#8a6f33" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">BEDLOAD</text>
</svg>

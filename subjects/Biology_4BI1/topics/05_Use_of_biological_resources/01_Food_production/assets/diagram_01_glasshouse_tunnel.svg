<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 38 760 284" width="760" height="284" role="img" aria-label="A glasshouse with numbered features: glass lets light in and traps heat; heaters; paraffin burner adding carbon dioxide; artificial lamps; an enclosed space that keeps pests out. Beside it a polythene tunnel, cheaper and covering large areas." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .gh-t { font-size: 12.5px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.06em; }
    .gh-k { font-size: 12.5px; font-weight: 700; }
    .gh-s { font-size: 12px; fill: #33475b; }
    .gh-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>
  <!-- ground -->
  <line x1="20" y1="250" x2="330" y2="250" stroke="#8a6a3a" stroke-width="2"/>
  <line x1="600" y1="250" x2="758" y2="250" stroke="#8a6a3a" stroke-width="2"/>
  <!-- sun -->
  <circle cx="34" cy="62" r="15" fill="#f5c542" stroke="#d99a17" stroke-width="1.5"/>
  <line x1="50" y1="74" x2="92" y2="118" stroke="#d99a17" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="56" y1="66" x2="150" y2="150" stroke="#d99a17" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- glasshouse -->
  <path d="M70,250 L70,132 L190,62 L310,132 L310,250 Z" fill="#e8f3f8" stroke="#33475b" stroke-width="2"/>
  <line x1="70" y1="132" x2="310" y2="132" stroke="#33475b" stroke-width="1.4"/>
  <g stroke="#8fa3b8" stroke-width="1">
    <line x1="130" y1="132" x2="130" y2="250"/><line x1="190" y1="132" x2="190" y2="250"/><line x1="250" y1="132" x2="250" y2="250"/>
    <line x1="130" y1="132" x2="160" y2="80"/><line x1="250" y1="132" x2="220" y2="80"/>
  </g>
  <!-- lamp -->
  <line x1="190" y1="64" x2="190" y2="90" stroke="#33475b" stroke-width="1.5"/>
  <path d="M178,98 L182,90 L198,90 L202,98 Z" fill="#fff3c4" stroke="#33475b" stroke-width="1.2"/>
  <path d="M176,100 L160,128 M190,100 L190,128 M204,100 L220,128" stroke="#f0c53c" stroke-width="1.4" stroke-dasharray="3 3"/>
  <!-- plants -->
  <g stroke="#2e7d4f" stroke-width="2.2" fill="none">
    <path d="M110,250 L110,178"/><path d="M190,250 L190,172"/><path d="M160,250 L160,190"/><path d="M225,250 L225,184"/>
  </g>
  <g fill="#5fae6e" stroke="#2e7d4f" stroke-width="0.8">
    <ellipse cx="101" cy="200" rx="9" ry="4.5" transform="rotate(-25 101 200)"/><ellipse cx="119" cy="188" rx="9" ry="4.5" transform="rotate(25 119 188)"/><ellipse cx="102" cy="226" rx="9" ry="4.5" transform="rotate(-20 102 226)"/>
    <ellipse cx="181" cy="194" rx="9" ry="4.5" transform="rotate(-25 181 194)"/><ellipse cx="199" cy="182" rx="9" ry="4.5" transform="rotate(25 199 182)"/><ellipse cx="199" cy="220" rx="9" ry="4.5" transform="rotate(20 199 220)"/>
    <ellipse cx="152" cy="208" rx="8" ry="4" transform="rotate(-25 152 208)"/><ellipse cx="168" cy="200" rx="8" ry="4" transform="rotate(25 168 200)"/>
    <ellipse cx="217" cy="203" rx="8" ry="4" transform="rotate(-25 217 203)"/><ellipse cx="233" cy="194" rx="8" ry="4" transform="rotate(25 233 194)"/>
  </g>
  <g fill="#d9534f"><circle cx="114" cy="212" r="4"/><circle cx="186" cy="208" r="4"/><circle cx="194" cy="232" r="4"/><circle cx="163" cy="224" r="3.5"/><circle cx="228" cy="220" r="3.5"/></g>
  <!-- heater -->
  <rect x="78" y="222" width="22" height="26" rx="2" fill="#f7d9cf" stroke="#33475b" stroke-width="1.2"/>
  <path d="M83,226 L83,244 M89,226 L89,244 M95,226 L95,244" stroke="#c0392b" stroke-width="1.2"/>
  <!-- paraffin burner -->
  <rect x="278" y="236" width="22" height="12" rx="2" fill="#dfe5ea" stroke="#33475b" stroke-width="1.2"/>
  <path d="M289,236 Q283,228 289,220 Q295,228 289,236 Z" fill="#f39c12" stroke="#d35400" stroke-width="0.8"/>
  <text class="gh-s" x="276" y="208" style="font-size:10.5px;font-weight:700">CO₂</text>
  <!-- number badges -->
  <g>
    <circle cx="112" cy="112" r="9" fill="#0f7b6c"/><text class="gh-n" x="112" y="116" text-anchor="middle">1</text>
    <circle cx="89" cy="208" r="9" fill="#0f7b6c"/><text class="gh-n" x="89" y="212" text-anchor="middle">2</text>
    <circle cx="300" cy="222" r="9" fill="#0f7b6c"/><text class="gh-n" x="300" y="226" text-anchor="middle">3</text>
    <circle cx="214" cy="94" r="9" fill="#0f7b6c"/><text class="gh-n" x="214" y="98" text-anchor="middle">4</text>
    <circle cx="290" cy="150" r="9" fill="#0f7b6c"/><text class="gh-n" x="290" y="154" text-anchor="middle">5</text>
  </g>
  <text class="gh-t" x="190" y="272" text-anchor="middle">GLASSHOUSE</text>
  <!-- key -->
  <g>
    <circle cx="352" cy="56" r="8" fill="#0f7b6c"/><text class="gh-n" x="352" y="60" text-anchor="middle">1</text>
    <text class="gh-k" x="366" y="60">Glass lets light in, traps heat</text>
    <text class="gh-s" x="366" y="75">→ warmer, faster photosynthesis</text>
    <circle cx="352" cy="100" r="8" fill="#0f7b6c"/><text class="gh-n" x="352" y="104" text-anchor="middle">2</text>
    <text class="gh-k" x="366" y="104">Heaters</text>
    <text class="gh-s" x="366" y="119">→ near optimum temperature, night and winter</text>
    <circle cx="352" cy="144" r="8" fill="#0f7b6c"/><text class="gh-n" x="352" y="148" text-anchor="middle">3</text>
    <text class="gh-k" x="366" y="148">Paraffin burners</text>
    <text class="gh-s" x="366" y="163">→ extra carbon dioxide (and heat)</text>
    <circle cx="352" cy="188" r="8" fill="#0f7b6c"/><text class="gh-n" x="352" y="192" text-anchor="middle">4</text>
    <text class="gh-k" x="366" y="192">Artificial lighting</text>
    <text class="gh-s" x="366" y="207">→ light for longer each day</text>
    <circle cx="352" cy="232" r="8" fill="#0f7b6c"/><text class="gh-n" x="352" y="236" text-anchor="middle">5</text>
    <text class="gh-k" x="366" y="236">Enclosed space</text>
    <text class="gh-s" x="366" y="251">→ pests kept out; watering controlled</text>
  </g>
  <!-- polythene tunnel -->
  <path d="M610,250 A70,70 0 0 1 750,250 Z" fill="#f1f6ee" stroke="#33475b" stroke-width="2"/>
  <g stroke="#8fa3b8" stroke-width="1" fill="none">
    <path d="M633,250 A47,66 0 0 1 727,250"/><path d="M660,250 A20,69 0 0 1 700,250"/>
  </g>
  <g fill="#5fae6e" stroke="#2e7d4f" stroke-width="0.8">
    <ellipse cx="628" cy="243" rx="9" ry="6"/><ellipse cx="654" cy="243" rx="9" ry="6"/><ellipse cx="680" cy="243" rx="9" ry="6"/><ellipse cx="706" cy="243" rx="9" ry="6"/><ellipse cx="732" cy="243" rx="9" ry="6"/>
  </g>
  <g fill="#d9534f"><circle cx="631" cy="246" r="2.4"/><circle cx="657" cy="246" r="2.4"/><circle cx="683" cy="246" r="2.4"/><circle cx="709" cy="246" r="2.4"/><circle cx="735" cy="246" r="2.4"/></g>
  <text class="gh-s" x="680" y="214" text-anchor="middle" style="font-weight:700">polythene sheet</text>
  <text class="gh-t" x="680" y="272" text-anchor="middle">POLYTHENE TUNNEL</text>
  <text class="gh-s" x="680" y="288" text-anchor="middle">cheaper; covers large areas</text>
  <text class="gh-s" x="680" y="302" text-anchor="middle">traps heat; shelters crops</text>
  <text class="gh-s" x="680" y="316" text-anchor="middle">from wind and frost</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 820 312" width="820" height="312" role="img"
     aria-label="Cross-section of a vacuum flask: plastic stopper, silvered double glass walls with a vacuum between them, insulating support and case">
  <defs>
    <clipPath id="p4vf-inner">
      <rect x="368" y="100" width="84" height="186" rx="16"/>
    </clipPath>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <!-- case and cap -->
    <rect x="335" y="60" width="150" height="264" rx="14" fill="#eef2f5" stroke="#6b7a88" stroke-width="2"/>
    <rect x="335" y="34" width="150" height="28" rx="8" fill="#c9d1d9" stroke="#6b7a88" stroke-width="2"/>
    <!-- outer glass wall (silvered) with the vacuum inside it -->
    <rect x="352" y="84" width="116" height="218" rx="26" fill="#ffffff" stroke="#9aa7b3" stroke-width="5"/>
    <!-- inner glass wall (silvered) -->
    <rect x="366" y="98" width="88" height="190" rx="18" fill="#ffffff" stroke="#9aa7b3" stroke-width="5"/>
    <rect x="368" y="142" width="84" height="150" fill="#f3c9a8" clip-path="url(#p4vf-inner)"/>
    <text x="410" y="222" font-size="14" font-weight="700" fill="#a0522d" text-anchor="middle">hot liquid</text>
    <!-- stopper -->
    <rect x="374" y="56" width="72" height="62" rx="6" fill="#e8dcc4" stroke="#8a7a5c" stroke-width="1.5"/>
    <!-- insulating support -->
    <rect x="395" y="302" width="30" height="20" fill="#e8dcc4" stroke="#8a7a5c" stroke-width="1.5"/>

    <!-- leaders -->
    <g stroke="#33475b" stroke-width="1">
      <line x1="306" y1="78" x2="374" y2="84"/>
      <line x1="306" y1="188" x2="358" y2="190"/>
      <line x1="514" y1="138" x2="470" y2="140"/>
      <line x1="514" y1="290" x2="426" y2="312"/>
    </g>
    <circle cx="358" cy="190" r="2.5" fill="#33475b"/>

    <!-- labels, left -->
    <text x="300" y="72" font-size="14" font-weight="700" fill="#16283c" text-anchor="end">Stopper (plastic)</text>
    <text x="300" y="88" font-size="12.5" text-anchor="end">poor conductor; stops convection</text>
    <text x="300" y="103" font-size="12.5" text-anchor="end">and evaporation from the top</text>

    <text x="300" y="182" font-size="14" font-weight="700" fill="#16283c" text-anchor="end">Vacuum between the walls</text>
    <text x="300" y="198" font-size="12.5" text-anchor="end">no particles → no conduction</text>
    <text x="300" y="213" font-size="12.5" text-anchor="end">or convection across the gap</text>

    <!-- labels, right -->
    <text x="520" y="132" font-size="14" font-weight="700" fill="#16283c">Silvered glass walls</text>
    <text x="520" y="148" font-size="12.5">poor emitters; reflect infrared</text>
    <text x="520" y="163" font-size="12.5">back → less radiation</text>

    <text x="520" y="284" font-size="14" font-weight="700" fill="#16283c">Insulating support and case</text>
    <text x="520" y="300" font-size="12.5">poor conductors → less conduction</text>
  </g>
</svg>

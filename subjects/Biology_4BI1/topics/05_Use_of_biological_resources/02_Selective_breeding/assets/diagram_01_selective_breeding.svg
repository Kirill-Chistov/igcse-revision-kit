<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Selective breeding: choose parents with the desired characteristic, breed them, select the offspring that show it most strongly and breed those; repeat for many generations until all offspring show the characteristic. Examples for plants such as wheat and for animals such as cattle, hens and sheep." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .sb-t { font-size: 12.5px; font-weight: 700; fill: #6b7a88; letter-spacing: 0.06em; }
    .sb-h { font-size: 12.5px; font-weight: 700; }
    .sb-s { font-size: 12px; fill: #33475b; }
    .sb-n { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .sb-r { font-size: 12px; font-weight: 700; fill: #0b5f54; font-style: italic; }
  </style>
  <defs>
    <marker id="sb-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <marker id="sb-ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker>
  </defs>
  <!-- steps -->
  <g>
    <rect x="10" y="8" width="236" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
    <circle cx="28" cy="33" r="9" fill="#0f7b6c"/><text class="sb-n" x="28" y="37" text-anchor="middle">1</text>
    <text class="sb-h" x="44" y="29">Choose parents</text>
    <text class="sb-s" x="44" y="45">that show the desired characteristic</text>
    <line x1="128" y1="58" x2="128" y2="78" stroke="#33475b" stroke-width="1.8" marker-end="url(#sb-ar)"/>
    <rect x="10" y="80" width="236" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
    <circle cx="28" cy="105" r="9" fill="#0f7b6c"/><text class="sb-n" x="28" y="109" text-anchor="middle">2</text>
    <text class="sb-h" x="44" y="101">Breed them together</text>
    <text class="sb-s" x="44" y="117">plants: cross-pollinate; animals: mate</text>
    <line x1="128" y1="130" x2="128" y2="150" stroke="#33475b" stroke-width="1.8" marker-end="url(#sb-ar)"/>
    <rect x="10" y="152" width="236" height="50" rx="7" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.6"/>
    <circle cx="28" cy="177" r="9" fill="#0f7b6c"/><text class="sb-n" x="28" y="181" text-anchor="middle">3</text>
    <text class="sb-h" x="44" y="173">Select the offspring</text>
    <text class="sb-s" x="44" y="189">that show it most strongly</text>
    <line x1="128" y1="202" x2="128" y2="232" stroke="#33475b" stroke-width="1.8" marker-end="url(#sb-ar)"/>
    <rect x="10" y="234" width="236" height="48" rx="7" fill="#16283c"/>
    <text class="sb-h" x="128" y="254" text-anchor="middle" style="fill:#ffffff">Result: all offspring show</text>
    <text class="sb-h" x="128" y="270" text-anchor="middle" style="fill:#ffffff">the desired characteristic</text>
    <!-- loop -->
    <path d="M246,177 L276,177 Q288,177 288,165 L288,117 Q288,105 276,105 L250,105" fill="none" stroke="#0f7b6c" stroke-width="2" marker-end="url(#sb-ag)"/>
    <text class="sb-r" x="296" y="130">use them as</text>
    <text class="sb-r" x="296" y="145">parents; repeat</text>
    <text class="sb-r" x="296" y="160">for many</text>
    <text class="sb-r" x="296" y="175">generations</text>
  </g>
  <line x1="394" y1="8" x2="394" y2="282" stroke="#dfe5ea" stroke-width="1.4"/>
  <!-- examples -->
  <text class="sb-t" x="410" y="22">PLANTS, e.g. wheat, tomatoes</text>
  <g>
    <text class="sb-s" x="410" y="44">• high yield (more or bigger grain, fruit)</text>
    <text class="sb-s" x="410" y="62">• short, strong stems (not blown over)</text>
    <text class="sb-s" x="410" y="80">• resistance to disease or pests</text>
    <text class="sb-s" x="410" y="98">• tolerance of drought or cold</text>
    <text class="sb-s" x="410" y="116">• better taste; ripening at the same time</text>
  </g>
  <line x1="410" y1="138" x2="752" y2="138" stroke="#dfe5ea" stroke-width="1.2"/>
  <text class="sb-t" x="410" y="162">ANIMALS, e.g. cattle, hens, sheep</text>
  <g>
    <text class="sb-s" x="410" y="184">• dairy cows: high milk yield</text>
    <text class="sb-s" x="410" y="202">• beef cattle: more meat, faster growth</text>
    <text class="sb-s" x="410" y="220">• hens: more eggs; sheep: more or finer wool</text>
    <text class="sb-s" x="410" y="238">• resistance to disease</text>
    <text class="sb-s" x="410" y="256">• calm temperament (easier to handle)</text>
  </g>
</svg>

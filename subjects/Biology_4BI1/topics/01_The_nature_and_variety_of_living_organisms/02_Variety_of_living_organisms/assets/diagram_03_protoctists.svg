<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 152" width="760" height="152" role="img" aria-label="Two single-celled protoctists. Amoeba is like an animal cell: a cell membrane but no cell wall, nucleus, cytoplasm and no chloroplasts. Chlorella is like a plant cell: a cell wall, a chloroplast and a nucleus." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .vg3-p   { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #0f7b6c; }
    .vg3-ps  { font-size: 12.5px; fill: #33475b; }
    .vg3-lb  { font-size: 12.5px; font-weight: 700; }
    .vg3-no  { font-size: 12.5px; font-weight: 700; fill: #c0392b; }
    .vg3-ldr { fill: none; stroke: #8fa3b8; stroke-width: 1.2; }
  </style>

  <!-- ============ Amoeba ============ -->
  <text x="6" y="16"><tspan class="vg3-p">AMOEBA</tspan><tspan class="vg3-ps"> — like an animal cell; lives in pond water</tspan></text>
  <path d="M76.4,87.0 C69.0,64.8 91.2,51.5 113.4,57.4 C120.8,38.2 143.0,35.2 150.4,53.0 C166.6,48.6 190.3,57.4 184.4,76.7 C206.6,81.1 214.0,101.8 194.8,110.7 C199.2,131.4 177.0,140.3 162.2,128.5 C150.4,144.8 123.7,144.8 117.8,127.0 C98.6,134.4 76.4,124.0 85.2,106.3 C67.5,103.3 64.5,91.5 76.4,87.0 Z"
        fill="#eef6f3" stroke="#0f7b6c" stroke-width="1.8"/>
  <ellipse cx="140" cy="90" rx="15" ry="12" fill="#9fc9bf" stroke="#0b5f54" stroke-width="1.4"/>
  <path class="vg3-ldr" d="M246,50 L186,70"/>
  <text class="vg3-lb" x="250" y="48">cell membrane</text>
  <text class="vg3-no" x="250" y="63">no cell wall</text>
  <path class="vg3-ldr" d="M246,90 L155,90"/>
  <text class="vg3-lb" x="250" y="94">nucleus</text>
  <path class="vg3-ldr" d="M246,126 L172,118"/>
  <text class="vg3-lb" x="250" y="128">cytoplasm</text>
  <text class="vg3-no" x="250" y="143">no chloroplasts</text>

  <line x1="382" y1="26" x2="382" y2="148" stroke="#dfe5ea" stroke-width="1.5"/>

  <!-- ============ Chlorella ============ -->
  <text x="398" y="16"><tspan class="vg3-p">CHLORELLA</tspan><tspan class="vg3-ps"> — has chloroplasts, like a plant cell</tspan></text>
  <circle cx="500" cy="88" r="50" fill="#eaf7ef" stroke="#1e8449" stroke-width="5"/>
  <path d="M464.0,70.0 C458.0,97.0 477.5,127.0 515.0,127.0 C536.0,125.5 545.0,112.0 539.0,100.0 C527.0,112.0 495.5,116.5 480.5,97.0 C473.0,88.0 470.0,79.0 464.0,70.0 Z" fill="#7bc88f" stroke="#1e8449" stroke-width="1.4"/>
  <circle cx="506" cy="74" r="11" fill="#9fc9bf" stroke="#0b5f54" stroke-width="1.4"/>
  <path class="vg3-ldr" d="M596,44 L540,62"/>
  <text class="vg3-lb" x="600" y="48">cell wall</text>
  <path class="vg3-ldr" d="M596,80 L517,75"/>
  <text class="vg3-lb" x="600" y="84">nucleus</text>
  <path class="vg3-ldr" d="M596,116 L530,112"/>
  <text class="vg3-lb" x="600" y="120">chloroplast</text>
  <text class="vg3-ps" x="600" y="135">photosynthesis</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="300" fill="#fff"/>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6fa3"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a88"/></marker><marker id="mk2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a100"/></marker></defs>
<rect x="6" y="6" width="382" height="288" fill="#f7fafb" stroke="#dfe5ea" rx="4"/>
<rect x="398" y="6" width="356" height="288" fill="#f7fafb" stroke="#dfe5ea" rx="4"/>
<text x="197" y="26" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="700">Nutrients: a fast cycle, stored in the plants</text>
<circle cx="197" cy="98" r="58" fill="#cfead8" stroke="#2f8f4e" stroke-width="1.4"/>
<text x="197" y="97" font-size="11" fill="#16283c" text-anchor="middle" font-weight="700">BIOMASS</text>
<text x="197" y="110" font-size="9.5" fill="#33475b" text-anchor="middle" font-weight="400">trees and plants: the</text>
<text x="197" y="122" font-size="9.5" fill="#33475b" text-anchor="middle" font-weight="400">largest store</text>
<circle cx="92" cy="226" r="24" fill="#efe3c8" stroke="#a07d3a" stroke-width="1.4"/>
<text x="92" y="230" font-size="11" fill="#16283c" text-anchor="middle" font-weight="700">LITTER</text>
<circle cx="302" cy="226" r="28" fill="#f2d3c6" stroke="#b5502f" stroke-width="1.4"/>
<text x="302" y="230" font-size="11" fill="#16283c" text-anchor="middle" font-weight="700">SOIL</text>
<path d="M150,134 L106,200" fill="none" stroke="#0f7b6c" stroke-width="1.8" marker-end="url(#mg)"/>
<text x="76" y="158" font-size="10" fill="#0b5f54" text-anchor="middle" font-weight="700">leaves fall</text>
<text x="76" y="170" font-size="9.5" fill="#33475b" text-anchor="middle" font-weight="400">all year round</text>
<path d="M118,228 L272,228" fill="none" stroke="#0f7b6c" stroke-width="1.8" marker-end="url(#mg)"/>
<text x="195" y="215" font-size="10" fill="#0b5f54" text-anchor="middle" font-weight="700">rapid decomposition</text>
<text x="195" y="246" font-size="9.5" fill="#33475b" text-anchor="middle" font-weight="400">hot and wet: fungi, bacteria,</text>
<text x="195" y="258" font-size="9.5" fill="#33475b" text-anchor="middle" font-weight="400">termites break litter down in weeks</text>
<path d="M290,199 L242,136" fill="none" stroke="#0f7b6c" stroke-width="1.8" marker-end="url(#mg)"/>
<text x="318" y="150" font-size="10" fill="#0b5f54" text-anchor="middle" font-weight="700">taken up fast</text>
<text x="318" y="162" font-size="9.5" fill="#33475b" text-anchor="middle" font-weight="400">by shallow roots</text>
<path d="M302,255 L302,284" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#mr)"/>
<text x="294" y="276" font-size="9.8" fill="#8f2b20" text-anchor="end" font-weight="700">leaching: heavy rain washes</text>
<text x="294" y="288" font-size="9.5" fill="#8f2b20" text-anchor="end" font-weight="400">unused nutrients out of the soil</text>
<text x="380" y="44" font-size="9.5" fill="#6b7a88" text-anchor="end" font-weight="400" font-style="italic">circle size = size of the store</text>
<text x="576" y="26" font-size="12.5" fill="#16283c" text-anchor="middle" font-weight="700">Water: the forest recycles its own rain</text>
<rect x="430" y="46" width="140" height="54" rx="5" fill="#e8f1f7" stroke="#2e6fa3" stroke-width="1.2"/>
<text x="500.0" y="70.2" font-size="10.5" font-weight="700" fill="#1f4f75" text-anchor="middle">Heavy convectional rain</text>
<text x="500.0" y="83.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">most afternoons</text>
<rect x="600" y="46" width="140" height="54" rx="5" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.2"/>
<text x="670.0" y="70.2" font-size="10.5" font-weight="700" fill="#0b5f54" text-anchor="middle">Canopy intercepts it</text>
<text x="670.0" y="83.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">drip tips shed the water</text>
<rect x="600" y="178" width="140" height="54" rx="5" fill="#e8f1f7" stroke="#2e6fa3" stroke-width="1.2"/>
<text x="670.0" y="202.2" font-size="10.5" font-weight="700" fill="#1f4f75" text-anchor="middle">Water reaches the soil</text>
<text x="670.0" y="215.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">absorbed by roots</text>
<rect x="430" y="178" width="140" height="54" rx="5" fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.2"/>
<text x="500.0" y="202.2" font-size="10.5" font-weight="700" fill="#0b5f54" text-anchor="middle">Leaves transpire</text>
<text x="500.0" y="215.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="middle">water vapour → humid air</text>
<path d="M571,73 L599,73" fill="none" stroke="#2e6fa3" stroke-width="1.6" marker-end="url(#mb)"/>
<path d="M670,101 L670,177" fill="none" stroke="#2e6fa3" stroke-width="1.6" marker-end="url(#mb)"/>
<path d="M599,205 L571,205" fill="none" stroke="#2e6fa3" stroke-width="1.6" marker-end="url(#mb)"/>
<path d="M500,177 L500,101" fill="none" stroke="#2e6fa3" stroke-width="1.6" marker-end="url(#mb)"/>
<text x="576" y="140" font-size="9.8" fill="#1f4f75" text-anchor="middle" font-weight="400" font-style="italic">a large share of the</text>
<text x="576" y="152" font-size="9.8" fill="#1f4f75" text-anchor="middle" font-weight="400" font-style="italic">rain is water the forest</text>
<text x="576" y="164" font-size="9.8" fill="#1f4f75" text-anchor="middle" font-weight="400" font-style="italic">itself transpired</text>
<text x="410" y="258" font-size="10.2" fill="#8f2b20" text-anchor="start" font-weight="700">Remove the trees → less transpiration → less rain</text>
<text x="410" y="272" font-size="10" fill="#33475b" text-anchor="start" font-weight="400">The rainforest climate depends on the rainforest (see 3.4).</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.3; }
    .tr { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.7; }
    .err { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .off { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .h { font-size: 14px; font-weight: bold; fill: #0f766e; letter-spacing: 0.5px; }
    .t { font-size: 13px; fill: #1e293b; }
    .b { font-size: 13px; font-weight: bold; fill: #1e293b; }
    .e { font-size: 13px; font-weight: bold; fill: #991b1b; }
    .g { font-size: 12.5px; fill: #94a3b8; }
    .lab { font-size: 12px; font-style: italic; fill: #475569; }
    .ln { stroke: #334155; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <line x1="320" y1="6" x2="320" y2="256" stroke="#cbd5e1" stroke-width="1"/>

  <!-- COMPILER -->
  <text class="h" x="160" y="18" text-anchor="middle">COMPILER</text>
  <rect class="box" x="60" y="30" width="200" height="30" rx="4"/>
  <text class="t" x="160" y="50" text-anchor="middle">source code — whole program</text>
  <line class="ln" x1="160" y1="60" x2="160" y2="78" marker-end="url(#a)"/>
  <rect class="tr" x="30" y="80" width="260" height="40" rx="4"/>
  <text class="b" x="160" y="97" text-anchor="middle">whole program translated in one go</text>
  <text class="t" x="160" y="113" text-anchor="middle">before anything is executed</text>

  <polyline class="ln" points="110,120 84,146" marker-end="url(#a)"/>
  <polyline class="ln" points="210,120 236,146" marker-end="url(#a)"/>
  <text class="lab" x="80" y="134" text-anchor="end">no errors</text>
  <text class="lab" x="240" y="134">errors</text>

  <rect class="box" x="14" y="148" width="140" height="44" rx="4"/>
  <text class="b" x="84" y="166" text-anchor="middle">executable file</text>
  <text class="t" x="84" y="183" text-anchor="middle">(machine code)</text>
  <rect class="err" x="166" y="148" width="144" height="44" rx="4"/>
  <text class="e" x="238" y="166" text-anchor="middle">error report for</text>
  <text class="e" x="238" y="183" text-anchor="middle">the whole code</text>

  <line class="ln" x1="84" y1="192" x2="84" y2="210" marker-end="url(#a)"/>
  <text class="t" x="14" y="228">runs any number of times,</text>
  <text class="t" x="14" y="245">without the compiler</text>
  <text class="t" x="166" y="212">lists all errors found;</text>
  <text class="t" x="166" y="229">no executable file</text>

  <!-- INTERPRETER -->
  <text class="h" x="480" y="18" text-anchor="middle">INTERPRETER</text>

  <rect class="box" x="332" y="30" width="72" height="30" rx="4"/><text class="t" x="368" y="50" text-anchor="middle">line 1</text>
  <line class="ln" x1="404" y1="45" x2="420" y2="45" marker-end="url(#a)"/>
  <rect class="tr" x="422" y="30" width="86" height="30" rx="4"/><text class="t" x="465" y="50" text-anchor="middle">translate</text>
  <line class="ln" x1="508" y1="45" x2="524" y2="45" marker-end="url(#a)"/>
  <rect class="box" x="526" y="30" width="102" height="30" rx="4"/><text class="t" x="577" y="50" text-anchor="middle">execute</text>

  <rect class="box" x="332" y="72" width="72" height="30" rx="4"/><text class="t" x="368" y="92" text-anchor="middle">line 2</text>
  <line class="ln" x1="404" y1="87" x2="420" y2="87" marker-end="url(#a)"/>
  <rect class="tr" x="422" y="72" width="86" height="30" rx="4"/><text class="t" x="465" y="92" text-anchor="middle">translate</text>
  <line class="ln" x1="508" y1="87" x2="524" y2="87" marker-end="url(#a)"/>
  <rect class="box" x="526" y="72" width="102" height="30" rx="4"/><text class="t" x="577" y="92" text-anchor="middle">execute</text>

  <rect class="err" x="332" y="114" width="72" height="30" rx="4"/><text class="e" x="368" y="134" text-anchor="middle">line 3 ✗</text>
  <line class="ln" x1="404" y1="129" x2="420" y2="129" marker-end="url(#a)"/>
  <rect class="tr" x="422" y="114" width="86" height="30" rx="4"/><text class="t" x="465" y="134" text-anchor="middle">translate</text>
  <line class="ln" x1="508" y1="129" x2="524" y2="129" marker-end="url(#a)"/>
  <rect class="err" x="526" y="114" width="102" height="30" rx="4"/><text class="e" x="577" y="134" text-anchor="middle">STOP: error</text>

  <rect class="off" x="332" y="156" width="72" height="30" rx="4"/><text class="g" x="368" y="176" text-anchor="middle">line 4</text>
  <text class="g" x="422" y="176">not run</text>

  <text class="t" x="332" y="214">execution stops at the error; that error is</text>
  <text class="t" x="332" y="231">reported. No executable file — the program is</text>
  <text class="t" x="332" y="248">translated again every time it is run.</text>
</svg>

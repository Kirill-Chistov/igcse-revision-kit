<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 296" width="820" height="296" role="img"
     aria-label="Conduction through a heated rod, a convection current in heated water, and infrared radiation crossing a vacuum">
  <defs>
    <marker id="p4tm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#33475b"/>
    </marker>
    <marker id="p4tm-arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c3fa8"/>
    </marker>
    <marker id="p4tm-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="p4tm-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e6da4"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" fill="#33475b">
    <!-- panel dividers -->
    <line x1="272" y1="10" x2="272" y2="285" stroke="#dfe5ea" stroke-width="1.5"/>
    <line x1="545" y1="10" x2="545" y2="285" stroke="#dfe5ea" stroke-width="1.5"/>

    <!-- ===== Conduction ===== -->
    <text x="137" y="24" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">Conduction</text>
    <rect x="22" y="78" width="236" height="72" rx="4" fill="#f4f6f8" stroke="#33475b" stroke-width="1.5"/>
    <g>
      <circle cx="38" cy="92" r="8" fill="#e0857a" stroke="#6b7a88" stroke-width="0.8"/>
      <path d="M27,87 Q23,92 27,97 M49,87 Q53,92 49,97" stroke="#c0392b" stroke-width="1.4" fill="none"/>
      <circle cx="38" cy="114" r="8" fill="#e0857a" stroke="#6b7a88" stroke-width="0.8"/>
      <path d="M27,109 Q23,114 27,119 M49,109 Q53,114 49,119" stroke="#c0392b" stroke-width="1.4" fill="none"/>
      <circle cx="38" cy="136" r="8" fill="#e0857a" stroke="#6b7a88" stroke-width="0.8"/>
      <path d="M27,131 Q23,136 27,141 M49,131 Q53,136 49,141" stroke="#c0392b" stroke-width="1.4" fill="none"/>
      <circle cx="64" cy="92" r="8" fill="#e59a8f" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="64" cy="114" r="8" fill="#e59a8f" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="64" cy="136" r="8" fill="#e59a8f" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="90" cy="92" r="8" fill="#eab0a5" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="90" cy="114" r="8" fill="#eab0a5" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="90" cy="136" r="8" fill="#eab0a5" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="116" cy="92" r="8" fill="#e9c4b6" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="116" cy="114" r="8" fill="#e9c4b6" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="116" cy="136" r="8" fill="#e9c4b6" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="142" cy="92" r="8" fill="#dfd0cc" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="142" cy="114" r="8" fill="#dfd0cc" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="142" cy="136" r="8" fill="#dfd0cc" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="168" cy="92" r="8" fill="#cfd4dc" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="168" cy="114" r="8" fill="#cfd4dc" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="168" cy="136" r="8" fill="#cfd4dc" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="194" cy="92" r="8" fill="#c2d2e2" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="194" cy="114" r="8" fill="#c2d2e2" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="194" cy="136" r="8" fill="#c2d2e2" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="220" cy="92" r="8" fill="#b8cde0" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="220" cy="114" r="8" fill="#b8cde0" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="220" cy="136" r="8" fill="#b8cde0" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="246" cy="92" r="8" fill="#b0c8de" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="246" cy="114" r="8" fill="#b0c8de" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="246" cy="136" r="8" fill="#b0c8de" stroke="#6b7a88" stroke-width="0.8"/>
      <circle cx="51" cy="125" r="2.8" fill="#4c3fa8"/>
      <circle cx="103" cy="103" r="2.8" fill="#4c3fa8"/>
      <circle cx="155" cy="125" r="2.8" fill="#4c3fa8"/>
      <circle cx="207" cy="103" r="2.8" fill="#4c3fa8"/>
      <circle cx="233" cy="125" r="2.8" fill="#4c3fa8"/>
      <circle cx="77" cy="103" r="2.8" fill="#4c3fa8"/>
    </g>
    <line x1="207" y1="99" x2="226" y2="68" stroke="#4c3fa8" stroke-width="1"/>
    <text x="258" y="62" font-size="12.5" fill="#4c3fa8" text-anchor="end">free electrons (metals)</text>
    <path d="M45,202 C28,192 32,172 45,158 C47,172 62,180 45,202 Z" fill="#e67e22"/>
    <path d="M45,200 C37,194 39,182 45,174 C47,184 53,190 45,200 Z" fill="#f7c948"/>
    <text x="66" y="172" font-size="12.5" font-weight="700" fill="#c0392b">hot end</text>
    <text x="258" y="172" font-size="12.5" font-weight="700" fill="#2e6da4" text-anchor="end">cool end</text>
    <line x1="80" y1="205" x2="250" y2="205" stroke="#33475b" stroke-width="2" marker-end="url(#p4tm-arr)"/>
    <text x="137" y="272" font-size="12.5" text-anchor="middle">energy passed from particle to particle,</text>
    <text x="137" y="289" font-size="12.5" text-anchor="middle">hot end → cool end</text>

    <!-- ===== Convection ===== -->
    <text x="410" y="24" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">Convection</text>
    <rect x="341" y="66" width="138" height="148" fill="#dbe9f5"/>
    <path d="M340,48 L340,206 Q340,215 349,215 L471,215 Q480,215 480,206 L480,48" stroke="#33475b" stroke-width="2" fill="none"/>
    <path d="M362,198 L362,94" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#p4tm-red)"/>
    <path d="M372,84 L450,84" stroke="#6b7a88" stroke-width="2.5" fill="none" marker-end="url(#p4tm-arr)"/>
    <path d="M460,94 L460,192" stroke="#2e6da4" stroke-width="2.5" fill="none" marker-end="url(#p4tm-blue)"/>
    <path d="M450,203 L374,203" stroke="#2e6da4" stroke-width="2.5" fill="none" marker-end="url(#p4tm-blue)"/>
    <text x="369" y="150" font-size="12.5" font-weight="700" fill="#c0392b">rises</text>
    <text x="453" y="150" font-size="12.5" font-weight="700" fill="#2e6da4" text-anchor="end">sinks</text>
    <path d="M362,256 C345,246 349,230 362,218 C364,230 379,238 362,256 Z" fill="#e67e22"/>
    <path d="M362,254 C354,248 356,238 362,231 C364,240 370,245 362,254 Z" fill="#f7c948"/>
    <text x="410" y="272" font-size="12.5" text-anchor="middle">heated water expands, is less dense, rises;</text>
    <text x="410" y="289" font-size="12.5" text-anchor="middle">cooler, denser water sinks</text>

    <!-- ===== Radiation ===== -->
    <text x="680" y="24" font-size="16" font-weight="700" fill="#16283c" text-anchor="middle">Radiation</text>
    <circle cx="600" cy="130" r="34" fill="#f0b27a" stroke="#c0392b" stroke-width="2"/>
    <rect x="752" y="98" width="38" height="64" fill="#b8cde0" stroke="#2e6da4" stroke-width="2"/>
    <path d="M645,110 q4,-7 8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 l12,0" stroke="#4c3fa8" stroke-width="2" fill="none" marker-end="url(#p4tm-arr2)"/>
    <path d="M645,130 q4,-7 8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 l12,0" stroke="#4c3fa8" stroke-width="2" fill="none" marker-end="url(#p4tm-arr2)"/>
    <path d="M645,150 q4,-7 8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 l12,0" stroke="#4c3fa8" stroke-width="2" fill="none" marker-end="url(#p4tm-arr2)"/>
    <text x="697" y="86" font-size="13" font-weight="700" fill="#4c3fa8" text-anchor="middle">infrared waves</text>
    <text x="600" y="190" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">hot object</text>
    <text x="771" y="190" font-size="12.5" font-weight="700" fill="#2e6da4" text-anchor="middle">cooler object</text>
    <text x="680" y="272" font-size="12.5" text-anchor="middle">no particles needed:</text>
    <text x="680" y="289" font-size="12.5" text-anchor="middle">crosses a vacuum</text>
  </g>
</svg>

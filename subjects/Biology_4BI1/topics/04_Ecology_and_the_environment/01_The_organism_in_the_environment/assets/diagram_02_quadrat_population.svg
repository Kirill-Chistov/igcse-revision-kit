<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" role="img" aria-label="Random sampling with quadrats in two areas. In each area two tape measures at right angles form the axes of a grid. Random numbers give coordinates where each quadrat is placed. The number of the chosen species in each quadrat is counted, at least ten quadrats are used in each area, the mean per quadrat is calculated and scaled up to estimate the population size.">

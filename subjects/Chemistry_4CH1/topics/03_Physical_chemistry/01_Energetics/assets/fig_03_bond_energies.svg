<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Carlito, Calibri, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="c3a3-arr-16283c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="c3a3-arr-c0392b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="c3a3-arr-4c3fa8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c3fa8"/></marker><marker id="c3a3-arr-1e7d5a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7d5a"/></marker><marker id="c3a3-arr-33475b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker></defs>
<line x1="40" y1="280" x2="40" y2="25" stroke="#16283c" stroke-width="1.5" marker-end="url(#c3a3-arr-16283c)"/>
<text x="26" y="150" font-size="12" fill="#33475b" text-anchor="middle" transform="rotate(-90 26 150)">energy</text>
<line x1="70" y1="60" x2="560" y2="60" stroke="#16283c" stroke-width="3"/>
<text x="315" y="50" font-size="13" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">H + H + Cl + Cl   (separate atoms)</text>
<line x1="70" y1="185" x2="200" y2="185" stroke="#16283c" stroke-width="3"/>
<text x="135" y="205" font-size="13" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">H–H + Cl–Cl</text>
<line x1="430" y1="250" x2="560" y2="250" stroke="#16283c" stroke-width="3"/>
<text x="495" y="270" font-size="13" fill="#16283c" text-anchor="middle" font-weight="bold" font-style="normal">H–Cl + H–Cl</text>
<line x1="150" y1="183" x2="150" y2="63" stroke="#4c3fa8" stroke-width="2.2" marker-end="url(#c3a3-arr-4c3fa8)"/>
<text x="160" y="100.0" font-size="12.5" fill="#4c3fa8" text-anchor="start" font-weight="bold" font-style="normal">bonds broken:</text>
<text x="160" y="117" font-size="12" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">energy taken in</text>
<text x="160" y="132" font-size="12" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">436 + 242 = 678 kJ</text>
<line x1="480" y1="62" x2="480" y2="247" stroke="#c0392b" stroke-width="2.2" marker-end="url(#c3a3-arr-c0392b)"/>
<text x="470" y="100.0" font-size="12.5" fill="#c0392b" text-anchor="end" font-weight="bold" font-style="normal">bonds made:</text>
<text x="470" y="117" font-size="12" fill="#33475b" text-anchor="end" font-weight="normal" font-style="normal">energy given out</text>
<text x="470" y="132" font-size="12" fill="#33475b" text-anchor="end" font-weight="normal" font-style="normal">2 × 431 = 862 kJ</text>
<line x1="200" y1="185" x2="580" y2="185" stroke="#16283c" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="575" y1="185" x2="575" y2="247" stroke="#16283c" stroke-width="1.8" marker-end="url(#c3a3-arr-16283c)"/>
<text x="585" y="205" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">ΔH = 678 − 862</text>
<text x="585" y="221" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal">= −184 kJ/mol</text>
<text x="585" y="240.0" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">more given out than</text>
<text x="585" y="254.5" font-size="11.5" fill="#33475b" text-anchor="start" font-weight="normal" font-style="normal">taken in: exothermic</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="Carlito, Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="318" fill="#fff"/>
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16283c"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6fa3"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a88"/></marker><marker id="mk2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a100"/></marker></defs>
<rect x="10" y="120" width="118" height="76" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="69.0" y="148.0" font-size="11.5" font-weight="700" fill="#8f2b20" text-anchor="middle">Forest</text>
<text x="69.0" y="162.1" font-size="10.7" font-weight="700" fill="#8f2b20" text-anchor="middle">cleared</text>
<text x="69.0" y="176.2" font-size="10.7" font-weight="700" fill="#8f2b20" text-anchor="middle">and burned</text>
<text x="168" y="16" font-size="10.5" fill="#6b7a88" text-anchor="start" font-weight="700">What changes</text>
<text x="452" y="16" font-size="10.5" fill="#6b7a88" text-anchor="start" font-weight="700">Impact</text>
<text x="748" y="16" font-size="10.5" fill="#6b7a88" text-anchor="end" font-weight="700">Scale</text>
<rect x="160" y="26" width="262" height="42" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="168" y="44.3" font-size="10.2" font-weight="400" fill="#6b4a00" text-anchor="start">Bare soil: no canopy to intercept rain,</text>
<text x="168" y="57.1" font-size="9.399999999999999" font-weight="400" fill="#33475b" text-anchor="start">no roots to bind the soil</text>
<rect x="446" y="26" width="212" height="42" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="454" y="50.8" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="start">Soil erosion; rivers silt up</text>
<path d="M423,47.0 L445,47.0" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M128,158 L159,47.0" fill="none" stroke="#16283c" stroke-width="1.1" marker-end="url(#mk)"/>
<text x="748" y="51.0" font-size="10" fill="#1f4f75" text-anchor="end" font-weight="700">local–regional</text>
<rect x="160" y="74" width="262" height="42" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="168" y="92.3" font-size="10.2" font-weight="400" fill="#6b4a00" text-anchor="start">The nutrient store (the trees)</text>
<text x="168" y="105.1" font-size="9.399999999999999" font-weight="400" fill="#33475b" text-anchor="start">is removed or burned</text>
<rect x="446" y="74" width="212" height="42" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="454" y="92.2" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="start">Soil infertile in a few years →</text>
<text x="454" y="105.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="start">farmers clear more forest</text>
<path d="M423,95.0 L445,95.0" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M128,158 L159,95.0" fill="none" stroke="#16283c" stroke-width="1.1" marker-end="url(#mk)"/>
<text x="748" y="99.0" font-size="10" fill="#1f4f75" text-anchor="end" font-weight="700">local</text>
<rect x="160" y="122" width="262" height="42" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="168" y="140.3" font-size="10.2" font-weight="400" fill="#6b4a00" text-anchor="start">Less interception, faster</text>
<text x="168" y="153.1" font-size="9.399999999999999" font-weight="400" fill="#33475b" text-anchor="start">surface runoff</text>
<rect x="446" y="122" width="212" height="42" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="454" y="146.8" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="start">Flooding downstream</text>
<path d="M423,143.0 L445,143.0" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M128,158 L159,143.0" fill="none" stroke="#16283c" stroke-width="1.1" marker-end="url(#mk)"/>
<text x="748" y="147.0" font-size="10" fill="#1f4f75" text-anchor="end" font-weight="700">regional</text>
<rect x="160" y="170" width="262" height="42" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="168" y="188.3" font-size="10.2" font-weight="400" fill="#6b4a00" text-anchor="start">Less transpiration, so less</text>
<text x="168" y="201.1" font-size="9.399999999999999" font-weight="400" fill="#33475b" text-anchor="start">water vapour</text>
<rect x="446" y="170" width="212" height="42" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="454" y="194.8" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="start">Less rain: drought and fire</text>
<path d="M423,191.0 L445,191.0" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M128,158 L159,191.0" fill="none" stroke="#16283c" stroke-width="1.1" marker-end="url(#mk)"/>
<text x="748" y="195.0" font-size="10" fill="#1f4f75" text-anchor="end" font-weight="700">regional</text>
<rect x="160" y="218" width="262" height="42" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="168" y="236.3" font-size="10.2" font-weight="400" fill="#6b4a00" text-anchor="start">Burning and decay release CO₂;</text>
<text x="168" y="249.1" font-size="9.399999999999999" font-weight="400" fill="#33475b" text-anchor="start">the carbon sink is lost</text>
<rect x="446" y="218" width="212" height="42" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="454" y="242.8" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="start">Global warming (Topic 5)</text>
<path d="M423,239.0 L445,239.0" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M128,158 L159,239.0" fill="none" stroke="#16283c" stroke-width="1.1" marker-end="url(#mk)"/>
<text x="748" y="243.0" font-size="10" fill="#1f4f75" text-anchor="end" font-weight="700">global</text>
<rect x="160" y="266" width="262" height="42" rx="5" fill="#fff5e0" stroke="#c98a00" stroke-width="1.2"/>
<text x="168" y="284.3" font-size="10.2" font-weight="400" fill="#6b4a00" text-anchor="start">Habitats destroyed and</text>
<text x="168" y="297.1" font-size="9.399999999999999" font-weight="400" fill="#33475b" text-anchor="start">split into fragments</text>
<rect x="446" y="266" width="212" height="42" rx="5" fill="#fdeded" stroke="#c0392b" stroke-width="1.2"/>
<text x="454" y="284.2" font-size="10.5" font-weight="700" fill="#8f2b20" text-anchor="start">Species lost, some extinct;</text>
<text x="454" y="297.3" font-size="9.7" font-weight="400" fill="#33475b" text-anchor="start">foods and medicines lost</text>
<path d="M423,287.0 L445,287.0" fill="none" stroke="#16283c" stroke-width="1.4" marker-end="url(#mk)"/>
<path d="M128,158 L159,287.0" fill="none" stroke="#16283c" stroke-width="1.1" marker-end="url(#mk)"/>
<text x="748" y="291.0" font-size="10" fill="#1f4f75" text-anchor="end" font-weight="700">local → global</text>
</svg>
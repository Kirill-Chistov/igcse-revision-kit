<rect x="0" y="0" width="960" height="262" fill="#ffffff"/>
<rect x="39.0" y="13.0" width="262" height="66" rx="10" fill="#fdeded" stroke="#c0392b" stroke-width="1.8" />
<text x="170" y="42" font-size="19" font-weight="700" fill="#16283c" text-anchor="middle">Food insecurity</text>
<text x="170" y="65" font-size="15" font-weight="400" fill="#33475b" text-anchor="middle">not enough safe, nutritious food</text>
<rect x="349.0" y="13.0" width="262" height="66" rx="10" fill="#fdf6e5" stroke="#d99a17" stroke-width="1.8" />
<text x="480" y="42" font-size="19" font-weight="700" fill="#16283c" text-anchor="middle">Malnutrition</text>
<text x="480" y="65" font-size="15" font-weight="400" fill="#33475b" text-anchor="middle">undernutrition, deficiency diseases</text>

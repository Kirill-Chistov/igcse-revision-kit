<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" role="img" aria-label="Environmental, economic and social factors that hold development back" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Carlito, Calibri, sans-serif">
    <!-- column headers -->
    <rect x="10" y="8" width="284" height="40" rx="7" fill="#0f7b6c"/>
    <text x="152" y="34" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Environmental (physical)</text>
    <rect x="308" y="8" width="284" height="40" rx="7" fill="#4c3fa8"/>
    <text x="450" y="34" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Economic</text>
    <rect x="606" y="8" width="284" height="40" rx="7" fill="#16283c"/>
    <text x="748" y="34" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Social and political</text>

    <!-- card frames -->
    <g fill="#e7f3ef" stroke="#0f7b6c" stroke-width="1.3">
      <rect x="10" y="58" width="284" height="96" rx="7"/>
      <rect x="10" y="162" width="284" height="96" rx="7"/>
      <rect x="10" y="266" width="284" height="96" rx="7"/>
      <rect x="10" y="370" width="284" height="96" rx="7"/>
    </g>
    <g fill="#eeedfb" stroke="#4c3fa8" stroke-width="1.3">
      <rect x="308" y="58" width="284" height="96" rx="7"/>
      <rect x="308" y="162" width="284" height="96" rx="7"/>
      <rect x="308" y="266" width="284" height="96" rx="7"/>
      <rect x="308" y="370" width="284" height="96" rx="7"/>
    </g>
    <g fill="#eef2f5" stroke="#16283c" stroke-width="1.3">
      <rect x="606" y="58" width="284" height="96" rx="7"/>
      <rect x="606" y="162" width="284" height="96" rx="7"/>
      <rect x="606" y="266" width="284" height="96" rx="7"/>
      <rect x="606" y="370" width="284" height="96" rx="7"/>
    </g>

    <!-- environmental -->
    <g font-size="14" fill="#16283c">
      <text x="22" y="82" font-size="15" font-weight="700" fill="#0b5f54">Climate</text>
      <text x="22" y="104">drought, extreme heat → crop failure,</text>
      <text x="22" y="123">food shortages; hot, wet climates →</text>
      <text x="22" y="142">malaria → sick, less productive workers</text>

      <text x="22" y="186" font-size="15" font-weight="700" fill="#0b5f54">Natural hazards</text>
      <text x="22" y="208">earthquakes, tropical storms, floods</text>
      <text x="22" y="227">destroy homes and infrastructure →</text>
      <text x="22" y="246">money spent rebuilding, not developing</text>

      <text x="22" y="290" font-size="15" font-weight="700" fill="#0b5f54">Landlocked location</text>
      <text x="22" y="312">no coastline or ports → high transport</text>
      <text x="22" y="331">costs → exports dearer, less trade</text>

      <text x="22" y="394" font-size="15" font-weight="700" fill="#0b5f54">Poor natural resources</text>
      <text x="22" y="416">infertile soils, water shortages, few</text>
      <text x="22" y="435">minerals → little to farm or sell</text>
    </g>

    <!-- economic -->
    <g font-size="14" fill="#16283c">
      <text x="320" y="82" font-size="15" font-weight="700" fill="#4c3fa8">Dependence on primary products</text>
      <text x="320" y="104">crops and minerals sell at low, unstable</text>
      <text x="320" y="123">prices; the value is added (and profit</text>
      <text x="320" y="142">made) where they are processed</text>

      <text x="320" y="186" font-size="15" font-weight="700" fill="#4c3fa8">Unfair trade</text>
      <text x="320" y="208">HIC tariffs (import taxes) and farm</text>
      <text x="320" y="227">subsidies → LIC goods hard to sell</text>
      <text x="320" y="246">in rich markets</text>

      <text x="320" y="290" font-size="15" font-weight="700" fill="#4c3fa8">Debt</text>
      <text x="320" y="312">repayments + interest → less money</text>
      <text x="320" y="331">for schools, hospitals and roads</text>

      <text x="320" y="394" font-size="15" font-weight="700" fill="#4c3fa8">Colonial history, corruption</text>
      <text x="320" y="416">economies set up to export raw materials;</text>
      <text x="320" y="435">money and aid lost to corruption;</text>
      <text x="320" y="454">investors put off</text>
    </g>

    <!-- social and political -->
    <g font-size="14" fill="#16283c">
      <text x="618" y="82" font-size="15" font-weight="700" fill="#16283c">Poor health</text>
      <text x="618" y="104">HIV/AIDS, malaria, unsafe water →</text>
      <text x="618" y="123">early deaths, time off sick → smaller,</text>
      <text x="618" y="142">less productive workforce</text>

      <text x="618" y="186" font-size="15" font-weight="700" fill="#16283c">Low education</text>
      <text x="618" y="208">low literacy → low-skilled workforce</text>
      <text x="618" y="227">→ few well-paid jobs; investors</text>
      <text x="618" y="246">go elsewhere</text>

      <text x="618" y="290" font-size="15" font-weight="700" fill="#16283c">High birth rates, gender inequality</text>
      <text x="618" y="312">many dependent children → spending</text>
      <text x="618" y="331">spread thin; girls and women kept out</text>
      <text x="618" y="350">of school and paid work</text>

      <text x="618" y="394" font-size="15" font-weight="700" fill="#16283c">Conflict and war</text>
      <text x="618" y="416">destroys infrastructure and farms,</text>
      <text x="618" y="435">deters investment and tourists,</text>
      <text x="618" y="454">creates refugees</text>
    </g>
  </g>
</svg>

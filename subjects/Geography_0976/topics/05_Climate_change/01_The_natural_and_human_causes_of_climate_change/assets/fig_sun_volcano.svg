<text x="546" y="252" font-size="11.5" fill="#b07a0a">less sunlight reaches the surface</text>
<text x="555" y="122" font-size="12.5" fill="#33475b" xml:space="preserve">1  Eruption blasts sulphur dioxide and ash</text>
<text x="555" y="137" font-size="12.5" fill="#33475b" xml:space="preserve">    high into the stratosphere</text>
<text x="555" y="156" font-size="12.5" fill="#33475b" xml:space="preserve">2  Sulphur dioxide forms tiny droplets</text>
<text x="555" y="171" font-size="12.5" fill="#33475b" xml:space="preserve">    (aerosols) that spread around the globe</text>
<text x="555" y="190" font-size="12.5" fill="#33475b" xml:space="preserve">3  They reflect incoming sunlight back to space</text>
<text x="555" y="209" font-size="12.5" fill="#33475b" xml:space="preserve">4  Surface cools for 1–3 years, until</text>
<text x="555" y="224" font-size="12.5" fill="#33475b" xml:space="preserve">    the aerosols fall out</text>
<rect x="362" y="258" width="436" height="28" rx="6" fill="#eef2f5"/>
<text x="580" y="277" font-size="12" fill="#16283c" text-anchor="middle"><tspan font-weight="700">Mount Pinatubo, Philippines, 1991:</tspan> world ≈ 0.5 °C cooler in 1992</text>

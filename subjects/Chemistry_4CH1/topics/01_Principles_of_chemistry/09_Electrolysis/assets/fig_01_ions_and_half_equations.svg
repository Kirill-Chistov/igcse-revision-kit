 font-size="12.5" fill="#4c3fa8" text-anchor="middle" font-weight="bold" font-style="normal" >cations → cathode</text><text x="120.0" y="195.0" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="bold" font-style="normal" >loses electrons: OXIDATION</text><text x="120.0" y="40.0" font-size="1" fill="#16283c" text-anchor="middle" font-weight="normal" font-style="normal" ></text><text x="600.0" y="195.0" font-size="12.5" fill="#4c3fa8" text-anchor="end" font-weight="bold" font-style="normal" >gains electrons: REDUCTION</text><text x="40.0" y="110.0" font-size="13" fill="#16283c" text-anchor="start" font-weight="bold" font-style="normal" >2Br⁻ → Br₂ + 2e⁻</text><text x="700.0" y="110.0" font-size="13" fill="#16283c" text-anchor="end" font-weight="bold" font-style="normal" >Pb²⁺ + 2e⁻ → Pb</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-label="A root hair cell has a long thin extension into the soil, giving a large surface area. Water enters by osmosis because the cell sap is more concentrated than soil water; mineral ions enter by active transport. Water then passes across the root cortex to the xylem.">
  <style>
    text { font-family: Carlito, Calibri, sans-serif; fill: #16283c; }
    .rh-l { font-size: 12.5px; font-weight: 700; }
    .rh-s { font-size: 11.5px; fill: #33475b; }
    .rh-ld { fill: none; stroke: #8fa3b8; stroke-width: 1.1; }
  </style>
  <!-- soil -->
  <rect x="6" y="20" width="320" height="170" rx="6" fill="#f3ead8"/>
  <g fill="#d8c29a" stroke="#a88a5a" stroke-width="1">
    <path d="M30,40 l22,-6 l10,16 l-18,12 z"/><path d="M150,160 l26,-4 l6,20 l-24,6 z"/><path d="M150,40 l20,4 l-2,20 l-20,-4 z"/><path d="M40,110 l18,-10 l14,14 l-16,14 z"/><path d="M200,160 l20,-8 l10,14 l-18,10 z"/><path d="M110,70 l16,-6 l8,14 l-14,8 z"/>
  </g>
  <!-- root hair cell -->
  <path d="M336,50 L406,50 Q416,50 416,60 L416,130 Q416,140 406,140 L336,140 Q326,140 326,130 L326,118 L200,106 C180,104 180,84 200,82 L326,70 L326,60 Q326,50 336,50 Z" fill="#f7fbf2" stroke="#4a7a1f" stroke-width="1.8"/>
  <rect x="340" y="64" width="60" height="62" rx="16" fill="#dcecf7" stroke="#5b8db8" stroke-width="1.3"/>
  <circle cx="226" cy="94" r="7" fill="#eadcf5" stroke="#6d3fa8" stroke-width="1.3"/>
  <!-- cortex cells to xylem -->
  <g fill="#f7fbf2" stroke="#4a7a1f" stroke-width="1.2">
    <rect x="420" y="56" width="50" height="40" rx="6"/><rect x="420" y="98" width="50" height="40" rx="6"/>
    <rect x="474" y="56" width="50" height="40" rx="6"/><rect x="474" y="98" width="50" height="40" rx="6"/>
  </g>
  <rect x="530" y="50" width="30" height="94" rx="4" fill="#dcecf7" stroke="#2e6fa3" stroke-width="1.8"/>
  <text class="rh-l" x="545" y="164" text-anchor="middle" style="fill:#2e6fa3">xylem</text>
  <!-- arrows -->
  <path d="M110,94 L176,94" stroke="#2e6fa3" stroke-width="3"/><path d="M184,94 l-10,-6 v12z" fill="#2e6fa3"/>
  <path d="M410,94 L520,94" stroke="#2e6fa3" stroke-width="2.4" stroke-dasharray="6 4"/><path d="M528,94 l-10,-6 v12z" fill="#2e6fa3"/>
  <path d="M110,126 L186,110" stroke="#6d3fa8" stroke-width="2.4"/><path d="M194,108 l-12,-2 l3,11z" fill="#6d3fa8"/>
  <text class="rh-l" x="16" y="90" style="fill:#2e6fa3">water: osmosis</text>
  <text class="rh-l" x="16" y="140" style="fill:#6d3fa8">mineral ions:</text>
  <text class="rh-l" x="16" y="154" style="fill:#6d3fa8">active transport</text>
  <path class="rh-ld" d="M230,40 L240,80"/>
  <text class="rh-l" x="210" y="36">long, thin root hair</text>
  <path class="rh-ld" d="M380,34 L372,66"/>
  <text class="rh-l" x="344" y="30">cell sap more concentrated</text>
  <text class="rh-s" x="344" y="16">vacuole:</text>
  <!-- explanation -->
  <text class="rh-l" x="580" y="60">Why it works</text>
  <text class="rh-s" x="580" y="78">• large surface area for uptake</text>
  <text class="rh-s" x="580" y="94">• cell sap more concentrated than</text>
  <text class="rh-s" x="580" y="108">  soil water → water enters by osmosis</text>
  <text class="rh-s" x="580" y="124">• ions are more concentrated in the</text>
  <text class="rh-s" x="580" y="138">  cell than the soil → active transport,</text>
  <text class="rh-s" x="580" y="152">  using energy from respiration</text>
</svg>

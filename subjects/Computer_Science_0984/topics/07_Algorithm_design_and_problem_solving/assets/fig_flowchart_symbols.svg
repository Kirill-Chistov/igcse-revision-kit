<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 196" width="820" height="196" role="img"
     aria-label="The six Cambridge flowchart symbols: terminator, input/output, process, decision, subroutine and flow line" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="sym-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16283c"/>
    </marker>
  </defs>
  <g font-family="Carlito, Calibri, sans-serif" font-size="14.5" fill="#33475b">
    <g fill="#ffffff" stroke="#16283c" stroke-width="2">
      <!-- row 1 -->
      <rect x="10" y="22" width="100" height="44" rx="22"/>
      <path d="M302 22 H392 L372 66 H282 Z"/>
      <rect x="556" y="22" width="100" height="44"/>
      <!-- row 2 -->
      <path d="M60 110 L110 138 L60 166 L10 138 Z"/>
      <rect x="282" y="116" width="110" height="44"/>
      <line x1="296" y1="116" x2="296" y2="160"/>
      <line x1="378" y1="116" x2="378" y2="160"/>
    </g>
    <line x1="556" y1="138" x2="656" y2="138" stroke="#16283c" stroke-width="2" marker-end="url(#sym-arr)"/>
    <g font-size="12.5" fill="#16283c" text-anchor="middle">
      <text x="60" y="49">START</text>
      <text x="337" y="49">INPUT X</text>
      <text x="606" y="49">Total ← 0</text>
      <text x="60" y="142">X &gt; 9?</text>
      <text x="337" y="142">Sort</text>
    </g>

    <!-- labels -->
    <g font-weight="700" fill="#16283c" font-size="16">
      <text x="122" y="38">Terminator</text>
      <text x="402" y="38">Input/Output</text>
      <text x="668" y="38">Process</text>
      <text x="122" y="130">Decision</text>
      <text x="402" y="130">Subroutine</text>
      <text x="668" y="130">Flow line</text>
    </g>
    <text x="122" y="57">START or STOP of</text>
    <text x="122" y="75">the flowchart</text>
    <text x="402" y="57">INPUT a value or</text>
    <text x="402" y="75">OUTPUT a value</text>
    <text x="668" y="57">an action, e.g. an</text>
    <text x="668" y="75">assignment</text>
    <text x="122" y="149">a question with two</text>
    <text x="122" y="167">exits: Yes/No</text>
    <text x="402" y="149">calls a separate,</text>
    <text x="402" y="167">non-linked flowchart</text>
    <text x="668" y="149">shows the order in</text>
    <text x="668" y="167">which steps are done</text>
  </g>
</svg>
